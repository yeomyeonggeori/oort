appId: app.momo.ios
name: 115-sheet-drag-list
env:
  # 16 Pro(402×874) 기본값 — 기기마다 시트 위치가 다르므로 `measure/sheet-drag-run.mjs` 가 `maestro hierarchy` 로 읽어 -e 로 덮어쓴다.
  # SE(375×667) 등 다른 기기의 값은 구동 스크립트가 계산한다(수동 실행은 `--render-only` 로 만든 파일을 쓴다 — 이 파일은 틀이다).
  HX: "201" # 가운데 x
  HY: "115" # 머리 제목 줄 y
  HY_SHORT: "175" # 문턱(시트 높이의 25%) 아래로 60 끈 자리
  HY_FAR: "415" # 문턱 위로 300 끈 자리
  HY_FLICK: "296" # 짧게(100) 튕긴 자리
  FLICK_MS: "60" # 튕김 시간(ms)
  ROWY: "271" # 첫 사람 줄 y(눌리는 줄 — Pressable)
  ROW_FAR: "571"
  BLANKY: "162" # 「받는 사람」 라벨 y(눌리지 않는 자리)
  BLANK_FAR: "462"
  BLANK_UP: "14" # 라벨에서 위로 150 올린 자리(스크롤 단정)
  UP_A: "175" # 위로 쓸기: UP_A → UP_B
  UP_B: "85"
  SCR_A: "760" # 스크롤: 손가락을 SCR_A → SCR_B 로 올린다(목록이 내려간다)
  SCR_B: "300"
  BACK_A: "300" # 되돌려 끌기: BACK_A → BACK_B(목록이 올라온다)
  BACK_B: "600"
  LONG_A: "260" # 맨 위를 지나 계속 끌기: LONG_A → LONG_B
  LONG_B: "840"
  SHOT: "sheet-drag-list"
---
# 115-sheet-drag-list — 긴 목록 시트(새 DM, 큰 단, 날 FlatList)를 끌어내리는 장면들 (#4612 2단계).
#
# 표면 `-momoMeasure SHEETDRAG-LIST`(다크) · `LIGHT-SHEETDRAG-LIST`(라이트)는 배송되는 `NewMessageSheet` 를 가상 인물 서른 명의 목록으로
# 세운다(`measure/sheetDrag.tsx`). 시트가 닫히면 무대에 「닫힘 N」과 「시트 다시 열기」 단추가 서고, 이 흐름이 그 단추를 눌러 다시 세워 장면을
# 이어 친다 — 한 번 띄운 앱에서 일곱 장면이다.
#
#   ① 모자란 끌기(머리, 문턱 아래, 느리게)           시트가 따라왔다가 제자리로 돌아온다 — 닫히지 않는다
#   ② 머리 끌기(문턱 위)                            닫힌다 — 머리의 눌리지 않는 자리(제목)에서 시작: 시작 응답자 길
#   ③ 본문 맨 위 끌기 — 사람 줄(눌리는 줄)에서 시작     닫힌다 — 줄이 먼저 응답자, 시트가 이동에서 가로챈다
#   ④ 본문 맨 위 — 「받는 사람」 라벨(눌리지 않는 자리)  **넘치는 목록의 눌리지 않는 자리는 시트가 잡지 않는다**(알려진 한계, #4645): 아래로 끌어도 열려 있고,
#                                                     같은 자리에서 위로 올리면 목록이 스크롤된다(시트가 응답자를 쥐면 이 스크롤이 죽는다 — 시뮬레이터가 잡은 결함)
#   ⑤ 빠른 튕김(짧지만 빠르게)                       닫힌다 — 거리는 모자라도 속도 문턱(0.7px/ms)을 넘는다
#   ⑥ 스크롤 중 끌기                                목록이 스크롤된 채 아래로 끌면 목록만 올라오고 시트는 안 움직인다(열려 있다)
#   ⑦ 같은 손가락으로 맨 위를 지나 계속 끌기            알려진 한계: 시트가 이어받지 않는다(열려 있다). 손가락을 뗐다 다시 끌면 닫힌다
#   ⑧ 위로 쓸기                                    열려 있다(닫지 않는다)
#
# 「시트가 안 움직였다」는 이 흐름이 못 잰다 — 화면 안에서 위치를 단정할 도구가 없다. 구동 스크립트가 녹화에서 시트 위 끝을 프레임마다 재고,
# 닫힘·열림은 여기서 단정한다(닫힘은 「닫힘 N」 글자가 보이는 것, 열림은 목록이 그대로 보이는 것).
#
#   node clients/mobile/measure/sheet-drag-run.mjs --udid <UDID> --device 16pro --surface LIST --metro <포트> ...
#   (손으로: 표면을 띄운 뒤 같은 스크립트에 `--render-only` 를 주면 좌표가 채워진 흐름 파일의 경로를 출력한다 — 그 파일을 `maestro --udid <UDID> test` 로 돌린다.
#    Maestro 2.8 은 `swipe` 의 좌표에 `${…}` 를 실행 시 파싱하지 못해서, 이 틀을 그대로 돌리면 `Parsing Failed` 다.)
- extendedWaitUntil:
    visible:
      id: "new-dm-list"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-0-open
# ① 모자란 끌기
- swipe:
    start: "${HX}, ${HY}"
    end: "${HX}, ${HY_SHORT}"
    duration: 1500
- waitForAnimationToEnd
- assertVisible:
    id: "new-dm-list"
# ② 머리 끌기(문턱 위)
- swipe:
    start: "${HX}, ${HY}"
    end: "${HX}, ${HY_FAR}"
    duration: 1200
- extendedWaitUntil:
    visible: "닫힘 1"
    timeout: 8000
- takeScreenshot: ${SHOT}-2-header-closed
- tapOn:
    id: "sheetdrag-reopen"
- extendedWaitUntil:
    visible:
      id: "new-dm-list"
    timeout: 10000
- waitForAnimationToEnd
# ③ 본문 맨 위 — 사람 줄에서 시작
- swipe:
    start: "${HX}, ${ROWY}"
    end: "${HX}, ${ROW_FAR}"
    duration: 1200
- extendedWaitUntil:
    visible: "닫힘 2"
    timeout: 8000
- tapOn:
    id: "sheetdrag-reopen"
- extendedWaitUntil:
    visible:
      id: "new-dm-list"
    timeout: 10000
- waitForAnimationToEnd
# ④ 본문 맨 위 — 눌리지 않는 자리(라벨)에서 시작: 넘치는 목록이라 시트가 잡지 않는다 — 아래로 끌어도 열려 있다
- swipe:
    start: "${HX}, ${BLANKY}"
    end: "${HX}, ${BLANK_FAR}"
    duration: 1200
- waitForAnimationToEnd
- assertVisible:
    id: "new-dm-list"
- assertVisible:
    id: "page-sheet-handle"
- takeScreenshot: ${SHOT}-4-blank-stays
# …같은 자리에서 위로 올리면 목록이 스크롤된다(라벨·검색 칸이 시야를 벗어난다). Maestro 계층은 잘려 가려진 요소도 「보임」으로 말해서 `assertNotVisible`
# 로는 못 잰다 — 스크롤이 사는지의 숫자는 118 의 P0(표본 수·y)이 잰다. 여기서는 열려 있음과 캡처 증거만 남긴다.
- assertVisible: "받는 사람"
- swipe:
    start: "${HX}, ${BLANKY}"
    end: "${HX}, ${BLANK_UP}"
    duration: 1200
- waitForAnimationToEnd
- assertVisible:
    id: "new-dm-list"
- takeScreenshot: ${SHOT}-4-blank-scrolled
# ⑤ 빠른 튕김
- swipe:
    start: "${HX}, ${HY}"
    end: "${HX}, ${HY_FLICK}"
    duration: ${FLICK_MS}
- extendedWaitUntil:
    visible: "닫힘 3"
    timeout: 8000
- tapOn:
    id: "sheetdrag-reopen"
- extendedWaitUntil:
    visible:
      id: "new-dm-list"
    timeout: 10000
- waitForAnimationToEnd
# ⑥ 스크롤 중 끌기 — 먼저 목록을 내려 스크롤한다
- swipe:
    start: "${HX}, ${SCR_A}"
    end: "${HX}, ${SCR_B}"
    duration: 1500
- waitForAnimationToEnd
- assertNotVisible:
    id: "new-dm-person-member01"
- takeScreenshot: ${SHOT}-6-scrolled
# …스크롤된 채 아래로 끌면 목록이 올라올 뿐 시트는 안 내려온다
- swipe:
    start: "${HX}, ${BACK_A}"
    end: "${HX}, ${BACK_B}"
    duration: 1200
- waitForAnimationToEnd
- assertVisible:
    id: "new-dm-list"
- assertVisible:
    id: "page-sheet-handle"
- takeScreenshot: ${SHOT}-6-dragged-back
# ⑦ 같은 손가락으로 맨 위를 지나 계속 끌기 — 알려진 한계(이어받지 않는다)
- swipe:
    start: "${HX}, ${LONG_A}"
    end: "${HX}, ${LONG_B}"
    duration: 1500
- waitForAnimationToEnd
- assertVisible:
    id: "new-dm-list"
- assertVisible:
    id: "new-dm-person-member01"
- takeScreenshot: ${SHOT}-7-passed-top-stays
# 손가락을 뗐다 다시 끌면 닫힌다
- swipe:
    start: "${HX}, ${ROWY}"
    end: "${HX}, ${ROW_FAR}"
    duration: 1200
- extendedWaitUntil:
    visible: "닫힘 4"
    timeout: 8000
- tapOn:
    id: "sheetdrag-reopen"
- extendedWaitUntil:
    visible:
      id: "new-dm-list"
    timeout: 10000
- waitForAnimationToEnd
# ⑧ 위로 쓸기 — 열려 있다
- swipe:
    start: "${HX}, ${UP_A}"
    end: "${HX}, ${UP_B}"
    duration: 150
- waitForAnimationToEnd
- assertVisible:
    id: "new-dm-list"
- takeScreenshot: ${SHOT}-8-up-stays
