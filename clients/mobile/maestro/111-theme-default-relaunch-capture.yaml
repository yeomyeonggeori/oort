appId: app.momo.ios
name: "111-theme-default-relaunch-capture"
---
# 111-theme-default-relaunch-capture — 「시스템」을 고른 폰은 앱을 다시 켜도 시스템이다(라이트 기본으로 돌아가지 않는다) (#4526).
#
# `111-theme-default-capture.yaml` 을 돌린 뒤 앱을 끄고(`xcrun simctl terminate <udid> app.momo.ios`) 같은 표면을 다시 띄운다.
# 저장이 남아 있으므로 다크 기기에서 화면은 다크이고 캡션은 「저장: 있음(system)」이다(`-5-relaunch-kept`).
# 이어서 기기 외양을 라이트로 뒤집으면(`xcrun simctl ui <udid> appearance light`) 「시스템」을 고른 폰은
# 앱을 다시 켜지 않고도 따라간다(`-6-device-flipped-light`). 사진을 찍은 뒤 기기를 다크로 되돌린다.
#
#   xcrun simctl launch <udid> app.momo.ios --args -momoMeasure THEME-LIVE -RCT_jsLocation 127.0.0.1:$PORT
#   maestro --udid <udid> test -e SHOT=theme --test-output-dir <dir> clients/mobile/maestro/111-theme-default-relaunch-capture.yaml
#   xcrun simctl ui <udid> appearance light   # 그다음 -6 을 찍는다(`xcrun simctl io <udid> screenshot`)
- extendedWaitUntil:
    visible:
      id: "theme-live-caption"
    timeout: 120000
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-5-relaunch-kept
