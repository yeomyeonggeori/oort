appId: app.momo.ios
name: "104-photo-viewer-capture"
---
# 104-photo-viewer-capture — 대화의 사진을 눌러 연 뷰어의 조작이 안전 영역 안에 서고 실제로 눌리는가 (#4293), 검정 무대 위의 유리
# 조작·사진을 한 번 누르면 숨고 다시 나타나는가 (#4297).
#
# 표면 `-momoMeasure PHOTO-VIEWER-SOLO`(다크) · `LIGHT-PHOTO-VIEWER-SOLO`(라이트)는 진짜 머리·타임라인·
# 컴포저가 선 대화에 사진 한 장짜리 메시지를 세운다(`measure/photoViewer.tsx`). 사진 바이트는 스텁이
# 대신 답한다(`measure/photo-stub.mjs`, 요청 때 만든 그라데이션 PNG). 뷰어를 여는 것도, 뒤로를 누르는 것도 **정말로 누르는**
# 이 흐름의 탭이다.
#
#   node clients/mobile/measure/photo-stub.mjs &
#   xcrun simctl launch <udid> app.momo.ios --args \
#     -momoMeasure PHOTO-VIEWER-SOLO -RCT_jsLocation 127.0.0.1:$PORT
#   maestro --udid <udid> test -e SHOT=viewer-dark clients/mobile/maestro/104-photo-viewer-capture.yaml
#   # 사진: --test-output-dir 아래 takeScreenshot/ (`${SHOT}-chat` · `-viewer` · `-viewer-hidden` · `-after-back-tap`)
#
# 같은 흐름을 고치기 전·후 판에 돌린다. 고치기 전(#4293)에는 닫기·공유가 상태 막대 높이(위쪽 44pt)에 깔려
# `-viewer` 사진에서 다이내믹 아일랜드·시계와 겹친다. `-after-back-tap` 은 뒤로 탭 뒤의 화면이다.
#
# #4297: `-viewer` 는 검정 무대 위에 사진이 화면 가득 서고 위 왼쪽 둥근 유리 ‹ 뒤로 + 보낸 사람·시각, 아래 [저장]·[공유]가 뜬 모양이다
# (한 장이라 썸네일 줄·캡션은 없다). 사진 가운데를 한 번 누르면 위·아래 조작이 같이 사라지고(`-viewer-hidden`, **접근성 트리에서도
# 빠진다** — 숨은 단추가 읽히거나 눌리지 않는다), 한 번 더 누르면 돌아온다.
- extendedWaitUntil:
    visible:
      id: "attachment-item"
    timeout: 60000
# 디버그 빌드의 LogBox 띠가 컴포저 위를 덮고 탭을 먹는다(`subflows/dismiss-dev-logbox.yaml`).
- runFlow: subflows/dismiss-dev-logbox.yaml
# 단색 PNG 를 내려받아 타일에 그릴 때까지(스텁 응답은 즉시이고, 그림이 그려져야 사진이 대화 속에 선다).
- extendedWaitUntil:
    visible:
      id: "attachment-preview-image"
    timeout: 30000
- takeScreenshot: ${SHOT}-chat
- tapOn:
    id: "attachment-item"
- extendedWaitUntil:
    visible:
      id: "attachment-viewer"
    timeout: 10000
- waitForAnimationToEnd
- assertVisible:
    id: "attachment-viewer-back"
- assertVisible:
    id: "attachment-viewer-stamp"
- takeScreenshot: ${SHOT}-viewer
# 사진을 한 번 누르면 조작이 같이 사라진다(#4297). 숨은 단추는 접근성 트리에서 빠지므로 「안 보인다」가 곧 「읽히지도 눌리지도 않는다」다.
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd
- assertNotVisible:
    id: "attachment-viewer-back"
- assertNotVisible:
    id: "attachment-viewer-share"
- takeScreenshot: ${SHOT}-viewer-hidden
# 한 번 더 누르면 돌아온다.
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd
- assertVisible:
    id: "attachment-viewer-back"
- assertVisible:
    id: "attachment-viewer-share"
- tapOn:
    id: "attachment-viewer-back"
- waitForAnimationToEnd
# 뒤로 탭이 **닫았는가**를 단정한다(고치기 전 다이내믹 아일랜드 기기에서는 탭이 상태 막대에 먹혀 뷰어가 남는다).
- assertNotVisible:
    id: "attachment-viewer"
- takeScreenshot: ${SHOT}-after-back-tap
