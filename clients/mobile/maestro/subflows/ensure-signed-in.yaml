appId: app.momo.ios
name: ensure-signed-in
---
# Every flow after 00-login must be runnable ALONE — `maestro test 20-stop.yaml`
# on a fresh checkout has to work, or the first thing anyone does while debugging
# one failing flow is re-run the whole lane to get back into a signed-in state.
#
# So this does not assume 00-login just ran. It waits for the app to finish its
# restore (`booting` / `session-restoring` are both real launch states, and the
# keychain read is async), then signs in only if the connect screen is what
# came up.
- runFlow: dismiss-system-alerts.yaml
- extendedWaitUntil:
    visible:
      id: "qr-connect-button|server-url-input|notify-primer-continue|sidebar-list"
    timeout: 180000
# M3 left over from a sign-in that never tapped 「계속」 (#2820).
- runFlow:
    when:
      visible:
        id: "notify-primer-continue"
    commands:
      - runFlow: pass-notify-primer.yaml
      - runFlow: dismiss-system-alerts.yaml
# M0 환영 (#2819): the address form is behind 「주소로 로그인」. A session that
# EXPIRED opens straight on the form, so this is conditional.
- runFlow:
    when:
      visible:
        id: "qr-connect-button"
    commands:
      # Debug LogBox strip first, for the reason given at the same step in
      # 00-login.yaml. It is called HERE, inside the signed-out branch, and not
      # before the wait above: on the channel list the same coordinate is the
      # 「＋」 button (see subflows/dismiss-dev-logbox.yaml), so a signed-in run must
      # never reach it.
      - runFlow: dismiss-dev-logbox.yaml
      - tapOn:
          id: "welcome-address"
      - extendedWaitUntil:
          visible:
            id: "server-url-input"
          timeout: 10000
- runFlow:
    when:
      visible:
        id: "server-url-input"
    commands:
      - tapOn:
          id: "server-url-input"
      # `eraseText` here and NOT in 00-login.yaml, and the asymmetry is the
      # point: 00-login launches with `clearState: true`, so its address field is
      # empty by construction. This subflow is reached with storage INTACT — a
      # session that expired, or a flow run on its own against a stack whose
      # database was replaced under it — and the connect screen prefills the
      # address it already knows. Typing then APPENDS.
      #
      # Measured, and it does not fail where you would look: the field held
      # `http://127.0.0.1:24330http://127.0.0.1:24330`, the screen said
      # "주소를 확인하세요", the submit tap did nothing because the form was invalid,
      # and the flow died 60 seconds later on `sidebar-list` — an assertion about
      # the channel list, three steps away from the field that was actually wrong.
      - eraseText
      - inputText: ${SERVER_URL}
      # The hint is the screen's own echo of the URL it will call, so asserting
      # the RESOLVED address (not just "a hint exists") is what catches the
      # doubling above at the step that caused it.
      - assertVisible:
          id: "server-url-hint"
      - assertVisible: "요청 주소: ${SERVER_URL}/v1/…"
      # The email field is NOT empty when this branch runs with storage INTACT
      # (#4669): 「이메일 기억하기」 is ON by default on the phone, so a signed-out
      # screen reached after an expired session, a logout, or a lane flow run
      # alone already holds the email this device remembered for that server.
      # Typing then APPENDS, and the login body carries
      # `me@example.comme@example.com`. 00-login.yaml starts from `clearState`, so
      # its field is empty by construction and needs none of this.
      #
      # What clears it is "select all, then delete" and NOT `eraseText` alone.
      # `eraseText` only deletes BEHIND the caret, and a tap puts the caret where
      # the finger landed, so every plan of the form "tap somewhere, erase N"
      # depends on how long the text is and where it ends relative to the tap.
      # Measured on 11-02 against this field (#5045, #5089):
      #   - tap at the middle + plain `eraseText`: the lane's 32-character email
      #     left its tail, `<new>@momo.local`, 「이메일 또는 비밀번호가 맞지 않습니다」.
      #   - tap at the right end (`point: "97%,50%"`) + `eraseText: 100`: passes
      #     only while the text ENDS INSIDE the field. With about 90 characters in
      #     it the caret landed mid-text, the front was erased and the tail stayed
      #     (`lane-…@momo.local-ab…`), the same rejection.
      # Three quick taps are iOS's own "select the whole line" for a one-line
      # field, so ONE delete then empties it whatever the caret, the length or the
      # device language was (the edit menu's 「전체 선택」 would depend on the
      # language). Under heavy load the three taps are now and then read as a
      # double tap (a WORD gets selected, the rest stays), so the pass runs twice
      # (the second is a no-op on an empty field), and the step is only done when
      # the field reads back EXACTLY the typed email. The `text` selector is a
      # FULL match, so a doubled or tailed value does not satisfy it (measured); a
      # miss re-runs the whole block, at most twice more, instead of failing 60
      # seconds later on `sidebar-list`, three steps away from the field that was
      # actually wrong.
      #
      # Do not assert "the field is empty" with `text: ".+"`: `text` also matches
      # the accessibility label (「이메일」), so it matches an empty field too.
      # `${EMAIL}` is read as a pattern; the lane's emails are regex-safe.
      - retry:
          maxRetries: 2
          commands:
            - tapOn:
                id: "email-input"
            - repeat:
                times: 2
                commands:
                  - tapOn:
                      id: "email-input"
                      repeat: 3
                      delay: 20
                      retryTapIfNoChange: false
                  - eraseText: 1
            - inputText: ${EMAIL}
            - extendedWaitUntil:
                visible:
                  id: "email-input"
                  text: ${EMAIL}
                timeout: 8000
      # `eraseText` first — see the note in 00-login.yaml; without it the
      # secure field hands the server a mangled password.
      - tapOn:
          id: "password-input"
      - eraseText
      - inputText: ${PASSWORD}
      # With the keyboard up — see the note at the same step in 00-login.yaml.
      - tapOn:
          id: "submit-button"
      - runFlow: dismiss-system-alerts.yaml
      - runFlow: pass-notify-primer.yaml
      # A successful sign-in raises the keychain prompt and then the push
      # permission prompt, seconds apart, and either one blocks the hierarchy
      # underneath it — the assertion below then fails against a screen that
      # rendered correctly. Same loop, same reason, as 00-login.yaml.
      #
      # It has to be HERE and not only in 00-login: a lane run reaches this
      # branch whenever a flow is run on its own (`--flow 20-stop` on a
      # signed-out simulator), which is exactly when nothing else has dealt with
      # the prompts. Measured: without it the sign-in succeeds and the flow dies
      # on `sidebar-list` with the channel list fully drawn behind a dialog.
      - repeat:
          times: 6
          commands:
            - runFlow: dismiss-system-alerts.yaml
            - waitForAnimationToEnd:
                timeout: 2000
      - extendedWaitUntil:
          visible:
            id: "sidebar-list"
          timeout: 60000
- assertVisible:
    id: "sidebar-list"
