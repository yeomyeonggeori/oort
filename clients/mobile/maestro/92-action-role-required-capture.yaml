appId: app.momo.ios
name: 92-action-role-required-capture
---
# 92-action-role-required-capture — 행동 승인 카드의 **403 뒤** 사진 (#2513 · #1084).
#
# `measure/` 의 표면들은 저 혼자 서서 찍히는데, 이 상태는 그럴 수 없다: 「관리자가
# 승인해야 합니다」와 무장 해제는 결정이 **실제로 나가고** 403 영수증이 돌아와야
# 선다. `ApprovalDecision` 의 상태는 prop 으로 세울 수 없고, 세울 수 있게 하는
# 것은 배송 컴포넌트에 하네스 전용 문을 하나 더 내는 일이다(`initialArmed` 한
# 개로 충분히 비싸다). 그래서 이 레인은 **정말로 누르고**, 서버 자리는 표면
# `ACTION-ROLE-REQUIRED` 의 `DecisionStub` 이 403 `{status: "role_required"}` 로
# 진다. 코어 `decideApproval` 과 폰 `ApprovalDecision` 은 전부 진짜다.
#
# 로그인도 서버도 필요 없고 `launchApp` 도 없다 — 앱을 다시 띄우면 계측 인자가
# 아니라 보통의 앱이 뜬다(`90-mention-sheet-capture.yaml` 과 같은 사정).
#
# 쓰는 법(사람이 부른다):
#
#   xcrun simctl launch booted app.momo.ios --args \
#     -momoMeasure ACTION-ROLE-REQUIRED -RCT_jsLocation 127.0.0.1:$PORT
#   maestro test clients/mobile/maestro/92-action-role-required-capture.yaml
#   # 사진: ~/.maestro/tests/<타임스탬프>/…/action-role-required.png
#
# 라이트는 `LIGHT-ACTION-ROLE-REQUIRED`.
#
# ## 왜 id 가 아니라 좌표인가
#
# 메시지 행은 **접근성 요소 하나**다(`MessageRow` 의 `accessible` — 칩·스레드·
# 재전송이 각자 정거장이 되지 않게 묶는다). 그 결과 행 안의 버튼은 접근성 트리에
# 없고, Maestro 가 id 로 찾는 것은 그 트리다. 그래서 iPhone 17 Pro 세로 화면에서
# 이 표면이 그리는 자리를 비율로 누른다(`APPROVE_X`·`APPROVE_Y` — 같은 표면의
# 사진에서 읽는다). 「승인」과 확정 줄의 「승인 확정」은 **같은 자리**에 선다
# (무장은 버튼을 제자리에서 바꾼다) — 같은 점을 두 번 누르되 사이에 확정
# 가드(400ms)보다 긴 기다림을 둔다.
#
# 기다리는 글자도 같은 이유로 카드 제목이 아니라 **표면의 캡션**이다: 카드 제목은
# 묶인 행 안에 있어 트리에 없고, 캡션은 행 밖의 글자다.
- extendedWaitUntil:
    visible: ".*403 role_required.*"
    timeout: 60000
- tapOn:
    point: "${APPROVE_X},${APPROVE_Y}"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: action-armed
- tapOn:
    point: "${APPROVE_X},${APPROVE_Y}"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: action-role-required
