appId: app.momo.ios
name: 100-attach-menu-capture
---
# 100-attach-menu-capture — 첨부 메뉴가 + 원에서 펼쳐진 사진 (#4180).
#
# 표면 `-momoMeasure ATTACH-MENU`(다크) · `LIGHT-ATTACH-MENU`(라이트)는 진짜 머리·타임라인·컴포저를
# 세운다(`measure/attachMenu.tsx`). 메뉴를 여는 것은 **정말로 누르는** 이 흐름의 탭이다 — 열리는 코드는
# 컴포저의 `onPress`(햅틱 → 열기 상태 → + 원 측정 → Modal → 스프링)이고, 상태를 심어서는 그 길이 안 돈다.
#
#   xcrun simctl launch booted app.momo.ios --args \
#     -momoMeasure ATTACH-MENU -RCT_jsLocation 127.0.0.1:$PORT
#   maestro test -e SHOT=attach-menu-dark clients/mobile/maestro/100-attach-menu-capture.yaml
#   # 사진: --test-output-dir 아래 takeScreenshot/ (`${SHOT}-closed` · `${SHOT}-open`)
#
# 펼쳐지는 **도중** 프레임은 이 흐름이 못 찍는다(스크린샷 한 장이 스프링 한 번보다 느리다). 같은 흐름을
# 돌리는 동안 `xcrun simctl io booted recordVideo` 로 영상을 받고 ffmpeg 로 프레임을 뽑는다.
- extendedWaitUntil:
    visible:
      id: "composer-attach"
    timeout: 60000
# 디버그 빌드의 LogBox 띠가 컴포저 위를 덮고 탭을 먹는다(`subflows/dismiss-dev-logbox.yaml`). 컴포저가
# 비어 있어 이 좌표(보내기 원)의 탭은 아무 일도 하지 않는다.
- runFlow: subflows/dismiss-dev-logbox.yaml
- takeScreenshot: ${SHOT}-closed
- tapOn:
    id: "composer-attach"
- extendedWaitUntil:
    visible:
      id: "attachment-pick-camera"
    timeout: 10000
# 스프링이 앉을 때까지(≈ 300ms) 기다린 뒤 찍는다 — 중간 프레임이 「펼침」으로 오인되지 않게.
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-open
