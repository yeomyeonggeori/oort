appId: app.momo.ios
name: "105-photo-viewer-swipe-capture"
---
# 105-photo-viewer-swipe-capture — 뷰어를 아래로 쓸어 닫는다 (#4293).
#
# 표면 `-momoMeasure PHOTO-VIEWER-MULTI`(다크) · `LIGHT-PHOTO-VIEWER-MULTI`(라이트)는 사진 세 장짜리
# 메시지를 세운다(`measure/photoViewer.tsx`). 격자의 가운데 장을 눌러 「3장 중 2번」으로 연 뒤:
#
#   ① 옆으로 넘긴다 — 쓸어 닫기가 가로 페이지 넘김을 훔치지 않는다(「3장 중 2번」 → 「3장 중 3번」, **단정한다**).
#   ② 모자라게(약 70pt, 느리게) 내렸다 놓는다 — 제자리로 돌아온다(뷰어가 그대로 서 있다, 「3장 중 3번」 그대로).
#   ②b (#4297) 아래 썸네일 줄의 첫 장을 누른다 — 그 장으로 간다(「3장 중 1번」). 줄은 조작이 사진 위에 뜬 모양에서도 눌린다.
#   ③ 충분히(약 400pt) 내렸다 놓는다 — 닫히고 뒤의 대화가 보인다(뷰어가 사라진 것을 단정한다).
#
# 조작이 사진 **위에 뜨면서** 옆으로 넘기기가 다시 죽을 위험이 있다(조작 덩어리의 빈 곳이 위로 번져 뿌리를 응답자로 만들면 iOS 스크롤뷰가
# 스크롤을 시작하지 못한다, r2 B-1). ① 의 「3장 중 3번」 단정이 그 위험을 잰다 — 조작은 `pointerEvents="box-none"` 이다.
#
# 단정이 이 흐름의 요점이다. 앞 판은 세 제스처를 돌리고 사진만 찍었다 — 가로 넘김이 죽어도(r2 판정 B-1:
# 응답을 쥔 뿌리 View 가 가로 ScrollView 의 조상이라 iOS 가 스크롤을 막았다) Maestro 는 COMPLETED 였다.
# 고치기 전 코드에서 ① 의 「3장 중 3번」(그때는 「3 / 3」) 단정이 빨갛고 고친 뒤 초록인 것을 PR 본문에 남겼다.
#
# 끄는 도중의 모양(배경이 옅어지고 사진이 줄어드는 프레임)은 이 흐름이 못 찍는다 — 스크린샷 한 장이
# 제스처보다 느리다. 같은 흐름을 돌리는 동안 `xcrun simctl io <udid> recordVideo --codec h264 f.mp4` 로
# 영상을 받고 ffmpeg 로 프레임을 뽑는다(`101-photo-card-capture.yaml` 머리말과 같은 절차).
#
#   node clients/mobile/measure/photo-stub.mjs &
#   xcrun simctl launch <udid> app.momo.ios --args \
#     -momoMeasure PHOTO-VIEWER-MULTI -RCT_jsLocation 127.0.0.1:$PORT
#   maestro --udid <udid> test -e SHOT=swipe-dark clients/mobile/maestro/105-photo-viewer-swipe-capture.yaml
- extendedWaitUntil:
    visible:
      id: "attachment-item"
    timeout: 60000
- runFlow: subflows/dismiss-dev-logbox.yaml
- extendedWaitUntil:
    visible:
      id: "attachment-preview-image"
    timeout: 30000
- takeScreenshot: ${SHOT}-chat
- tapOn:
    id: "attachment-item"
    index: 1
- extendedWaitUntil:
    visible:
      id: "attachment-viewer"
    timeout: 10000
- waitForAnimationToEnd
- assertVisible:
    id: "attachment-viewer-position"
    text: "3장 중 2번.*"
- takeScreenshot: ${SHOT}-open-2of3
# ① 가로 페이지 넘김은 그대로다.
- swipe:
    start: 85%, 50%
    end: 15%, 50%
    duration: 300
- waitForAnimationToEnd
# 단정이 없으면 이 흐름은 가로 넘김이 죽어도 초록이다(r2 판정 B-1: 사진은 찍혔지만 읽히지 않았다).
- assertVisible:
    id: "attachment-viewer-position"
    text: "3장 중 3번.*"
- takeScreenshot: ${SHOT}-paged-3of3
# ② 모자라게 내렸다 놓는다 — 제자리로.
- swipe:
    start: 50%, 40%
    end: 50%, 48%
    duration: 500
- waitForAnimationToEnd
- assertVisible:
    id: "attachment-viewer-position"
    text: "3장 중 3번.*"
- takeScreenshot: ${SHOT}-short-swipe-stays
# ②b 썸네일 줄의 첫 장을 누른다 — 그 장으로 간다(#4297).
- tapOn:
    id: "attachment-viewer-thumb"
    index: 0
- waitForAnimationToEnd
- assertVisible:
    id: "attachment-viewer-position"
    text: "3장 중 1번.*"
- takeScreenshot: ${SHOT}-thumb-1of3
# ③ 충분히 내렸다 놓는다 — 닫힌다.
- swipe:
    start: 50%, 30%
    end: 50%, 75%
    duration: 400
- waitForAnimationToEnd
- assertNotVisible:
    id: "attachment-viewer"
- assertVisible:
    id: "attachment-item"
- takeScreenshot: ${SHOT}-long-swipe-closed
