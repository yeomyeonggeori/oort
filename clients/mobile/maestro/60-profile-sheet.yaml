appId: app.momo.ios
name: 60-profile-sheet
# No `env:` block — see the note at the top of 00-login.yaml.
---
# 60-profile-sheet — 머리의 아바타가 여는 「설정」 페이지 (#2702 → #4457).
#
# jest 가 못 보는 것 하나를 여기서 본다: **가장자리를 밀어 닫은 페이지가 다시 열리는가.**
# 설정은 셸의 층(`nav.settings`)이고 왼쪽 가장자리 밀기(`EdgeSwipeBack`)가 닫는다. 밀기가 부모의
# 「열림」을 내리지 못하면 페이지는 내려갔는데 아바타가 죽는다. 그 결함은 두 번째 탭에서만 보이므로
# 이 흐름은 닫고 **다시 연다**. (이 흐름은 로그인한 앱이 필요하다. 서버 없이 같은 길을 도는 짝이 `114-settings-shell-flow.yaml`(하네스 셸 위)이고 2단계가 그것을 시뮬레이터에서 돌렸다.)
#
# 로그아웃은 누르지 않는다 — 이 흐름은 다른 흐름과 같은 스택에서 혼자 돌 수
# 있어야 하고, 세션을 지우면 다음 흐름이 로그인부터 다시 한다. 로그아웃의 확인
# 단계는 `__tests__/settingsPage.test.tsx` 가 진다.
#
# lane-phone.sh 의 기본 목록에는 없다. 부를 때:
#   maestro test -e SERVER_URL=… -e EMAIL=… -e PASSWORD=… \
#     clients/mobile/maestro/60-profile-sheet.yaml
- launchApp:
    appId: app.momo.ios
- runFlow: subflows/ensure-signed-in.yaml

# 대화 목록 발치에는 계정 줄이 더는 없다.
- assertNotVisible:
    id: "sign-out"

- tapOn:
    id: "profile-avatar"
- extendedWaitUntil:
    visible:
      id: "self-profile-name"
    timeout: 20000
# 푸시·테마 행은 접힌 아래에 있다(얼굴 + 상태 + 프로필 카드 아래) — 스크롤해서 둘 다 있는지 본다.
- scrollUntilVisible:
    element:
      id: "profile-push-row"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "profile-theme-row"
    direction: DOWN
    timeout: 20000

# 테마는 설정 위에 한 겹 더 쌓이는 장이다: 들어갔다 머리의 ‹ 뒤로 설정으로 돌아온다.
- tapOn:
    id: "profile-theme-row"
- extendedWaitUntil:
    visible:
      id: "theme-control"
    timeout: 10000
- tapOn:
    id: "settings-back"
# 설정 페이지는 마운트된 채 남아 스크롤 자리가 그대로다 — 방금 스크롤해 온 행이 다시 보인다.
- extendedWaitUntil:
    visible:
      id: "profile-theme-row"
    timeout: 10000

# 왼쪽 가장자리를 밀어 닫는다 — 그리고 다시 열린다.
- swipe:
    start: 1%, 50%
    end: 90%, 50%
    duration: 400
- extendedWaitUntil:
    notVisible:
      id: "profile-theme-row"
    timeout: 10000
- tapOn:
    id: "profile-avatar"
- extendedWaitUntil:
    visible:
      id: "self-profile-name"
    timeout: 10000

# 머리의 원형 X 로도 닫힌다.
- tapOn:
    id: "settings-close"
- extendedWaitUntil:
    notVisible:
      id: "self-profile-name"
    timeout: 10000
