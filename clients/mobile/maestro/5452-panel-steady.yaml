appId: app.momo.ios
name: 5452-panel-steady
# No `env:` block — see the note at the top of 00-login.yaml.
#   SERVER_URL EMAIL PASSWORD CHANNEL_ID
---
# 키보드 ↔ 이모티콘 창을 오가도 입력창이 안 움직인다 (#5452, owner 「키보드 ↔ 창을 오갈 때 입력창이 튀지 않아요」).
#
# 이 흐름은 눌러 줄 뿐이고 단정이 없다. 입력창(보내기 원)의 세로 자리는 화면 캡처를 `measure/panel-steady.py` 가 잰다:
#   키보드가 올라온 자리 → 창이 선 자리 → 키보드가 돌아온 자리 → 창이 다시 선 자리의 네 장에서 보내기 원의 가운데 y 가 1pt(3px) 안에서 같다.
# 녹화를 같이 뜨면(`measure/run-panel-steady.sh`) 오가는 도중의 프레임까지 같은 분석기로 잰다.
#
# 준비: `CHANNEL_ID` 채널이 있는 스택 - `measure/seed-expression-panel.py`.
- launchApp:
    appId: app.momo.ios
    arguments:
      momoAutomation: "YES"
- runFlow: subflows/ensure-signed-in.yaml
- extendedWaitUntil:
    visible:
      id: "sidebar-row-channel:${CHANNEL_ID}"
    timeout: 90000
- tapOn:
    id: "sidebar-row-channel:${CHANNEL_ID}"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: "composer-pill"
    timeout: 60000
- runFlow: subflows/dismiss-dev-logbox.yaml
# 보내기 원이 채워진 색으로 서도록 글자 하나를 넣는다(분석기가 그 원을 찾는다).
- tapOn:
    id: "composer-input"
- inputText: "a"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 5452-steady-1-keyboard
- tapOn:
    id: "composer-expression"
- extendedWaitUntil:
    visible:
      id: "expression-panel"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 5452-steady-2-panel
- tapOn:
    id: "composer-input"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 5452-steady-3-keyboard-again
- tapOn:
    id: "composer-expression"
- extendedWaitUntil:
    visible:
      id: "expression-panel"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 5452-steady-4-panel-again
# 키보드 단추(☺ 를 한 번 더)로 돌아온다.
- tapOn:
    id: "composer-expression"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 5452-steady-5-keyboard-button
# 떠나기 전에 초안을 지운다(다음 흐름의 입력창이 비어 있어야 한다).
- eraseText: 5
- tapOn:
    id: "conversation-list"
    point: "50%,30%"
