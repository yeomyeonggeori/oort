appId: app.momo.ios
name: 5784-channel-member-add-live
# No `env:` block — see the note at the top of 00-login.yaml.
#   SERVER_URL EMAIL PASSWORD (ensure-signed-in) · 고를 수 있는 것: KIND(public, 기본 비공개) · PEER_NAME(기본 「Lane Peer」)
---
# 5784-channel-member-add-live — 채널을 만들면 새 채널 위에 「멤버 추가」 시트가 서고, 한 명을 넣고 X 로 닫는다 (#5784, 검수 r1 B1).
#
# 결함: 비공개 채널을 만들면 채널은 만들어지고 새 채널로 들어가지만 「멤버 추가」 시트가 **아예 안 떴다**(검수 r1, 시뮬레이터 4/4, 60초 뒤에도 0).
# 새 채널 시트는 만들기가 끝나면 `onClose()`(그 Modal 을 내림)와 「멤버 추가」 세우기(다른 Modal 을 올림)를 한 틱에 불렀다 - 내려가는 Modal 과
# 올라오는 Modal 이 한 화면 갱신에 겹치면 iOS 는 뒤의 제시를 거절하고 RN 은 이미 떴다고 믿는다(#5417 과 같은 모양, `5417-edit-from-sheet-live.yaml`).
# 고친 뒤에는 새 채널 시트가 iOS 가 「다 내렸다」고 알린 뒤(`Modal` 의 `onDismiss`)에야 새 채널로 들어가고 멤버 추가 시트를 세운다(`usePageSheetHandoff`).
# jest 는 이 결함을 못 잡는다(Jest 의 `Modal` 은 제시를 거절하지 못한다) - 이 흐름이 그 증거다.
#
# 서버가 필요하다(진짜 채널 만들기·멤버 추가). 레인에서: `npm run lane:phone -- --flow 5784-channel-member-add-live`.
# 레인 멤버(「Lane Tester」, 관리자)가 만들고, 레인의 둘째 멤버 「Lane Peer」 를 넣는다. 손으로 돌릴 때:
#
#   maestro --udid <udid> test -e SERVER_URL=… -e EMAIL=… -e PASSWORD=… [-e KIND=public] [-e PEER_NAME=…] \
#     clients/mobile/maestro/5784-channel-member-add-live.yaml
#
# 이 흐름이 재는 것(눈이 아니라 단정이다):
#   ① ＋ → 새 채널 → (비공개) → 이름 → ✓ 를 누르면 **멤버 추가 시트의 X**(`channel-member-add-close`)가 15초 안에 선다 - 고치기 전에는 여기서 떨어진다.
#      새 채널 시트의 ✓ 는 없다(두 시트가 겹쳐 서지 않는다). 안내 줄이 만든 채널 이름을 말한다.
#   ② 사람 줄을 누르면 그 줄이 「멤버」가 되고 시트는 남는다.
#   ③ X 로 닫으면 시트가 사라지고 새 채널(머리의 이름)이 선다.
#
# 채널 이름은 실행마다 새로 짓는다(같은 워크스페이스에서 다시 돌려도 「이미 있는 이름」 이 되지 않게). 입력은 ASCII 다(이름 규칙이 그렇다).
- evalScript: ${output.channelName = 'a' + (new Date().getTime() % 1000000)}
- evalScript: "${output.peer = (typeof PEER_NAME === 'undefined' ? 'Lane Peer' : PEER_NAME)}"
- launchApp:
    appId: app.momo.ios
    arguments:
      momoAutomation: "YES"
- runFlow: subflows/ensure-signed-in.yaml
# `subflows/dismiss-dev-logbox.yaml` 은 쓰지 않는다: 그 자리(92%,94%)가 바로 ＋ 단추라 메뉴가 먼저 열려 버린다.
- extendedWaitUntil:
    visible:
      id: "shell-plus"
    timeout: 60000
- tapOn:
    id: "shell-plus"
- extendedWaitUntil:
    visible:
      id: "plus-menu-channel"
    timeout: 10000
- tapOn:
    id: "plus-menu-channel"
- extendedWaitUntil:
    visible:
      id: "new-channel-create"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      true: ${typeof KIND === 'undefined' || KIND !== 'public'}
    commands:
      - tapOn:
          id: "new-channel-kind-private"
- tapOn:
    id: "new-channel-name"
- inputText: ${output.channelName}
- takeScreenshot: 5784-1-new-channel
# ① ✓ — 새 채널 시트가 다 내려간 **뒤** 멤버 추가 시트가 선다.
- tapOn:
    id: "new-channel-create"
- extendedWaitUntil:
    visible:
      id: "channel-member-add-close"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "channel-member-add-lead"
    text: "${output.channelName} 채널을 만들었어요.*"
- assertNotVisible:
    id: "new-channel-create"
- takeScreenshot: 5784-2-member-add-sheet
# ② 한 명을 넣는다. 줄의 이름(낭독 이름)은 「이름, @핸들, 사람[, 상태]」로 시작한다.
- tapOn:
    text: "${output.peer}, @.*"
- extendedWaitUntil:
    visible:
      text: "${output.peer}, @.*멤버"
    timeout: 10000
- assertVisible:
    id: "channel-member-add-close"
- takeScreenshot: 5784-3-added-one
# ③ X — 건너뛰기와 같은 닫는 길. 시트가 사라지고 새 채널의 머리가 선다.
- tapOn:
    id: "channel-member-add-close"
- extendedWaitUntil:
    notVisible:
      id: "channel-member-add-close"
    timeout: 10000
- assertVisible:
    id: "conversation-title"
    text: "${output.channelName}"
# 폰 머리는 채널의 멤버 수를 그리지 않는다(채널 목록의 `memberIds` 가 DM 에만 실려 비어 있다 - `channelMemberCountLabel`, 이 흐름 밖의 기존 모양).
# 그래서 「넣은 사람이 서버에 실제로 들어갔는가」는 이 흐름이 아니라 서버의 `membership` 행으로 잰다(인계 「수리 1회차」).
- takeScreenshot: 5784-4-after-close
