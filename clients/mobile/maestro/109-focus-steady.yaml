appId: app.momo.ios
name: 109-focus-steady
---
# 109-focus-steady — 입력창을 **누르는 순간**(글자 0개) 펼침이 시작되고, 포커스를 잃으면 접히는 흐름 (#4456). 재는 것은 앱이 한다
# (`measure/steady.tsx` 의 `focus` 장면: 프레임마다 맨 아래 행·도크의 창 좌표와 포커스 여부, 포커스·자판·초안·보냄 표식).
#
#   xcrun simctl launch <udid> app.momo.ios --args -momoMeasure DM-STEADY-FOCUS \
#     -RCT_jsLocation 127.0.0.1:$PORT -momoGapSink 127.0.0.1:$SINK
#   maestro --device <udid> test clients/mobile/maestro/109-focus-steady.yaml
#
# 장면은 100초 재고 끝난다. 이 흐름은 그 안에 끝나야 한다(앞 6초는 목록이 끝에 앉는 시간이라 기다린다).
# 시뮬레이터는 키보드가 처음 오를 때 받아쓰기 설정을 물을 수 있고 그 알림이 앱 트리를 가린다 — 잴 기기에서 한 번 미리 눌러 두고
# (`103-input-steady` 의 앞 두 탭이 같은 일을 한다) 이 흐름은 그 뒤에 돌린다. 안 그러면 첫 포커스가 알림에 먹힌다.
#
# 끌어 내리기는 도구 줄의 「@」 에서 시작한다. 글 칸(`composer-input`) 위에서 시작하면 시뮬레이터(Maestro 의 합성 터치)에서는 손을 뗄 때 입력창이
# 다시 포커스를 받아 자판이 되살아난다(#4456 에서 기준 코드도 같음을 확인) — 이 흐름이 재려는 것은 접힘이라 그 길은 피한다.
#
# 순서 (「가만히」 = 아무것도 안 하고 1.5~3초 — 그 사이 목록이 움직이면 안 된다):
#   A 누른다(글 0자)      → 포커스 순간 펼침(빈 펼침)이 자판과 함께 선다. 가만히.
#   B 세 줄을 친다        → 펼친 채 입력창이 줄 수만큼 자란다(첫 글자에서 따로 펼치지 않는다). 세 번째 줄에서 자란다.
#   C 보낸다              → 글이 비어도 포커스가 남으므로 **빈 펼침 높이**(한 줄 + 도구 줄)로 돌아온다. 여러 줄 높이가 남지 않는다.
#   D 끌어 내린다         → 자판이 내려가고 포커스를 잃고 글이 없어서 접힌다.
#   E 다시 누른다         → 두 번째 펼침. 한 글자를 남기고 끌어 내린다 → 글이 남았으니 **펼친 채**.
#   F 다시 누르고 지운다  → 지운 채 끌어 내린다 → 접힌다.
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 60000
# 장면이 재기 시작할 때까지 기다린다(진입 수렴 4초 + 0.8초).
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 7000
    optional: true
# A — 누른다. 처음 몇 초는 접힌 채 가만히(대조: 접힘 높이에서 목록이 안 움직인다).
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 2500
    optional: true
- tapOn:
    id: "composer-input"
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 3000
    optional: true
# B — 세 줄. 펼친 입력창은 빈 줄 하나를 더 품고 있어서(한 줄 + 빈 줄 + 도구 줄) 두 줄까지는 높이가 그대로이고 **세 번째 줄에서** 자란다.
- inputText: "금요일 배포는 오후로 미룰게요"
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 1500
    optional: true
- pressKey: Enter
- inputText: "그 전에 시안부터 확인해 주세요"
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 1500
    optional: true
- pressKey: Enter
- inputText: "끝나면 여기에 남겨 둘게요"
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 2000
    optional: true
# C — 보낸다(포커스는 그대로).
- tapOn:
    id: "composer-send"
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 3000
    optional: true
# D — 아래로 끌어 자판을 내린다(#4305). 포커스를 잃고 글이 없으니 접힌다.
- swipe:
    from:
      id: "composer-tool-mention"
    direction: DOWN
    duration: 400
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 3000
    optional: true
# E — 다시 누르고, 한 글자를 남긴 채 끌어 내린다.
- tapOn:
    id: "composer-input"
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 2000
    optional: true
- inputText: "가"
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 800
    optional: true
- swipe:
    from:
      id: "composer-tool-mention"
    direction: DOWN
    duration: 400
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 3000
    optional: true
# F — 글이 남은 채 다시 누르고(이미 펼침), 지우고, 끌어 내린다 → 접힌다.
- tapOn:
    id: "composer-input"
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 1500
    optional: true
- eraseText: 5
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 1500
    optional: true
- swipe:
    from:
      id: "composer-tool-mention"
    direction: DOWN
    duration: 400
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 3000
    optional: true
