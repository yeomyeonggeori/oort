appId: app.momo.ios
name: 5490-reply-preview
# No `env:` block — see the note at the top of 00-login.yaml.
#   SERVER_URL EMAIL PASSWORD CHANNEL_ID PEER_TEXT
---
# 밀어서 답장 → 이모티콘 고르기 → 미리 보기(답글 머리말과 함께) → 보내기 한 번 (#5490, 검증 7b M5. owner 11-07 「보내기를 누르면 글과 같이가요 라든지 미리보기 X로 지우기 같은 텍스트는 같이
# 노출 안하고 내가 보낸 카카오톡 레퍼런스 처럼」). 밀어서 답장은 카카오톡에서 가져온 손짓이라, 여기서 `:이름:` 글이 입력칸에 들어가면 레퍼런스에서 가장 멀어진다.
#
# 이 흐름이 재는 것(눈이 아니라 단정이다):
#   ① 남의 글을 밀면 답글 머리말이 선다(`4869-reply-swipe` ②와 같다).
#   ② ☺ 로 창을 열고 이모티콘 칸을 누르면 **입력칸에 `:이름:` 글이 안 들어가고**, 머리말과 미리 보기(그림 + ✕)가 **함께** 선다. ← 캡처 `5490-cap-1-reply-preview`
#   ③ 입력창을 눌러 키보드가 돌아와도 둘 다 그대로다. 글을 쓴다. ← 캡처 `5490-cap-2-keyboard`
#   ④ 보내기 한 번: 머리말·미리 보기가 사라지고 입력창이 비며, 대화 화면에 머문다(스레드 화면 `thread-header-overlay` 가 서지 않는다).
#
# 이 흐름이 **못 재는 것**(검증 줄이 레인 DB와 화면으로 본다 - 인계 「스택 검증 메모」):
#   · 서버가 받은 순서 `[큰 그림, 글]` · 두 메시지의 `root_id` 가 같고 대상 글의 id 인 것 · `client_msg_id` 가 서로 다른 것 - Maestro 는 서버 행을 읽지 못한다.
#     (#5452 와 같은 길: 레인 DB 에서 `message` 의 `seq`·`root_id`·`client_msg_id` 를 읽는다.)
#   · 보낸 뒤 대상 글 밑에 「답글 N개」(`thread-rollup`)가 서고, 그것을 열면 큰 그림 `expression-body-large` 와 글이 같은 스레드 안에 있는 모습(캡처 1장).
#   · 첫째 실패·둘째만 실패의 화면(서버를 막아야 한다 - 규칙은 jest 가 잰다: `expressionBundleSend`·`replyExpressionSend`).
#
# 준비: 두 가지를 모두 갖춘 스택이다.
#   1) `CHANNEL_ID` 채널의 **본류에 남이 쓴 글** `PEER_TEXT` - `4869-reply-swipe` 와 같다(내 글이면 머리말이 「내 글에 답글」이라 ①의 단정이 붉어진다. 에이전트의 답은 남의 글 자리를 못 채운다).
#   2) 팀 보관함에 `chi_cry` 가 있다 - `measure/seed-expression-panel.py`(`5452-expression-panel` 과 같다).
#
#   maestro --udid <udid> test -e SERVER_URL=… -e EMAIL=… -e PASSWORD=… \
#     -e CHANNEL_ID=<채널 id> -e PEER_TEXT="<남의 글 한 줄>" clients/mobile/maestro/5490-reply-preview.yaml
#
# 같은 흐름을 세 번 돌려 3/3 이어야 한다. 보낼 때마다 대상 글 밑 스레드에 답글이 둘씩 쌓이지만 이 흐름은 보낸 뒤를 짚지 않는다.
- launchApp:
    appId: app.momo.ios
    arguments:
      momoAutomation: "YES"
# 시스템 언어가 영어인 시뮬레이터에서는 로그인 직후 「Save Password?」 가 뜬다(`dismiss-system-alerts` 는 한국어 단추만 안다) - 있으면 닫는다.
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- runFlow: subflows/ensure-signed-in.yaml
- extendedWaitUntil:
    visible:
      id: "sidebar-row-channel:${CHANNEL_ID}"
    timeout: 90000
- tapOn:
    id: "sidebar-row-channel:${CHANNEL_ID}"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 60000
- runFlow: subflows/dismiss-dev-logbox.yaml
- assertVisible: ".*${PEER_TEXT}.*"

# ① 남의 글을 문턱 넘게 밀어 답글 머리말을 건다. 대상은 좌표가 아니라 `PEER_TEXT` 가 든 행이다(`4869-reply-swipe` 의 11-06 수리와 같다).
- swipe:
    from:
      id: "message-press"
      text: ".*${PEER_TEXT}.*"
    direction: LEFT
    duration: 400
- extendedWaitUntil:
    visible:
      id: "reply-draft-card"
    timeout: 10000
- assertVisible: ".*님에게 답글"
- assertNotVisible: "내 글에 답글"
# 입력칸의 초안은 `launchApp` 을 건너 살아남으므로(30-approval 의 같은 줄 참고) 먼저 비운다 - 안 그러면 앞 실행의 글이 보내는 글에 섞인다.
- eraseText: 200

# ② ☺ - 창이 키보드 자리에 서고, 이모티콘 칸 하나를 누르면 머리말과 미리 보기가 함께 선다. 입력칸에는 아무 글도 들어가지 않는다.
- tapOn:
    id: "composer-expression"
- extendedWaitUntil:
    visible:
      id: "expression-panel"
    timeout: 10000
- tapOn:
    id: "expression-panel-tab-emoticon"
- extendedWaitUntil:
    visible:
      id: "expression-pick-chi_cry"
    timeout: 20000
- tapOn:
    id: "expression-pick-chi_cry"
- extendedWaitUntil:
    visible:
      id: "composer-expression-preview"
    timeout: 10000
- assertVisible:
    id: "reply-draft-card"
- assertVisible:
    id: "composer-expression-preview-clear"
# 이전에는 여기서 `:chi_cry:` 글이 입력칸에 들어갔다(M5). 입력칸에 그 글이 없어야 한다(대화에 지난 실행이 보낸 큰 그림이 있어도 걸리지 않게 입력칸으로 좁힌다).
- assertNotVisible:
    id: "composer-input"
    text: ".*:chi_cry:.*"
- waitForAnimationToEnd:
    timeout: 3000
# 이 장면이 이슈의 캡처 수용기준(답글 머리말과 미리 보기가 같이 선 모습)이다.
- takeScreenshot: 5490-cap-1-reply-preview

# ③ 입력창을 누르면 키보드가 돌아오고(창은 걷힌다) 머리말과 미리 보기는 그대로 남는다. 글을 쓴다.
- tapOn:
    id: "composer-input"
- inputText: "MAESTRO TEXT 고생 많았어요"
- assertVisible:
    id: "reply-draft-card"
- assertVisible:
    id: "composer-expression-preview"
- assertNotVisible:
    id: "expression-panel"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 5490-cap-2-keyboard

# ④ 보내기 한 번 - 머리말과 미리 보기가 함께 사라지고 입력창이 비며, 스레드 화면으로 옮겨 가지 않는다.
- tapOn:
    id: "composer-send"
- extendedWaitUntil:
    notVisible:
      id: "reply-draft-card"
    timeout: 10000
- assertNotVisible:
    id: "composer-expression-preview"
- assertNotVisible:
    id: "thread-header-overlay"
- assertVisible:
    id: "composer-input"
