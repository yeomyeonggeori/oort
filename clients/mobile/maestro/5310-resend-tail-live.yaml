appId: app.momo.ios
name: 5310-resend-tail-live
---
# 5310-resend-tail-live - 서버가 끊긴 채 보낸 글이 연결이 돌아와 **자동으로 다시 나간 뒤**, 마지막 행이 대화 목록 끝에 온전히 앉는가 (#5310, #5284 재발 — 검증 5b L7 의 흐름).
#
# 검증 5a·5b 에서 같은 모양이 셋 나왔다: 자동 재전송된 마지막 행이 입력창 위 목록 끝에서 17~20pt 잘린 채 서 있고(55초 뒤에도, 작은 쓸기 뒤에도), 「최신으로」 필도 없었다. 입력창 위의 빈 띠 108px(36pt)는
# 결함이 아니다 — 에이전트 대화의 목록 → 알약 간격은 20 + 레일 칸 16 = 36 이고(`CONV.agentRailSlot`), 정상 상태도 같다. **결함은 그 창 아래 끝에서 마지막 행이 잘린 것**이다.
#
# 시뮬레이터는 네트워크를 못 끈다 — 그래서 서버 쪽을 끊는다. `scripts/lane-api-ctl.mjs` 가 **이 레인의 api 컨테이너 하나**를 내렸다 올린다(허용 범위 고정, `CTL` 이 그 주소).
#
#   # 1) 레인 스택(보통 `npm run lane:phone -- --keep --skip-flows` 로 올린다). 앱은 Metro 에 물려 있고(`defaults write app.momo.ios RCT_jsLocation 127.0.0.1:<포트>`) 시뮬레이터의
#   #    하드웨어 키보드는 꺼져 있어야 한다(`hwkb <UDID> off` — 안 그러면 자판이 안 올라와 「키보드 올림」이 조용히 「접음」이 된다). 입력창은 비어 있어야 한다(앞 흐름의 초안이 없게).
#   # 2) 컨트롤러(레인의 compose 프로젝트 이름을 명시한다 — 기본값이 없다):
#   node clients/mobile/scripts/lane-api-ctl.mjs --project <compose 프로젝트> --port 24994 &
#   # 3) 흐름. KEYBOARD=up(기본 장면: 자판이 올라온 채 끊김·복구) | down(자판을 접은 대조):
#   maestro --udid <UDID> test -e SERVER_URL=http://127.0.0.1:<api 포트> -e EMAIL=<레인 이메일> -e PASSWORD=<레인 비밀번호> -e CHANNEL_ID=<#agent-lab 채널 id> \
#     -e CTL=http://127.0.0.1:24994 -e PREFIX=<사진 이름 머리> -e KEYBOARD=up --test-output-dir <폴더> clients/mobile/maestro/5310-resend-tail-live.yaml
#   # 4) 흐름이 끝난 **그 화면**에서 잘린 양을 잰다(Maestro 의 assertVisible 은 잘린 행도 「보인다」고 센다 — 경계가 화면에 걸치면 된다):
#   maestro --udid <UDID> hierarchy > hier.json && node clients/mobile/scripts/lane-tail-check.mjs hier.json     # 잘린 양 0 이면 통과(종료 코드 0)
#   # 5) 컨트롤러를 PID 로 끝낸다(끝낼 때 api 를 올려 두고 나간다).
#
# 단계(사진 이름 `${PREFIX}-D<n>-…`): D0 건강 · D1 쓴 글(둘째 줄로 넘어간다) · api 내림 → 보내기 · D2 못 보냈어요 + 원인 문장 · D4 쓰던 글이 남은 채(KEYBOARD=down 이면 입력창이 쉰 뒤) · api 올림 → 자동 재전송(앱의 재연결 주기에 따라 1~2분) →
# D6 복구 뒤(끝). 못 보낸 글은 DB 에 한 번만 들어가야 한다(같은 멱등 키) — 이 흐름은 화면만 본다.
#
# 이 흐름이 직접 단정하는 것: 못 보낸 글 줄이 **섰다가**(보내기가 정말 못 나갔다) 원인 문장과 함께 걷혔다 · 「최신으로」 필이 없다(따라가는 중이 꺼지지 않았다) · KEYBOARD=down 이면 입력창이 쉬었다.
# 마지막 행이 끝에 온전한지는 위 4) 가 잰다. 4) 가 잘린 양 > 0 을 내면 **한 번 쓸어 보고 다시 잰다**: 움직여서 0 이 되면 오프셋이 모자랐던 것이고, 안 움직이면(5b 의 D7 이 그랬다) 행 프레임이 그린 모양보다 작은 쪽이다 — 그때는 계층(hier.json)과 사진을 남겨 올린다.
- launchApp:
    appId: app.momo.ios
    arguments:
      momoAutomation: "YES"
- runFlow: subflows/ensure-signed-in.yaml
- tapOn:
    id: "sidebar-row-channel:${CHANNEL_ID}"
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 60000
- runFlow: subflows/dismiss-dev-logbox.yaml
- takeScreenshot: ${PREFIX}-D0-healthy
- tapOn:
    id: "composer-input"
# 앞 흐름이 남긴 초안이 끼어들지 않게 지운다(쓴 글이 초안 한가운데로 들어가 행이 길어졌던 것이 5b 사진의 모양이다).
- eraseText: 300
- inputText: "서버 끊긴 채 보내는 글입니다. 두 줄로 넘어가도록 조금 길게 적어 행의 높이를 키워요"
- takeScreenshot: ${PREFIX}-D1-typed
# 글을 다 쓴 **뒤에** 서버(api)를 내리고 곧바로 보낸다 — 실시간 연결(centrifugo)은 그대로다: 「서버에 닿지 못함」 장면. 앱이 끊김을 눈치채기 **전에** 보내야 못 보낸 글 줄이 선다:
# 눈치챈 뒤에는 보내기가 꺼져 글이 입력창에 남기만 한다(5b 흐름은 내린 뒤에 썼고, 부하가 큰 판에서는 그렇게 아무 글도 못 보낸 채 지나갔다 — 그래서 아래에서 못 보낸 글 줄을 기다린다).
- evalScript: ${http.get(CTL + '/api-stop').status}
- tapOn:
    id: "composer-send"
# 보내기가 못 나가면 입력창 위에 원인 문장이 서고 못 보낸 글 줄이 선다. 글 줄이 서지 않으면(글이 입력창에 남았다면) 이 흐름은 여기서 붉어진다 — 복구를 기다려도 다시 보낼 글이 없다.
- extendedWaitUntil:
    visible:
      id: "composer-offline"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "pending-failed-reason"
    timeout: 30000
- takeScreenshot: ${PREFIX}-D2-failed
# 입력창에 쓰던 글이 남는다(오프라인이면 보내기가 꺼져 있어 초안이 그대로 남는 것이 설계다) — 5b 흐름의 「넷째 글」이다.
- tapOn:
    id: "composer-input"
- inputText: "서버 끊긴 채 쓰던 글"
# 자판을 접은 대조: 목록의 아무 데나 한 번 누르면 자판이 내려가고 입력창이 쉰다(#4614). `hideKeyboard` 는 이 자판에서 실패한다(Maestro 가 닫을 곳을 못 찾는다).
- runFlow:
    when:
      true: ${KEYBOARD == 'down'}
    commands:
      - tapOn:
          point: "50%,23%"
      - evalScript: ${(function () { var end = new Date().getTime() + 2000; while (new Date().getTime() < end) {} return 0; })()}
      # 쉬는 알약으로 접히면 도구 줄(+ · @ · 보내기)이 걷힌다 — 자판이 내려가고 입력창이 쉬었다는 증거다(`115-list-tap-dismiss` 와 같은 단정).
      - assertNotVisible:
          id: "composer-tools"
- takeScreenshot: ${PREFIX}-D4-offline-ready
# 서버를 올린다. 앱이 다시 닿으면 원인 문장이 걷히고, 못 보낸 글이 저절로 같은 멱등 키로 다시 나간다.
- evalScript: ${http.get(CTL + '/api-start').status}
- extendedWaitUntil:
    notVisible:
      id: "composer-offline"
    timeout: 180000
- extendedWaitUntil:
    notVisible:
      id: "pending-failed-reason"
    timeout: 60000
# 활강(350ms)·안착 확인·되튐이 가라앉도록 둔다.
- evalScript: ${(function () { var end = new Date().getTime() + 4000; while (new Date().getTime() < end) {} return 0; })()}
- takeScreenshot: ${PREFIX}-D6-recovered
- assertNotVisible:
    id: "jump-latest"
# 일부러 여기서 끝낸다: 5b 흐름은 끝에 작은 쓸기를 더했는데, 끝에서 **오프셋이 모자란** 목록은 그 쓸기가 남은 만큼 움직여 끝에 앉혀 버린다 — 사진(D7)이 멀쩡해 보이고, 이 흐름이 재려는 상태가
# 지워진다. 쓸기는 위 4) 가 잘린 양을 낸 **뒤에** 손으로 한다.
