appId: app.momo.ios
name: 112-enter-steady
---
# 112-enter-steady — 대기 중인 실행이 있는 에이전트 DM 에 **들어가서** 입력창을 **누르고** 첫 글자 1~5개를 치고 1분 남짓 가만히 두는 흐름 (#4613).
# 재는 것은 앱이 한다(`measure/steady.tsx` 의 `enter` 장면: 마운트 첫 프레임부터 프레임마다 맨 아래 행·목록 높이·입력창 높이·도크·알약,
# 스크롤 보고마다 출처, `chasingTail` 전이, 햅틱 호출). 분석은 `measure/enter-windows.mjs`.
#
#   xcrun simctl launch <udid> app.momo.ios --args -momoMeasure DM-STEADY-ENTER+T80 \
#     -RCT_jsLocation 127.0.0.1:$PORT -momoGapSink 127.0.0.1:$SINK
#   maestro --udid <udid> test clients/mobile/maestro/112-enter-steady.yaml
#
# 변형(장면 이름 뒤 `+`): `age17h`(글자 고정 대조) · `nobar`(활동 줄·1초 시계 없음 대조) · `label`(서버 생존 판정 D4 문구까지 — 실기 근거 글) · `T<초>`.
# 장면은 기본 75초(`+T80` 권장)를 재고 끝난다. 이 흐름은 그 안에(약 65초) 끝난다.
# 시뮬레이터는 키보드가 처음 오를 때 받아쓰기·슬라이드 입력 안내를 띄울 수 있고 그 알림이 앱 트리를 가린다 — 잴 기기에서 한 번 미리 눌러 두고
# 이 흐름은 그 뒤에 돌린다(`110-focus-steady` 머리말과 같다). 아래 `지금 안 함` 가드는 그 알림이 떠 있을 때만 닫는다.
#
# 순서 (「가만히」 = 아무것도 안 하고 기다림 — 그 사이 활동 줄의 「N초째」가 매초 바뀐다):
#   A 진입 뒤 가만히(입력창이 보이면 진입 수렴은 시작된 지 오래 아님 — 앞 3초를 더 본다)
#   B 입력창을 누른다   → 닿는 순간 펼침(#4518) → 손을 떼면 포커스·자판
#   C 글자 1개 → 가만히 → 글자 4개 더(총 5) → 가만히
#   D 45초 가만히        → 초 단위 갱신만으로 목록이 움직이는가
#   E 첨부 버튼 한 번    → **양성 대조**: 앱 햅틱이 울리면 하네스의 햅틱 계수가 정확히 1 이어야 한다(「진입·입력 중 0」이 증거가 되려면).
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 60000
# A
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 3000
    optional: true
# B
- tapOn:
    id: "composer-input"
- runFlow:
    when:
      visible: "지금 안 함"
    commands:
      - tapOn: "지금 안 함"
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 2500
    optional: true
# C
- inputText: "가"
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 2000
    optional: true
- inputText: "나다라마"
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 2000
    optional: true
# D — 45초: 활동 줄 글자만 바뀐다(1분이 지나는 순간 「N초째」→「1분째」도 이 안에 든다).
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 15000
    optional: true
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 15000
    optional: true
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 15000
    optional: true
# E — 양성 대조(첨부 메뉴 열기는 haptics.light 한 번).
- tapOn:
    id: "composer-attach"
- extendedWaitUntil:
    visible:
      id: "no-such-element"
    timeout: 2500
    optional: true
