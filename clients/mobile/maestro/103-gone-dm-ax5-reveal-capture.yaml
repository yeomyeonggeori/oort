appId: app.momo.ios
name: 103-gone-dm-ax5-reveal-capture
---
# 103-gone-dm-ax5-reveal-capture - 가장 큰 글자 크기에서 접힌 줄을 누르면 펼친 결과가 화면 안에 보인다 (#4252, design-review M1).
#
# 「나간 멤버와의 대화」 줄은 DM 구역의 끝(= 목록의 끝)이고, AX5 에서는 행이 커서 펼친 행이 화면 밖에 선다. 앱이 펼친 직후 목록 끝으로
# 내려 줘야 사람이 눌렀을 때 결과를 본다. 이 흐름은 줄을 누른 뒤 **하네스가 스크롤하지 않은** 첫 화면을 찍는다.
#
#   xcrun simctl ui booted content_size accessibility-extra-extra-extra-large
#   xcrun simctl launch booted app.momo.ios --args \
#     -momoMeasure GONE-DM-HOME -RCT_jsLocation 127.0.0.1:$PORT
#   maestro test -e SHOT=ax5-expanded-dark clients/mobile/maestro/103-gone-dm-ax5-reveal-capture.yaml
- extendedWaitUntil:
    visible:
      id: "sidebar-gone-toggle"
    timeout: 60000
- tapOn:
    id: "sidebar-gone-toggle"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOT}
