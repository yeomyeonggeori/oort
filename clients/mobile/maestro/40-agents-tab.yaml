appId: app.momo.ios
name: 40-agents-tab
# No `env:` block — see the note at the top of 00-login.yaml.
---
# 40-agents-tab — 에이전트 목록 → 에이전트 프로필.
#
# This flow used to be about 재우기: the agent screen's state card, the pause
# toggle, and the 「자고 있음」 system line it causes in the channel. #3902
# (a75a0eda9, 「깨우기 제거」) took that card OFF the phone on purpose — the pause
# stays on the server and the desktop — so there is no toggle left to tap, and
# `agent-state` / `agent-pause-*` are not in the app any more. The 11-01
# verification run got as far as the agent screen and died there, once the
# `plus-menu-agents` row it started from was also found gone (#5045).
#
# What it checks now is what the phone still has: that the agent list opens from
# where it lives today (+ 메뉴 → 「AI」 시트 → 「에이전트 부르기」), that the lane's agent
# is on it, and that its profile screen is that agent's — the instructions text is
# the one scripts/lane-phone.sh writes into `agent_profile` for the fixture, so a
# profile of some other agent cannot pass. Nothing here changes server state, so
# unlike the old flow there is nothing to put back for 10/20/30 to find.
#
# NOT covered any more, and not coverable from this lane: the phone rendering the
# server's system line for a mention that reaches a PAUSED agent. With no pause
# control on the phone the lane has no way to pause the agent; that needs either
# the desktop or a REST call from the flow, and is left to a follow-up.
- launchApp:
    appId: app.momo.ios
- runFlow: subflows/ensure-signed-in.yaml

# Detour through #general before touching the tab bar, and it is not wasted
# motion: the LogBox banner (subflows/dismiss-dev-logbox.yaml) sits on the same
# band of screen as the tab bar, so a tab tap made while it is up is swallowed
# and the flow carries on against the wrong screen — `tapOn: tab-agents` (then a tab)
# reported COMPLETED here while the app never left 대화.
#
# It has to be dismissed from a CONVERSATION rather than from this screen,
# because the dismissal is a coordinate and on the channel list that coordinate
# is the 「＋」 button. In a conversation it lands on a disabled send button.
- tapOn:
    id: "sidebar-row-channel:${GENERAL_CHANNEL_ID}"
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "long-press-hint"
    commands:
      - tapOn:
          id: "long-press-hint-dismiss"
- runFlow: subflows/dismiss-dev-logbox.yaml
- tapOn:
    id: "header-back"

# The agent list layer is mounted LAZILY on first visit (AppShell), so `agents-list`
# does not exist in the hierarchy until it has been opened — waiting for it
# before opening it would time out on a healthy app.
- extendedWaitUntil:
    visible:
      id: "shell-plus"
    timeout: 30000
# 에이전트 목록은 탭이 아니라 + 메뉴 「AI」 시트의 「에이전트 부르기」 행이다 (ADR-0189 D1 →
# N10 #3598: 에이전트 부르기·작업 맡기기·내 도구가 「AI」 시트 하나로 모였다). `plus-menu-agents`
# 행은 없어졌고 + 메뉴의 행은 dm·channel·ai·work 넷이다(`PlusMenuItem.key`).
- tapOn:
    id: "shell-plus"
- tapOn:
    id: "plus-menu-ai"
- extendedWaitUntil:
    visible:
      id: "ai-row-agents"
    timeout: 10000
- tapOn:
    id: "ai-row-agents"
- extendedWaitUntil:
    visible:
      id: "agents-list"
    timeout: 60000
- assertVisible:
    id: "agents-title"
- assertVisible:
    id: "agent-row-${AGENT_MEMBER_ID}"

- tapOn:
    id: "agent-row-${AGENT_MEMBER_ID}"
- extendedWaitUntil:
    visible:
      id: "agent-detail-title"
    timeout: 60000

# The profile card carries the fixture's own instructions (see the header), the
# two actions are the ones #3902 left (「대화 열기」 primary, 「작업 맡기기」 secondary),
# and the channels the agent was seated in show as chips.
- assertVisible:
    id: "agent-profile-card"
- assertVisible:
    id: "agent-instructions"
    text: ".*MAESTRO-1 phone lane fixture.*"
- assertVisible:
    id: "agent-open-dm"
- assertVisible:
    id: "agent-delegate-work"
- assertVisible:
    id: "agent-channels"

# 에이전트 상세 → 에이전트 목록 층 → 홈. 탭바는 층 뒤에 있어 누를 수 없다.
- tapOn:
    id: "header-back"
- extendedWaitUntil:
    visible:
      id: "agents-list"
    timeout: 10000
- tapOn:
    id: "header-back"
- extendedWaitUntil:
    visible:
      id: "sidebar-list"
    timeout: 10000
