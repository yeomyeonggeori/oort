appId: app.momo.ios
name: 45-work-console
---
# #2864 — 「작업」 팀 보드 한 열 판과 읽기 전용 시트(옛 #1292 작업 콘솔의 자리).
- launchApp:
    appId: app.momo.ios
- runFlow: subflows/ensure-signed-in.yaml

# Dismiss the development LogBox away from the tab bar, using the same safe
# detour as 40-agents-tab.
- tapOn:
    id: "sidebar-row-channel:${GENERAL_CHANNEL_ID}"
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 60000
- runFlow: subflows/dismiss-dev-logbox.yaml
- tapOn:
    id: "header-back"

# 에이전트·작업은 탭이 아니라 + 메뉴의 행이다 (ADR-0189 D1, #2714 → #2750).
- tapOn:
    id: "shell-plus"
- tapOn:
    id: "plus-menu-work"
- extendedWaitUntil:
    visible:
      id: "team-board-list"
    timeout: 60000
- assertVisible:
    id: "work-title"
- assertVisible:
    id: "team-board-filter-all"
- assertVisible:
    id: "team-board-filter-mine"
# 「작업」은 팀 보드 한 열 판이다(#2864). 서버가 채널 멤버십으로 걸러 준 줄만 선다.
- tapOn:
    id: "team-board-filter-mine"
- tapOn:
    id: "team-board-filter-all"
- assertVisible:
    id: "team-board-row-${WORK_SESSION_ID}"

# 줄을 누르면 읽기 전용 시트가 열린다. 터미널·입력·멈춤이 없고, 바닥에는 이동만 있다.
- tapOn:
    id: "team-board-row-${WORK_SESSION_ID}"
- extendedWaitUntil:
    visible:
      id: "team-detail-terminal-note"
    timeout: 60000
- assertVisible:
    id: "team-detail-open-channel"
- tapOn:
    id: "team-detail-close"
- assertVisible:
    id: "team-board-list"
