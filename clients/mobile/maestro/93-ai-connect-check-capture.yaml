appId: app.momo.ios
name: 93-ai-connect-check-capture
---
# 93-ai-connect-check-capture — 자판 없이 카드 몸을 끝까지 올리고 「연결 확인」을 누른다 (#2945).
#
# `-momoMeasure AI-CONNECT-CARD` 위에서(92번과 같은 방식). 큰 글씨에서 버튼·알약·
# 마스킹 꼬리까지 보이는지와, 확인 결과가 줄 자리에 서는지를 찍는다. 하네스에는
# 서버가 없으므로 결과는 오류 갈래다.
- extendedWaitUntil:
    visible:
      id: "ai-connect-card"
    timeout: 60000
- runFlow: subflows/dismiss-dev-logbox.yaml
# 카드 몸은 제 ScrollView 안에서 움직인다. maestro 의 「보임」은 ScrollView 의
# 잘림을 모르므로(잘린 버튼 좌표를 누르면 아래 입력창이 눌려 자판이 오른다) 몸을
# 직접 끌어 올린다.
- repeat:
    times: 3
    commands:
      - swipe:
          from:
            id: "ai-connect-card-scroll"
          direction: UP
- takeScreenshot: ai-connect-scrolled
- tapOn:
    id: "ai-connect-card-team-check"
# 결과 줄은 몸 스크롤의 아래에 설 수 있다(큰 글씨 SE 의 몸 창은 좁다). 끌어 올리지
# 않는다 — 결과 줄이 서면 카드가 몸을 끝까지 내린다(#2988). 사진이 그것을 든다.
- extendedWaitUntil:
    visible:
      id: "ai-connect-card-team-result"
    timeout: 30000
- takeScreenshot: ai-connect-check-result
