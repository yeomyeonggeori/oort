[package]
name = "momo-desktop"
version = "0.0.0"
description = "momo desktop shell — ADR-0133 (MOMO-595 spike, MOMO-603 native plugins, MOMO-606 updater)"
# Repository license (root LICENSE). Stated explicitly because this crate is not
# a member of the server-rust workspace and inherits nothing from it; without it
# the #1225 license gate reports the first-party shell as unlicensed.
license = "Apache-2.0"
edition = "2021"
# MSRV — 실측치(#1442). 이전 값 1.77.2 는 tauri 2 스캐폴드가 남긴 초기값이었고
# 그래프 실상과 12 마이너 어긋나 있었다. 서버 워크스페이스(1.88.0)보다 한 칸 높다
# — 데스크톱만 끌어오는 알림 스택이 더 높은 바닥을 요구하기 때문이다.
#   실측(2026-08-17, track/engine@54f5d2dc, Cargo.lock 고정, aarch64-apple-darwin):
#     `cargo +1.88.0 check --workspace --locked` → 거절
#       notify-rust@4.18.0 이 rustc 1.89.0 요구
#     `cargo +1.89.0 check --workspace --locked` → green
rust-version = "1.89.0"

[lib]
name = "momo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# P2 native integrations (MOMO-603). Licences are all MIT/Apache-2.0 — the
# permissive-stack rule applies to the client shell too, not just the backbone.
tauri-plugin-deep-link = "2"   # oort:// (+ legacy momo://) scheme registration + OS URL delivery
tauri-plugin-notification = "2"
mdns-sd = "0.20"               # pure-Rust _momo._tcp browse, no async runtime
url = "2"
percent-encoding = "2"         # RFC 3986 decoding for the deep link contract

# Self-update (MOMO-606). Desktop-only plugin: the updater replaces an app
# bundle, which has no meaning on iOS/Android, so it is gated the same way the
# plugin itself is rather than pulled into a mobile build that cannot use it.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

# OS credential store for the refresh token. Platform-gated so a Linux build does
# not have to grow the D-Bus/secret-service stack unless it is built there.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
