[package]
name = "momo-desktop"
version = "0.0.0"
description = "momo desktop shell — ADR-0133 (MOMO-595 spike, MOMO-603 native plugins, MOMO-606 updater)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "momo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# P2 native integrations (MOMO-603). Licences are all MIT/Apache-2.0 — the
# permissive-stack rule applies to the client shell too, not just the backbone.
tauri-plugin-deep-link = "2"   # oort:// (+ legacy momo://) scheme registration + OS URL delivery
tauri-plugin-notification = "2"
mdns-sd = "0.20"               # pure-Rust _momo._tcp browse, no async runtime
url = "2"
percent-encoding = "2"         # RFC 3986 decoding for the deep link contract

# Self-update (MOMO-606). Desktop-only plugin: the updater replaces an app
# bundle, which has no meaning on iOS/Android, so it is gated the same way the
# plugin itself is rather than pulled into a mobile build that cannot use it.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

# OS credential store for the refresh token. Platform-gated so a Linux build does
# not have to grow the D-Bus/secret-service stack unless it is built there.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
