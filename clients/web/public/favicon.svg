<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    oort 탭 아이콘 (B4.4). src/design/brand/OortMark.tsx와 같은 24x24 격자의 같은
    path이고, 32x32 타일 안에 4px 여백을 두고 앉는다.

    여기서는 색이 토큰이 아니라 리터럴이다. 이 파일은 CSS 캐스케이드 밖에서
    브라우저 탭이 직접 읽으므로 var(--accent)가 닿지 않는다. 값은 tokens.css의
    다크 스킴 --surface(#17161a)와 --accent(#f0a850)를 그대로 옮긴 것이고, 팔레트가
    바뀌면 이 파일도 같이 바뀌어야 한다.

    스킴을 따라가지 않고 어두운 타일 하나로 고정한다: 탭 바는 라이트에서도
    어두운 칩을 문제없이 보여주고, 파비콘이 스킴마다 달라지면 사용자가 탭을 찾는
    표식이 두 개가 된다.
  -->
  <rect width="32" height="32" rx="7" fill="#17161a"/>
  <g transform="translate(4 4)" fill="none" stroke="#f0a850" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.9 16.92A6.2 6.2 0 1 0 5.93 13.81L4.38 19.88Z"/>
    <path d="M15.89 5.92A10.4 3.6 -22 0 1 18.08 11.36M6.91 15.88A10.4 3.6 -22 0 1 4.72 10.44"/>
  </g>
</svg>
