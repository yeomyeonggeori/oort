<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    oort 탭 아이콘 (#2650, C2-04 Bubble). 생성물: clients/web/scripts/brand-mark.mjs가
    쓴다. 손으로 고치지 않는다. 기하는 small(24 격자, 16~32px 광학 보정판)이고
    src/design/brand/OortMark.tsx와 같은 path다.
    icon-system-exception(ADR-0172): 브라우저가 직접 읽는 oort 브랜드 파비콘이라
    Lucide 기능 아이콘으로 바꾸지 않고 로컬 SVG로 남긴다.

    색은 토큰이 아니라 리터럴이다(CSS 캐스케이드 밖에서 탭이 직접 읽는다).
    값은 앱 아이콘판과 같다: 바탕 #17161a(surface 토큰 다크), 링 #f7f6f3
    (surface 토큰 라이트), 위성 #f0a850(accent 토큰 다크). XML 주석 안에는
    하이픈 두 개를 쓸 수 없어 토큰 이름을 풀어 적었다. 폰 홈 화면·Dock·탭이
    같은 마크, 같은 세 색을 보인다. 스킴을 따라가지 않는다.
  -->
  <rect width="32" height="32" rx="7" fill="#17161a"/>
  <g transform="translate(4 4)" fill-rule="evenodd">
    <path fill="#f7f6f3" d="M18.59 10.46A8 8 0 0 1 7.29 20.09A0.5 0.5 0 0 0 6.94 20.04L4.2 20.71A0.75 0.75 0 0 1 3.29 19.8L3.96 17.06A0.5 0.5 0 0 0 3.91 16.71A8 8 0 0 1 13.54 5.41A4.5 4.5 0 0 0 18.59 10.46ZM15 13A4 4 0 1 0 7 13A4 4 0 1 0 15 13Z"/>
    <path fill="#f0a850" d="M21 6A3 3 0 1 1 15 6A3 3 0 1 1 21 6Z"/>
  </g>
</svg>
