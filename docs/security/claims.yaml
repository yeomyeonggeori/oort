# 「하지 않는 것」 — 시험으로 증명할 수 없고 증명하지 않는 문장이다(공개 약속의 일부).
# 각 항목은 아래 문서에 `<!-- limit:ID -->` 표식이 있어야 한다(E5).
limits:
  - id: LIM-1
    text: "oort is not end-to-end encrypted. The server reads message content: search, agents and notification previews depend on it."
    docs:
      - "SECURITY.md"
      - "docs/security/README.ko.md"
  - id: LIM-2
    text: "oort has not had an external security audit or penetration test."
    docs:
      - "SECURITY.md"
      - "docs/security/README.ko.md"
  - id: LIM-3
    text: "oort holds no SOC 2, ISO 27001 or similar certification."
    docs:
      - "SECURITY.md"
      - "docs/security/README.ko.md"
  - id: LIM-4
    text: "Whoever operates a server can read its plaintext messages and database."
    docs:
      - "SECURITY.md"
      - "docs/security/README.ko.md"
