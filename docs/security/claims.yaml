# oort 보안 주장 ↔ 증명 시험 매핑 (#4224 SEC-02, ADR-0214).
#
# 규칙: 시험이 없는 보안 주장은 공개하지 않는다. 이 파일에 없는 문장은 「주장」이 아니다.
# scripts/check_security_claims.py 가 아래를 검사한다(깨지면 exit 1).
#   E1 증명 없음 · E2 선택자가 아무것도 못 가리킴 · E3 `runs:` 약속과 실제 실행 위치 불일치
#   E4 P0 인데 사보타주 증거 없음 · E5 `limits:` 의 표식 누락
#
# 필드
#   id        주장 ID (유일)
#   claim     한 문장. 시험이 실제로 단정하는 것만 쓴다(시험보다 넓게 쓰지 않는다).
#   scope     범위·한계. 무엇이 증명되지 않았는지도 여기에 적는다.
#   priority  P0 = 경계 자체를 지키는 주장 → 사보타주(음성 대조) 증거가 필수.  P1 = 시험만 필수.
#   runs      pr-ci | nightly | local | release. 모든 증명이 적어도 그 레인에서 돈다는 약속.
#   proofs    시험 선택자 목록.  path.rs#fn · path.test.ts::정확한 제목 · script:경로
#   sabotage  P0 필수. how=무엇을 깨면 어느 시험이 빨개지는가, evidence=그 음성 대조의 경로(#fn).
#
# 선택자 모양과 레인 판정은 scripts/check_security_claims.py 머리말이 정본이다.
# 여기에 없는 「미검증」 주장(예: API 부팅 시 DB 역할 자기검사)은 공개 문서가 쓰지 않는다.
version: 1

claims:
  # ---- 테넌트 격리 -----------------------------------------------------------------
  - id: TEN-1
    claim: "Every public table that has a workspace_id column has row-level security enabled and forced, and a policy that references app.workspace_id."
    scope: "Checked against a real PostgreSQL 18 after all server/Migrations are applied, per table, in the Security pack lane of PR CI. Says nothing about tables without a workspace_id column (those are checked against a reviewed list, see the unclassified-table test)."
    priority: P0
    runs: pr-ci
    proofs:
      - "server-rust/crates/momo-db/tests/tenant_catalog_pg.rs#the_real_database_has_rls_force_and_a_workspace_policy_on_every_tenant_table"
      - "server-rust/crates/momo-db/tests/tenant_catalog_pg.rs#the_real_database_has_no_unclassified_non_tenant_table"
    sabotage:
      how: "A tenant table created without FORCE (or without a policy, or with a policy that ignores workspace_id) turns the catalog test red; the control_* tests feed each broken shape to the same checks, and security_pack.sh negative runs a migration fixture in CI."
      evidence: "server-rust/crates/momo-db/tests/tenant_catalog_pg.rs#control_force_missing_is_red"
  - id: TEN-2
    claim: "The runtime API role momo_app has no DML privilege on a tenant table that is not forced, cannot bypass row-level security, and sees no plain view (one without security_invoker) or foreign table outside the boundary."
    scope: "Catalog checks on the migrated test database. Does not prove that every deployment connects as momo_app: the API does not check its own role at start-up (SECURITY.md describes the deploy-time checks)."
    priority: P0
    runs: pr-ci
    proofs:
      - "server-rust/crates/momo-db/tests/tenant_catalog_pg.rs#the_real_database_gives_momo_app_no_dml_on_an_unforced_tenant_table"
      - "server-rust/crates/momo-db/tests/tenant_catalog_pg.rs#the_real_database_keeps_momo_app_inside_the_rls_boundary"
      - "server-rust/crates/momo-db/tests/tenant_catalog_pg.rs#the_real_database_exposes_no_view_or_foreign_relation_to_momo_app"
    sabotage:
      how: "Granting momo_app DML on an unforced tenant table, giving it BYPASSRLS or table ownership, or exposing a plain view turns the matching real-database test red; the control_* tests prove each shape is detected."
      evidence: "server-rust/crates/momo-db/tests/tenant_catalog_pg.rs#control_momo_app_dml_on_an_unforced_tenant_table_is_red"
  - id: TEN-3
    claim: "Every SECURITY DEFINER function in the public schema pins its search_path, and the set of public definers that momo_app may execute equals a reviewed allowlist."
    scope: "Catalog checks on the migrated test database; a new definer function needs an allowlist edit in the same change."
    priority: P0
    runs: pr-ci
    proofs:
      - "server-rust/crates/momo-db/tests/tenant_catalog_pg.rs#the_real_database_pins_search_path_on_every_security_definer"
      - "server-rust/crates/momo-db/tests/tenant_catalog_pg.rs#the_real_database_public_security_definers_equal_the_allowlist"
      - "server-rust/crates/momo-db/tests/tenant_catalog_pg.rs#the_real_database_momo_app_executes_only_the_listed_security_definers"
    sabotage:
      how: "A definer without a pinned search_path, or an unlisted public definer (including a new overload of an allowlisted name), turns the matching test red."
      evidence: "server-rust/crates/momo-db/tests/tenant_catalog_pg.rs#control_definer_without_search_path_is_red"
  - id: TEN-4
    claim: "Inside a tenant transaction the row-level-security workspace variable holds the caller's workspace id."
    scope: "Real PostgreSQL, read back through a superuser pool. Covers the helper every tenant route uses, not each route individually. It does not test that the value is gone after the transaction ends (SET LOCAL versus SET), nor that a policy then filters rows; the catalog and isolation tests carry the policy side."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/crates/momo-db/tests/conformance_pg.rs#with_tenant_tx_sets_the_rls_guc"
  - id: TEN-5
    claim: "Searching a channel the caller may not read answers exactly like searching a channel that does not exist, and a search cursor cannot be replayed under a different scope."
    scope: "Search routes only. Real PostgreSQL."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/bins/momo-server/tests/search_scope_conformance_pg.rs#a_channel_the_caller_may_not_read_is_the_same_404_as_one_that_is_not_there"
      - "server-rust/bins/momo-server/tests/search_scope_conformance_pg.rs#a_cursor_may_not_be_replayed_under_a_different_scope"

  # ---- 인증·세션 -------------------------------------------------------------------
  - id: AUTH-1
    claim: "Presenting an already-used refresh token after the reuse window has passed ends the whole session lineage of that device."
    scope: "Real PostgreSQL, device-key sessions. A resend inside the reuse window returns the same token pair and keeps the lineage (a retry after a lost response). Not a claim about access tokens already issued, which live until they expire."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/bins/momo-server/tests/device_key_conformance_pg.rs#a_reused_refresh_token_ends_the_whole_lineage"
  - id: AUTH-2
    claim: "A copy of a refresh token made without the device key ends a key-bound lineage, even inside the reuse window, and a replayed or stale proof is refused while the lineage is kept."
    scope: "Real PostgreSQL. Applies to sessions that registered a device key."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/bins/momo-server/tests/refresh_proof_conformance_pg.rs#a_copy_without_the_key_ends_a_bound_lineage_even_inside_the_window"
      - "server-rust/bins/momo-server/tests/refresh_proof_conformance_pg.rs#a_replayed_or_stale_proof_is_refused_and_the_lineage_kept"
  - id: AUTH-3
    claim: "After logout ends a session lineage, an older access token from that lineage can still authenticate but can no longer register a device key (409 session_lineage_ended)."
    scope: "States the honest edge: logout does not instantly invalidate access tokens already issued; it ends the lineage so no new capability can be derived from it."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/bins/momo-server/tests/device_key_conformance_pg.rs#an_access_token_outliving_its_logout_cannot_register_a_key"
  - id: AUTH-4
    claim: "One-time login claims and password-reset links work once, are stored as hashes, and are scoped to their own workspace."
    scope: "Real PostgreSQL."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/bins/momo-server/tests/claim_conformance_pg.rs#claim_issue_login_reject_consume_login_reuse_and_hash_only"
      - "server-rust/bins/momo-server/tests/password_reset_conformance_pg.rs#reset_issue_consume_reuse_reissue_and_cross_workspace"

  # ---- 웹훅 · 바깥으로 나가는 요청 --------------------------------------------------
  - id: WH-1
    claim: "An inbound webhook with a forged signature or an expired timestamp is rejected with 401, an unknown endpoint gets 404, and a replayed delivery id is acknowledged as a duplicate without creating a second message."
    scope: "Native oort webhook format. The signature comparison is written to be constant time (code review); no test measures timing, the unit test only checks equality, mismatch and the v1= prefix. Each third-party provider's own format is not covered by this claim."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/bins/momo-server/tests/webhook_inbound_conformance_pg.rs#native_signature_ok_forged_expired_replay_and_unknown_404"
      - "server-rust/crates/momo-webhook/src/crypto.rs#ingress_signatures_compare_in_constant_time_and_accept_the_v1_prefix"
  - id: WH-2
    claim: "An outbound webhook delivery signature covers both the timestamp and the body, so a receiver can reject a replayed or altered delivery."
    scope: "The signing function. Whether a receiver checks the timestamp is the receiver's job."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/crates/momo-webhook/src/crypto.rs#the_delivery_signature_binds_the_timestamp_to_the_body"
  - id: NET-1
    claim: "Outbound webhook delivery refuses a loopback target URL (127.0.0.1)."
    scope: "The shared SSRF guard on the delivery path. The test feeds one loopback address; other private ranges and the absence of a connection attempt are not asserted here (the link-preview claim NET-2 covers private literals for that fetcher)."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/bins/momo-webhook-sender/tests/webhook_delivery_conformance_pg.rs#the_ssrf_guard_refuses_the_very_url_this_harness_uses"
  - id: NET-2
    claim: "The link-preview fetcher blocks private address literals before connecting and blocks a hostname whose DNS answer is a private address."
    scope: "Link previews (unfurl) only."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/crates/momo-unfurl/src/fetch.rs#private_literals_are_blocked_before_connect"
      - "server-rust/crates/momo-unfurl/src/fetch.rs#a_private_dns_answer_is_blocked"
  - id: NET-3
    claim: "The agent worker's outbound client refuses a hostname that resolves to a private address before connecting."
    scope: "The agent worker egress helper. Other outbound paths have their own claims (NET-1, NET-2)."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/bins/momo-agent-worker/src/egress.rs#a_name_resolving_to_a_private_address_is_refused_before_connect"

  # ---- 첨부 · 푸시 -----------------------------------------------------------------
  - id: ATT-1
    claim: "Attachment bytes are served with Content-Disposition attachment and X-Content-Type-Options nosniff, and an anonymous request for them gets 401."
    scope: "Real PostgreSQL with the local archive backend. There is no malware scan (see the Korean trust document, current limits)."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/bins/momo-server/tests/attachment_conformance_pg.rs#the_three_routes_round_trip_and_bind_to_a_message"
  - id: ATT-2
    claim: "A member cannot bind another member's attachment to a message, and the failed send rolls back with it."
    scope: "Real PostgreSQL."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/bins/momo-server/tests/attachment_conformance_pg.rs#another_members_attachment_cannot_be_bound_and_the_message_rolls_back_with_it"
  - id: ATT-3
    claim: "An attachment that no message carries yet (a draft in a composer tray, or a file a scheduled message is holding) is readable by its uploader alone: every other member of the channel gets the same 404 an unknown id gets, and once a message carries it the channel's members can read it."
    scope: "Real PostgreSQL, through the content route. The uploader has to be an active member of the channel too. The 404 is compared by status and body, not by headers. The tests read as a plain channel member and as an outsider: that no workspace role (owner, admin) is an exception is read from the code, not tested. A file a deleted message carried is covered by ATT-4."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/bins/momo-server/tests/attachment_conformance_pg.rs#an_unbound_attachment_is_its_uploaders_alone_until_a_message_carries_it"
      - "server-rust/bins/momo-server/tests/attachment_conformance_pg.rs#a_draft_and_a_carried_attachment_stay_inside_their_tenant_and_channel"
      - "server-rust/bins/momo-server/tests/attachment_conformance_pg.rs#a_scheduled_messages_file_is_its_authors_alone_until_the_message_goes_out"
  - id: ATT-4
    claim: "A file that a deleted message carried is read by nobody, not the channel, not the author who uploaded it, not a workspace admin: the content route answers the same 404 an unknown id gets, and the deleted message's history row lists no files."
    scope: "Real PostgreSQL, through the content route and through the four projections that list a message's files: channel history, thread replies, the replay echo of a retried send, and the agent port's image list. A row with only `state` or only `deleted_at` set counts as deleted. The 404 is compared by status and body. The admin check runs as a workspace admin. Not covered: the file stays on the archive after its message is deleted (the cleanup in ATT-7 takes only files no message carries), and a client that already holds the file card in memory may still show it until it reloads."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/bins/momo-server/tests/attachment_conformance_pg.rs#a_deleted_messages_attachment_is_nobodys_to_read"
      - "server-rust/bins/momo-server/tests/attachment_conformance_pg.rs#a_deleted_messages_attachments_are_not_listed_anywhere"
  - id: ATT-5
    claim: "The audit row oort writes when an attachment upload starts carries the file's type and size but not its file name."
    scope: "Real PostgreSQL, through the upload route: the row is read back and has no name key, with the file name used in the test found in no audit detail. This covers rows written by this release. Rows an older release wrote are covered by ATT-6. The audit rows written when a member or workspace avatar upload starts still carry the image's file name."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/bins/momo-server/tests/attachment_conformance_pg.rs#the_audit_trail_never_holds_a_file_name"
  - id: ATT-6
    claim: "Upgrading to this release removes the file name from the audit rows that older releases wrote when an attachment upload started, changes no other audit row, and running the same step again changes nothing."
    scope: "A real PostgreSQL database upgraded from the previous release's schema with seeded rows: rows with and without a schema key, in two workspaces, are cleaned; a row of another action that has a name key, another attachment action, a row with no name and a name nested below the top level are left byte for byte; no row is lost; a second run changes no row version. The audit table has no hash chain, append-only trigger or update-denying policy, so the edit breaks no such guarantee. An older api instance that is still running during the deploy can write one more row with a name after the step has run; the operator's check SQL counts such rows and the step can be run again. Runs in the nightly lane only (the upgrade harness is not in the PR security pack)."
    priority: P1
    runs: nightly
    proofs:
      - "server-rust/bins/momo-notifier/tests/prod_role_conformance_pg.rs#the_audit_scrub_removes_a_file_name_from_old_upload_rows_and_touches_nothing_else"
  - id: ATT-7
    claim: "The cleanup of unattached uploads never deletes a file a message, a scheduled message, a huddle transcription or an avatar still holds, never deletes a file younger than 30 days, deletes nothing at all until an operator sets MOMO_ATTACHMENT_RECLAIM to exactly 1, and writes only through a connection that cannot bypass row-level security."
    scope: "Real PostgreSQL with the same role names as production (the candidate read as the notifier role, every write as the app role; this lane runs with the development role grants, and the production column grants and upgrade order are proven separately in the nightly lane by prod_role_conformance_pg) and a recording stand-in for Google Drive. Every kind of reference that the schema enforces is tested one by one: a message (live or deleted), a scheduled message hold (and a hold released less than 30 days ago), the three huddle transcription columns, a member avatar and a workspace avatar naming the same Drive object. A Drive failure writes nothing and the next run retries; an object Drive says is already gone counts as deleted; a bind or a hold that commits while the cleanup waits wins. References that exist only outside the database, such as a file card in a composer tray that is still open after 30 days, are not seen; the 30 days is the cover. The Google Drive and local volume runners are separate processes; this claim covers the shared decision in both, and ATT-8 covers the local volume runner. A file that stays unattached is only deleted from the workspaces the runner looks at (see ATT-8)."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/bins/momo-notifier/tests/attachment_reclaim_conformance_pg.rs#old_unbound_complete_attachments_are_reclaimed_and_everything_else_is_kept"
      - "server-rust/bins/momo-notifier/tests/attachment_reclaim_conformance_pg.rs#a_file_something_else_holds_is_never_deleted_and_never_in_the_way"
      - "server-rust/bins/momo-notifier/tests/attachment_reclaim_conformance_pg.rs#a_drive_failure_writes_nothing_and_the_next_tick_retries"
      - "server-rust/bins/momo-notifier/tests/attachment_reclaim_conformance_pg.rs#a_bind_or_a_hold_that_commits_while_the_reclaim_waits_beats_it"
      - "server-rust/bins/momo-notifier/tests/attachment_reclaim_conformance_pg.rs#the_reclaim_cannot_reach_another_tenants_row"
      - "server-rust/bins/momo-notifier/tests/attachment_reclaim_conformance_pg.rs#a_write_pool_that_bypasses_rls_is_refused"
      - "server-rust/bins/momo-notifier/tests/attachment_reclaim_conformance_pg.rs#the_switched_off_reclaimer_counts_exactly_what_the_enabled_one_deletes_and_deletes_nothing"
      - "server-rust/bins/momo-notifier/tests/attachment_reclaim_conformance_pg.rs#a_hold_that_appears_after_the_listing_is_seen_by_the_recheck_under_the_lock"
      - "server-rust/bins/momo-notifier/tests/attachment_reclaim_conformance_pg.rs#an_unknown_reference_stops_the_delete_before_any_byte_goes"
      - "server-rust/bins/momo-server/tests/attachment_conformance_pg.rs#a_held_file_is_never_reclaimed_and_a_released_one_is_a_draft_for_a_full_ttl"
      - "server-rust/crates/momo-messaging/src/attachment_reclaim.rs#only_exactly_one_turns_the_delete_on"
  - id: ATT-8
    claim: "On the local volume the api process deletes unattached uploads only in workspaces whose uploads it has served since it started, deletes nothing unless MOMO_ATTACHMENT_RECLAIM is exactly 1, and refuses to run on a database role that bypasses row-level security."
    scope: "Real PostgreSQL and the real local-volume archive, through the real upload routes. Switched off, the run counts what it would delete and leaves the volume and the rows alone. Switched on, the object and its sidecar leave the volume, the row goes, and the audit row says why without a file name. A workspace this process has not served an upload for since it started is not looked at, so its old unattached files stay until somebody uploads there; this is a gap in coverage, not a leak, because storage does not grow in a workspace that uploads nothing. A run deletes at most the batch size in total. A request that creates no upload remembers no workspace. Only the local backend runs this in the api process; with Google Drive the notifier runs the cleanup (ATT-7). The real tick loop (timer, switch, archive) is run with a short interval to prove the switch holds. Not covered: the call in main that starts the tick and the shutdown wait."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/bins/momo-server/tests/attachment_reclaim_local_pg.rs#the_tick_follows_the_workspaces_this_process_served_and_deletes_only_when_switched_on"
      - "server-rust/bins/momo-server/tests/attachment_reclaim_local_pg.rs#a_refused_upload_touches_nothing_and_a_pool_that_bypasses_rls_is_refused"
      - "server-rust/bins/momo-server/tests/attachment_reclaim_local_pg.rs#a_tick_deletes_at_most_batch_files_across_workspaces_and_the_next_tick_carries_on"
      - "server-rust/bins/momo-server/tests/attachment_reclaim_local_pg.rs#a_big_backlog_in_one_workspace_does_not_starve_the_next_one"
      - "server-rust/bins/momo-server/tests/attachment_reclaim_local_pg.rs#the_running_tick_obeys_the_switch"
      - "server-rust/bins/momo-server/src/attachment_reclaim.rs#only_the_local_volume_is_reclaimed_by_the_api_process"
  - id: PUSH-1
    claim: "The push dispatch payload carries identifiers only: no message body, and no content-shaped key."
    scope: "Payload construction in momo-push and the relay's closed dispatch (static placeholder text). The notification the phone shows is built on the device after a separate authenticated fetch."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/crates/momo-push/src/dispatch.rs#dispatch_payload_is_id_only"
      - "server-rust/crates/momo-push/src/dispatch.rs#dispatch_payload_cannot_carry_message_content"
      - "server-rust/bins/momo-push-relay/src/dispatch.rs#closed_dispatch_and_apns_payload_use_only_static_placeholder_content"
  - id: PUSH-2
    claim: "An approval push wakes exactly the people the decision route would let through."
    scope: "Real PostgreSQL."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/bins/momo-server/tests/approval_push_audience_conformance_pg.rs#the_people_an_approval_push_wakes_are_the_people_the_decision_route_lets_through"

  - id: PUSH-3
    claim: "A second member can neither register over nor revoke a device on which another member holds an active push token in any env, whatever the env or platform of the attempt (403), while a device with no active token passes to the next member of the same workspace who registers it (and revoking it as anyone else is a 404, like an unknown id), and a device id registered in another workspace is refused (403) instead of moved."
    scope: "Real PostgreSQL as momo_app (row-level security forced), at the library and at the HTTP route. Active means invalidated_at IS NULL: a registration left alive because an offline logout never reached the server is not handed over (#4445), and a phone that moves between workspaces is not supported (#4444). Says nothing about whom a push is sent to (PUSH-2 and the notifier suites) or about the push-token rule, which has its own tests. The two lock tests hold the device row in a second transaction: they show that a registration and a late revoke queue behind a takeover in flight, not that no other interleaving exists. Accepted limit (ADR-0204 addendum 4): a member who once held a device knows its id, so while the device is dormant that earlier holder can take it back before the current holder signs in again, and the current holder's next registration is refused (403) until the earlier holder's registration ends; a live registration is still never taken, and the earlier holder receives none of the current holder's pushes. Proving possession of the device's last APNs token is the open hardening choice."
    priority: P1
    runs: pr-ci
    proofs:
      - "server-rust/crates/momo-push/tests/device_conformance_pg.rs#another_members_device_is_refused"
      - "server-rust/crates/momo-push/tests/device_conformance_pg.rs#a_live_registration_is_not_taken_over_with_another_token"
      - "server-rust/crates/momo-push/tests/device_conformance_pg.rs#a_live_registration_blocks_the_takeover_whatever_the_env_or_platform_of_the_attempt"
      - "server-rust/crates/momo-push/tests/device_conformance_pg.rs#a_device_left_dormant_by_logout_is_reclaimable_by_the_next_member"
      - "server-rust/crates/momo-push/tests/device_conformance_pg.rs#revoking_a_device_nobody_holds_alive_is_a_404_for_anyone_else"
      - "server-rust/crates/momo-push/tests/device_conformance_pg.rs#a_device_id_registered_in_another_workspace_is_a_rejection_not_a_500"
      - "server-rust/crates/momo-push/tests/device_conformance_pg.rs#a_takeover_waits_for_the_device_row_lock"
      - "server-rust/crates/momo-push/tests/device_conformance_pg.rs#a_previous_owners_late_sign_out_waits_for_a_takeover_in_flight"
