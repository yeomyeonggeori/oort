  /v1/workspaces/{workspaceId}/search/messages:
    get:
      tags: [messages]
      operationId: searchWorkspaceMessages
      summary: Search messages in channels where the caller is an active member.
      description: >
        Read-only v0 substring search backed by the existing partial GIN trigram
        index. Results exclude deleted/body-less messages and channels where the
        caller has left. Ordering is newest first by created time, then channel
        sequence; the opaque cursor preserves that keyset across new inserts.
        Search is limited to 30 requests per authenticated member per minute.
        `channel` narrows the search to one channel the caller belongs to
        (#1931); its absence is the workspace-wide search this route has always
        been. The cursor carries the scope it was minted under, so a page cannot
        be resumed against a different one.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
          description: >
            Opaque keyset cursor returned as `nextCursor`. It is bound to the
            scope that produced it: replaying a `channel`-scoped cursor without
            `channel` (or against another channel) is a 400, not a wider page.
        - name: channel
          in: query
          schema:
            type: string
            format: uuid
          description: >
            Optional channel scope (#1931). A blank value is the workspace
            scope; a channel the caller is not a member of — and one that does
            not exist — are the same 404.
      responses:
        "200":
          description: Membership-filtered message search page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMessageSearchResponse"
        "400":
          description: >
            Query shorter than two characters, malformed cursor, malformed
            `channel`, or a cursor replayed under a different scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Workspace scope mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >
            The named `channel` is not one the caller may read. A channel that
            does not exist answers identically, so the pair is not a membership
            oracle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Search member rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{workspaceId}/messages/{messageId}:
    patch:
      tags: [messages]
      operationId: editMessage
      summary: Edit an authored, undeleted message without changing its seq.
      description: >
        Two writes share this route. Without a `stream` block it is a human
        revision: `state` becomes `edited` and `editedAtMs` is stamped. With one
        (#1130 전제①) it is a slice of a growing answer — same 200, same
        `message.edited` broadcast, but no edit stamp, and a `rev` that is not
        newer than the stored one is a no-op. Authorship, membership, the
        tombstone rule and "no interaction consumes a seq" guard both. The
        slice that closes a stream may also name an `outcome` (ADR-0155) when
        the answer was stopped rather than completed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: messageId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EditMessageRequest"}
      responses:
        "200":
          description: Full edited message with its original seq.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
        "400":
          description: >
            Empty body, malformed id, an already-deleted message, a stream `rev`
            below 1, or an `outcome` that is unknown or not on a final slice.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Not the author/channel member, or workspace scope mismatch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: Message not found.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}
    delete:
      tags: [messages]
      operationId: deleteMessage
      summary: Soft-delete an authored message and remove all its reactions.
      description: >
        The tombstone keeps the original seq but sets body to null. The original
        body is not copied into audit detail. Repeating an already-completed
        delete returns the same tombstone without another outbox event.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: messageId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Tombstone message with body omitted and state=deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
        "400":
          description: Malformed message id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Not the author/channel member, or workspace scope mismatch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: Message not found.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

