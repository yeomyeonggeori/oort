  /v1/mcp/agent-port:
    post:
      tags: [mcp]
      operationId: agentPort
      summary: Call the sessionless hosted-agent MCP endpoint.
      description: >
        Vendor-neutral Agent Port from ADR-0162. This is a POST-only,
        sessionless JSON-RPC endpoint and every request is authenticated again
        with an active agent bearer carrying the non-default
        `agent:port:connect` reachability scope. The credential is accepted
        only in `Authorization`; URL/query credentials, app JWTs, human
        principals are rejected. An incoming `Mcp-Session-Id` never creates
        authority and is never echoed. No OAuth protected resource metadata is
        advertised by this static-bearer wave.

        Modern requests pin `2026-07-28`, include
        `params._meta[io.modelcontextprotocol/protocolVersion]` and
        `params._meta[io.modelcontextprotocol/clientCapabilities]`, and mirror
        their version and method in `MCP-Protocol-Version` and `Mcp-Method`.
        `Mcp-Name` is additionally mandatory for `tools/call` and must match
        the body tool name. The modern era exposes `server/discover`, a scoped
        `tools/list` and `tools/call`; it does not expose initialize, ping,
        protocol sessions, or a GET stream.

        `tools/list` and `tools/call` are answered from one intersection of the
        connection's approved scopes, the credential's current scopes and the
        server capability, so the advertised catalog is exactly the callable
        one. A credential carrying only `agent:port:connect` lists no tool and
        may call none; a tool outside the caller's view answers byte-identically
        to a tool that does not exist. The eight tools are `oort_inbox_read`,
        `oort_conversation_read`, `oort_message_post`, `oort_jobs_claim`,
        `oort_job_renew`, `oort_job_release`, `oort_run_event` and
        `oort_run_complete`; each binds an existing domain rather than a second
        one, and job authority travels only as an opaque `leaseHandle` that
        carries the channel its work came from, so the confirming human's exact
        channel grant is re-checked on every later verb. Arguments are validated
        against the tool's published `inputSchema` before execution, so
        `additionalProperties: false`, the declared nullability (every optional
        property is `["<type>", "null"]` and every required one is not), the
        numeric bounds, `format: uuid` and `enum` are enforced rather than
        advertised. String `minLength`/`maxLength` count **UTF-8 bytes**, which
        each such field's description states. Tool
        failures use a closed set of JSON-RPC codes (-32602 invalid arguments,
        -32003 not authorized, -32004 unavailable, -32005 conflict, -32603
        internal) with fixed messages, so a refusal never distinguishes absent
        from invisible from forbidden.

        The narrow legacy adapter pins `2025-11-25`. Its first `initialize`
        may omit `MCP-Protocol-Version`; every later request must carry that
        exact version. It accepts `initialize`,
        `notifications/initialized`, `ping`, a scoped `tools/list`, and an
        unknown-tool `tools/call` error, without issuing a session id. All
        calls send `Content-Type: application/json` and an `Accept` value that
        contains both `application/json` and `text/event-stream`. Recognized
        modern errors never silently downgrade to legacy. The two exact
        supported versions are the complete compatibility set.
      security:
        - agentPortBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MCPProtocolVersion"
        - $ref: "#/components/parameters/MCPMethod"
        - $ref: "#/components/parameters/MCPName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPortJSONRPCRequest"
      responses:
        "200":
          description: >
            A modern discovery/tools result, a legacy initialize/tools result,
            or a pong. Success never carries `Mcp-Session-Id`.
          headers:
            Cache-Control:
              description: Agent Port responses are private and must never be stored.
              schema:
                type: string
                enum: ["private, no-store"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPortJSONRPCSuccessResponse"
        "202":
          description: Legacy `notifications/initialized` accepted; the response body is empty.
          headers:
            Cache-Control:
              description: Agent Port responses are private and must never be stored.
              schema:
                type: string
                enum: ["private, no-store"]
        "400":
          description: >
            Malformed JSON-RPC, metadata/header mismatch, unsupported version
            or method, a query/duplicate transport header, or another bounded
            protocol validation failure. Protocol errors use the Agent Port
            JSON-RPC envelope.
          headers:
            Cache-Control:
              description: Agent Port responses are private and must never be stored.
              schema:
                type: string
                enum: ["private, no-store"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPortJSONRPCErrorResponse"
        "401":
          $ref: "#/components/responses/AgentPortUnauthorized"
        "403":
          $ref: "#/components/responses/AgentPortForbidden"
        "413":
          description: Request body exceeds the Agent Port byte bound.
          headers:
            Cache-Control:
              description: Agent Port responses are private and must never be stored.
              schema:
                type: string
                enum: ["private, no-store"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPortJSONRPCErrorResponse"
        "415":
          description: >
            `Content-Type` or `Accept` does not satisfy the Agent Port
            transport contract.
          headers:
            Cache-Control:
              description: Agent Port responses are private and must never be stored.
              schema:
                type: string
                enum: ["private, no-store"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPortJSONRPCErrorResponse"
        "429":
          $ref: "#/components/responses/AgentPortRateLimited"
        "500":
          description: >
            Authentication, tenant transaction, or audit persistence failed.
            The body is deliberately empty and never exposes database details.
          headers:
            Cache-Control:
              description: Agent Port responses are private and must never be stored.
              schema:
                type: string
                enum: ["private, no-store"]

