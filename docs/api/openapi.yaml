        memberId:
          type: string
          format: uuid
        noticeVersion:
          type: integer
          enum: [1]
        consentedAtMs:
          type: integer
          format: int64

    HuddleRecordingResponse:
      type: object
      required: [id, huddleId, model, status, requestedAtMs]
      properties:
        id:
          type: string
          format: uuid
        huddleId:
          type: string
          format: uuid
        model:
          type: string
          description: Operator-configured ASR model; MOMO-646 does not select a winner.
        status:
          type: string
          enum: [requested, recording, stopped, failed]
        requestedAtMs:
          type: integer
          format: int64

    # ---- Messages ----------------------------------------------------------------
    SendMessageRequest:
      type: object
      required: [clientMsgId]
      properties:
        clientMsgId:
          type: string
          format: uuid
          description: Client-generated idempotency key (L4 §3.1).
        rootId:
          type: string
          format: uuid
          description: Undeleted top-level message in this channel used as the thread root.
        replyToId:
          type: string
          format: uuid
          description: >
            ADR-0148 quote target — the message this send points at. Independent
            of `rootId`: a message may carry both, which quotes one particular
            reply from inside its own thread. The target must be an undeleted
            message in the same channel (it may itself be a reply); a target in
            another channel or another workspace is reported as not found.
        type:
          type: string
          enum: [text, tool_call, tool_result, diff, artifact, approval_request, system]
          default: text
        body:
          type: string
        props:
          type: object
          additionalProperties:
            type: string
          description: >
            Simplified structured payload for v0 — a flat string-to-string
            map on send. Server-owned keys are stripped and rewritten
            server-side: `mention_member_ids` (recomputed from the body),
            `momo.stream` (the streaming staleness marker) and
            `momo.harnessRefine` (ADR-0158 — send the `harnessRefine` block
            instead). Because the map is flat, a structured block cannot be sent
            through it at all.
        runId:
          type: string
          format: uuid
          description: >
            ADR-0158 D5 — the agent run this write belongs to. Served since
            ADR-0158; earlier builds decoded the field and answered
            `400 runId (agent-run binding) is not served by momo-server yet`, so
            a producer can detect support by sending it.

            Validated **fail-closed inside the send transaction**, and all three
            checks must pass: the run exists, it is in this workspace, and the
            caller is that run's agent (`agent_run.agent_member_id` equals the
            credential's member — which is what makes this an agent-bearer field
            in practice, a human credential being refused by the same rule rather
            than by a separate one). A run this workspace cannot see — including
            one in another tenant, which RLS makes invisible — answers **404**; a
            run it can see but does not own answers **403**.

            On success the id is written to `message.run_id` *and* mirrored into
            `props.run_id`, overwriting any `run_id` the request put in `props`.
            The column is what a server-side close looks a half-written answer up
            by (ADR-0155), and the props copy is what a history page reads to
            decide `runEnded` (#1166); an out-of-process producer needs both in
            order to behave exactly like the in-process one. Sending `runId`
            together with `stream` is the intended adapter shape — it is what
            makes a cancel able to close the stream that adapter opened.
        harnessRefine:
          $ref: "#/components/schemas/HarnessRefine"
          description: >
            ADR-0158 D1–D4 — announces that the agent rewrote its own harness.
            Optional and additive; omitting it is the ordinary send.
        attachmentIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
          uniqueItems: true
          description: >
            Completed attachments uploaded by this actor in this channel. They
            are linked to the new message inside the canonical message transaction.
        routing:
          $ref: "#/components/schemas/RunRoutingInput"
          description: Per-request agent model/effort override for mention runs.
        stream:
          $ref: "#/components/schemas/StreamOpen"
          description: >
            #1173 — marks this send as the opening write of a growing answer.
            Optional and additive; omitting it is the ordinary send.

    RunRoutingInput:
      type: object
      additionalProperties: false
      properties:
        model: {type: string, minLength: 1, maxLength: 200}
        effort: {type: string, enum: [low, medium, high, xhigh, max]}

    HarnessRefine:
      type: object
      description: >
        ADR-0158 D1–D4 — the block that turns "the agent rewrote its own
        instructions" into one line the room can scroll back to.

        A prime harness refines itself on a timer without any host command
        (`autoRefine.enabled` defaults true, `turnInterval` 25, `cooldownMs`
        20 min — measured), and D1 decided that in a product where an agent is a
        first-class member the team is owed that fact rather than one host's log.

        The send that carries this block must be `type: system` (D2 — no new
        message type is introduced) and must carry a human-readable `body`; the
        reasons live in props, the sentence lives in the channel. The stored
        object is `props["momo.harnessRefine"]`, written by the server: `scope`
        is re-stated rather than copied, and the key is stripped from any
        client-supplied `props`.

        **`clientMsgId` is derived, not chosen** (D4). It must equal
        `uuidv5(namespace = 6d6f6d6f-2e68-6172-6e65-737352656669, name =
        refinementId)` — the 16 ASCII bytes `momo.harnessRefi`. `message.client_msg_id`
        is a uuid column and `RefinementResult.id` is an arbitrary string, so the
        string is hashed into the column's type, exactly as `tool_result` keys
        are. Any other value is a 400 that names the expected uuid. The point is
        that the two paths which can observe one refinement — the `refine_complete`
        RPC event and the file watcher that covers the kernel's silent writes —
        derive the same key and collapse into a single announcement.

        Unlike most request objects here this one is strictly closed
        (`additionalProperties: false`, on the edits too). That is a disclosure
        rule, not tidiness: harness memories can quote the conversation that
        produced them, so an edit may name *what* changed and never carry the
        text. A producer that adds `before`/`after` is refused rather than
        silently trimmed.
      required: [refinementId, trigger, scope]
      additionalProperties: false
      properties:
        refinementId:
          type: string
          minLength: 1
          maxLength: 200
          description: >
            `RefinementResult.id` as the harness assigned it (e.g.
            `refine_20260807041452415`). The seed of the derived `clientMsgId`.
        trigger:
          type: string
          enum: [command, turn_interval, compact, observed-drift]
          description: >
            What set the refinement off. `command` is an explicit `refine` RPC;
            `turn_interval` and `compact` are the harness's own timers;
            `observed-drift` is the honest name for the kernel path, where
            `rlm.harness` writes `harness_state.json` and the protocol emits
            nothing at all (measured: 6 runs × 37 events, `refine_complete` = 0).
            An adapter using `observed-drift` is stating "we saw the file change",
            never "the agent decided X". The mixed casing is the contract's, not
            a typo. An unrecognised value is a 400 — the server does not repeat a
            story it cannot read.
        scope:
          type: string
          enum: [workspace]
          description: >
            Always `workspace`, and any other value is a 400. The harness calls a
            global refinement `"global"`, but an adapter runs one `HOME` per
            workspace, so repeating that word would claim something about other
            workspaces that is not true.
        edits:
          type: array
          maxItems: 50
          description: The harness entries this refinement touched — names only.
          items:
            type: object
            required: [action, kind, id]
            additionalProperties: false
            properties:
              action: {type: string, minLength: 1, maxLength: 200}
              kind: {type: string, minLength: 1, maxLength: 200}
              id: {type: string, minLength: 1, maxLength: 200}
        summary:
          type: string
          maxLength: 500
          description: >
            Supporting detail for the human sentence. Bounded for the same
            disclosure reason the edits are: an unbounded summary is the harness
            text reaching the channel under a friendlier name.
        rollbackId:
          type: string
          maxLength: 200
          description: >
            D3 — recorded on the row and in the audit trail, with **no channel
            affordance promised**. What a rewind should look like to a room is an
            open question; storing the id keeps the cheap half (an operator can
            answer "can this be undone, and by what id") without shipping a
            half-answer that would be harder to withdraw than to add.

    EditMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
        stream:
          $ref: "#/components/schemas/StreamEdit"

    StreamEdit:
      type: object
      description: >
        #1130 전제① — marks this PATCH as a slice of a growing answer rather than
        a human revising what they already said. Present only for streaming
        producers. With it, `body` is the whole text so far (never a delta), the
        response leaves `editedAtMs` null and `state` at `sent`, the message
        keeps its original `seq`, and the realtime frame is the usual
        `message.edited` carrying the whole body — so a client renders a slice
        without re-reading anything.
      required: [rev, final]
      additionalProperties: false
      properties:
        rev:
          type: integer
          format: int64
          minimum: 1
          description: >
            The writer's own monotonic revision, starting at 1. Not a `seq`: it
            orders one message's slices and lives in that message's server-owned
            `props["momo.stream"]`. A `rev` that is not strictly greater than the
            stored one is accepted as a 200 no-op — nothing is written, published
            or audited — which is the honest answer to both a replayed slice and
            one overtaken by its own successor. A value below 1 is a 400.
        final:
          type: boolean
          description: >
            True on the last slice. Clears `props["momo.stream"].streaming` and
            is the point at which the single `message.streamed` audit row is
            written — one per assembled message, not one per slice.
        outcome:
          type: string
          enum: [cancelled, failed]
          description: >
            ADR-0155 — how the stream ended, when it did not simply finish.
            Optional and additive: a normal completion omits it (and the key is
            then absent from `props["momo.stream"]`, not null), so a producer
            written before this field sends what it always sent and means what it
            always meant. `cancelled` is a human pressing stop; `failed` is the
            provider dying mid-answer. In both cases the partial body is left
            exactly as it stood and clients draw a restrained tail from this
            value. Only valid together with `final: true` — an outcome on a
            non-final slice is a 400, because "this is how it ended" and "more is
            coming" cannot both be true. Any other value is a 400.

    StreamOpen:
      type: object
      description: >
        #1173 — the `stream` block on a send, marking it as the **opening write**
        of a growing answer. A stream's first write is a POST, not a PATCH (the
        opening text rides the insert), so without this block a producer that
        died before its first slice left a half sentence with nothing on it —
        indistinguishable from an answer the agent chose to end there, and
        invisible to the close path that could have marked it. With it, the
        message carries `props["momo.stream"] = {rev: 0, streaming: true}` from
        its first byte, exactly like one opened in-process, and the first PATCH
        slice is `rev: 1` as always. Neither field is stored as sent: the marker
        is server-owned, and these are the producer's declaration of the
        arithmetic it is about to do — which is why a wrong one is refused
        instead of silently corrected.
      required: [rev, streaming]
      additionalProperties: false
      properties:
        rev:
          type: integer
          format: int64
          enum: [0]
          description: >
            Must be `0` — the floor the strictly-greater rule already stands on,
            so a message that never streamed and one that just opened read the
            same. Any other value is a 400: the server would write `0` anyway,
            and a producer numbering its slices from a different floor would be
            keeping a revision ledger the row never held.
        streaming:
          type: boolean
          enum: [true]
          description: >
            Must be `true`. A send opens a stream; only the final PATCH slice
            closes one. `false` is a 400 rather than a no-op, because a producer
            that believed it had posted a finished answer would never send the
            slice that closes the message the channel is actually showing.

    ReactionDelta:
      type: object
      required: [action, messageId, memberId, emoji]
      properties:
        action:
          type: string
          enum: [added, removed]
        messageId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        emoji:
          type: string
          minLength: 1
          maxLength: 32

    ReactionSnapshot:
      type: object
      additionalProperties:
        type: object
        additionalProperties:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid

    PinnedMessage:
      type: object
      description: >
        One entry of a channel's pin list — the pin plus enough of the message to
        draw a header row without a second read. A pin's whole point is a message
        that is not on screen, so an ids-only projection would force a lookup that
        misses. `seq` is the message's own; pinning never mints one.
      required:
        [messageId, channelId, seq, authorMemberId, type, state, createdAtMs, pinnedBy, pinnedAtMs]
      properties:
        messageId: {type: string, format: uuid}
        channelId: {type: string, format: uuid}
        seq: {type: integer, format: int64}
        authorMemberId: {type: string, format: uuid}
        type: {type: string}
        state: {type: string}
        body:
          type: string
          nullable: true
        createdAtMs: {type: integer, format: int64}
        pinnedBy:
          type: string
          format: uuid
          description: >
            Where the pin came from. A pin is the channel's fact, not the
            pinner's — any channel member may unpin, including one who did not
            pin it. This field grants nothing.
        pinnedAtMs: {type: integer, format: int64}

    PinDelta:
      type: object
      required: [action, messageId, channelId, changed]
      properties:
        action:
          type: string
          enum: [pinned, unpinned]
        messageId: {type: string, format: uuid}
        channelId: {type: string, format: uuid}
        changed:
          type: boolean
          description: >
            false when the message was already in the requested state. The call
            still succeeded — pin and unpin are idempotent — but nothing was
            recorded and nothing was published.
        pinned:
          allOf:
            - $ref: "#/components/schemas/PinnedMessage"
          description: Present on an effective pin only; absent on unpin and on a no-op.

    PinList:
      type: object
      required: [pins]
      properties:
        pins:
          type: array
          items: {$ref: "#/components/schemas/PinnedMessage"}

    WorkspaceSettings:
      type: object
      description: >
        Stored workspace.settings bag. Additional keys may appear after a later
        ticket widens the allowlist. Writable keys today are
        allowed_agent_models and role_labels (#1770).
      additionalProperties: true
      properties:
        allowed_agent_models:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 32
        role_labels:
          $ref: "#/components/schemas/RoleLabels"

    PatchWorkspaceSettingsRequest:
      type: object
      description: >
        RFC 7396-shaped top-level merge patch. Unknown keys 400. role_labels
        is a whole-object replace (nested keys are not deep-merged). null
        deletes the named key.
      additionalProperties: false
      properties:
        allowed_agent_models:
          nullable: true
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 32
        role_labels:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RoleLabels"
          description: >
            Display-only role name overrides. Keys ⊂ {owner, admin, member,
            guest}. Values are non-empty strings, ≤ 48 UTF-8 bytes.
            Whitespace-only is 400. Agent keys are refused. null deletes
            the key (client default labels).

    RoleLabels:
      type: object
      description: >
        Display-only membership role name overrides. Does not change
        permissions, RLS, or the role wire value. Empty object means client
        defaults. Agent labels are a client null rule and are not stored.
      additionalProperties: false
      properties:
        owner: {type: string, minLength: 1}
        admin: {type: string, minLength: 1}
        member: {type: string, minLength: 1}
        guest: {type: string, minLength: 1}

    WorkspaceDto:
      type: object
      description: >
        GET /v1/workspaces/{workspaceId} workspace object. Identity plus the
        member-readable roleLabels projection. The settings bag is never
        included.
      required: [id, slug, name, updatedAtMs, roleLabels]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        updatedAtMs: {type: integer, format: int64}
        avatarUrl:
          type: string
          description: Versioned avatar content path, omitted when unset.
        roleLabels:
          allOf:
            - $ref: "#/components/schemas/RoleLabels"
          description: >
            Projection of workspace.settings.role_labels. Empty object when
            the key is absent. Display-only.

    WorkspaceResponse:
      type: object
      required: [workspace]
      properties:
        workspace: {$ref: "#/components/schemas/WorkspaceDto"}

    UnfurlSettings:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
        updatedAtMs: {type: integer, format: int64}

    PutUnfurlSettingsRequest:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: {type: boolean}

    MessageUnfurl:
      type: object
      required: [id, messageId, url, status]
      properties:
        id: {type: string, format: uuid}
        messageId: {type: string, format: uuid}
        url: {type: string, format: uri}
        status:
          type: string
          enum: [pending, ok, failed, blocked]
        title: {type: string}
        description: {type: string}
        domain: {type: string}
        imageUrl:
          type: string
          description: Authenticated proxy path on this origin. Never a remote host.

    MessageUnfurlList:
      type: object
      required: [unfurls]
      properties:
        unfurls:
          type: array
          items: {$ref: "#/components/schemas/MessageUnfurl"}

    RemoveUnfurlsResponse:
      type: object
      required: [removed]
      properties:
        removed:
          type: boolean
          description: false when the cards were already gone (idempotent).

    CreateAttachmentUploadRequest:
      type: object
      required: [name, mime, size]
      properties:
        name:
          type: string
          maxLength: 255
        mime:
          type: string
          maxLength: 255
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 104857600
          description: >
            Client-declared length in bytes. `0` means the client does not know
            the length; the server does not treat that as a mismatch and records
            the measured archive size at complete. The 100 MB ceiling is enforced
            on received bytes, not on this hint.

    AttachmentUploadResponse:
      type: object
      required: [id, status, uploadUrl]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending]
        uploadUrl:
          type: string
          format: uri
          description: Opaque Google resumable upload capability URL.

    Attachment:
      type: object
      required: [id, channelId, uploaderMemberId, name, mime, size, status, createdAtMs]
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        uploaderMemberId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        name:
          type: string
        mime:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 104857600
          description: >
            Attachment length in bytes. After complete this is the measured
            archive size, not the create-time declaration.
        status:
          type: string
          enum: [pending, complete, failed]
        createdAtMs:
          type: integer
          format: int64

    Message:
      type: object
      required: [id, channelId, seq, hlcTs, hlcCount, authorMemberId, type, createdAtMs]
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        rootId:
          type: string
          format: uuid
          description: Thread root for a reply; omitted for top-level messages.
        replyToId:
          type: string
          format: uuid
          description: >
            ADR-0148 — the message this one quotes; omitted when it quotes
            nothing. Present on every projection (send echo, history, replies)
            and independent of `rootId`.
        replyTo:
          allOf:
            - $ref: "#/components/schemas/QuotedMessage"
          description: >
            The quoted message, resolved at read time. Present on history and
            thread-replies rows whose `replyToId` resolves; omitted from the
            send response, which echoes the write rather than the conversation
            around it. Never a stored snapshot — an edit of the original shows
            through here and a deletion arrives as a tombstone.
        seq:
          type: integer
          format: int64
          description: Gapless per-channel sequence; the ordering authority.
        hlcTs:
          type: integer
          format: int64
        hlcCount:
          type: integer
        authorMemberId:
          type: string
          format: uuid
        type:
          type: string
          enum: [text, tool_call, tool_result, diff, artifact, approval_request, system]
        body:
          type: string
        state:
          type: string
          enum: [sent, edited, deleted, failed]
          description: Durable message state; history always projects the stored value.
        props:
          type: object
          additionalProperties: true
          description: >
            Arbitrary JSON object; includes the server-computed
            `mention_member_ids` array when the message mentions members.
            Omitted when empty.
        runId:
          type: string
          format: uuid
        clientMsgId:
          type: string
          format: uuid
        createdAtMs:
          type: integer
          format: int64
        editedAtMs:
          type: integer
          format: int64
          description: Epoch milliseconds of the latest edit when state is edited or deleted after an edit.
        deletedAtMs:
          type: integer
          format: int64
          description: Epoch milliseconds of deletion; populated for history tombstones.
        attachments:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MessageAttachment"
          description: >
            Completed attachments bound to this message, ordered by creation time.
            Omitted when empty. Upload capability URLs and archive provider identifiers
            are never included; download bytes through the authenticated content proxy.
        thread:
          $ref: "#/components/schemas/ThreadRollup"
        runEnded:
          type: boolean
          enum: [true]
          description: >
            ADR-0155 방어 렌더링의 durable한 절반 (#1166). Present, and only ever
            `true`, on a page read (history, thread replies) whose row is still
            marked `momo.stream.streaming: true` while the `run_id` in its props
            names an agent run that has reached a terminal status. A reader that
            sees it draws the same "응답이 끊김" tail a closed stream's `outcome`
            would have drawn, so a closing PATCH that never landed survives a
            reload instead of dressing a half answer as a finished one.

            **Omitted otherwise — never `false`.** Absence covers three
            different silences (this message never streamed, its stream is
            already closed and self-describing, or the run is not over), and a
            client must not read any of them as an ending. Optional and
            additive: a client that ignores the key behaves exactly as it did
            before the key existed.

            Never present on the send echo, on an edit/stream response, or on a
            realtime `message.new`/`message.edited` frame — those describe a
            write, and a connected client learns a run's ending from its
            terminal `agent.status` frame.

    QuotedMessage:
      type: object
      required: [id, seq, authorMemberId, type, state]
      description: >
        The quoted message a client draws above a reply (ADR-0148). A reference
        resolved on every read, never a copy: editing the original changes what
        this says, and deleting it leaves a tombstone with no `body` at all. The
        author is named by id only, like every other row in the response — the
        client resolves it against the roster it already holds.
      properties:
        id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
        authorMemberId:
          type: string
          format: uuid
        type:
          type: string
          enum: [text, tool_call, tool_result, diff, artifact, approval_request, system]
        body:
          type: string
          description: Omitted on a tombstone, whose text no longer exists.
        state:
          type: string
          enum: [sent, edited, deleted, failed]
        editedAtMs:
          type: integer
          format: int64
        deletedAtMs:
          type: integer
          format: int64
          description: Present when the quoted message has been deleted.
        quotesAnother:
          type: boolean
          description: >
            The quoted message itself quotes something. A marker only — the
            inner target's id is deliberately absent, because quoting is drawn
            one layer deep and a second id is all anyone needs to build a
            staircase. Omitted when false.
        propsKind:
          type: string
          description: >
            The quoted message's `props.kind`, and the only thing its props
            contribute here. A card message rides an ordinary row — `type` is
            `text`, `body` is absent, and the card itself lives in `props` —
            which leaves it identical to a tombstone in every other field of this
            object, so a client reading "a text with no body was deleted" calls
            that card a deleted message. This key is what separates them.
            Omitted when the quoted message carries no kind, and omitted on a
            tombstone: a deleted row keeps its props in the database, but the
            deletion leaves nothing on the wire beyond the fact of it. The card's
            own payload never appears here — a quote draws two lines and sends
            the reader to the original.

    MessageAttachment:
      type: object
      required: [id, name, mime, sizeBytes]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mime:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 104857600
          description: >
            Measured attachment length in bytes after complete. A create-time
            declaration of `0` is unknown and is replaced by this value.

    ThreadRollup:
      type: object
      required: [reply_count, last_reply_seq, last_reply_at]
      properties:
        reply_count:
          type: integer
          minimum: 1
        last_reply_seq:
          type: integer
          format: int64
        last_reply_at:
          type: integer
          format: int64
          description: Epoch milliseconds for the latest reply timestamp.

    MessagePage:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
          description: >
            Descending by seq for head/`before` reads; ASCENDING for
            `after` backfill reads.
        nextBefore:
          type: integer
          format: int64
          description: >
            Smallest seq in this page — pass as `before` to fetch older
            messages. Omitted when the page is empty.

    ThreadRepliesPage:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
          description: Replies ordered by authoritative channel `seq` ascending.
        nextCursor:
          type: integer
          format: int64
          description: Last seq in this page when more replies remain; pass as `cursor`.

    WorkspaceMessageSearchHit:
      type: object
      required: [channelId, messageId, seq, authorMemberId, createdAtMs, snippet, matchOffset]
      properties:
        channelId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
          description: Authoritative per-channel message sequence.
        authorMemberId:
          type: string
          format: uuid
        createdAtMs:
          type: integer
          format: int64
        snippet:
          type: string
          description: Bounded text around the first match, with about 80 characters of context per side.
        matchOffset:
          type: integer
          minimum: 0
          description: Zero-based character offset of the first match within `snippet`.

    WorkspaceMessageSearchResponse:
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMessageSearchHit"
        nextCursor:
          type: string
          description: Opaque cursor for the next older page; omitted when exhausted.

    # ---- Read state (snake_case wire contract, ADR-0109) --------------------------
    UpdateReadStateRequest:
      type: object
      required: [last_read_seq]
      properties:
        last_read_seq:
          type: integer
          format: int64
          minimum: 0

    ReadState:
      type: object
      required: [channel_id, last_read_seq, latest_seq, unread_count, mention_count]
      properties:
        channel_id:
          type: string
          format: uuid
        last_read_seq:
          type: integer
          format: int64
        latest_seq:
          type: integer
          format: int64
        unread_count:
          type: integer
          format: int64
        mention_count:
          type: integer

    ReadStateListResponse:
      type: object
      required: [read_states]
      properties:
        read_states:
          type: array
          items:
            $ref: "#/components/schemas/ReadState"

    # ---- DMs ----------------------------------------------------------------------
    OpenDirectMessageRequest:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
          format: uuid
          description: >
            The other participant (must differ from the caller). Snake-case
            alias accepted by the server, `member_id`.

    OpenDirectMessageResponse:
      type: object
      required: [channel, created]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        created:
          type: boolean
          description: True when the DM channel was created by this call (status 201).

    # ---- Approvals (snake_case wire contract) ---------------------------------------
    ApprovalProjection:
      description: >
        One row of the approval inbox, as `GET .../approvals` returns it.


        NOTATION (SRV-B5c): the keys below are camelCase because that is what
        the Rust server — the deployed one — emits (`#[serde(rename_all =
        "camelCase")]` on `ApprovalDto`). The Swift server, which is still in
        the tree, maps the same fields to snake_case through explicit
        `CodingKeys` (`DTOs.swift:650`), so while both exist ONE of them does
        not match this schema. The spec follows the deployed server.


        Consequence a reader should know: `scripts/verify_openapi_contract.sh`
        boots the **Swift** e2e stack, so its samples are the snake_case ones.
        Its strict closed-object check therefore validates the shape this
        schema no longer describes. Repointing that gate at `server-rust` is
        tracked as harness hygiene, not fixed here.
      type: object
      required:
        - id
        - workspaceId
        - runId
        - channelId
        - requestedBy
        - actionType
        - payload
        - status
        - createdAtMs
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        requestMessageId:
          type: string
          format: uuid
          description: The approval_request message, when one exists.
        requestedBy:
          type: string
          format: uuid
          description: The requesting agent member.
        onBehalfOf:
          type: string
          description: >
            Delegation subject, projected from `payload.on_behalf_of`. The Rust
            server does not currently emit this field at all.
        actionType:
          type: string
          description: >
            e.g. `tool_call`, `deploy`, `spend`. `work.spawn` marks a
            work-control approval, whose decision settles the linked
            `work_control` row instead of resuming an agent turn.
        payload:
          type: object
          additionalProperties: true
          description: >
            Free-form approval payload. Two keys are contractual for the spawn
            card (ADR-0125 D6-A, #1114) and absent everywhere else:


            * `execution.host_candidates[]` — the hosts this approval offers,
              each `{host_id, display_name, host_type, tier, scope, online,
              selectable, unavailable_reason}`. `tier` is `local` | `remote` |
              `cloud`; a `cloud` row is always `selectable: false` with
              `unavailable_reason: "t3_disabled"` while ADR-0136 keeps momo Cloud
              off. Unselectable rows are listed with their reason rather than
              hidden.

            * `execution.default_host_id` — the pre-selected host (online local
              first, then remote), or null when nothing is eligible.


            The picker's answer is sent back as `ApprovalDecisionRequest.hostId`.
            No host-local path, environment, process state, or credential ever
            appears here.
        status:
          type: string
          enum: [pending, approved, rejected, expired, cancelled]
        estimatedMicroUsd:
          type: integer
          format: int64
          description: >
            Projected from payload when present as a number or numeric string.
            Not emitted by the Rust server: its one executable tool has no price
            table to quote.
        isReversible:
          type: boolean
          description: >
            Not emitted by the Rust server. An ABSENT value means "unknown" and
            must never be read as "reversible".
        decidedBy:
          type: string
          format: uuid
        decidedAtMs:
          type: integer
          format: int64
        decisionReason:
          type: string
        expiresAtMs:
          type: integer
          format: int64
        createdAtMs:
          type: integer
          format: int64
          description: >
            Always present on the Rust server. Neither the Swift DTO nor this
            schema carried it before SRV-B5c, which under the gate's
            closed-object rule made every Rust approval row undeclared drift.

    # ---- Plugin registry and delegated tool policy --------------------------
    InstallPluginRequest:
      type: object
      properties:
        enabled:
          type: boolean

    GrantPluginRequest:
      type: object
      required: [scope]
      properties:
        scope:
          type: string

    PluginCatalogItem:
      type: object
      required:
        - pluginId
        - name
        - version
        - description
        - official
        - recommended
        - egressDomains
        - recommendedFor
        - installed
        - enabled
      properties:
        pluginId: {type: string}
        name: {type: string}
        version: {type: string}
        description: {type: string}
        termsURL:
          type: string
          format: uri
          description: Optional HTTPS terms URL. Omitted when the manifest does not declare one; clients must not render an empty link.
        privacyPolicyURL:
          type: string
          format: uri
          description: Optional HTTPS privacy-policy URL. Omitted when the manifest does not declare one; clients must not render an empty link.
        iconText:
          type: string
          maxLength: 8
          description: Optional short text icon. Remote image URLs are not supported; clients derive a character fallback from name when omitted.
        official: {type: boolean}
        recommended:
          type: boolean
          description: True for the fixed onboarding set (GitHub, Drive, external webhook).
        egressDomains:
          type: array
          items: {type: string}
        recommendedFor:
          type: array
          items: {type: string}
        installed: {type: boolean}
        enabled: {type: boolean}

    PluginPolicyTool:
      type: object
      required: [name, risk, approvalTier]
      properties:
        name: {type: string}
        risk: {type: string}
        approvalTier: {type: string}

    PluginPolicyMCP:
      type: object
      required: [url, transport]
      properties:
        url: {type: string}
        transport: {type: string}

    PluginPolicyDescriptor:
      type: object
      required: [pluginId, mcp, egressDomains, tools]
      properties:
        pluginId: {type: string}
        mcp:
          $ref: "#/components/schemas/PluginPolicyMCP"
        egressDomains:
          type: array
          items: {type: string}
        tools:
          type: array
          items:
            $ref: "#/components/schemas/PluginPolicyTool"

    PluginToolPolicy:
      type: object
      required: [plugins]
      properties:
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/PluginPolicyDescriptor"

    PluginCatalogResponse:
      type: object
      required: [plugins, toolPolicy]
      properties:
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/PluginCatalogItem"
        toolPolicy:
          $ref: "#/components/schemas/PluginToolPolicy"

    PluginDetail:
      type: object
      required:
        - pluginId
        - name
        - version
        - description
        - official
        - egressDomains
        - recommendedFor
        - installed
        - enabled
        - manifest
      properties:
        pluginId: {type: string}
        name: {type: string}
        version: {type: string}
        description: {type: string}
        termsURL:
          type: string
          format: uri
          description: Optional HTTPS terms URL. Omitted when the manifest does not declare one; clients must not render an empty link.
        privacyPolicyURL:
          type: string
          format: uri
          description: Optional HTTPS privacy-policy URL. Omitted when the manifest does not declare one; clients must not render an empty link.
        iconText:
          type: string
          maxLength: 8
          description: Optional short text icon. Remote image URLs are not supported; clients derive a character fallback from name when omitted.
        official: {type: boolean}
        egressDomains:
          type: array
          items: {type: string}
        recommendedFor:
          type: array
          items: {type: string}
        installed: {type: boolean}
        enabled: {type: boolean}
        manifest:
          description: Validated registry manifest. Its manifest-version-specific shape is preserved.
          type: object
          additionalProperties: true

    PluginDetailResponse:
      type: object
      required: [plugin]
      properties:
        plugin:
          $ref: "#/components/schemas/PluginDetail"

    PluginMutationResponse:
      type: object
      required: [pluginId, status, enabled, capabilities]
      properties:
        pluginId: {type: string}
        memberId:
          type: string
          format: uuid
        scope: {type: string}
        status: {type: string}
        enabled: {type: boolean}
        auditRef:
          type: string
          format: uuid
        capabilities:
          type: array
          items: {type: string}

    # ---- Incoming webhooks --------------------------------------------------
    CreateWebhookRequest:
      type: object
      required: [channelId, mode]
      properties:
        channelId:
          type: string
          format: uuid
        mode:
          type: string
          enum: [native, slack_compatible]
        label:
          type: string
          minLength: 1
          maxLength: 80

    RotateWebhookRequest:
      type: object
      properties:
        overlapSeconds:
          type: integer
          minimum: 0
          maximum: 604800
          default: 86400

    WebhookInstallation:
      type: object
      required: [id, channelId, authorMemberId, mode, label, status, createdAtMs, updatedAtMs]
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        authorMemberId:
          type: string
          format: uuid
        mode:
          type: string
          enum: [native, slack_compatible]
        label: {type: string}
        status:
          type: string
          enum: [active, revoked]
        createdAtMs:
          type: integer
          format: int64
        updatedAtMs:
          type: integer
          format: int64

    WebhookInstallationListResponse:
      type: object
      required: [installations]
      properties:
        installations:
          type: array
          items:
            $ref: "#/components/schemas/WebhookInstallation"

    WebhookSecretResponse:
      type: object
      description: >
        One-time credential response. Native mode includes secret,
        signatureVersion, and algorithm; Slack-compatible mode embeds the
        opaque secret only in url. Absent mode-specific fields are omitted.
      required: [installation, keyId, url]
      properties:
        installation:
          $ref: "#/components/schemas/WebhookInstallation"
        keyId:
          type: string
          format: uuid
        secret:
          type: string
          description: Native HMAC secret, revealed once and never persisted in raw form.
        url:
          type: string
          description: Native relative ingress path or one-time Slack-compatible secret URL.
        signatureVersion:
          type: string
          enum: [v1]
        algorithm:
          type: string
          enum: [HMAC-SHA256]
        overlapSeconds:
          type: integer

    WebhookRevokeResponse:
      type: object
      required: [installation, revoked]
      properties:
        installation:
          $ref: "#/components/schemas/WebhookInstallation"
        revoked: {type: boolean}

    WebhookIngressResponse:
      type: object
      required: [receiptId, messageId, seq, duplicate]
      properties:
        receiptId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
        duplicate: {type: boolean}

    NativeWebhookPayload:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 40000
        event_type:
          type: string
          minLength: 1
          maxLength: 120
        metadata:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
            maxLength: 1000

    SlackCompatibleWebhookPayload:
      type: object
      description: >
        Mattermost-compatible subset. text and legacy attachments are read;
        unsupported fields are ignored except blocks, which returns 400.
      not:
        required: [blocks]
      properties:
        text: {type: string}
        attachments:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    # ---- Hosted Agent Port MCP JSON-RPC (ADR-0162 / HAP-E2) ---------------
    AgentPortClientInfo:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        title:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: string
          minLength: 1
          maxLength: 64

    AgentPortRequestMeta:
      type: object
      additionalProperties: false
      required:
        - io.modelcontextprotocol/protocolVersion
        - io.modelcontextprotocol/clientCapabilities
      properties:
        io.modelcontextprotocol/protocolVersion:
          type: string
          enum: ["2026-07-28"]
        io.modelcontextprotocol/clientCapabilities:
          type: object
          description: Bounded client-declared capabilities; never an authorization source.
          additionalProperties: true
        io.modelcontextprotocol/clientInfo:
          $ref: "#/components/schemas/AgentPortClientInfo"

    AgentPortModernParams:
      type: object
      additionalProperties: false
      required: [_meta]
      properties:
        _meta:
          $ref: "#/components/schemas/AgentPortRequestMeta"

    AgentPortModernToolCallParams:
      type: object
      additionalProperties: false
      required: [_meta, name]
      properties:
        _meta:
          $ref: "#/components/schemas/AgentPortRequestMeta"
        name:
          type: string
          minLength: 1
          maxLength: 128
        arguments:
          type: object
          additionalProperties: true

    AgentPortLegacyInitializeParams:
      type: object
      additionalProperties: false
      required: [protocolVersion, capabilities, clientInfo]
      properties:
        protocolVersion:
          type: string
          enum: ["2025-11-25"]
        capabilities:
          type: object
          additionalProperties: true
        clientInfo:
          $ref: "#/components/schemas/AgentPortClientInfo"

    AgentPortLegacyEmptyParams:
      type: object
      additionalProperties: false

    AgentPortLegacyToolCallParams:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        arguments:
          type: object
          additionalProperties: true

    AgentPortJSONRPCRequestId:
      description: >
        JSON-RPC non-empty string or finite number request id. Omitted only by the legacy
        `notifications/initialized` notification.
      oneOf:
        - type: string
          minLength: 1
          maxLength: 128
        - type: number

    AgentPortJSONRPCRequest:
      description: Exact closed union of the supported modern and legacy request bodies.
      oneOf:
        - $ref: "#/components/schemas/AgentPortModernDiscoverRequest"
        - $ref: "#/components/schemas/AgentPortModernToolsListRequest"
        - $ref: "#/components/schemas/AgentPortModernToolsCallRequest"
        - $ref: "#/components/schemas/AgentPortLegacyInitializeRequest"
        - $ref: "#/components/schemas/AgentPortLegacyInitializedNotification"
        - $ref: "#/components/schemas/AgentPortLegacyPingRequest"
        - $ref: "#/components/schemas/AgentPortLegacyToolsListRequest"
        - $ref: "#/components/schemas/AgentPortLegacyToolsCallRequest"

    AgentPortModernDiscoverRequest:
      type: object
      additionalProperties: false
      required: [jsonrpc, id, method, params]
      properties:
        jsonrpc: {type: string, enum: ["2.0"]}
        id: {$ref: "#/components/schemas/AgentPortJSONRPCRequestId"}
        method: {type: string, enum: [server/discover]}
        params: {$ref: "#/components/schemas/AgentPortModernParams"}

    AgentPortModernToolsListRequest:
      type: object
      additionalProperties: false
      required: [jsonrpc, id, method, params]
      properties:
        jsonrpc: {type: string, enum: ["2.0"]}
        id: {$ref: "#/components/schemas/AgentPortJSONRPCRequestId"}
        method: {type: string, enum: [tools/list]}
        params: {$ref: "#/components/schemas/AgentPortModernParams"}

    AgentPortModernToolsCallRequest:
      type: object
      additionalProperties: false
      required: [jsonrpc, id, method, params]
      properties:
        jsonrpc: {type: string, enum: ["2.0"]}
        id: {$ref: "#/components/schemas/AgentPortJSONRPCRequestId"}
        method: {type: string, enum: [tools/call]}
        params: {$ref: "#/components/schemas/AgentPortModernToolCallParams"}

    AgentPortLegacyInitializeRequest:
      type: object
      additionalProperties: false
      required: [jsonrpc, id, method, params]
      properties:
        jsonrpc: {type: string, enum: ["2.0"]}
        id: {$ref: "#/components/schemas/AgentPortJSONRPCRequestId"}
        method: {type: string, enum: [initialize]}
        params: {$ref: "#/components/schemas/AgentPortLegacyInitializeParams"}

    AgentPortLegacyInitializedNotification:
      type: object
      additionalProperties: false
      required: [jsonrpc, method]
      properties:
        jsonrpc: {type: string, enum: ["2.0"]}
        method: {type: string, enum: [notifications/initialized]}
        params: {$ref: "#/components/schemas/AgentPortLegacyEmptyParams"}

    AgentPortLegacyPingRequest:
      type: object
      additionalProperties: false
      required: [jsonrpc, id, method]
      properties:
        jsonrpc: {type: string, enum: ["2.0"]}
        id: {$ref: "#/components/schemas/AgentPortJSONRPCRequestId"}
        method: {type: string, enum: [ping]}
        params: {$ref: "#/components/schemas/AgentPortLegacyEmptyParams"}

    AgentPortLegacyToolsListRequest:
      type: object
      additionalProperties: false
      required: [jsonrpc, id, method]
      properties:
        jsonrpc: {type: string, enum: ["2.0"]}
        id: {$ref: "#/components/schemas/AgentPortJSONRPCRequestId"}
        method: {type: string, enum: [tools/list]}
        params: {$ref: "#/components/schemas/AgentPortLegacyEmptyParams"}

    AgentPortLegacyToolsCallRequest:
      type: object
      additionalProperties: false
      required: [jsonrpc, id, method, params]
      properties:
        jsonrpc: {type: string, enum: ["2.0"]}
        id: {$ref: "#/components/schemas/AgentPortJSONRPCRequestId"}
        method: {type: string, enum: [tools/call]}
        params: {$ref: "#/components/schemas/AgentPortLegacyToolCallParams"}

    AgentPortServerToolCapability:
      type: object
      additionalProperties: false
      required: [listChanged]
      properties:
        listChanged:
          type: boolean
          enum: [false]

    AgentPortServerCapabilities:
      type: object
      additionalProperties: false
      required: [tools]
      properties:
        tools:
          $ref: "#/components/schemas/AgentPortServerToolCapability"

    AgentPortServerInfo:
      type: object
      additionalProperties: false
      required: [name, title, version]
      properties:
        name:
          type: string
          enum: [oort-agent-port]
        title:
          type: string
          enum: [oort Agent Port]
        version:
          type: string

    AgentPortCache:
      type: object
      additionalProperties: false
      required: [ttlSeconds, scope]
      properties:
        ttlSeconds:
          type: integer
          minimum: 0
          maximum: 300
        scope:
          type: string
          enum: [private]

    AgentPortModernDiscoverCache:
      type: object
      additionalProperties: false
      required: [ttlSeconds, scope]
      properties:
        ttlSeconds: {type: integer, enum: [300]}
        scope: {type: string, enum: [private]}

    AgentPortModernToolsListCache:
      type: object
      additionalProperties: false
      required: [ttlSeconds, scope]
      properties:
        ttlSeconds: {type: integer, enum: [0]}
        scope: {type: string, enum: [private]}

    AgentPortResult:
      description: >
        Exact closed union of modern discovery/list and legacy initialize/list/ping results.
      oneOf:
        - $ref: "#/components/schemas/AgentPortModernDiscoverResult"
        - $ref: "#/components/schemas/AgentPortModernToolsListResult"
        - $ref: "#/components/schemas/AgentPortLegacyInitializeResult"
        - $ref: "#/components/schemas/AgentPortLegacyToolsListResult"
        - $ref: "#/components/schemas/AgentPortPingResult"

    AgentPortModernDiscoverResult:
      type: object
      additionalProperties: false
      required: [protocolVersion, capabilities, serverInfo, resultType, cache]
      properties:
        protocolVersion:
          type: string
          enum: ["2026-07-28"]
        capabilities:
          $ref: "#/components/schemas/AgentPortServerCapabilities"
        serverInfo:
          $ref: "#/components/schemas/AgentPortServerInfo"
        resultType:
          type: string
          enum: [server/discover]
        cache:
          $ref: "#/components/schemas/AgentPortModernDiscoverCache"

    AgentPortModernToolsListResult:
      type: object
      additionalProperties: false
      required: [tools, resultType, cache]
      properties:
        resultType: {type: string, enum: [tools/list]}
        cache:
          $ref: "#/components/schemas/AgentPortModernToolsListCache"
        tools:
          type: array
          maxItems: 0
          items:
            type: object
            additionalProperties: true

    AgentPortLegacyInitializeResult:
      type: object
      additionalProperties: false
      required: [protocolVersion, capabilities, serverInfo]
      properties:
        protocolVersion: {type: string, enum: ["2025-11-25"]}
        capabilities: {$ref: "#/components/schemas/AgentPortServerCapabilities"}
        serverInfo: {$ref: "#/components/schemas/AgentPortServerInfo"}

    AgentPortLegacyToolsListResult:
      type: object
      additionalProperties: false
      required: [tools]
      properties:
        tools:
          type: array
          maxItems: 0
          items: {type: object, additionalProperties: true}

    AgentPortPingResult:
      type: object
      additionalProperties: false

    AgentPortJSONRPCError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: integer
          enum: [-32700, -32600, -32601, -32602, -32020, -32022, -32029]
        message:
          type: string
        data:
          type: object
          additionalProperties: true

    AgentPortJSONRPCResponse:
      description: >
        Exactly one of result or error is emitted. Transport authentication
        failures are intentionally not encoded in this envelope.
      oneOf:
        - $ref: "#/components/schemas/AgentPortJSONRPCSuccessResponse"
        - $ref: "#/components/schemas/AgentPortJSONRPCErrorResponse"

    AgentPortJSONRPCResponseId:
      description: Echoed JSON-RPC string/number id, or null when unavailable.
      nullable: true
      oneOf:
        - type: string
          minLength: 1
          maxLength: 128
        - type: number

    AgentPortJSONRPCSuccessResponse:
      type: object
      additionalProperties: false
      required: [jsonrpc, id, result]
      properties:
        jsonrpc: {type: string, enum: ["2.0"]}
        id: {$ref: "#/components/schemas/AgentPortJSONRPCRequestId"}
        result: {$ref: "#/components/schemas/AgentPortResult"}

    AgentPortJSONRPCErrorResponse:
      type: object
      additionalProperties: false
      required: [jsonrpc, id, error]
      properties:
        jsonrpc: {type: string, enum: ["2.0"]}
        id: {$ref: "#/components/schemas/AgentPortJSONRPCResponseId"}
        error: {$ref: "#/components/schemas/AgentPortJSONRPCError"}

    # ---- Hosted Drive MCP JSON-RPC -----------------------------------------
    DriveMCPRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          description: Required by the server for a valid request; string, number, or null on parse errors.
        method:
          type: string
          enum: [initialize, tools/list, tools/call]
        params:
          type: object
          additionalProperties: true

    DriveMCPError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          enum: [-32700, -32600, -32601, -32602, -32003]
        message: {type: string}
        data:
          type: object
          additionalProperties: true

    DriveMCPResponse:
      type: object
      description: Exactly one of result or error is emitted; nil fields are omitted by Swift.
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id: {}
        result: {}
        error:
          $ref: "#/components/schemas/DriveMCPError"

    ApprovalProjectionPage:
      type: object
      required: [approvals]
      properties:
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalProjection"

    ApprovalDecisionRequest:
      type: object
      required: [approval_id, approve, client_decision_id]
      properties:
        approval_id:
          type: string
          format: uuid
          description: Must equal the path approvalId.
        approve:
          type: boolean
        reason:
          type: string
          description: Optional; trimmed and truncated to 2000 chars server-side.
        client_decision_id:
          type: string
          format: uuid
          description: Client-generated idempotency key for the decision.
        hostId:
          type: string
          format: uuid
          description: >
            ADR-0125 D6-A. The work host the approver chose from the card's
            picker, for an approval whose payload carries an `execution` object
            (a `work.spawn` control or a `work.session.spawn` tool call). Omit to
            accept `execution.default_host_id`; sending it on an approval that
            offers no picker is a 400, and sending one outside
            `execution.host_candidates[].selectable` is a 403. Not part of the
            idempotency key: a replayed decision answers the original receipt.

    ApprovalDecisionReceipt:
      type: object
      description: >
        Decision acknowledgement. Committed decisions carry status
        approved/rejected; expected failures reuse this shape with a
        diagnostic status (e.g. idempotency_conflict, forbidden, not_found,
        bad_request, expired, or the approval's current status on a 409).


        NOTATION (SRV-B5c): camelCase, matching the deployed Rust server. See
        `ApprovalProjection` for the Swift dual-notation caveat — and note this
        receipt is additionally stored verbatim in `approval_decision.receipt`
        and replayed on retry, so a notation change here rewrites what an
        idempotent retry returns.
      required: [approvalId, status, decidedAtMs]
      properties:
        approvalId:
          type: string
          format: uuid
        status:
          type: string
        decidedBy:
          type: string
          format: uuid
          description: Absent for system-side outcomes such as expiry.
