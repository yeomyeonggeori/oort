          type: string
          minLength: 1
          maxLength: 80
        launchTemplate:
          $ref: "#/components/schemas/WorkToolLaunchTemplate"
        tierDefaults:
          type: object
          additionalProperties: true
        envPolicy:
          $ref: "#/components/schemas/WorkToolEnvironmentPolicy"
        enabled:
          type: boolean
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid
        createdAtMs:
          type: integer
          format: int64
        updatedAtMs:
          type: integer
          format: int64

    CreateWorkToolProfileRequest:
      type: object
      additionalProperties: false
      required: [toolKey, displayName, launchTemplate]
      properties:
        toolKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
