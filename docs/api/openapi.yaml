openapi: 3.0.3

# =============================================================================
# oort REST API — web v0 + plugin surface (MOMO-389/MOMO-459)
#
# This file is the canonical client contract for the web v0 surface. Clients
# (clients/web-legacy via openapi-typescript, and packages/momo-core as a
# conformance target) follow this spec. The live server is server-rust
# (bins/momo-server, ADR-0145); drift between this spec and the running server
# is detected by scripts/verify_openapi_contract.sh (docs/LOCAL_PR_GATE.md).
#
# Provenance note: this spec was written field-level identical to the retired
# Swift DTOs (server/Sources/MomoServer/Routes/DTOs.swift). That tree is being
# deleted, and the Swift-derived encoding rules below are recorded as the wire
# contract that server-rust must keep reproducing, not as a description of the
# code that serves it today.
#
# Scope: web v0 (ADR-0119 D5-A) plus admin agent creation, the plugin
# registry/grant, incoming webhook, hosted Drive MCP, hosted-agent Agent Port,
# and interactive Work Console control surfaces. Other routes (workspace
# identity GET path, legacy agent credential/run surfaces, cost projection,
# platform admin, centrifugo proxy, health) remain intentionally undocumented
# here. WorkspaceDto (roleLabels) is the identity projection schema (#1770).
# Operator/instance-admin surfaces (e.g. the MOMO-572 provider link) are
# documented separately in docs/api/openapi.operator.yaml.
#
# Encoding rules (server truth):
# - Optional response fields are OMITTED when absent (Swift encodeIfPresent);
#   they are never serialized as JSON null. Fields listed under `required`
#   are always present.
# - Object schemas in this spec are CLOSED for the drift gate: a response key
#   that is not listed here is contract drift. Arbitrary-shape fields are the
#   explicit exceptions (Message.props, ApprovalProjection.payload).
# - Timestamps are epoch milliseconds and carry an `AtMs`/`_ms`/`Ms` suffix.
# - UUID casing is mixed by design: values that pass through Swift
#   Foundation.UUID are UPPERCASE; values passed through from PostgreSQL JSON
#   are lowercase. Clients must compare UUIDs case-insensitively.
# - Message ordering authority is `message.seq` per channel (L4 §3.1);
#   realtime is transport-only and REST backfill uses `?after=<seq>`.
# =============================================================================

info:
  title: oort REST API (web v0 + plugin surface)
  version: 0.1.0
  description: >
    Canonical REST contract for the oort web v0 client surface:
    login/refresh/logout, public invite join, realtime token issuance,
    workspace roster, channels (list/create), messages (send/history with
    seq-cursor pagination and `?after=` backfill), read-state (bulk read +
    cursor advance), direct messages (list/open), and approvals
    (list/decision), plugin registry/grants, incoming webhooks, the hosted
    read-only Drive MCP endpoint, the sessionless hosted-agent Agent Port, and
    ADR-0114 Work Console sessions and controls, plus the fresh-database agent
    creation boundary. Mirrors MomoServer field by field.

servers:
  - url: /
    description: >
      Same-origin deployment (ADR-0119 D1-A). The web SPA and the `/v1/*` API
      are served from one origin; the realtime WebSocket address is NOT
      derived from this origin — the only authority is the
      `realtimeWebSocketUrl` field returned by login/join (ADR-0110).

tags:
  - name: auth
    description: Session token issuance, rotation, revocation, realtime token.
  - name: join
    description: Public invite self-signup (no auth required).
  - name: invites
    description: Workspace invite-code admin (owner/admin) and member self-redeem.
  - name: claim
    description: >
      Public credential claim (ADR-0166 / #1767). One-time token sets a
      password — first-owner bootstrap or operator-issued password reset.
  - name: roster
    description: Workspace member roster.
  - name: presence
    description: >
      ADR-0160 declared presence (auto/away/dnd) plus ADR-0176 custom status
      (emoji + text + optional expiry). Human-only; the path names no member
      id. Changes ride the existing `type: presence` channel broadcast.
  - name: membership
    description: Caller-scoped membership writes (self-leave, self display name).
  - name: membership-admin
    description: ADR-0128 workspace/channel roles, suspension, removal, and bans.
  - name: agents
    description: Human-admin agent identity creation; channel membership and credentials remain explicit follow-up steps.
  - name: channels
    description: Workspace channels.
  - name: huddles
    description: Channel-bound ephemeral voice huddle lifecycle and LiveKit room grants.
  - name: work-hosts
    description: Registered execution hosts authenticated by Ed25519 heartbeats.
  - name: work-sessions
    description: Host-owned interactive work session ledger bound to channel thread roots.
  - name: workstreams
    description: >
      ADR-0143 goal layer anchored on a thread root. Continuity lives on the
      workstream, so a work session is one Run of it and work_session.memberId is
      that Run's actor rather than the owner of the work.
  - name: work-pool
    description: Workspace-shared concurrent work-session quota and current derived usage.
  - name: work-controls
    description: Agent-requested, human-gated controls dispatched to a user-owned execution host.
  - name: work-tool-profiles
    description: Workspace-admin tool catalog and enabled host launch projection.
  - name: event-subscriptions
    description: Workspace-admin signed outbound event webhook subscriptions.
  - name: messages
    description: Channel messages — the single write path (REST -> PG -> outbox).
  - name: reminders
    description: >
      ADR-0175 personal message reminders (later-alert). Human-only owner CRUD.
      v1 has no outbox fan-out — clients poll the list.
  - name: sidebar
    description: >
      ADR-0177 member-owned sidebar organization — custom sections, channel
      placement and stars, roamed per member. Human-only; no outbox fan-out in
      v1 (other devices converge on the bootstrap GET). Collapse state stays on
      the device (D4).
  - name: unfurls
    description: >
      ADR-0170 link unfurl server surface. Workspace on/off, message-level
      removal, and the authenticated image proxy. Cards arrive on
      `message.unfurl` broadcasts; personal render-fold is a client concern.
  - name: attachments
    description: Drive archive resumable uploads, completion, and authorized content proxy.
  - name: read-state
    description: ADR-0109 per-member read cursors and unread/mention counts.
  - name: dms
    description: 1:1 direct message channels.
  - name: approvals
    description: Human-in-the-loop approval projections and decisions.
  - name: plugins
    description: Plugin catalog, workspace installation, delegated grants, and tool policy.
  - name: webhooks
    description: Incoming webhook installation management and public ingress.
  - name: mcp
    description: Hosted MCP JSON-RPC endpoints for agent bearers.
  - name: memories
    description: ADR-0129 workspace memory lifecycle, source links, and admin policy.
  - name: workspace-settings
    description: >
      Operator-only workspace.settings bag (#1800/#1770). Owner/admin. The bag
      is not exposed on GET /v1/workspaces/{workspaceId}; members read
      individual keys through derived projections. role_labels is accepted on
      PATCH and projected as WorkspaceDto.roleLabels.

paths:
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      summary: Log in with email/password and receive a session token pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credentials verified; session issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: authRefresh
      summary: Rotate a refresh token into a new access/refresh pair.
      description: >
        Single-use rotation (MOMO-300): the presented refresh token is revoked
        atomically; replaying it returns 401. Exactly one concurrent caller
        wins.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New token pair issued; the old refresh token is dead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          description: Invalid, expired, revoked, or already-used refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Member is no longer active in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: Revoke the presented session tokens (idempotent).
      description: >
        Requires a signature-valid access token in the Authorization header
        (an already-revoked access token still gets a 200 — logging out twice
        is idempotent, reported via `alreadyRevoked`). The optional body may
        carry the session's refresh token so the whole session dies at once;
        a refresh token belonging to another member/workspace is rejected
        with 403.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Revocation outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          description: Missing/invalid access token signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Body refresh token does not match this session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/auth/realtime-token:
    post:
      tags: [auth]
      operationId: authRealtimeToken
      summary: Issue a short-lived Centrifugo connection JWT.
      description: >
        The returned token authenticates the WebSocket connection at the
        server-owned `realtimeWebSocketUrl` (ADR-0110). Requires the
        `messages:read` scope for humans.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Connection token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Missing scope or member no longer active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/join:
    post:
      tags: [join]
      operationId: publicJoin
      summary: Join a workspace with an invite code (public, no auth).
      description: >
        Redeems a high-entropy invite code, creating (201) or reusing (200) a
        human member, granting membership in every joinable public channel,
        and issuing a session token pair. Snake-case body aliases accepted by
        the server: `display_name`, `time_zone`/`tz`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequest"
      responses:
        "201":
          description: New member created and joined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResponse"
        "200":
          description: Existing member (same email) re-joined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResponse"
        "400":
          description: Invalid code/email/displayName/handle/password shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role escalation or non-joinable member state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invite code is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already redeemed, exhausted, or no joinable channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Invite code expired or revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/invites:
    get:
      tags: [invites]
      operationId: listWorkspaceInvites
      summary: List invite codes for a workspace (owner/admin).
      description: >
        Newest-first. Projects a 6-character preview only — the raw code is
        never stored and is not returned here. `include_revoked=true` (or
        `includeRevoked=true`) includes revoked rows. `limit` clamps to 1..200
        (default 50).
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: include_revoked
          in: query
          required: false
          schema: {type: string}
          description: Literal `true` includes revoked rows. Camel alias `includeRevoked`.
        - name: includeRevoked
          in: query
          required: false
          schema: {type: string}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: Invite metadata list (no raw codes).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InviteListResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Caller is not a workspace owner/admin.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
    post:
      tags: [invites]
      operationId: createWorkspaceInvite
      summary: Create an invite code (owner/admin).
      description: >
        The raw code is returned exactly once in this 201 body. The durable
        record is `sha256(raw)`. Examples and samples must never carry a live
        code.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateInviteRequest"}
      responses:
        "201":
          description: Created invite plus the one-time raw code.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreateInviteResponse"}
        "400":
          description: Role, maxUses, or expiresAtMs rejected.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Caller is not a workspace owner/admin.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /v1/workspaces/{workspaceId}/invites/redeem:
    post:
      tags: [invites]
      operationId: redeemWorkspaceInvite
      summary: Redeem an invite code as an existing workspace member.
      description: >
        Swift `InviteRoutes.redeem`. Distinct from public `POST /v1/join`.
        Does not create a member. The request carries the raw code; the
        response never echoes it.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RedeemInviteRequest"}
      responses:
        "200":
          description: Invite metadata after the increment, plus redemption id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RedeemInviteResponse"}
        "400":
          description: Code is invalid, expired, exhausted, revoked, or already redeemed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Not a workspace member, or banned.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /v1/workspaces/{workspaceId}/invites/{inviteId}:
    get:
      tags: [invites]
      operationId: getWorkspaceInvite
      summary: Read one invite and its redemptions (owner/admin).
      description: >
        Redeem-status lookup. Returns usedCount / revokedAt plus the
        redemption audit rows. No raw code.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/InviteId"
      responses:
        "200":
          description: Invite metadata and redemption rows.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InviteStatusResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Caller is not a workspace owner/admin.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: Invite not found in this workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
    delete:
      tags: [invites]
      operationId: deleteWorkspaceInvite
      summary: Revoke an unused invite (owner/admin).
      description: >
        Same handler as `POST …/revoke`. Exhausted codes (`usedCount >= maxUses`)
        are 409. Already-revoked is idempotent 200 without a second audit row.
        Optional JSON body `{reason}` is accepted; an empty body is a revoke
        with no reason.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/InviteId"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RevokeInviteRequest"}
      responses:
        "200":
          description: Current invite metadata after revoke.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InviteCode"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Caller is not a workspace owner/admin.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: Invite not found in this workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "409":
          description: Invite is already consumed (no remaining uses).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /v1/workspaces/{workspaceId}/invites/{inviteId}/revoke:
    post:
      tags: [invites]
      operationId: revokeWorkspaceInvite
      summary: Revoke an unused invite (Swift path).
      description: >
        Swift `POST …/revoke`. Same contract as `DELETE …/invites/{inviteId}`.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/InviteId"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RevokeInviteRequest"}
      responses:
        "200":
          description: Current invite metadata after revoke.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InviteCode"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Caller is not a workspace owner/admin.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: Invite not found in this workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "409":
          description: Invite is already consumed (no remaining uses).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /v1/workspaces/{workspaceId}/invites/{inviteId}/regenerate:
    post:
      tags: [invites]
      operationId: regenerateWorkspaceInvite
      summary: Revoke the old code and mint a replacement (owner/admin).
      description: >
        Copies role, maxUses, and metadata. Expiry resets to seven days. The
        previous code is immediately invalid. The new raw code is returned
        once; examples and samples must never carry a live code.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/InviteId"
      responses:
        "201":
          description: Replacement invite plus the one-time raw code.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreateInviteResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Caller is not a workspace owner/admin.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "409":
          description: Invite not found or already revoked.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /v1/claim:
    post:
      tags: [claim]
      operationId: publicClaim
      summary: Consume a claim token and set the password (public, no auth).
      description: >
        ADR-0166 / #1767. Redeems a one-time 32-byte claim token
        (`owner_bootstrap` from momo-migrate, or `password_reset` issued by an
        owner/admin). Sets the target human's password in the same transaction
        and issues a session token pair. `password_reset` also revokes that
        member's other session tokens. The raw token is never stored (sha256
        only). Reuse returns 409; expiry returns 410. Per-IP rate limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRequest"
      responses:
        "200":
          description: Password set; session issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid token or password shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Claim token is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Token already used, or owner already has a password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Claim token expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/roster:
    get:
      tags: [roster]
      operationId: getRoster
      summary: List active workspace members (humans and agents).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: kind
          in: query
          required: false
          description: Filter by member kind. Alias accepted by the server, `member_kind`.
          schema:
            type: string
            enum: [human, agent]
        - name: limit
          in: query
          required: false
          description: Page size, clamped to 1..500.
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Active workspace roster, restricted to shared-channel members for guests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRosterResponse"
        "400":
          description: kind must be human or agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/members:
    get:
      tags: [roster]
      operationId: getRosterMembersAlias
      summary: Compatibility alias of the roster endpoint.
      description: Same handler, parameters, and response as `/roster`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [human, agent]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Roster of active members with an active channel membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRosterResponse"
        "400":
          description: kind must be human or agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/presence:
    get:
      tags: [presence]
      operationId: getPresenceStatus
      summary: Read the caller's own declared presence and custom status.
      description: >
        ADR-0160 ③ plus ADR-0176. Human bearer only. The member is the
        credential's — the path has no `memberId`. Custom-status fields are
        omitted when unset, empty, or `statusExpiresAtMs` has been reached
        (lazy delete; no sweeper job). Availability and the effective dot are
        not here.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: The caller's durable declared status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Agent bearer (presence is human-only).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No live human presence for this member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      tags: [presence]
      operationId: setPresenceStatus
      summary: Set the caller's own declared presence and optional custom status.
      description: >
        Same PUT as ADR-0160. `status` remains required (`auto`/`away`/`dnd`).
        Optional `statusEmoji` / `statusText` / `statusExpiresAtMs` are a
        per-key patch — omitted leaves the stored value, JSON null clears,
        a value sets. Trimmed text is at most 80 characters; emoji is a
        length/code-point cap (≤32 scalars), not a strict emoji classifier.
        All three null clears the custom status. Broadcasts on the existing
        `type: presence` `ch:` rail. No audit row (personal intent; the
        original presence PUT was unaudited).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPresenceRequest"
      responses:
        "200":
          description: Stored declared status (custom fields omitted when empty/expired).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceStatusResponse"
        "400":
          description: Invalid status, overlong text/emoji, or unrepresentable expiry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Agent bearer, or not a live member of this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/members/{memberId}/role:
    patch:
      tags: [membership-admin]
      operationId: changeWorkspaceMemberRole
      summary: Change a workspace role under the owner/admin hierarchy.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangeMembershipRoleRequest"}
      responses:
        "200":
          description: Workspace role changed and audited.
          content: {application/json: {schema: {$ref: "#/components/schemas/MembershipRoleResponse"}}}
        "400": {description: Invalid role or member id, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: Workspace member not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "409": {description: The change would remove the last owner, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/settings:
    get:
      tags: [workspace-settings]
      operationId: getWorkspaceSettings
      summary: Read the workspace.settings bag.
      description: >
        Owner/admin only (`require_workspace_operator`). Returns the stored
        jsonb object, or `{}` when the workspace has never written a key.
        This is deliberately a sibling of `GET /v1/workspaces/{workspaceId}`,
        which must not grow a `settings` field — the bag is an extensible
        store that may later hold keys not every member may read.
        Members read `role_labels` through `WorkspaceDto.roleLabels` on that
        identity GET.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Current bag. Empty object when unset.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspaceSettings"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Human owner/admin required. Agents and members/guests are refused.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: Workspace not visible under the tenant GUC.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}
    patch:
      tags: [workspace-settings]
      operationId: patchWorkspaceSettings
      summary: Merge top-level keys into workspace.settings.
      description: >
        Owner/admin only. RFC 7396-shaped top-level merge: specified keys
        replace, omitted keys stay, `null` deletes the key. Unknown top-level
        keys are 400. Allowlist is `allowed_agent_models` (string array, max
        32 entries, each ≤ 64 bytes) and `role_labels` (object whose keys
        are `owner`/`admin`/`member`/`guest`, values non-empty strings ≤ 48
        UTF-8 bytes). `role_labels` is replaced whole — omit a role key to
        drop that override; `null` deletes the key (client default labels).
        Serialized body over 8192 bytes is 413. There is no PUT whole-replace.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PatchWorkspaceSettingsRequest"}
      responses:
        "200":
          description: Merged bag.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspaceSettings"}
        "400":
          description: Unknown key, malformed allowed_agent_models or role_labels, or non-object body.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Human owner/admin required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: Workspace not visible under the tenant GUC.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "413":
          description: Serialized PATCH body exceeds 8192 bytes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/members/me:
    patch:
      tags: [membership]
      operationId: renameSelfMember
      summary: Change the caller's own display name.
      description: >
        #1873 / BZ-4e. Human active members only. Body is `{displayName}`
        (camelCase, closed world). Normalization reuses the join rule
        (`normalized_join_display_name`: trimmed, 1..100 chars); a violation
        is 400 `displayName is required`. Handle, role, and avatar are not
        writable here. Agent bearers are 403 — an agent's display name is
        the agent profile path. Writes `member.display_name` and `updated_at`
        in one tenant transaction with audit `member.renamed` and a
        `member.renamed` outbox broadcast per co-member channel (presence
        fan-out shape; no new rail).
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/WorkspaceId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameSelfMemberRequest"
      responses:
        "200":
          description: Display name updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfMemberResponse"
        "400":
          description: displayName failed join normalization (empty or longer than 100 chars after trim).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: >
            Caller is not a human live member of this workspace, or presented
            an agent bearer (not on the agent-route allow-list).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [membership]
      operationId: leaveWorkspace
      summary: Leave the workspace and revoke the caller's sessions.
      description: >
        Human active members only. Removes all channel memberships and the
        workspace membership, transitions the caller to deleted, revokes every
        token, and preserves authored messages. The final active owner must
        transfer ownership before leaving.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/WorkspaceId"}]
      responses:
        "200": {description: Workspace left and all caller tokens revoked, content: {application/json: {schema: {$ref: "#/components/schemas/MembershipLifecycleResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: Caller is the last active owner, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/members/me/password:
    patch:
      tags: [auth]
      operationId: changeOwnPassword
      summary: Change the caller's password after reconfirming the current one.
      description: >
        #1767. Requires the current password. On success every live session
        token of this member is revoked and a fresh access/refresh pair is
        issued (same LoginResponse shape as login/claim). Agent bearers are
        not touched. Per-member and per-IP rate limited.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/WorkspaceId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed; previous sessions revoked; new pair issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Password shape invalid, or new password equals current.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current password is incorrect, or caller is not a human member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Caller has no password to change (use claim).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/members/{memberId}/password-reset:
    post:
      tags: [membership-admin]
      operationId: issuePasswordReset
      summary: Issue a one-time password-reset claim for a human member.
      description: >
        #1767 / ADR-0128 D2. Owner or admin only. Hierarchy is judged in the
        same tenant transaction as the issue (route-layer admin check is not
        the authority): owner may reset any other human, including another
        owner (the multi-owner unlock path); admin may reset member and guest
        only. Self-reset is always 403 — use PATCH …/members/me/password.
        Mints a 32-byte token (same shape as owner_bootstrap), stores sha256
        only, TTL 24h, single use. Reissue consumes any previous live reset
        token for that member. The raw token is in this 201 body once — the
        operator delivers `/claim/<token>` out of band. There is no mailer.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "201":
          description: Reset token issued. Raw token is shown only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetClaimResponse"
        "400":
          description: Target is not a human member, or member id is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Workspace member not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Target member is not active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{workspaceId}/channels/{channelId}/members/me:
    delete:
      tags: [membership]
      operationId: leaveChannel
      summary: Leave a public or private channel.
      description: >
        Direct-message channels cannot be left. A private channel is archived
        atomically when its final active member leaves.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200": {description: Channel membership ended, content: {application/json: {schema: {$ref: "#/components/schemas/ChannelLeaveResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Direct-message leave is forbidden, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "404": {description: Active channel membership not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/channels/{channelId}/members/{memberId}/role:
    patch:
      tags: [membership-admin]
      operationId: changeChannelMemberRole
      summary: Change a channel role under workspace/channel admin hierarchy.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangeMembershipRoleRequest"}
      responses:
        "200":
          description: Channel role changed and audited.
          content: {application/json: {schema: {$ref: "#/components/schemas/MembershipRoleResponse"}}}
        "400": {description: Invalid role or identifier, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: Active channel membership not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/members/{memberId}/suspend:
    post:
      tags: [membership-admin]
      operationId: suspendWorkspaceMember
      summary: Suspend a member and revoke all of their tokens.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Member suspended, content: {application/json: {schema: {$ref: "#/components/schemas/MembershipLifecycleResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: Workspace member not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "409": {description: Invalid transition or last-owner invariant, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/members/{memberId}/reinstate:
    post:
      tags: [membership-admin]
      operationId: reinstateWorkspaceMember
      summary: Return a suspended member to active status.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Member reinstated; previously revoked tokens remain revoked, content: {application/json: {schema: {$ref: "#/components/schemas/MembershipLifecycleResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: Workspace member not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "409": {description: Member is not suspended, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/members/{memberId}:
    delete:
      tags: [membership-admin]
      operationId: removeWorkspaceMember
      summary: Remove a member while preserving authored message history.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RemoveWorkspaceMemberRequest"}
      responses:
        "200": {description: Memberships removed, status deleted, and tokens revoked, content: {application/json: {schema: {$ref: "#/components/schemas/MembershipLifecycleResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: Workspace member not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "409": {description: The member is the last active owner, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/bans:
    get:
      tags: [membership-admin]
      operationId: listWorkspaceBans
      summary: List the workspace ban ledger (admin only).
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/WorkspaceId"}]
      responses:
        "200": {description: Ban ledger, content: {application/json: {schema: {$ref: "#/components/schemas/WorkspaceBanListResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [membership-admin]
      operationId: createWorkspaceBan
      summary: Ban an email and/or handle from invite redemption and public join.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/WorkspaceId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CreateWorkspaceBanRequest"}}}
      responses:
        "201": {description: Ban created and audited, content: {application/json: {schema: {$ref: "#/components/schemas/WorkspaceBanResponse"}}}}
        "400": {description: Neither valid email nor handle supplied, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: A matching ban already exists, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/bans/{banId}:
    delete:
      tags: [membership-admin]
      operationId: deleteWorkspaceBan
      summary: Delete a workspace ban and permit future rejoin.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: banId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Deleted ban, content: {application/json: {schema: {$ref: "#/components/schemas/WorkspaceBanResponse"}}}}
        "400": {description: Invalid ban id, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: Ban not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/audit:
    get:
      tags: [membership-admin]
      operationId: listWorkspaceAudit
      summary: Read the tenant audit ledger (owner/admin only).
      description: >
        Stable newest-first keyset pagination over `(created_at, id)`. `actions`
        is a comma-separated list of action prefixes. The target member filter
        applies to `subject_member_id`; time bounds are inclusive epoch
        milliseconds. Snake-case filter aliases are canonical, with camelCase
        aliases accepted by the server.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: actions, in: query, schema: {type: string}, description: Comma-separated action prefixes.}
        - {name: target_member_id, in: query, schema: {type: string, format: uuid}}
        - {name: from_ms, in: query, schema: {type: integer, format: int64, minimum: 0}}
        - {name: to_ms, in: query, schema: {type: integer, format: int64, minimum: 0}}
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200": {description: Filtered audit page, content: {application/json: {schema: {$ref: "#/components/schemas/AuditPageResponse"}}}}
        "400": {description: Invalid filter or cursor, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/workspaces/{workspaceId}/agents:
    post:
      tags: [agents]
      operationId: createAgent
      summary: Create an active first-class agent member (workspace admin only).
      description: >
        Human owner/admin bearer only. The member(kind=agent), agent profile,
        and agent.created audit row commit in one tenant transaction. This
        operation intentionally creates no channel membership and issues no
        bearer credential. Pairing continues by calling the existing
        `POST /v1/workspaces/{workspaceId}/channels/{channelId}/members` and
        `POST /v1/workspaces/{workspaceId}/agents/{agentId}/credentials`
        routes. baseUrl never accepts userinfo/query/fragment credential
        material; non-loopback endpoints require HTTPS, while loopback HTTP
        requires the server's explicit local-only opt-in.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "201":
          description: Agent identity created without channel membership or credential issuance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAgentResponse"
        "400":
          description: Invalid identity, owner, endpoint, config, or credential-shaped input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not a human workspace owner/admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The normalized handle already exists in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/hosted-agent-connections:
    post:
      tags: [agents]
      operationId: createHostedAgentConnection
      summary: Create a dedicated paused hosted-agent identity and one-time pairing challenge.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/WorkspaceId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CreateHostedAgentConnectionRequest"}}}
      responses:
        "201":
          description: Dedicated identity and pairing challenge created atomically.
          headers:
            Cache-Control: {required: true, schema: {type: string, enum: [no-store]}}
            Pragma: {required: true, schema: {type: string, enum: [no-cache]}}
          content: {application/json: {schema: {$ref: "#/components/schemas/CreateHostedAgentConnectionResponse"}}}
        "400": {description: Invalid closed input, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Human workspace owner/admin required, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "409": {description: Handle already exists, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
    get:
      tags: [agents]
      operationId: listHostedAgentConnections
      summary: List bounded secret-free hosted connection metadata.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/WorkspaceId"}]
      responses:
        "200": {description: Hosted connections, content: {application/json: {schema: {$ref: "#/components/schemas/HostedAgentConnectionListResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Human workspace owner/admin required, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/hosted-agent-connections/{connectionId}:
    get:
      tags: [agents]
      operationId: getHostedAgentConnection
      summary: Get secret-free hosted connection metadata.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: connectionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Hosted connection, content: {application/json: {schema: {$ref: "#/components/schemas/HostedAgentConnectionResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Human workspace owner/admin required, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "404": {description: Hosted connection not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/hosted-agent-connections/{connectionId}/pairing-challenge/regenerate:
    post:
      tags: [agents]
      operationId: regenerateHostedAgentPairingChallenge
      summary: Invalidate prior material and return one replacement pairing challenge.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: connectionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Pairing challenge regenerated.
          headers:
            Cache-Control: {required: true, schema: {type: string, enum: [no-store]}}
            Pragma: {required: true, schema: {type: string, enum: [no-cache]}}
          content: {application/json: {schema: {$ref: "#/components/schemas/CreateHostedAgentConnectionResponse"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Human workspace owner/admin required, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "404": {description: Hosted connection not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "409": {description: Active connection cannot regenerate, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/hosted-agent-connections/{connectionId}/confirm:
    post:
      tags: [agents]
      operationId: confirmHostedAgentConnection
      summary: Approve exact channels/scopes and issue the one-time active Agent Port credential.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: connectionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ConfirmHostedAgentConnectionRequest"}}}
      responses:
        "201":
          description: Credential issued once; first valid foundation call proves binding and unpauses.
          headers:
            Cache-Control: {required: true, schema: {type: string, enum: [no-store]}}
            Pragma: {required: true, schema: {type: string, enum: [no-cache]}}
          content: {application/json: {schema: {$ref: "#/components/schemas/ConfirmHostedAgentConnectionResponse"}}}
        "400": {description: Invalid closed scopes/channels/auth mode, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Human workspace owner/admin required, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "404": {description: Hosted connection not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "409": {description: Connection has not been detected or was already confirmed, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/hosted-agent-connections/{connectionId}/disconnect:
    post:
      tags: [agents]
      operationId: disconnectHostedAgentConnection
      summary: Start an atomic hosted-agent disconnect and seed its cleanup manifest.
      description: >
        One tenant transaction: the connection's live bearer is revoked, the
        connection becomes `cleanup_pending`, the dedicated agent is paused,
        every open gateway job of that agent is settled with its lease released,
        and the per-kind cleanup manifest is seeded. A failure anywhere rolls the
        whole set back. The revoke is scoped to this connection, so a sibling
        hosted connection of the same workspace is never collateral. Retrying
        answers the same body with `startedNow: false` and writes nothing —
        including no second audit row. History (message, chat, audit, inbox) is
        preserved; nothing cascades.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: connectionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/DisconnectHostedAgentConnectionRequest"}}}
      responses:
        "200": {description: Disconnect started (or already pending), content: {application/json: {schema: {$ref: "#/components/schemas/DisconnectHostedAgentConnectionResponse"}}}}
        "400": {description: Invalid artifact kind or reference, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Human workspace owner/admin required, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "404": {description: Hosted connection not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "409": {description: Connection is already disconnected or was never credentialed, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/hosted-agent-connections/{connectionId}/disconnect/complete:
    post:
      tags: [agents]
      operationId: completeHostedAgentDisconnect
      summary: Transition a cleanup-confirmed connection to the terminal disconnected state.
      description: >
        Refused while any required artifact is unresolved, and refused unless
        this server can read back the local half it performed: zero live
        credentials on the connection and a paused dedicated agent. The
        transition happens at most once; a replay answers 200 with
        `disconnectedNow: false` and writes no audit row. The same two facts are
        asserted by a database trigger, so a writer that bypasses this operation
        still cannot mint a terminal state.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: connectionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Connection is disconnected, content: {application/json: {schema: {$ref: "#/components/schemas/CompleteHostedAgentDisconnectResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Human workspace owner/admin required, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "404": {description: Hosted connection not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "409": {description: Not awaiting cleanup, unresolved artifacts, or unconfirmed local revoke, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/hosted-agent-connections/{connectionId}/cleanup-artifacts/{artifactId}/acknowledge:
    post:
      tags: [agents]
      operationId: acknowledgeHostedCleanupArtifact
      summary: Record one cleanup observation, and optionally one resolution.
      description: >
        The manual half of cleanup confirmation. Provenance is server-derived —
        this operation writes `manual` and nothing else, so a client cannot
        promote its own claim to `server_verified`. Omitting `disposition`
        records only `currentStatus`, which is how an inactive routine stays
        unresolved. A resolution requires evidence and is not re-decidable.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: connectionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: artifactId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/AcknowledgeHostedCleanupArtifactRequest"}}}
      responses:
        "200": {description: Acknowledgement recorded, content: {application/json: {schema: {$ref: "#/components/schemas/AcknowledgeHostedCleanupArtifactResponse"}}}}
        "400": {description: Invalid status, illegal disposition for the kind, or missing evidence, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Human workspace owner/admin required, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "404": {description: Cleanup artifact not found on this connection, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "409": {description: Connection is not awaiting cleanup, or the artifact is already resolved, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/hosted-agent-connections/{connectionId}/doorbell:
    put:
      tags: [agents]
      operationId: registerHostedAgentDoorbell
      summary: Register or replace a hosted-connection doorbell (ADR-0171).
      description: >
        Tenant-scoped. Stores `doorbellUrl` plus an AEAD-sealed Bearer.
        Responses never echo the secret (mask only). Closed unless
        `MOMO_DOORBELL_ENABLED` is the exact lowercase word `true` — otherwise
        this path answers empty 404, the same as an unknown route.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: connectionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RegisterHostedDoorbellRequest"}}}
      responses:
        "200":
          description: Doorbell registered. Secret is write-only.
          headers:
            Cache-Control: {required: true, schema: {type: string, enum: [no-store]}}
            Pragma: {required: true, schema: {type: string, enum: [no-cache]}}
          content: {application/json: {schema: {$ref: "#/components/schemas/HostedDoorbellResponse"}}}
        "400": {description: Invalid URL (HTTPS/OutboundHTTPPolicy) or empty secret, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Human workspace owner/admin required, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "404": {description: Gate closed, connection missing, or unknown path, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "409": {description: Connection is not active, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
    delete:
      tags: [agents]
      operationId: unregisterHostedAgentDoorbell
      summary: Remove a hosted-connection doorbell registration (ADR-0171).
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: connectionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Doorbell unregistered.
          headers:
            Cache-Control: {required: true, schema: {type: string, enum: [no-store]}}
            Pragma: {required: true, schema: {type: string, enum: [no-cache]}}
          content: {application/json: {schema: {$ref: "#/components/schemas/HostedDoorbellResponse"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Human workspace owner/admin required, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "404": {description: Gate closed, doorbell missing, or unknown path}

  /v1/workspaces/{workspaceId}/agents/{agentId}/credentials:
    post:
      tags: [agents]
      operationId: createAgentCredential
      summary: Issue or rotate a generic per-agent bearer (workspace owner/admin only).
      description: >
        Returns the raw bearer exactly once while persisting only its SHA-256
        digest. Every currently live predecessor is shortened to at most the
        requested rotation grace; concurrent rotations serialize so only the
        final successor keeps its requested lifetime. The response is always
        `Cache-Control: no-store` and `Pragma: no-cache`. Agent Port reach/read
        scopes and `messages:read` are grantable only when explicitly named,
        never defaults. `provider:quota:write` additionally requires an
        instance operator. HAP-E3 reserves 409 for a dedicated hosted agent
        whose credentials are connection-managed.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: agentId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateAgentCredentialRequest"}
      responses:
        "201":
          description: Credential issued; the bearer appears only in this response.
          headers:
            Cache-Control:
              required: true
              schema: {type: string, enum: [no-store]}
            Pragma:
              required: true
              schema: {type: string, enum: [no-cache]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreateAgentCredentialResponse"}
        "400": {description: Invalid scope, label, expiry, or rotation grace, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller is not a human workspace owner/admin or lacks instance-operator authority, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "404": {description: Active target agent not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "409": {description: Dedicated hosted-agent credentials are connection-managed, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
    get:
      tags: [agents]
      operationId: listAgentCredentials
      summary: List generic agent credential metadata (workspace owner/admin only).
      description: >
        Newest-first bounded metadata projection. Raw bearer material, token
        hashes, and envelope prefixes are never projected.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: agentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Credential metadata, content: {application/json: {schema: {$ref: "#/components/schemas/AgentCredentialListResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller is not a human workspace owner/admin, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "404": {description: Active target agent not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/agents/{agentId}/credentials/{credentialId}/revoke:
    post:
      tags: [agents]
      operationId: revokeAgentCredential
      summary: Idempotently revoke a generic per-agent bearer.
      description: >
        The first call writes the revocation and its audit row in one tenant
        transaction. Replays return 200 with `alreadyRevoked=true` and do not
        append another revoke audit. Foreign agent/credential pairs are not
        distinguishable from a missing credential. HAP-E3 reserves 409 for a
        dedicated hosted agent whose credentials are connection-managed.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: agentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: credentialId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RevokeAgentCredentialRequest"}
      responses:
        "200": {description: Current credential state and whether this call revoked it, content: {application/json: {schema: {$ref: "#/components/schemas/RevokeAgentCredentialResponse"}}}}
        "400": {description: Invalid id or reason metadata, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller is not a human workspace owner/admin, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "404": {description: Agent credential not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "409": {description: Dedicated hosted-agent credentials are connection-managed, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/agents/{agentId}/allowed-models:
    get:
      tags: [agents]
      operationId: getAgentAllowedModels
      summary: Read one agent's effective workspace model allow-list.
      description: >
        Any active workspace member may read this credential-free projection.
        The response is the agent's own model plus
        workspace.settings.allowed_agent_models; it deliberately does not
        expose the workspace settings object or agent profile fields.

        When workspace.settings carries no allowed_agent_models key at all AND
        the agent's own model is one of the measured provider-catalog ids also
        served by GET /v1/provider/effort-table under provider `openai-codex`,
        the answer additionally contains that catalog (SRV-B3). An unconfigured
        workspace is the absence of a configuration surface — nothing on this
        API writes workspace.settings — rather than a narrowing anyone chose,
        and the agent's own model is the evidence of which upstream this
        instance reaches. A workspace that HAS configured the key, including an
        explicit empty list, gets exactly agent.model plus what it configured;
        a gateway-handle model (hermes-*) is never widened.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: agentId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Deterministic effective model names for this agent.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AllowedAgentModelsResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: Active agent not found.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /v1/workspaces/{workspaceId}/agents/{agentId}/runs:
    get:
      tags: [agents]
      operationId: listAgentRuns
      summary: List one agent's workspace-global run history.
      description: >
        Human active workspace members receive a newest-first keyset page of
        this agent's runs, restricted to channels where the caller has active
        membership. The UUID cursor identifies the final `(created_at, id)`
        row from the previous page. Each item is a bounded, credential-free
        summary shared with the channel run-list projection; input/output/error,
        gateway payloads, and full transcripts remain available only through
        the existing authorized run-detail surface.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: agentId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: cursor
          in: query
          schema: {type: string, format: uuid}
          description: Run ID at the exclusive older-page boundary.
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: Visible run summaries ordered by created time and ID descending.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentRunSummaryPage"}
        "400":
          description: Malformed or inaccessible cursor.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Caller is not an active human workspace member.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: Active agent not found in this workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /v1/workspaces/{workspaceId}/agents/{agentId}/profile:
    get:
      tags: [agents]
      operationId: getAgentProfile
      summary: Read an agent's credential-free native profile.
      description: Human workspace owner/admin or the agent's active human owner only.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: agentId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Current profile ledger projection.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentProfileResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: Active agent or profile not found.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
    put:
      tags: [agents]
      operationId: putAgentProfile
      summary: Create or replace an agent profile and increment its version.
      description: >
        Human workspace owner/admin or agent owner only. instructions are
        limited to 8192 bytes; credential-shaped fields are rejected.
        enabledTools only narrows existing grants. mention=true is fixed and
        schedule is reserved data with no v0 executor. modelPref must be inside
        workspace.settings.allowed_agent_models or equal to the agent's own model
        (ADR-0131 D2); an explicit write of anything else is a 400, while a value
        stored before the allow-list narrowed is still read back unchanged and
        stays a silent run-time ignore.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: agentId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AgentProfileInput"}
      responses:
        "200":
          description: Upserted profile with monotonically incremented version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentProfileResponse"}
        "400":
          description: >
            Invalid profile, trigger, tool name, credential-shaped field, or a
            modelPref outside workspace.settings.allowed_agent_models.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: Active agent not found.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /v1/workspaces/{workspaceId}/agents/{agentId}/pause:
    put:
      tags: [agents]
      operationId: putAgentPause
      summary: Pause or resume new run enqueue for an agent.
      description: >
        ADR-0132 D2. Human workspace owner/admin or the agent's active human
        owner only. Pausing does not remove membership or cancel an existing
        run; existing runs use the separate human cancel endpoint.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: agentId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AgentPauseInput"}
      responses:
        "200":
          description: Current profile projection including the pause state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentProfileResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: Active agent not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/agent-runs/{runId}/cancel:
    post:
      tags: [agents]
      operationId: cancelAgentRun
      summary: Cancel one agent run as a human channel member.
      description: >
        ADR-0132 D1. Any active human member of the run's channel may cancel —
        channel membership, not workspace ownership, is the authorization.
        Agent and work-host bearers are rejected. The server atomically marks
        the run cancelled, retires pending agent jobs, cancels pending
        approvals, writes an audit event and a channel system line, and returns
        linked work-session IDs. Linked work sessions are not terminated;
        callers must use the existing work.control kill path separately.
        Cancelling an already-cancelled run answers 200 with the same body and
        writes nothing: no second system line and no second audit row.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: runId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Run is cancelled; repeated cancellation is idempotent.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentRunCancelResponse"}
        "400": {description: Malformed workspace or run identifier, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Active human channel membership required, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "404": {description: Agent run not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "409": {description: Run is already terminal in a non-cancelled state, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/agents/from-card:
    post:
      tags: [agents]
      operationId: registerAgentFromCard
      summary: Fetch an A2A v0.3 Agent Card for administrator consent.
      description: >
        Human workspace owner/admin only. The server fetches
        `/.well-known/agent-card.json` with a five-second timeout, a 256KB
        response limit, at most two manually validated redirects, and DNS/IP
        SSRF checks on every hop. HTTPS is required except for an explicit
        local-development opt-in. A successful parse stores public card
        provenance and display-only security requirements with
        status=pending_consent; failures persist nothing. Provider credentials
        and secret-shaped card fields are rejected.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterAgentCardRequest"}
      responses:
        "201":
          description: Public card metadata is pending administrator consent.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentCardRegistrationResponse"}
        "400":
          description: Unsafe URL, failed fetch, redirect violation, oversize response, or invalid card.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/agents/from-card/{registrationId}/confirm:
    post:
      tags: [agents]
      operationId: confirmAgentFromCard
      summary: Confirm a pending Agent Card and issue its first gateway bearer.
      description: >
        Human workspace owner/admin only. The member(kind=agent), agent row,
        workspace membership, one-time per-agent gateway bearer digest,
        registration transition, and audit rows commit in one tenant
        transaction. The raw bearer is returned once with no-store headers;
        no card-provided credential is accepted or persisted.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: registrationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "201":
          description: Agent member and initial gateway credential created atomically.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConfirmAgentCardResponse"}
        "400":
          description: Invalid registration identifier.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: Pending registration not found in this workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "409":
          description: Registration was already confirmed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/channels:
    get:
      tags: [channels]
      operationId: listChannels
      summary: List channels the authenticated member belongs to.
      description: >
        Returns public/private/dm channels where the caller has an active
        membership, ordered public -> private -> dm, then by name.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: include_archived
          in: query
          required: false
          description: Include archived channels when `true`. CamelCase alias accepted by the server, `includeArchived`.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          description: Page size, clamped to 1..500.
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Channels visible to the member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceChannelsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [channels]
      operationId: createChannel
      summary: Create a public/private channel (workspace admin only).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "201":
          description: Channel created with the creator as channel owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateChannelResponse"
        "400":
          description: Invalid kind/name/topic shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not a workspace owner/admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Channel name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/channels/{channelId}/notification-pref:
    put:
      tags: [channels]
      operationId: updateChannelNotificationPref
      summary: Mute or unmute push notifications for one channel.
      description: >
        Active channel members only. `muted: true` stores an indefinite mute;
        `muted: false` deletes the preference. Mute suppresses every push
        reason, including mentions and approval requests, without changing
        unread/read-state.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationPrefRequest"
      responses:
        "200":
          description: The effective channel mute state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPrefResponse"
        "400":
          description: Invalid request body or identifiers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Active channel membership required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/notification-rules:
    get:
      tags: [channels]
      operationId: getNotificationRules
      summary: Read the caller's member-global notification rules.
      description: >
        ADR-0124 증보 1. The signed-in member's own rules (never a memberId from
        the request). No stored row answers as both switches off. `dnd` suppresses
        every push for this member across the workspace; `mentionOverridesMute`
        lets a mention through a channel this member muted in 018.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: The caller's effective notification rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRulesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Active human membership required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      tags: [channels]
      operationId: updateNotificationRules
      summary: Replace the caller's member-global notification rules.
      description: >
        ADR-0124 증보 1. Replaces both switches at once; a body with an unknown
        field is a 400. `dnd` sits above channel mute and the mention exception
        (pause-everything means everything); `mentionOverridesMute` only affects
        `reason=mention`, so a muted channel still stays silent for DMs and
        approval requests. Unread/read-state is untouched.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationRulesRequest"
      responses:
        "200":
          description: The stored notification rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRulesResponse"
        "400":
          description: Invalid or unknown request field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Active human membership required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/members/me/sidebar-prefs:
    get:
      tags: [sidebar]
      operationId: getSidebarPrefs
      summary: Read the caller's own sidebar organization.
      description: >
        ADR-0177 D1/D2. The signed-in member's custom sidebar sections, the
        channels they placed in each, and their starred channels — never a
        memberId from the request. A member who has never saved reads the empty
        v1 default (`{version:1, sections:[], starredChannelIds:[]}`) rather than
        a 404, so the client bootstraps down one path. Human-only: an agent has
        no sidebar. Collapse state is NOT here — ADR-0177 D4 keeps it on the
        device.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: The caller's stored sidebar prefs, or the empty v1 default.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SidebarPrefsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Active human membership required (agent bearers are refused).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      tags: [sidebar]
      operationId: updateSidebarPrefs
      summary: Replace the caller's own sidebar organization.
      description: >
        ADR-0177 D3. Replaces the whole payload; this is not a patch. The server
        validates shape and size only — at most 50 sections, section names at
        most 80 **characters**, at most 500 channel references across the whole
        payload, and `version` must be 1. Channel membership is deliberately NOT
        verified: a section may name a channel the member has left or one that
        was deleted, and the client filters dead ids at render time (tolerant
        contract, ADR-0177 D3). No event is emitted (D2) — other devices
        converge on their next bootstrap GET.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSidebarPrefsRequest"
      responses:
        "200":
          description: The stored sidebar prefs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SidebarPrefsResponse"
        "400":
          description: A cap or the payload version was violated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Active human membership required (agent bearers are refused).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The body is not a sidebar-prefs payload (unknown or missing key).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/reminders:
    post:
      tags: [reminders]
      operationId: createMessageReminder
      summary: Create a personal reminder on a channel message.
      description: >
        ADR-0175 / #1888. Human bearer only. The target message must live in
        `channelId` and the caller must be a current channel member. `dueAtMs`
        in the past is 400. v1 does not emit outbox — expiry is a client poll.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReminderRequest"
      responses:
        "201":
          description: Reminder stored and audited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResponse"
        "400":
          description: Invalid body, unknown field, or dueAtMs not in the future.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Agent bearer, inactive membership, or not a channel member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Message not found in the named channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      tags: [reminders]
      operationId: listMessageReminders
      summary: List the caller's own reminders, soonest due first.
      description: >
        Owner-scoped. `state=pending` (default) hides completed rows; `state=all`
        returns both. Keyset pagination over `(due_at, id)` via `cursor` =
        the previous page's last reminder id.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: state
          in: query
          schema:
            type: string
            enum: [pending, all]
            default: pending
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The caller's reminder page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListResponse"
        "400":
          description: Invalid state or cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Agent bearer or inactive membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/reminders/{reminderId}:
    patch:
      tags: [reminders]
      operationId: updateMessageReminder
      summary: Snooze a reminder or mark it complete.
      description: >
        Body is `{dueAtMs}` (snooze) or `{completed: true}`. Both, neither, or
        `completed: false` is 400. Snoozing a completed row is 409. A reminder
        that is not the caller's answers 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: reminderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReminderRequest"
      responses:
        "200":
          description: Updated reminder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResponse"
        "400":
          description: Invalid body, unknown field, or dueAtMs not in the future.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Agent bearer or inactive membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reminder not found for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Completed reminder cannot be rescheduled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [reminders]
      operationId: deleteMessageReminder
      summary: Delete the caller's reminder.
      description: Owner only. A reminder that is not the caller's answers 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: reminderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Reminder deleted and audited.
        "400":
          description: Invalid reminder id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Agent bearer or inactive membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reminder not found for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/channels/{channelId}/huddles:
    post:
      tags: [huddles]
      operationId: startHuddle
      summary: Start the channel huddle, or return the existing active huddle.
      description: Lifecycle, audit, and realtime event outbox commit in one tenant transaction.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: An active huddle already existed (idempotent replay).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HuddleResponse"
        "201":
          description: Huddle created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HuddleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HuddleNotConfigured"

  /v1/workspaces/{workspaceId}/channels/{channelId}/huddles/active:
    get:
      tags: [huddles]
      operationId: getActiveHuddle
      summary: Get the active huddle and current participants for a channel badge.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: Active huddle when present; otherwise the optional field is omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveHuddleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HuddleNotConfigured"

  /v1/workspaces/{workspaceId}/huddles/{huddleId}/join:
    post:
      tags: [huddles]
      operationId: joinHuddle
      summary: Join or reissue a 10-minute LiveKit room grant.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/HuddleId"
      responses:
        "200":
          description: Current presence plus a freshly issued LiveKit access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinHuddleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Huddle ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/HuddleNotConfigured"

  /v1/workspaces/{workspaceId}/huddles/{huddleId}/leave:
    post:
      tags: [huddles]
      operationId: leaveHuddle
      summary: Leave a huddle; the last participant atomically ends it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/HuddleId"
      responses:
        "200":
          description: Updated huddle and whether this leave ended it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveHuddleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Caller has no current presence to leave.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/HuddleNotConfigured"

  /v1/workspaces/{workspaceId}/huddles/{huddleId}/recording-consent:
    post:
      tags: [huddles]
      operationId: consentToHuddleRecording
      summary: Record the caller's explicit consent to recording and post-call transcription.
      description: >
        Idempotently records notice version 1. This endpoint does not start
        recording; the caller may leave instead of consenting.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/HuddleId"
      responses:
        "200":
          description: Consent receipt, including the original consent timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HuddleRecordingConsentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Huddle ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/HuddleNotConfigured"

  /v1/workspaces/{workspaceId}/huddles/{huddleId}/recordings:
    post:
      tags: [huddles]
      operationId: startHuddleRecording
      summary: Request participant-track recording after every active participant consents.
      description: >
        Fails closed unless every current participant has a consent receipt.
        The transaction appends a channel system notice and a recording request.
        A recorded huddle rejects later joins that lack prior consent.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/HuddleId"
      responses:
        "200":
          description: Existing idempotent recording request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HuddleRecordingResponse"
        "201":
          description: Recording request and channel notice committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HuddleRecordingResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Huddle ended or at least one active participant has not consented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: LiveKit or transcription model is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{workspaceId}/work-hosts:
    post:
      tags: [work-hosts]
      operationId: registerWorkHost
      summary: Register an execution host for a member or workspace.
      description: >
        Human bearer only. Any active workspace member may register either
        scope; ownerMemberId is always the registering member. The row and
        work.host.registered audit event commit in one tenant transaction.
        Capabilities are boolean tool-availability flags only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWorkHostRequest"
      responses:
        "201":
          description: Host registered offline until its first signed heartbeat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkHostResponse"
        "400":
          description: Invalid scope, type, display name, public key, or capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Agent bearer, workspace mismatch, or inactive membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      tags: [work-hosts]
      operationId: listWorkHosts
      summary: List registered and revoked hosts in the workspace.
      description: >
        Human members poll this v0 projection. Online is server-computed from
        the signed lastSeenAtMs window and is always false for revoked hosts.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Hosts ordered oldest-first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkHostListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-hosts/cloud:
    post:
      tags: [work-hosts]
      operationId: provisionCloudWorkHost
      summary: Explicitly provision one paid oort Cloud host on the configured provider.
      description: >
        Human bearer only. Requires confirmPaidCloud=true, positive workspace
        credit, an available work-pool slot, and a managed provider adapter
        configured on this instance (ADR-0142 D2). Returns 202 while the cloud
        workd is consuming its one-shot bootstrap token and 201 if registration
        completed before create returned. An instance whose provider is the
        degenerate BYOC adapter answers 409 and points at the enrollment path
        below rather than pretending it can create hosts.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCloudHostRequest"
      responses:
        "201":
          description: Provider instance and cloud work host are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudHostResponse"
        "202":
          description: Provider instance exists; cloud workd registration is pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudHostResponse"
        "400":
          description: Paid-cloud confirmation missing or body invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Workspace credit or work-pool slot is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Provider concurrency limit reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Provider adapter config is absent or the provider failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{workspaceId}/work-hosts/byoc/enrollments:
    post:
      tags: [work-hosts]
      operationId: enrollBYOCWorkHost
      summary: Issue a one-shot token so a host the workspace already owns can enroll.
      description: >
        ADR-0142 D1. The base acquisition path: a workspace admin installs
        `momo-workd` on their own VM and spends this token at the cloud
        register endpoint. oort never creates or destroys a BYOC host — its
        lifetime belongs to its owner — but scheduling, observation and billing
        are identical to a managed host. Workspace-shared hosts only; a
        `scope` other than `workspace` is refused by name. The token is
        returned exactly once: only its SHA-256 digest reaches storage, so a
        replayed idempotencyRef answers 409 rather than re-revealing it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollBYOCHostRequest"
      responses:
        "201":
          description: Enrollment token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BYOCEnrollmentResponse"
        "400":
          description: Personal scope requested or body invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only a workspace admin or owner may enroll a host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This idempotencyRef already revealed its token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: T3 is disabled or the BYOC adapter is not installed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/workspaces/{workspaceId}/credits/topups:
    post:
      tags: [work-hosts]
      operationId: topupCloudCredit
      summary: Append one idempotent positive workspace credit topup.
      description: >
        Paid-credit writer only: a human token carrying
        platform:credits:write. platform:read and verified allowlist identity
        alone are insufficient. The credit entry, balance trigger, and audit
        row commit in one transaction.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudCreditTopupRequest"
      responses:
        "200":
          description: Topup applied, or the identical idempotent result replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudCreditTopupResponse"
        "400":
          description: Amount or idempotency reference is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The reference was previously used with another amount.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{workspaceId}/work-hosts/cloud/register:
    post:
      tags: [work-hosts]
      operationId: registerCloudWorkHost
      summary: Consume a one-shot bootstrap token and self-register cloud workd.
      description: >
        Cloud workd only, on either acquisition path (managed provider or
        BYOC). Authorization uses `MomoBootstrap {token}`. The server stores
        only the token SHA-256 digest and the workd-generated Ed25519 public
        key; the provider operator key and the workd private key never enter
        this API.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            pattern: "^MomoBootstrap "
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWorkHostRequest"
      responses:
        "201":
          description: Cloud workd registered as a workspace-scoped work_host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkHostResponse"
        "400":
          description: Registration is not scope=workspace and type=cloud.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/workspaces/{workspaceId}/work-hosts/cloud/{provisionId}:
    get:
      tags: [work-hosts]
      operationId: getCloudWorkHostProvision
      summary: Read safe cloud provisioning state without provider credentials.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: provisionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current safe cloud host projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudHostResponse"
        "404":
          description: Provision request not found in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{workspaceId}/work-hosts/{workHostId}/cloud/pause:
    post:
      tags: [work-hosts]
      operationId: pauseCloudWorkHost
      summary: Pause the provider instance and open a zero-active-seconds pause interval.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkHostId"
      responses:
        "200":
          description: Cloud host paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudHostResponse"
        "409":
          description: Host is not running or its usage state changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Provider lifecycle request failed or is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{workspaceId}/work-hosts/{workHostId}/cloud/resume:
    post:
      tags: [work-hosts]
      operationId: resumeCloudWorkHost
      summary: Resume the provider instance and start a new active-time interval.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkHostId"
      responses:
        "200":
          description: Cloud host resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudHostResponse"
        "409":
          description: Host is not paused or its usage state changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Provider lifecycle request failed or is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{workspaceId}/work-hosts/{workHostId}/cloud:
    delete:
      tags: [work-hosts]
      operationId: destroyCloudWorkHost
      summary: Destroy a settled provider instance and revoke its work_host.
      description: Running/unsettled sessions must be ended first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkHostId"
      responses:
        "200":
          description: Cloud host destroyed and its work_host revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudHostResponse"
        "409":
          description: Host is not ready or still has unsettled usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Provider lifecycle request failed or is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{workspaceId}/work-hosts/{workHostId}/heartbeat:
    post:
      tags: [work-hosts]
      operationId: heartbeatWorkHost
      summary: Refresh host liveness with an Ed25519 signature.
      description: >
        Public signature-authenticated endpoint. The host signs the exact UTF-8
        bytes `momo.work_host.heartbeat.v1\\n<lowercase workspace UUID>\\n<lowercase
        host UUID>\\n<sentAtMs>`. Timestamps outside the five-minute clock-skew
        window, forged signatures, unknown hosts, and revoked hosts return 401.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkHostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkHostHeartbeatRequest"
      responses:
        "200":
          description: Host liveness refreshed with server time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkHostResponse"
        "400":
          description: Invalid path identifiers or request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-hosts/{workHostId}/pending-controls:
    get:
      tags: [work-hosts, work-controls]
      operationId: listPendingWorkHostControls
      summary: Poll dispatched controls targeted at this execution host.
      description: >
        ADR-0125 D2 outbound-only transport. The host signs the exact UTF-8
        bytes `momo.work_host.request.v2\nGET\n<path>\n<lowercase workspace
        UUID>\n<lowercase host UUID>\n<sentAtMs>\n<SHA-256(raw empty body),
        lowercase hex>\n<lowercase request UUID>` with its registered Ed25519
        key. The request UUID is consumed atomically once and retained for ten
        minutes. Only unrevoked status=dispatched controls targeted at that
        host are returned; no human or agent bearer is accepted.
      security:
        - workHostAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkHostId"
        - $ref: "#/components/parameters/WorkHostSentAt"
        - $ref: "#/components/parameters/WorkHostSignature"
        - $ref: "#/components/parameters/WorkHostRequestId"
      responses:
        "200":
          description: Bounded oldest-first dispatched controls for this host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingWorkControlsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-hosts/{workHostId}/live-sessions:
    get:
      tags: [work-hosts, work-sessions]
      operationId: listWorkHostLiveSessions
      summary: Host-signed view of this host's running/idle sessions.
      description: >
        Signature-authenticated (momo.work_host.request.v2). A restarting
        daemon asks the ledger which sessions it is still expected to serve
        before deciding what it can revive (MOMO-656).
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkHostId"
      responses:
        "200":
          description: Sessions the ledger still attributes to this host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkHostLiveSessionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-hosts/{workHostId}/reconcile:
    post:
      tags: [work-hosts, work-sessions]
      operationId: reconcileWorkHostSessions
      summary: Host-signed report of sessions it cannot revive.
      description: >
        Signature-authenticated (momo.work_host.request.v2). Stamps
        host_lost_at on the named sessions so the existing offline sweep
        owns the orphaned transition, resume card, and lineage — the fast
        restart case where heartbeats never lapsed (MOMO-656). Performs no
        lifecycle transition of its own.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkHostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkHostReconcileRequest"
      responses:
        "200":
          description: Sessions accepted for sweep-owned orphaning.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkHostReconcileResponse"
        "400":
          description: Malformed report (over 200 entries or bad UUIDs).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-hosts/{workHostId}/terminal-attach/validate:
    post:
      tags: [work-hosts, work-sessions]
      operationId: validateTerminalAttachCapability
      summary: Validate a direct terminal attach capability as its target host.
      description: >
        MomoHost-signed control-plane check performed immediately before the
        direct PTY host accepts a client connection. The opaque bearer is
        matched by SHA-256 digest; the raw token is never persisted or logged.
        Validation joins the running-or-idle work_session and unrevoked work_host on
        every call, so expiry, session end, and host revoke take effect
        immediately. The returned mode is authoritative: observer connections
        may receive output but the host must reject send_stdin, resize, and kill.
        The host also calls this on a timer for every stream it is already
        serving (`stream: true`), which is what makes a revoke reach a socket
        that is already open. This endpoint returns binding metadata only:
        terminal bytes never traverse MomoServer, OutboxRelay, or Centrifugo.
      security:
        - workHostAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkHostId"
        - $ref: "#/components/parameters/WorkHostSentAt"
        - $ref: "#/components/parameters/WorkHostSignature"
        - $ref: "#/components/parameters/WorkHostRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateTerminalAttachRequest"
      responses:
        "200":
          description: Capability is live and bound to this host and PTY.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalAttachValidationResponse"
        "400":
          description: Invalid path identifier or request body shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid host signature or unknown, expired, ended, or revoked capability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: A human or agent bearer attempted host-side validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-hosts/{workHostId}:
    delete:
      tags: [work-hosts]
      operationId: revokeWorkHost
      summary: Revoke a host and block future control dispatch.
      description: >
        The registering owner or a workspace owner/admin may revoke. Revocation
        is durable and audited in the same tenant transaction; pending approval
        controls can no longer dispatch and settle failed with host_revoked.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkHostId"
      responses:
        "200":
          description: Revoked host projection; repeat revoke is idempotent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkHostResponse"
        "400":
          description: Invalid host identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is neither the registering owner nor workspace admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Host does not exist in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-pool:
    get:
      tags: [work-pool]
      operationId: getWorkPool
      summary: Read workspace work-pool settings and current derived usage.
      description: >
        Available to active human workspace members. Usage is counted from
        running-or-idle work_session rows; no mutable active counter exists. A missing
        settings row is created with v0 defaults in the same tenant transaction.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Pool settings, workspace usage, and caller usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkPoolResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Active human workspace membership required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      tags: [work-pool]
      operationId: updateWorkPool
      summary: Replace workspace work-pool settings as an owner or admin.
      description: >
        The settings update and work.pool.updated audit row commit in the same
        tenant transaction. Lowering a cap does not preempt running sessions;
        subsequent creates remain rejected until derived usage is below it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkPoolRequest"
      responses:
        "200":
          description: Updated settings and current derived usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkPoolResponse"
        "400":
          description: Invalid cap, included hours, or per-member soft limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Workspace owner or admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-sessions:
    post:
      tags: [work-sessions]
      operationId: createWorkSession
      summary: Create a running host session and its channel thread-root card.
      description: >
        The work_session row, authoritative message seq, system card,
        message.new outbox, and no-version work.session.started outbox commit in
        one tenant transaction. Host-local cwd/path/process and credentials are
        deliberately absent.
      security:
        - bearerAuth: []
        - workHostAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkSessionRequest"
      responses:
        "201":
          description: Session ledger row and channel card created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSessionResponse"
        "400":
          description: Invalid identifiers, tool, or label.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Active channel membership required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            No session was created. error.message is the stable machine-readable
            reason pool_exhausted or member_limit. v0 does not enqueue or emit an
            outbox event; automatic queue start and waiting-card UX are follow-ups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      tags: [work-sessions]
      operationId: listWorkSessions
      summary: List sessions in channels visible to the authenticated member.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: active
          in: query
          required: false
          description: Set to 1 to return running or idle sessions; 0 or omitted returns all.
          schema:
            type: integer
            enum: [0, 1]
      responses:
        "200":
          description: Sessions ordered newest-first, bounded to 200 rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSessionListResponse"
        "400":
          description: Invalid active filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/workstreams:
    get:
      tags: [workstreams]
      operationId: listWorkstreams
      summary: List workstreams anchored in channels the caller belongs to.
      description: >
        ADR-0143 D3 visibility is channel membership; no workstream-level ACL
        exists. sessionId narrows the list to the workstream a given Run belongs
        to, which is how a client resolves a session to its goal layer without
        widening the work session projection.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, paused, done, cancelled]
        - name: channelId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: sessionId
          in: query
          required: false
          description: Return only the workstream that owns this work session.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Workstreams ordered newest-first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkstreamListResponse"
        "400":
          description: Invalid status, channelId, sessionId, or limit filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A work host signature cannot read the goal layer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/workstreams/{workstreamId}:
    get:
      tags: [workstreams]
      operationId: getWorkstream
      summary: Read one workstream anchored in a channel the caller belongs to.
      description: >
        A workstream outside the caller's channels answers 404, not 403, so this
        route cannot be used to probe for the existence of other people's work.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkstreamId"
      responses:
        "200":
          description: Workstream projection with Run counters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkstreamResponse"
        "400":
          description: Invalid workstream id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A work host signature cannot read the goal layer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such workstream, or it is anchored outside the caller's channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/workstreams/{workstreamId}/runs:
    get:
      tags: [workstreams]
      operationId: listWorkstreamRuns
      summary: List the Runs of a workstream oldest-first.
      description: >
        ADR-0143 D2 execution history. Every Run keeps the member that executed
        it, so a workstream continued by a second member lists both. Host-local
        state (pty id, attach endpoint, cwd) is deliberately unprojected.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkstreamId"
      responses:
        "200":
          description: Runs ordered oldest-first, bounded to 200 rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkstreamRunListResponse"
        "400":
          description: Invalid workstream id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A work host signature cannot read the goal layer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such workstream, or it is anchored outside the caller's channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-tier-policy:
