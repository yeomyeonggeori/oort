  /v1/workspaces/{workspaceId}/work-sessions/{workSessionId}:
    patch:
      tags: [work-sessions]
      operationId: updateWorkSession
      summary: Report tool lifecycle, end a live session, change observation, or relay an ACP event.
      description: >
        A MomoHost-signed execution host bound to the session reports
        running-to-idle with the last tool exitCode and idle-to-running without
        replacing the session. The corresponding realtime frames are
        work.session.idle with payload keys session_id, channel_id,
        root_message_id, member_id, host_id, status, idle_at, exit_code, and
        work.session.resumed-to-running with the same identity/status fields
        plus resumed_at and the preserved exit_code. Idle also commits one
        system thread message ("작업 완료 — idle 대기") so NotifierWorker can
        notify only the owner through the existing id-only push envelope. When
        the bound host is an oort Cloud host whose adapter declares pause
        support, running-to-idle also pauses its provider instance and opens a
        zero-active-seconds paused interval; idle-to-running resumes it before
        reopening active usage. An adapter that declares no pause is skipped
        rather than faked. A provider-confirmed missing
        instance closes usage, destroys and revokes the cloud host, and schedules
        the existing offline sweep to publish the orphaned lifecycle.
        The creating member, or the bound host, may explicitly end a running
        or idle session. The ledger row and card props update beside a
        no-version work.session.ended outbox. A human session owner may instead set
        observation to open or owner_only; owner_only invalidates live observer
        grants and blocks new ones. A MomoHost-signed caller may alternatively
        append one bounded normalized ACP event to the session thread ledger;
        the message row and message.new plus ACP realtime outbox projections
        commit atomically. Raw ACP metadata and terminal streams are forbidden.
        A MomoHost-signed caller may also publish its direct PTY attach binding
        (ptyId + attachEndpoint) onto its own running or idle session exactly
        once; the same call with a different binding is 409.
      security:
        - bearerAuth: []
        - workHostAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkSessionRequest"
      responses:
        "200":
          description: Updated session, or its prior result on an idempotent retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSessionResponse"
        "400":
          description: Invalid session id, status, or body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not the owner or no longer belongs to the channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session does not exist in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session state changed concurrently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: The bound oort Cloud sandbox no longer exists; orphaned fallback is scheduled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: The oort Cloud provisioner is unavailable; non-cloud hosts do not use it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{workspaceId}/work-sessions/{workSessionId}/resume:
    post:
      tags: [work-sessions]
      operationId: resumeWorkSession
      summary: Resume an orphaned session on another registered host.
      description: >
        Human session owner only. The source becomes ended(resumed), while a
        new running work_session reuses the same root thread, records
        resumedFromSessionId, and emits the existing spawn dispatch in one
        tenant transaction. Host paths, credentials, and process state are not
        accepted or persisted.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeWorkSessionRequest"
      responses:
        "201":
          description: New running session with durable lineage and dispatched spawn control.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSessionResponse"
        "400":
          description: Invalid source session or target host identifier.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Caller is not an active member of the source session's anchor
            channel (ADR-0143 D3 — eligibility is channel membership, not the
            source member_id), or the target is a member-scoped work host owned
            by somebody else.
        "404":
          description: Source session does not exist in this workspace.
        "409":
          description: >
            Source is not orphaned, target host is revoked/unavailable/outside
            policy, target host is the source host, or the workspace/member pool
            has no available slot.

  /v1/workspaces/{workspaceId}/work-sessions/{workSessionId}/terminal-attach:
    post:
      tags: [work-sessions]
      operationId: issueTerminalAttachCapability
      summary: Issue an ephemeral capability for direct remote PTY attach.
      description: >
        Human bearer only. mode defaults to controller, which remains session
        owner-only. observer requires active workspace and session-channel
        membership while observation=open. The running or idle session must carry a
        MomoHost-signed remote PTY binding and its work_host must be unrevoked.
        The raw capability is returned exactly once, while PostgreSQL stores
        only its SHA-256 digest and timestamptz expiry. The same transaction
        audits only owner, mode, issue time, and expiry. Observer issuance also
        enqueues work.session.observer with a count-only projection.
        attach_endpoint contains no
        bearer or credential; the client connects there directly with the
        separate capability_token. MomoServer and relay expose no PTY stream.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkSessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueTerminalAttachRequest"
      responses:
        "200":
          description: Exact three-field direct attach grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalAttachCapabilityResponse"
        "400":
          description: Invalid work session identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an authorized active human/channel member, or observation is owner_only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session does not exist in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session ended, lacks a remote PTY binding, or host is revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-sessions/{workSessionId}/display-attach:
    post:
      tags: [work-sessions]
      operationId: issueDisplayAttachCapability
      summary: Issue an ephemeral capability for the session's live screen.
      description: >
        Human bearer only. ADR-0165 carries the live screen over WebRTC directly
        between the browser and the sandbox; this endpoint mints the 60-second
        bearer for that peer-to-peer handshake and nothing else.
        mode is observer or, since LIVE-3, controller. It still DEFAULTS to
        observer: taking control stops the agent, which is never what a client
        meant by saying nothing.
        observer requires active workspace and session-channel membership. Since
        LIVE-3 the session OWNER is exempt from the observation clause —
        owner_only means 소유자만 본다 (ADR-0004 증보 3), not 아무도 못 본다 —
        while a teammate is still refused 403 on a closed session.
        controller is the session owner and nobody else (증보 3 D1: control is a
        person's act on their own session), and it does three things at once:
        it mints a controller grant, it OPENS A CONTROL WINDOW in the
        display_control_window ledger (migration 076), and for as long as that
        window stands the agent's own path to this session is refused
        (POST /work-controls answers 409, and anything already dispatched is
        withheld from the host's pending-controls poll). That is 증보 3 D3's
        비관측 enforced rather than declared. The VM does not move: the session
        stays running and running-time billing continues (증보 3 D6).
        Both grades additionally require a running or idle session carrying a
        MomoHost-signed display binding, an unrevoked work_host, AND that host
        advertising capabilities.display_attach. That last clause is fail-closed
        and is what excludes BYOC hosts without any policy naming a provider.
        Since LIVE-5a a controller grant also FORCES observation to owner_only
        for as long as the window stands, and restores the owner's own setting
        when it closes — by return, by lease lapse, or with the session. A
        teammate's already-open stream stops validating within one
        re-validation period, because the validate join re-reads observation
        every time. The reason is the whole point of the window: a person is
        about to type a password, and 증보 3 D2 keeps that out of the
        transcript and the audit log while a teammate watching it frame by
        frame would undo all of it.
        display_endpoint is the HOST's own credential-free WebRTC signalling
        WebSocket; it contains no bearer, momo never proxies signalling or
        media, and no frame is stored anywhere. ice_servers is the one place
        momo touches the ICE negotiation: it mints a SHORT-LIVED credential for
        the oort-operated relay (ADR-0165 D3 — never a third party's), scoped to
        this work session, replacing the single shared password the relay
        shipped with. It is empty on an instance that was given no relay, which
        a client must treat as "use what you already have" rather than as an
        error. Nothing the person types during a control window enters this API,
        the transcript, the audit log or the Memory Plane (증보 3 D2) — the
        ledger records who, when and why it ended, and has no column that could
        hold a keystroke.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkSessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueDisplayAttachRequest"
      responses:
        "200":
          description: Exact four-field view-only display grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayAttachCapabilityResponse"
        "400":
          description: Invalid work session identifier, or a mode outside the vocabulary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            controller was requested by someone who is not the session owner, or
            the caller is not an authorized active human/channel member, or
            observation is owner_only and the caller is not the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session does not exist in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Session ended, lacks a display binding, its host is revoked, or that
            host does not advertise a display. One status for all four: which is
            false describes a host's internal state to a caller entitled only to
            know it is unavailable. Also returned when controller was requested
            and somebody else already holds the control window — one open window
            per session is a unique index, not a race.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-sessions/{workSessionId}/display-binding:
    post:
      tags: [work-sessions, work-hosts]
      operationId: publishWorkSessionDisplayBinding
      summary: Publish this session's WebRTC display binding as its own host.
      description: >
        MomoHost-signed, exactly once per session. The daemon inside the sandbox
        declares displayId plus the credential-free WSS signalling endpoint a
        browser will dial. A human bearer is 403 here and the same field names
        are refused by name on session create and PATCH: publishing a binding is
        a claim about what is running on a machine, and only the machine makes
        it. Re-sending the identical pair is idempotent (204); a DIFFERENT
        binding is 409, because two producers claiming one session's screen is a
        state the ledger cannot describe. The signing host must be the session's
        own; the path names a session rather than a host, so that pin is
        enforced against the ledger inside the handler. The host must also
        already advertise capabilities.display_attach.
      security:
        - workHostAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkSessionId"
        - $ref: "#/components/parameters/WorkHostSentAt"
        - $ref: "#/components/parameters/WorkHostSignature"
        - $ref: "#/components/parameters/WorkHostRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishDisplayBindingRequest"
      responses:
        "204":
          description: Binding stored, or already exactly this binding.
        "400":
          description: >
            Invalid session identifier, or displayId/displayEndpoint outside the
            ledger's grammar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or replayed host signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Human bearer, or a host binding a session that is not its own.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session does not exist in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Session is not running or idle, the host is revoked or does not
            advertise a display, or a different binding is already published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{workspaceId}/work-sessions/{workSessionId}/display-control:
    delete:
      tags: [work-sessions]
      operationId: returnDisplayControl
      summary: Hand the session's screen back to its agent.
      description: >
        The 반환 half of ADR-0004 증보 3 (LIVE-3): the person closes their
        control window and the agent's reach into the session comes back.
        Session owner only, matching who could have opened it — a teammate must
        not be able to end somebody else's intervention mid-password.
        Closing writes an end_reason of returned, emits the work.session.control
        boundary event carrying 재개 시각, and makes the next producer
        re-validation answer input_enabled false. That last part is what makes
        the return real rather than bookkeeping: without it, handing control
        back would be a row in a table and a keyboard that still worked.
        IDEMPOTENT. Returning a window that has already closed — because this is
        a retry, because the lease lapsed, or because the session ended — is 200
        with closed=false, never a 4xx. It is one of the window's three closes;
        the other two (a lapsed producer lease, and the session ending) need no
        caller and happen on their own.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkSessionId"
      responses:
        "200":
          description: >
            The window is closed. closed says whether this call is what closed
            it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayControlReturnResponse"
        "400":
          description: Invalid work session identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Not an active workspace member, or not the session owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session does not exist in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-hosts/{workHostId}/display-attach/validate:
    post:
      tags: [work-hosts, work-sessions]
      operationId: validateDisplayAttachCapability
      summary: Validate a view-only display capability as its target host.
      description: >
        MomoHost-signed control-plane check performed by the WebRTC producer
        immediately before it accepts a signalling connection, and then on a
        timer for every peer connection it already serves (`stream: true`). The
        opaque bearer is matched by SHA-256 digest; the raw token is never
        persisted or logged. Validation joins the running-or-idle work_session,
        the unrevoked work_host, the grantee, the session's observation and the
        host's display advertisement on every call, so ending the session,
        revoking the host, closing observation, the grantee leaving the channel,
        or withdrawing capabilities.display_attach all cut a stream that is
        already open. A terminal capability presented here, or a display
        capability presented to terminal-attach/validate, is the ordinary 401:
        two surfaces on one box do not lend each other authority. The response
        carries input_enabled, which instructs the producer whether it may
        negotiate an input datachannel. It is TRUE only when the bearer is a
        controller grant AND the control window that grant opened is still
        standing, and it is re-answered on every re-validation — so it is also
        the off switch: when the person returns control the window closes and
        the producer must close the channel. For an observer grant it is always
        false, and view-only remains the ABSENCE of a channel rather than a flag
        beside one (ADR-0165 D4).
        A controller re-validation also RENEWS the control window's lease. That
        is deliberate and is why the window is not keyed to the capability's
        60-second expiry: a live WebRTC session outlives its dial window by
        design, and a window that expired with it would resume the agent sixty
        seconds into a login still in progress.
        Media and signalling never traverse MomoServer, OutboxRelay, or
        Centrifugo, and no frame is stored.
      security:
        - workHostAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkHostId"
        - $ref: "#/components/parameters/WorkHostSentAt"
        - $ref: "#/components/parameters/WorkHostSignature"
        - $ref: "#/components/parameters/WorkHostRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateDisplayAttachRequest"
      responses:
        "200":
          description: Capability is live and bound to this host and display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayAttachValidationResponse"
        "400":
          description: Invalid path identifier or request body shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >
            Invalid host signature, or an unknown, expired, wrong-kind, ended,
            revoked or no-longer-authorized capability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{workspaceId}/work-controls:
    post:
      tags: [work-controls]
      operationId: createWorkControl
      summary: Request a host control from the agent bound to an active run.
      description: >
        Agent bearer only and requires the work:control scope. Spawn dispatches
        immediately only when the human host owner has enabled the exact tool;
        otherwise it creates the canonical approval_request card. Input and
        kill require a running session in the same requester lineage, while
        read requires the lineage but no approval. The target must be a
        registered, unrevoked host in this workspace. Member-scoped hosts must
        belong to the session owner; workspace-scoped hosts accept all members.
        Host-local paths,
        environment, process state, and credentials are forbidden payloads.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkControlRequest"
      responses:
        "201":
          description: Control recorded as pending_approval or dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkControlResponse"
        "400":
          description: Invalid kind, identifiers, session shape, or closed payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Human bearer, wrong agent/run lineage, or member-host owner mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Target host is missing, revoked, or belongs to another workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Run or required work session is not running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-controls/{workControlId}/ack:
    post:
      tags: [work-controls]
      operationId: acknowledgeWorkControl
      summary: Acknowledge one dispatched control from its registered execution host.
      description: >
        The registering human owner or the MomoHost-signed execution host may
        acknowledge. A successful spawn acknowledgement must bind a running
        work_session owned by the requesting agent's human owner with the same
        channel and host UUID. Pending or denied controls cannot be acknowledged.
      security:
        - bearerAuth: []
        - workHostAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkControlId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkControlAckRequest"
      responses:
        "200":
          description: Control settled as acked or failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkControlResponse"
        "400":
          description: Invalid acknowledgement or spawn session binding.
          content:
            application/json:
              schema:
