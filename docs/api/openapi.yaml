            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/messages/{messageId}/pin:
    put:
      tags: [messages]
      operationId: pinMessage
      summary: Pin a message to its channel idempotently.
      description: >
        A pin is the **channel's** fact, not the pinner's: `message_pin` is unique
        on the message alone, so two members pinning the same message produce one
        header entry, and any channel member may unpin it — including one who did
        not pin it. Requiring the pinner would strand every pin whose author left.
        Pinning consumes no `message.seq` and does not modify the message; the
        `message.pinned` broadcast reuses the target's own seq. The response
        carries the full list entry so the caller can insert it without re-reading.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: messageId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Pinned delta; an already-pinned message is also success (changed=false).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PinDelta"}
        "400":
          description: Malformed message id, or the message is deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Not a channel member, or workspace scope mismatch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: Message not found.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "409":
          description: The channel already has the maximum 100 pinned messages.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}
    delete:
      tags: [messages]
      operationId: unpinMessage
      summary: Unpin a message from its channel idempotently.
      description: >
        Any channel member may unpin, not only the pinner. Unpinning a message
        that is not pinned is also a success (changed=false) and publishes
        nothing. Deleting a message sweeps its pin without a separate
        `message.unpinned` frame — the client drops it on `message.deleted`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: messageId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Unpinned delta; an already-absent pin is also success.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PinDelta"}
        "400":
          description: Malformed message id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Not a channel member, or workspace scope mismatch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: Message not found.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/channels/{channelId}/pins:
    get:
      tags: [messages]
      operationId: getChannelPins
      summary: List a channel's pinned messages, most recently pinned first.
      description: >
        The cold-load counterpart of the pin verbs, the way the reaction snapshot
        is to the reaction toggle: read once per channel, then kept live by
        `message.pinned` / `message.unpinned`. Deleted messages are excluded.
        Empty channels return an empty array.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: The channel's pins, ordered by pinnedAtMs descending.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PinList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Not a channel member, or workspace scope mismatch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/unfurl-settings:
    get:
      tags: [unfurls]
      operationId: getWorkspaceUnfurlSettings
      summary: Read the workspace link-unfurl fetch switch.
      description: >
        Owner/admin. Missing row means enabled. Off skips fetch itself, not just
        client render (ADR-0170 D4). Instance-level `MOMO_UNFURL_ENABLED` (default
        0) is a separate opt-in that must also be on before any GET leaves the
        process.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Current switch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UnfurlSettings"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Workspace owner/admin required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}
    put:
      tags: [unfurls]
      operationId: putWorkspaceUnfurlSettings
      summary: Set the workspace link-unfurl fetch switch.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PutUnfurlSettingsRequest"}
      responses:
        "200":
          description: Updated switch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UnfurlSettings"}
        "400":
          description: Malformed body.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Workspace owner/admin required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/messages/{messageId}/unfurls:
    get:
      tags: [unfurls]
      operationId: listMessageUnfurls
      summary: List derived unfurl cards for a message.
      description: >
        Channel members. Failed/blocked cards are present so a client can choose
        silence (ADR-0170 D5). Image bytes are not inlined — `imageUrl` is the
        authenticated proxy path.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: messageId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Cards in insertion order. Empty array when none.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageUnfurlList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Not a channel member, or workspace scope mismatch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: Message not found.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}
    delete:
      tags: [unfurls]
      operationId: removeMessageUnfurls
      summary: Remove unfurl cards from a message. Author only. Not regenerated.
      description: >
        Deletes the derived rows and plants a tombstone so the worker will not
        recreate them. Does not modify `message` or consume `seq`. Publishes
        `message.unfurl.removed` reusing the message's seq.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: messageId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Removal is idempotent; removed=false when already gone.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RemoveUnfurlsResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Only the message author may remove its unfurls.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: Message not found.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/unfurls/{unfurlId}/image:
    get:
      tags: [unfurls]
      operationId: getUnfurlImage
      summary: Stream the unfurl preview image through this origin.
      description: >
        Channel members. The client must not fetch the remote host (CSP).
        Private/loopback/link-local destinations are refused by the same
        OutboundHTTPPolicy as webhook delivery. Only image/jpeg, png, gif,
        webp, avif are proxied.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: unfurlId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Image bytes.
          content:
            "image/*":
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Not a channel member, or workspace scope mismatch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: Card or image not available (including SSRF-blocked).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/channels/{channelId}/reactions:
    get:
      tags: [messages]
      operationId: getChannelReactionSnapshot
      summary: Load message-to-emoji-to-member reaction sets for a channel.
      description: Deleted messages are excluded. Empty channels return an empty object.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: Direct message id -> emoji -> member id array mapping.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReactionSnapshot"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Not a channel member, or workspace scope mismatch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/channels/{channelId}/messages:
    post:
      tags: [messages]
      operationId: sendMessage
      summary: Send a message (idempotent via clientMsgId).
      description: >
        The single write path (L4 §3.1): one transaction bumps the gapless
        per-channel `seq`, inserts the message, and enqueues the realtime
        broadcast through the transactional outbox. Retrying with the same
        `clientMsgId` returns the original message (exactly-once effect) —
        the response status is 201 in both cases.
        Supplying `rootId` creates a one-level thread reply. The root must be an
        undeleted top-level message in the same channel; cross-channel roots are
        reported as not found.
        Supplying `replyToId` quotes a message (ADR-0148): the send stays in the
        channel's main flow and points at the target rather than folding the
        conversation into a thread. The two are independent and may be sent
        together. A quote target must be undeleted and in the same channel, but
        — unlike a thread root — it may itself be a reply.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Message committed with its authoritative `seq`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: >
            Invalid workspace/channel id, deleted root, nested reply root, a
            deleted quote target, an opening `stream` block that declares
            anything other than `rev: 0` / `streaming: true`, or a signed send
            that also opens a stream (the provenance digest binds the props as
            inserted, and the opening marker is written by the server after the
            signature was made).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a member of this channel, or workspace scope mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >
            Channel/root not found or not provisioned, or a quote target that is
            not in this channel (a target in another channel or workspace is
            answered identically to one that does not exist).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      tags: [messages]
      operationId: getMessageHistory
      summary: Read message history (seq-cursor pagination).
      description: >
        Without cursors, returns the newest messages ordered by `seq`
        descending. `before=<seq>` pages older history (descending).
        `after=<seq>` is the realtime-recovery backfill: it returns messages
        with `seq > after` in ASCENDING order and takes precedence over
        `before` when both are present. All variants include deleted messages as
        tombstones (`state=deleted`, omitted/null `body`, populated `deletedAtMs`)
        and project the durable `state`, `editedAtMs`, and `deletedAtMs` values so
        clients converge after restart or backfill.
        A generic agent bearer that carries the non-default `messages:read`
        scope may call this route on a channel where that agent is an active
        member (ADR-0173). Hosted connection credentials are refused on this
        REST surface; they keep the Agent Port read tool only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
        - name: limit
          in: query
          required: false
          description: Page size, clamped to 1..200.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: before
          in: query
          required: false
          description: Return messages with `seq` strictly below this cursor (older).
          schema:
            type: integer
            format: int64
        - name: after
          in: query
          required: false
          description: Return messages with `seq` strictly above this cursor (backfill, ascending).
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: One page of messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "400":
          description: Invalid workspace/channel id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a member of this channel, or workspace scope mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/channels/{channelId}/messages/{rootId}/replies:
    get:
      tags: [messages]
      operationId: getThreadReplies
      summary: Read all replies to a top-level message in ascending seq order.
      description: >
        Uses an exclusive message-seq cursor. Deleted replies remain visible as
        tombstones. The root must exist in this channel and be top-level; a root
        in another channel is reported as not found. Active channel membership is
        enforced before the root lookup.
        A generic agent bearer that carries the non-default `messages:read`
        scope may call this route on the same membership predicate as history
        (ADR-0173). Hosted connection credentials are refused here.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
        - name: rootId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          description: Return replies with `seq` strictly above this cursor.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Page size, clamped to 1..200.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: One oldest-first page of replies, including tombstones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadRepliesPage"
        "400":
          description: Invalid id/cursor, or the selected root is itself a reply.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Not a channel member, or workspace scope mismatch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: Root absent from this channel (including cross-channel roots).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/read-state:
    get:
      tags: [read-state]
      operationId: listReadStates
      summary: Bulk read-state for every channel the member belongs to.
      description: >
        ADR-0109 read surface. One entry per active membership on a
        non-archived channel, bound to the authenticated principal.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Read-state projections for the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadStateListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/channels/{channelId}/read-state:
    put:
      tags: [read-state]
      operationId: updateReadState
      summary: Advance the caller's read cursor for a channel.
      description: >
        Monotonic: the effective cursor is
        `max(current, min(requested, latestSeq))` — it never moves backward
        and never beyond the channel head. The cursor owner is always the
        authenticated principal; no member id is accepted in the body.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReadStateRequest"
      responses:
        "200":
          description: Effective read-state after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadState"
        "400":
          description: last_read_seq must be non-negative, or invalid ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a member of this channel, or workspace scope mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/dms:
    get:
      tags: [dms]
      operationId: listDms
      summary: List the caller's active 1:1 DM channels.
      description: Newest-created first; at most 500 channels.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: DM channels with active participant ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceChannelsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [dms]
      operationId: openDm
      summary: Open (or reuse) the 1:1 DM channel with another member.
      description: >
        Idempotent per participant pair: creates the DM channel on first call
        (201) and returns the existing one afterwards (200). Snake-case body
        alias accepted by the server, `member_id`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenDirectMessageRequest"
      responses:
        "201":
          description: DM channel newly created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenDirectMessageResponse"
        "200":
          description: Existing DM channel returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenDirectMessageResponse"
        "400":
          description: Target must be another member / invalid ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Active workspace member not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: List approval projections visible to the caller.
      description: >
        Requires an active human member; only approvals on channels where the
        caller has an active membership are returned. Ordered by expiry
        (soonest first, NULLs last), then newest first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: status
          in: query
          required: false
          description: Approval status filter; defaults to `pending`.
          schema:
            type: string
            enum: [pending, approved, rejected, expired, cancelled]
            default: pending
        - name: limit
          in: query
          required: false
          description: Page size, clamped to 1..500.
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Approval projections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalProjectionPage"
        "400":
          description: Invalid status filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an active human workspace member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/approvals/{approvalId}/decision:
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: Approve or reject a pending approval (idempotent).
      description: >
        Human-only. `client_decision_id` provides idempotency — retrying the
        same decision returns the original receipt (200); a different
        decision under the same `client_decision_id` returns a 409 receipt
        with status `idempotency_conflict`. Expected failures (403/404/409)
        return the SAME receipt schema (not the generic error envelope) with
        a diagnostic `status`; the generic error envelope is used only for
        400 body/path mismatches and 401 auth failures.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: approvalId
          in: path
          required: true
          description: Approval UUID; must match the body `approval_id`.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          description: Decision committed (or identical idempotent retry).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionReceipt"
        "400":
          description: approval_id does not match path / invalid ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Receipt-shaped expected failure (not human / not a channel member).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionReceipt"
        "404":
          description: Receipt-shaped expected failure (approval not found).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionReceipt"
        "409":
          description: >
            Receipt-shaped expected failure — already decided, expired before
            decision, or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionReceipt"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/plugins:
    get:
      tags: [plugins]
      operationId: listPlugins
      summary: List the plugin catalog and caller-effective tool policy.
      description: >
        Human bearers receive policy for themselves. Agent bearers must supply
        both delegatedMemberId and channelId; the server verifies that the
        delegated human and agent are active members of that channel. The
        response contains policy metadata only, never provider credentials.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DelegatedMemberId"
        - $ref: "#/components/parameters/DelegatedChannelId"
      responses:
        "200":
          description: Plugin catalog and effective credential-free tool policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginCatalogResponse"
        "400":
          description: Agent bearer omitted or malformed delegation query parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/plugins/{pluginId}:
    get:
      tags: [plugins]
      operationId: getPlugin
      summary: Get one plugin manifest and installation state.
      description: Human bearer only. The manifest is registry metadata and contains no credential.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PluginId"
      responses:
        "200":
          description: Plugin detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginDetailResponse"
        "401":
