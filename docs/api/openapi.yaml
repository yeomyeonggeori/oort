    AgentPauseInput:
      type: object
      additionalProperties: false
      required: [paused]
      properties:
        paused: {type: boolean}

    AgentProfileTriggers:
      type: object
      additionalProperties: false
      required: [mention]
      properties:
        mention: {type: boolean, enum: [true]}
        schedule:
          description: Reserved definition only; v0 does not execute schedules.

    AgentProfile:
      type: object
      required:
        [agentMemberId, workspaceId, instructions, enabledTools, triggers, paused,
         version, updatedBy, updatedAtMs]
      properties:
        agentMemberId: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        instructions: {type: string}
        modelPref: {type: string}
        effortPref: {type: string, enum: [low, medium, high, xhigh, max]}
        enabledTools:
          type: array
          items: {type: string}
        triggers: {$ref: "#/components/schemas/AgentProfileTriggers"}
        paused: {type: boolean}
        version: {type: integer, minimum: 1}
        updatedBy: {type: string, format: uuid}
        updatedAtMs: {type: integer, format: int64}

    AgentProfileResponse:
      type: object
      required: [profile]
      properties:
        profile: {$ref: "#/components/schemas/AgentProfile"}

    AllowedAgentModelsResponse:
      type: object
      additionalProperties: false
      required: [allowedAgentModels]
      properties:
        allowedAgentModels:
          type: array
          minItems: 1
          items: {type: string, minLength: 1, maxLength: 200}

    AgentRunSummary:
      type: object
      additionalProperties: false
      required: [id, channelId, status, createdAtMs, updatedAtMs]
      properties:
        id: {type: string, format: uuid}
        channelId: {type: string, format: uuid}
        triggerMessageId:
          type: string
          format: uuid
          description: Message that triggered this run, when applicable.
        triggerSummary:
          type: string
          maxLength: 200
          description: >
            Bounded validated Work title or mention prompt excerpt. No raw
            input object, tool payload, output, error, or transcript is exposed.
        status:
          type: string
          enum: [queued, running, awaiting_approval, paused, succeeded, failed, cancelled, timed_out]
        startedAtMs: {type: integer, format: int64}
        finishedAtMs: {type: integer, format: int64}
        createdAtMs: {type: integer, format: int64}
        updatedAtMs: {type: integer, format: int64}

    AgentRunSummaryPage:
      type: object
      additionalProperties: false
      required: [runs]
      properties:
        runs:
          type: array
          items: {$ref: "#/components/schemas/AgentRunSummary"}
        nextCursor:
          type: string
          format: uuid
          description: Final run ID when another older page exists.

    AgentRunCancelResponse:
      type: object
      additionalProperties: false
      required: [runId, status, linkedWorkSessionIds, workSessionsTerminated]
      properties:
        runId: {type: string, format: uuid}
        status: {type: string, enum: [cancelled]}
        linkedWorkSessionIds:
          type: array
          items: {type: string, format: uuid}
        workSessionsTerminated:
          type: boolean
          enum: [false]

    AgentMember:
      type: object
      required: [id, handle, displayName]
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        displayName:
          type: string

    CreateAgentResponse:
      type: object
      required: [agent]
      properties:
        agent:
          $ref: "#/components/schemas/AgentMember"

    RegisterAgentCardRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Agent origin or exact /.well-known/agent-card.json URL; userinfo, query, and fragment are forbidden.

    AgentCardRegistration:
      type: object
      required: [id, status, name, url, capabilities, securitySchemes, createdAtMs]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [pending_consent, confirmed]}
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, maxLength: 2000}
        url: {type: string, format: uri}
        capabilities:
          type: object
          additionalProperties: true
        securitySchemes:
          type: object
          description: Display-only summary; never includes submitted credentials or secrets.
          additionalProperties: true
        agentMemberId: {type: string, format: uuid}
        createdAtMs: {type: integer, format: int64}
        confirmedAtMs: {type: integer, format: int64}

    AgentCardRegistrationResponse:
      type: object
      required: [registration]
      properties:
        registration: {$ref: "#/components/schemas/AgentCardRegistration"}

    AgentCredentialScope:
      type: string
      description: >
        Closed generic agent-bearer scope set. `messages:read` is grantable and
        not default (ADR-0162). When present it opens
        `GET …/channels/{ch}/messages` and `GET …/messages/{root}/replies`
        for that generic credential (ADR-0173). Hosted credentials never gain
        those REST routes from this name — class preflight keeps them on the
        Agent Port tool only.
      enum:
        - agent:jobs:read
        - agent:runs:callback
        - messages:read
        - messages:write
        - realtime:subscribe
        - work:control
        - provider:quota:write
        - agent:port:connect
        - agent:inbox:read

    HostedAgentScope:
      type: string
      description: >
        The closed hosted scope set. `agent:port:connect` is reachability only:
        it opens `POST /v1/mcp/agent-port` and no product tool. Each of the
        others opens exactly one Agent Port tool family and no REST route
        (ADR-0173 does not change that for hosted) —
        `agent:inbox:read` -> oort_inbox_read, `messages:read` ->
        oort_conversation_read, `messages:write` -> oort_message_post,
        `agent:jobs:read` -> oort_jobs_claim/oort_job_renew/oort_job_release,
        `agent:runs:callback` -> oort_run_event/oort_run_complete. A tool is
        listed and callable only when the connection approval, the credential's
        current scopes and the server capability all carry its scope.
      enum: ["agent:port:connect", "agent:inbox:read", "messages:read", "messages:write", "agent:jobs:read", "agent:runs:callback"]

    HostedAgentConnection:
      type: object
      additionalProperties: false
      required: [id, agentMemberId, status, authMode, audience, approvedChannelIds, approvedScopes, createdAtMs, updatedAtMs]
      properties:
        id: {type: string, format: uuid}
        agentMemberId: {type: string, format: uuid}
        status: {type: string, enum: [pairing_pending, detected, active, expired, cleanup_pending, disconnected]}
        authMode: {type: string, enum: [static_bearer]}
        audience: {type: string, enum: [/v1/mcp/agent-port]}
        approvedChannelIds: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
        approvedScopes: {type: array, uniqueItems: true, items: {$ref: "#/components/schemas/HostedAgentScope"}}
        activeCredentialId: {type: string, format: uuid}
        createdAtMs: {type: integer, format: int64}
        updatedAtMs: {type: integer, format: int64}
        doorbellUrl: {type: string, format: uri, description: Present only when a doorbell is registered and MOMO_DOORBELL_ENABLED=true.}
        doorbellSecretMasked: {type: string, description: Non-secret display tail. Never the Bearer.}
        doorbellLastFiredAtMs: {type: integer, format: int64}
        doorbellLastStatus: {type: string}

    RegisterHostedDoorbellRequest:
      type: object
      additionalProperties: false
      required: [url, secret]
      properties:
        url: {type: string, minLength: 1, maxLength: 2048, description: HTTPS doorbell URL. Validated by OutboundHTTPPolicy.}
        secret: {type: string, minLength: 1, maxLength: 4096, writeOnly: true, description: Operator Bearer. AEAD-sealed; never returned.}

    HostedDoorbellResponse:
      type: object
      additionalProperties: false
      required: [connectionId, url, secretMasked, registeredAtMs]
      properties:
        connectionId: {type: string, format: uuid}
        url: {type: string}
        secretMasked: {type: string, description: Masked display. Never the pasted Bearer.}
        registeredAtMs: {type: integer, format: int64}
        lastFiredAtMs: {type: integer, format: int64}
        lastStatus: {type: string}

    CreateHostedAgentConnectionRequest:
      type: object
      additionalProperties: false
      required: [displayName, handle]
      properties:
        displayName: {type: string, minLength: 1}
        handle: {type: string, minLength: 1}
        authMode: {type: string, enum: [static_bearer], default: static_bearer}

    CreateHostedAgentConnectionResponse:
      type: object
      additionalProperties: false
      required: [connection, pairingCredential, pairingExpiresAtMs]
      properties:
        connection: {$ref: "#/components/schemas/HostedAgentConnection"}
        pairingCredential: {type: string, readOnly: true, minLength: 1, description: One-time pairing bearer; only SHA-256 is persisted.}
        pairingExpiresAtMs: {type: integer, format: int64}

    HostedAgentConnectionResponse:
      type: object
      additionalProperties: false
      required: [connection, cleanupArtifacts]
      properties:
        connection: {$ref: "#/components/schemas/HostedAgentConnection"}
        cleanupArtifacts:
          type: array
          maxItems: 200
          items: {$ref: "#/components/schemas/HostedCleanupArtifact"}
          description: >
            HAP-E6 cleanup manifest. Empty until a disconnect starts, so an
            unstarted connection answers with the same shape rather than a
            different one.

    HostedCleanupArtifact:
      type: object
      additionalProperties: false
      description: >
        One provider artifact a disconnect must account for (ADR-0162 HAP-E6).
        Rows are per kind, plus one per named item, and one row never resolves
        another: acknowledging `connector` leaves `local_plugin_files`
        unresolved, which is the #1344 measurement made structural. `resolved`
        is derived from `disposition` alone, so `currentStatus: inactive` is an
        observation and never a cleanup. Nothing here carries a provider
        credential, chat content or file path.
      required: [id, kind, expectedAction, currentStatus, disposition, resolved, required, updatedAtMs]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [bot, routine, plugin, connector, local_plugin_files, secret]}
        externalRef: {type: string, minLength: 1, maxLength: 200, description: Bounded non-secret operator label for one named item.}
        expectedAction:
          type: string
          enum: [remove, revoke, decide]
          description: >
            Fixed by kind. `bot` is `decide` because deleting one deletes its
            chat history; `secret` is `revoke`; everything else is `remove`.
        currentStatus: {type: string, enum: [unknown, present, inactive, absent]}
        disposition:
          type: string
          enum: [pending, removed, preserved, revoked]
          description: >
            `preserved` is legal for `bot` only and is a terminal answer — oort
            never deletes provider chat history on someone's behalf.
        resolved: {type: boolean}
        required: {type: boolean}
        source:
          type: string
          enum: [server_verified, manual]
          description: >
            `server_verified` is reserved for what this server removed itself
            (the hosted bearer it revoked) and is never readable from a request
            body. Provider-owned artifacts are `manual` and carry an actor plus
            evidence.
        acknowledgedBy: {type: string, format: uuid}
        acknowledgedAtMs: {type: integer, format: int64}
        evidence: {type: string, minLength: 1, maxLength: 2000}
        updatedAtMs: {type: integer, format: int64}

    DisconnectHostedAgentConnectionRequest:
      type: object
      additionalProperties: false
      properties:
        artifacts:
          type: array
          maxItems: 50
          description: Extra named provider items to track beside the seeded per-kind rows.
          items:
            type: object
            additionalProperties: false
            required: [kind, externalRef]
            properties:
              kind: {type: string, enum: [bot, routine, plugin, connector, local_plugin_files, secret]}
              externalRef: {type: string, minLength: 1, maxLength: 200}

    DisconnectHostedAgentConnectionResponse:
      type: object
      additionalProperties: false
      required: [connection, cleanupArtifacts, remainingRequired, startedNow]
      properties:
        connection: {$ref: "#/components/schemas/HostedAgentConnection"}
        cleanupArtifacts: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/HostedCleanupArtifact"}}
        remainingRequired: {type: integer, format: int64, minimum: 0}
        startedNow: {type: boolean, description: False when the disconnect had already started; nothing was written a second time.}

    AcknowledgeHostedCleanupArtifactRequest:
      type: object
      additionalProperties: false
      required: [currentStatus]
      properties:
        currentStatus: {type: string, enum: [unknown, present, inactive, absent]}
        disposition:
          type: string
          enum: [delete, preserve, revoke]
          description: >
            Omit to record an observation only. `preserve` is legal for `bot`
            alone; `revoke` for `secret` alone; `delete` for every other kind.
        evidence: {type: string, minLength: 1, maxLength: 2000, description: Required whenever a disposition is supplied.}

    AcknowledgeHostedCleanupArtifactResponse:
      type: object
      additionalProperties: false
      required: [artifact, remainingRequired, changed]
      properties:
        artifact: {$ref: "#/components/schemas/HostedCleanupArtifact"}
        remainingRequired: {type: integer, format: int64, minimum: 0}
        changed: {type: boolean, description: False for a byte-identical repeat, which writes no audit row.}

    CompleteHostedAgentDisconnectResponse:
      type: object
      additionalProperties: false
      required: [connection, cleanupArtifacts, disconnectedNow]
      properties:
        connection: {$ref: "#/components/schemas/HostedAgentConnection"}
        cleanupArtifacts: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/HostedCleanupArtifact"}}
        disconnectedNow: {type: boolean, description: False for an idempotent replay of a transition that already happened.}

    HostedAgentConnectionListResponse:
      type: object
      additionalProperties: false
      required: [connections]
      properties:
        connections: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/HostedAgentConnection"}}

    ConfirmHostedAgentConnectionRequest:
      type: object
      additionalProperties: false
      required: [agentMemberId, audience, approvedChannelIds, approvedScopes, authMode]
      properties:
        agentMemberId: {type: string, format: uuid}
        audience: {type: string, enum: [/v1/mcp/agent-port]}
        approvedChannelIds: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
        approvedScopes: {type: array, minItems: 1, uniqueItems: true, items: {$ref: "#/components/schemas/HostedAgentScope"}}
        authMode: {type: string, enum: [static_bearer]}

    ConfirmHostedAgentConnectionResponse:
      type: object
      additionalProperties: false
      required: [connection, credentialId, credential, tokenType]
      properties:
        connection: {$ref: "#/components/schemas/HostedAgentConnection"}
        credentialId: {type: string, format: uuid}
        credential: {type: string, readOnly: true, minLength: 1, description: One-time Agent Port bearer; only SHA-256 is persisted.}
        tokenType: {type: string, enum: [Bearer]}

    AgentCredential:
      type: object
      additionalProperties: false
      required: [id, agentMemberId, status, scopes, createdAtMs]
      properties:
        id: {type: string, format: uuid}
        agentMemberId: {type: string, format: uuid}
        status: {type: string, enum: [active, expired, revoked]}
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: "#/components/schemas/AgentCredentialScope"}
        label: {type: string, minLength: 1, maxLength: 120}
        lastUsedAtMs: {type: integer, format: int64}
        expiresAtMs: {type: integer, format: int64}
        revokedAtMs: {type: integer, format: int64}
        createdAtMs: {type: integer, format: int64}

    CreateAgentCredentialRequest:
      type: object
      additionalProperties: false
      properties:
        scopes:
          type: array
          minItems: 1
          description: >
            Closed explicit scope set. Duplicates are normalized away. If omitted, defaults to
            agent:jobs:read, agent:runs:callback, messages:write,
            realtime:subscribe, and work:control.
          items: {$ref: "#/components/schemas/AgentCredentialScope"}
        label:
          type: string
          minLength: 1
          maxLength: 120
          description: Defaults to `agent bearer` when omitted.
        expiresAtMs:
          type: integer
          format: int64
          minimum: 0
          description: Optional future epoch millisecond; past or current values are rejected.
        rotationGraceSeconds:
          type: integer
          minimum: 0
          maximum: 604800
          description: Defaults to 86400 seconds when omitted.

    CreateAgentCredentialResponse:
      type: object
      additionalProperties: false
      required: [credential, token, tokenType, rotatedCredentialCount]
      properties:
        credential: {$ref: "#/components/schemas/AgentCredential"}
        token:
          type: string
          readOnly: true
          minLength: 1
          description: One-time raw bearer. Only SHA-256(token) is persisted.
        tokenType: {type: string, enum: [Bearer]}
        rotatedCredentialCount: {type: integer, minimum: 0}
        rotationGraceEndsAtMs: {type: integer, format: int64}

    AgentCredentialListResponse:
      type: object
      additionalProperties: false
      required: [credentials]
      properties:
        credentials:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/AgentCredential"}

    RevokeAgentCredentialRequest:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, maxLength: 500}

    RevokeAgentCredentialResponse:
      type: object
      additionalProperties: false
      required: [credential, revokedNow, alreadyRevoked]
      properties:
        credential: {$ref: "#/components/schemas/AgentCredential"}
        revokedNow: {type: boolean}
        alreadyRevoked: {type: boolean}

    ConfirmAgentCardResponse:
      type: object
      required: [registrationId, status, agent, credential, token, tokenType, confirmedAtMs]
      properties:
        registrationId: {type: string, format: uuid}
        status: {type: string, enum: [confirmed]}
        agent: {$ref: "#/components/schemas/AgentMember"}
        credential: {$ref: "#/components/schemas/AgentCredential"}
        token:
          type: string
          writeOnly: true
          description: One-time-issued scoped gateway bearer; only its SHA-256 digest is persisted.
        tokenType: {type: string, enum: [Bearer]}
        confirmedAtMs: {type: integer, format: int64}

    # ---- Provider cascade + effort table (ADR-0135 D1 / ADR-0134 D2) --------
    ProviderChainEntry:
      type: object
      description: >
        One projected cascade hop. Position 0 is the `provider_link` singleton
        (or the boot-time HERMES_* env trio when no row exists); positions >= 1
        come from `provider_link_chain`. The bearer itself is never projected —
        only whether one is configured/openable and a masked tail (ADR-0004).
      required:
        [position, source, mode, baseUrl, endpointLabel, enabled,
         bearerConfigured, bearerUnavailable]
      properties:
        position:
          type: integer
          description: 0 is the singleton head; fallback hops run 1..8.
        source:
          type: string
          enum: [database, environment, chain]
          description: >
            Position 0 resolves to `database` (a provider_link row) or
            `environment` (the env fallback); every fallback hop is `chain`.
        mode:
          type: string
          enum: [local-mock, internal-host-mock, external-hermes]
        baseUrl:
          type: string
        endpointLabel:
          type: string
          description: >
            Scheme, host, port, and path only — userinfo, query, and fragment
            are stripped before the hop is projected or audited.
        enabled:
          type: boolean
        bearerConfigured:
          type: boolean
        bearerUnavailable:
          type: boolean
          description: >
            The row exists but its ciphertext cannot be opened with the
            configured master key. It stays visible so a replace-all PUT cannot
            silently erase it.
        bearerLast4:
          type: string
          description: >
            Masked 4-character bearer tail. Absent — never null — when no
            bearer is readable for this hop.
        updatedAtMs:
          type: integer
          format: int64
          description: Absent for an env-sourced position 0.
        updatedBy:
          type: string
          format: uuid
          description: Absent when the row has no recorded editor.

    ProviderChainResponse:
      type: object
      required: [schema, entries, fallbackCount, attemptableCount]
      properties:
        schema:
          type: string
          enum: [momo.provider_link.chain.v0]
        entries:
          type: array
          description: The whole cascade in attempt order, position 0 first.
          items: {$ref: "#/components/schemas/ProviderChainEntry"}
        fallbackCount:
          type: integer
          description: Configured hops beyond position 0.
        attemptableCount:
          type: integer
          description: Hops a real turn would actually attempt (enabled AND usable).

    PutProviderChainEntry:
      type: object
      description: >
        One fallback hop in the replace-all body. Closed-world: any key outside
        this set is rejected with 400, so no provider OAuth or raw-provider-key
        field can enter through this API (ADR-0004 Rules #1-#2).
      required: [position, baseUrl]
      additionalProperties: false
      properties:
        position:
          type: integer
          minimum: 1
          description: >
            Position 0 is the provider-link singleton and is rejected by name;
            it stays editable only through `PUT /v1/provider/link`.
        baseUrl:
          type: string
          description: >
            Validated exactly like an agent endpoint — no userinfo, query, or
            fragment credential material; HTTPS unless the server opted into
            local loopback HTTP.
        bearer:
          type: string
          writeOnly: true
          description: >
            Write-only; never echoed back. Omit to keep the ciphertext already
            stored at this position — required only for a position that does
            not exist yet.
        mode:
          type: string
          enum: [local-mock, internal-host-mock, external-hermes]
          description: Defaults to external-hermes when omitted.
        enabled:
          type: boolean
          description: Defaults to true when omitted.

    PutProviderChainRequest:
      type: object
      required: [entries]
      additionalProperties: false
      properties:
        entries:
          type: array
          maxItems: 8
          description: >
            The complete new set of fallback hops. This is a replace-all: any
            configured position absent from the list is dropped.
          items: {$ref: "#/components/schemas/PutProviderChainEntry"}

    ProviderEffortModel:
      type: object
      required: [model, efforts, defaultEffort]
      properties:
        model: {type: string}
        efforts:
          type: array
          description: Levels this model accepts — a subset of `levels`.
          items: {type: string, enum: [low, medium, high, xhigh, max]}
        defaultEffort: {type: string, enum: [low, medium, high, xhigh, max]}

    ProviderEffortProvider:
      type: object
      required: [provider, models]
      properties:
        provider: {type: string}
        models:
          type: array
          items: {$ref: "#/components/schemas/ProviderEffortModel"}

    ProviderEffortFallback:
      type: object
      description: >
        Applied to any model absent from the table — deliberately the
        conservative low/medium/high triple.
      required: [efforts, defaultEffort]
      properties:
        efforts:
          type: array
          items: {type: string, enum: [low, medium, high, xhigh, max]}
        defaultEffort: {type: string, enum: [low, medium, high, xhigh, max]}

    ProviderEffortTableResponse:
      type: object
      required: [schema, levels, fallback, providers]
      properties:
        schema:
          type: string
          enum: [momo.provider.effort_table.v0]
        levels:
          type: array
          description: >
            Canonical superset in ascending order. A value outside this set is
            never a valid `routing.effort` regardless of model.
          items: {type: string, enum: [low, medium, high, xhigh, max]}
        fallback: {$ref: "#/components/schemas/ProviderEffortFallback"}
        providers:
          type: array
          items: {$ref: "#/components/schemas/ProviderEffortProvider"}

    # ---- Channels ----------------------------------------------------------------
    Channel:
      type: object
      required: [id, workspaceId, kind, muted]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [public, private, dm]
        name:
          type: string
          description: Absent for DM channels.
        topic:
          type: string
        dmKey:
          type: string
          description: Canonical participant-pair hash; DM channels only.
        memberIds:
          type: array
          items:
            type: string
            format: uuid
          description: Active participants for DM channels; empty array for public/private.
        createdBy:
          type: string
          format: uuid
        archivedAtMs:
          type: integer
          format: int64
          description: Present only when the channel is archived.
        muted:
          type: boolean
          description: Whether push dispatch is suppressed for the authenticated member.

    WorkspaceChannelsResponse:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"

    UpdateNotificationPrefRequest:
      type: object
      required: [muted]
      properties:
        muted:
          type: boolean

    NotificationPrefResponse:
      type: object
      required: [muted]
      properties:
        muted:
          type: boolean

    UpdateNotificationRulesRequest:
      type: object
      required: [dnd, mentionOverridesMute]
      additionalProperties: false
      properties:
        dnd:
          type: boolean
          description: Suppress every push for this member across the workspace.
        mentionOverridesMute:
          type: boolean
          description: Let a mention through a channel this member muted (018).

    NotificationRulesResponse:
      type: object
      required: [dnd, mentionOverridesMute]
      properties:
        dnd:
          type: boolean
        mentionOverridesMute:
          type: boolean

    SidebarSection:
      type: object
      required: [id, name, order, channelIds]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: Client-minted section id, unique within the payload.
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: >
            Section label, trimmed. The cap is 80 **characters**, not bytes — an
            80-character Korean name is 240 bytes and is legal.
        order:
          type: integer
          format: int32
          description: The member's own ordering. The server never renumbers it.
        channelIds:
          type: array
          items: {type: string, format: uuid}
          description: >
            Channels the member placed in this section. NOT a membership list —
            an id here may name a channel that no longer exists.

    SidebarPrefs:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          type: integer
          enum: [1]
          description: Payload version. Required; only 1 is accepted (ADR-0177 D3).
        sections:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/SidebarSection"
        starredChannelIds:
          type: array
          items: {type: string, format: uuid}
          description: >
            BT-5 (#1933) owns the star UI; the schema accepts the field from
            BT-4 so no migration is needed when that lands (ADR-0177 D5).
        sectionSort:
          type: string
          maxLength: 32
          description: >
            Reserved for BT-5's A–Z / Recent sort. Round-tripped verbatim; the
            server does not enumerate the values.

    UpdateSidebarPrefsRequest:
      type: object
      required: [prefs]
      additionalProperties: false
      properties:
        prefs:
          $ref: "#/components/schemas/SidebarPrefs"

    SidebarPrefsResponse:
      type: object
      required: [prefs]
      properties:
        prefs:
          $ref: "#/components/schemas/SidebarPrefs"
        updatedAtMs:
          type: integer
          format: int64
          description: >
            When the row was last written. Omitted for a member who has never
            saved. Observability, not a concurrency token — v1 is
            last-write-wins between the member's own devices.

    CreateReminderRequest:
      type: object
      required: [channelId, messageId, dueAtMs]
      additionalProperties: false
      properties:
        channelId: {type: string, format: uuid}
        messageId: {type: string, format: uuid}
        dueAtMs: {type: integer, format: int64}
        note: {type: string, maxLength: 500}

    UpdateReminderRequest:
      type: object
      additionalProperties: false
      properties:
        dueAtMs: {type: integer, format: int64}
        completed: {type: boolean}

    Reminder:
      type: object
      required: [id, workspaceId, memberId, channelId, messageId, dueAtMs, createdAtMs, updatedAtMs]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        memberId: {type: string, format: uuid}
        channelId: {type: string, format: uuid}
        messageId: {type: string, format: uuid}
        dueAtMs: {type: integer, format: int64}
        note: {type: string}
        completedAtMs: {type: integer, format: int64}
        createdAtMs: {type: integer, format: int64}
        updatedAtMs: {type: integer, format: int64}

    ReminderResponse:
      type: object
      required: [reminder]
      properties:
        reminder: {$ref: "#/components/schemas/Reminder"}

    ReminderListResponse:
      type: object
      required: [reminders]
      properties:
        reminders:
          type: array
          items: {$ref: "#/components/schemas/Reminder"}
        nextCursor: {type: string, format: uuid}

    CreateChannelRequest:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [public, private]
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]*[a-z0-9]$|^[a-z0-9]$"
          description: 1..80 chars; lowercased server-side.
        topic:
          type: string
          description: At most 280 chars; blank collapses to absent.

    ChannelMembership:
      type: object
      required: [id, workspaceId, channelId, memberId, role, joinedAtMs]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/MembershipRole"
        joinedAtMs:
          type: integer
          format: int64
        leftAtMs:
          type: integer
          format: int64
          description: Present only after the member left the channel.

    CreateChannelResponse:
      type: object
      required: [channel, creatorMembership]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        creatorMembership:
          $ref: "#/components/schemas/ChannelMembership"

    MembershipRole:
      type: string
      enum: [owner, admin, member, guest]

    # ---- Work hosts ---------------------------------------------------------
    RegisterWorkHostRequest:
      type: object
      required: [scope, type, displayName, publicKey]
      properties:
        scope:
          type: string
          enum: [member, workspace]
        type:
          type: string
          enum: [app, workd, cloud]
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        publicKey:
          type: string
          minLength: 44
          maxLength: 44
          description: Raw 32-byte Ed25519 public key in standard base64.
        capabilities:
          type: object
          additionalProperties:
            type: boolean
          description: Boolean tool-availability flags only.

    CreateCloudHostRequest:
      type: object
      required: [displayName, confirmPaidCloud, idempotencyRef]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        confirmPaidCloud:
          type: boolean
          description: Must be true for this one paid-cloud provisioning request.
        idempotencyRef:
          type: string
          format: uuid
          description: >
            Client-stable create key. Reusing it converges a lost 201 response
            onto the same provider instance and never creates a second paid
            host.

    EnrollBYOCHostRequest:
      type: object
      required: [displayName, idempotencyRef]
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        scope:
          type: string
          enum: [workspace]
          description: >
            Accepted only so a personal request can be refused by name instead
            of being silently promoted to a workspace-wide host.
        idempotencyRef:
          type: string
          format: uuid

    BYOCEnrollment:
      type: object
      required:
        [provisionId, provider, state, bootstrapToken, bootstrapExpiresAtMs,
         registerUrl]
      properties:
        provisionId:
          type: string
          format: uuid
        provider:
          type: string
          description: Always the degenerate `byoc` adapter identifier.
        state:
          type: string
        bootstrapToken:
          type: string
          description: >
            Shown exactly once. Only its SHA-256 digest is stored, so oort
            cannot show it again.
        bootstrapExpiresAtMs:
          type: integer
          format: int64
        registerUrl:
          type: string
          description: Absolute URL the operator's workd registers against.

    BYOCEnrollmentResponse:
      type: object
      required: [enrollment]
      properties:
        enrollment:
          $ref: "#/components/schemas/BYOCEnrollment"

    CloudCreditTopupRequest:
      type: object
      required: [amountMicroUsd, idempotencyRef]
      additionalProperties: false
      properties:
        amountMicroUsd:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
        idempotencyRef:
          type: string
          format: uuid

    CloudCreditTopupResponse:
      type: object
      required: [workspaceId, amountMicroUsd, idempotencyRef, balanceMicroUsd]
      properties:
        workspaceId:
          type: string
          format: uuid
        amountMicroUsd:
          type: integer
          format: int64
        idempotencyRef:
          type: string
          format: uuid
        balanceMicroUsd:
          type: integer
          format: int64

    CloudHost:
      type: object
      required: [provisionId, state, provider, createdAtMs]
      properties:
        provisionId:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
          description: Present after cloud workd self-registration.
        state:
          type: string
          enum:
            [provisioning, ready, running, pausing, paused, resuming,
             destroy_pending, destroyed, failed]
        provider:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,31}$"
          description: >
            ADR-0142 D2 adapter registry identifier — `byoc` for a host the
            workspace owns, or the id of a managed substrate adapter. Not a
            closed vendor enum: adding a substrate must not change this API.
        createdAtMs:
          type: integer
          format: int64

    CloudHostResponse:
      type: object
      required: [cloudHost]
      properties:
        cloudHost:
          $ref: "#/components/schemas/CloudHost"

    WorkHostLiveSessionDTO:
      type: object
      required: [id, tool, label, status, startedAtMs]
      properties:
        id: { type: string, format: uuid }
        tool: { type: string }
        label: { type: string }
        status: { type: string, enum: [running, idle] }
        startedAtMs: { type: integer, format: int64 }
    WorkHostLiveSessionsResponse:
      type: object
      required: [workSessions]
      properties:
        workSessions:
          type: array
          items:
            $ref: "#/components/schemas/WorkHostLiveSessionDTO"
    WorkHostReconcileRequest:
      type: object
      required: [lostSessionIds]
      properties:
        lostSessionIds:
          type: array
          maxItems: 200
          items: { type: string, format: uuid }
    WorkHostReconcileResponse:
      type: object
      required: [reportedSessionIds]
      properties:
        reportedSessionIds:
          type: array
          items: { type: string, format: uuid }
    WorkHostHeartbeatRequest:
      type: object
      required: [sentAtMs, signature]
      properties:
        sentAtMs:
          type: integer
          format: int64
        signature:
          type: string
          description: Raw 64-byte Ed25519 signature in standard base64.

    WorkHost:
      type: object
      required:
        [id, workspaceId, scope, ownerMemberId, type, displayName, publicKey,
         capabilities, createdAtMs, online]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        scope:
          type: string
          enum: [member, workspace]
        ownerMemberId:
          type: string
          format: uuid
        type:
          type: string
          enum: [app, workd, cloud]
        displayName:
          type: string
        publicKey:
          type: string
        capabilities:
          type: object
          additionalProperties:
            type: boolean
        lastSeenAtMs:
          type: integer
          format: int64
        revokedAtMs:
          type: integer
          format: int64
        createdAtMs:
          type: integer
          format: int64
        online:
          type: boolean

    WorkHostResponse:
      type: object
      required: [workHost]
      properties:
        workHost:
          $ref: "#/components/schemas/WorkHost"

    WorkHostListResponse:
      type: object
      required: [workHosts]
      properties:
        workHosts:
          type: array
          items:
            $ref: "#/components/schemas/WorkHost"

    PendingWorkControlsResponse:
      type: object
      required: [workControls]
      properties:
        workControls:
          type: array
          items:
            $ref: "#/components/schemas/WorkControl"

    # ---- Work sessions ------------------------------------------------------
    UpdateWorkPoolRequest:
      type: object
      required: [maxActive, perMemberSoftLimit]
      properties:
        maxActive:
          type: integer
          minimum: 1
          maximum: 1000
        includedActiveHours:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1000000
          description: Omitted or null means no included-hours setting.
        perMemberSoftLimit:
          type: integer
          minimum: 1
          maximum: 1000
          description: Must not exceed maxActive.

    WorkPool:
      type: object
      required:
        - workspaceId
        - maxActive
        - perMemberSoftLimit
        - activeSessions
        - memberActiveSessions
      properties:
        workspaceId:
          type: string
          format: uuid
        maxActive:
          type: integer
        includedActiveHours:
          type: integer
          nullable: true
        perMemberSoftLimit:
          type: integer
        activeSessions:
          type: integer
          description: Workspace running-or-idle work_session count.
        memberActiveSessions:
          type: integer
          description: Calling member's running-or-idle work_session count.

    WorkPoolResponse:
      type: object
      required: [workPool]
      properties:
        workPool:
          $ref: "#/components/schemas/WorkPool"

    CreateWorkSessionRequest:
      type: object
      required: [channelId, hostId, tool, label]
      properties:
        channelId:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
          description: Registered work_host identity enforced by a database FK.
        tool:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
        label:
          type: string
          minLength: 1
          maxLength: 120
          description: Display-only label. Filesystem cwd/path is never stored.
        controlId:
          type: string
          format: uuid
          description: >
            Required only for MomoHost-signed spawn dispatch. The server binds
            host, channel, tool, label, and session owner to this dispatched control.
        ptyId:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          description: >
            MomoHost-signed remote PTY binding only; must appear together with
            attachEndpoint. create returns this id, while connect, send_stdin,
            resize, and kill target the same id. Human-created local sessions
            omit both fields.
        attachEndpoint:
          type: string
          maxLength: 2048
          description: >
            Credential-free HTTPS or WSS direct PTY endpoint. Userinfo, query,
            and fragment are forbidden. MomoServer never proxies this stream.

    UpdateWorkSessionRequest:
      oneOf:
        - $ref: "#/components/schemas/EndWorkSessionRequest"
        - $ref: "#/components/schemas/SetWorkSessionIdleRequest"
        - $ref: "#/components/schemas/SetWorkSessionRunningRequest"
        - $ref: "#/components/schemas/UpdateWorkSessionObservationRequest"
        - $ref: "#/components/schemas/RelayWorkSessionACPEventRequest"
        - $ref: "#/components/schemas/BindWorkSessionRemotePTYRequest"

    BindWorkSessionRemotePTYRequest:
      type: object
      required: [ptyId, attachEndpoint]
      additionalProperties: false
      description: >
        MomoHost-signed publication of the direct PTY attach binding for a
        running or idle session the caller already owns (MOMO-655, ADR-0125
        D10). Create allocates the session id server-side and a tier-fallback
        resume never calls create at all, so this is the only way those sessions
        can carry a binding. Writing a DIFFERENT binding onto a session that
        already has one is 409; re-sending the identical pair is idempotent.
        The server stores and authorizes the endpoint and never proxies bytes.
      properties:
        ptyId:
          type: string
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
        attachEndpoint:
          type: string
          maxLength: 2048
          description: >
            Credential-free HTTPS or WSS direct PTY endpoint. Userinfo, query,
            and fragment are forbidden.

    RelayWorkSessionACPEventRequest:
      type: object
      required: [event]
      additionalProperties: false
      properties:
        event:
          $ref: "#/components/schemas/WorkSessionACPEvent"

    WorkSessionACPEvent:
      type: object
      required: [event_id, type, v, ts, payload]
      additionalProperties: false
      maxProperties: 5
      description: >
        At most 65536 encoded bytes. The server accepts at most 240 events per
        work session per 60 seconds. payload is an ADR-0004 allowlisted summary;
        _meta.acp, credentials, command/env/path, and terminal output are rejected.
      properties:
        event_id:
          type: string
          format: uuid
          description: Stable idempotency key retained across relay retries.
        type:
          type: string
          enum: [agent.partial, agent.status, approval.requested, approval.decided]
        v:
          type: integer
          enum: [1]
        ts:
          type: integer
          format: int64
          minimum: 0
        payload:
          type: object
          description: >
            Normalized progress, plan, approval, or terminal lifecycle summary.
            Terminal created/ended uses agent.status with terminal_event and an
            optional exit_code; raw terminal bytes never enter this object.
          additionalProperties: true

    EndWorkSessionRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ended]
        exitCode:
          type: integer
          format: int32
          description: Optional last tool result; an idle session preserves its recorded value.

    SetWorkSessionIdleRequest:
      type: object
      required: [status, exitCode]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [idle]
        exitCode:
          type: integer
          format: int32
          description: Result of the tool execution that just completed; not a session exit code.

    SetWorkSessionRunningRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [running]

    ResumeWorkSessionRequest:
      type: object
      required: [targetHostId]
      properties:
        targetHostId:
          type: string
          format: uuid
          description: Active registered host allowed by the effective tier policy.

    PutWorkTierPolicyRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [t1_only, ask, auto]
          default: ask
        autoTarget:
          type: string
          description: Required only for auto; a work_host UUID or the reserved cloud selector.
          pattern: '^(cloud|[0-9a-fA-F-]{36})$'

    WorkTierPolicy:
      type: object
      required: [workspaceId, mode, inherited]
      properties:
        workspaceId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
          description: Present for a member override or inherited effective member policy.
        mode:
          type: string
          enum: [t1_only, ask, auto]
        autoTarget:
          type: string
          description: Concrete work_host UUID or the reserved cloud selector in auto mode.
        inherited:
          type: boolean
        updatedAtMs:
          type: integer
          format: int64
          description: Absent for the virtual ask default.

    WorkTierPolicyResponse:
      type: object
      required: [workTierPolicy]
      properties:
        workTierPolicy:
          $ref: "#/components/schemas/WorkTierPolicy"

    UpdateWorkSessionObservationRequest:
      type: object
      required: [observation]
      additionalProperties: false
      properties:
        observation:
          type: string
          enum: [open, owner_only]

    WorkSession:
      type: object
      required:
        [id, workspaceId, channelId, memberId, hostId, rootMessageId,
         tool, label, status, observation, observerGrantCount,
         remoteAttachAvailable, remoteDisplayAvailable, startedAtMs]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
        rootMessageId:
          type: string
          format: uuid
        tool:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
        label:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [running, idle, orphaned, ended]
        observation:
          type: string
          enum: [open, owner_only]
        observerGrantCount:
          type: integer
          format: int64
          minimum: 0
          description: >
            Currently valid observer capabilities only; expired or invalid
            grants are excluded. Deliberately kind-blind since LIVE-1: a
            teammate watching the live screen is watching, and one 관전자 수 is
            what every surface publishes.
        remoteAttachAvailable:
          type: boolean
          description: True only when the session has a complete remote PTY binding; endpoint and capability remain unprojected.
        remoteDisplayAvailable:
          type: boolean
          description: >
            True only when the session has a complete WebRTC display binding
            (ADR-0165); the signalling endpoint and the capability remain
            unprojected, exactly as the PTY pair's do. Independent of
            remoteAttachAvailable: a session can offer a screen and no terminal,
            or the reverse, and a client that folds them offers the wrong verb.
        controlStartedAt:
          type: integer
          format: int64
          description: >
            Epoch milliseconds at which somebody took this session's keyboard,
            present only while they still hold it (LIVE-5a). ABSENT means nobody
            does — a 0 would render as 1970.
            This is the field a reload reads. The work.session.control envelope
            says the same thing over the wire, but Centrifugo is transport and a
            surface that only heard it forgets on refresh; the value here comes
            from the display_control_window ledger, which is the source of truth
            for the boundary. The login-handoff card's control_* props are a
            second, narrower projection of that same ledger and are not it.
            WHO holds the keyboard is deliberately absent, matching the
            broadcast: control is owner-only, so "somebody has control" is all a
            reader or an agent needs to behave correctly, and nothing the person
            types is reachable from here or from anything this links to
            (ADR-0004 증보 3 D2).
            While it is present the session is forced to observation=owner_only,
            and the owner's own setting is restored when the window closes by
            any of its three routes.
        startedAtMs:
          type: integer
          format: int64
        endedAtMs:
          type: integer
          format: int64
          description: Present only after the session ends.
        exitCode:
          type: integer
          format: int32
          description: Last tool execution result; it remains present across idle-to-running.
        endReason:
          type: string
          enum: [orphaned, resumed, idle_timeout]
          description: Terminal host-loss, lineage resume, or idle-timeout reason.
        resumedFromSessionId:
          type: string
          format: uuid
          description: Source orphaned session; the root thread remains unchanged.

    WorkSessionResponse:
      type: object
      required: [workSession]
      properties:
        workSession:
          $ref: "#/components/schemas/WorkSession"

    WorkSessionListResponse:
      type: object
      required: [workSessions]
      properties:
        workSessions:
          type: array
          items:
            $ref: "#/components/schemas/WorkSession"

    Workstream:
      type: object
      required:
        [id, workspaceId, channelId, rootMessageId, goal, status,
         createdByMemberId, createdAtMs, updatedAtMs, runCount, activeRunCount]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        rootMessageId:
          type: string
          format: uuid
          description: Anchor thread root. The workstream extends the thread; it does not replace it.
        goal:
          type: string
          minLength: 1
          maxLength: 200
          description: >
            Goal statement. Implicit creation seeds it from the first Run's label;
            explicit declaration and editing are ADR-0143 P2.
        status:
          type: string
          enum: [active, paused, done, cancelled]
        createdByMemberId:
          type: string
          format: uuid
          description: >
            Provenance of the first Run only. Resume eligibility derives from
            channel membership, never from this member.
        createdAtMs:
          type: integer
          format: int64
        updatedAtMs:
          type: integer
          format: int64
        runCount:
          type: integer
          format: int64
          minimum: 0
        activeRunCount:
          type: integer
          format: int64
          minimum: 0
          description: Runs currently running or idle.

    WorkstreamRun:
      type: object
      required: [id, memberId, hostId, tool, label, status, startedAtMs]
      properties:
        id:
          type: string
          format: uuid
          description: work_session id of this Run.
        memberId:
          type: string
          format: uuid
          description: The member who executed this Run. Immutable execution record.
        hostId:
          type: string
          format: uuid
        tool:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
        label:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [running, idle, orphaned, ended]
        startedAtMs:
          type: integer
          format: int64
        endedAtMs:
          type: integer
          format: int64
        exitCode:
          type: integer
          format: int32
        endReason:
          type: string
          enum: [orphaned, resumed, idle_timeout]
        resumedFromSessionId:
          type: string
          format: uuid
          description: Lineage of the Run this one continued, inside the same workstream.

    WorkstreamResponse:
      type: object
      required: [workstream]
      properties:
        workstream:
          $ref: "#/components/schemas/Workstream"

    WorkstreamListResponse:
      type: object
      required: [workstreams]
      properties:
        workstreams:
          type: array
          items:
            $ref: "#/components/schemas/Workstream"

    WorkstreamRunListResponse:
      type: object
      required: [workstreamId, runs]
      properties:
        workstreamId:
          type: string
          format: uuid
        runs:
          type: array
          items:
            $ref: "#/components/schemas/WorkstreamRun"

    TerminalAttachCapabilityResponse:
      type: object
      required: [attach_endpoint, capability_token, pty_id]
      properties:
        attach_endpoint:
          type: string
          description: Credential-free direct HTTPS or WSS host endpoint.
        capability_token:
          type: string
          description: >
            Opaque 60-second bearer returned once. Only its SHA-256 digest is
            persisted; host-side validation also requires a live host signature.
        pty_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'

    IssueTerminalAttachRequest:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [controller, observer]
          default: controller

    ValidateTerminalAttachRequest:
      type: object
      required: [capability_token]
      properties:
        capability_token:
          type: string
          description: Opaque grant presented by the direct client to its target host.
        stream:
          type: boolean
          default: false
          description: >
            True when the host is re-checking a stream it has already accepted
            rather than admitting a new client. It relaxes exactly one clause,
            the capability expiry, because that TTL bounds the mint-to-dial
            window and the host closed that window under a full validation.
            Every authorization clause still applies on every call, so an open
            terminal is cut within one revalidation period when the session
            ends, the host is revoked, observation closes, the grantee leaves
            the channel, or the grantee is deactivated.

    TerminalAttachValidationResponse:
      type: object
      required: [work_session_id, pty_id, expires_at, mode]
      properties:
        work_session_id:
          type: string
          format: uuid
        pty_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        expires_at:
          type: string
          format: date-time
          description: PostgreSQL timestamptz capability expiry.
        mode:
          type: string
          enum: [controller, observer]
          description: Host authorization grade; observer forbids send_stdin, resize, and kill.

    # ---- Display attach (LIVE-1 / ADR-0165) ---------------------------------
    IssueDisplayAttachRequest:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [observer, controller]
          default: observer
          description: >
            observer watches; controller also takes the keyboard, opens a
            control window and stops the agent's reach into this session for as
            long as it stands (ADR-0004 증보 3, LIVE-3). Only the session owner
            may ask for controller.
            The default stays observer now that both are spellable, and that is
            a decision rather than a leftover: a default is what a client gets
            when it did not consider the question, and "did you mean to stop the
            agent and take the keyboard" is never answered by silence.

    IceServer:
      type: object
      required: [urls, username, credential]
      description: >
        One entry of the browser's RTCConfiguration.iceServers, in the W3C's own
        spelling because a client hands the array to RTCPeerConnection
        unchanged. The credential is minted per work session and expires on its
        own (coturn use-auth-secret): username is "<unix expiry>:<work session
        id>" and the password is derived rather than stored, so there is no row
        to leak and nothing to rotate but the relay's own shared secret. The
        relay is oort-operated and never a third party's (ADR-0165 D3) — momo
        hands out the credential and still carries no media, sees no candidate
        and terminates nothing.
      properties:
        urls:
          type: array
          items:
            type: string
            maxLength: 2048
          description: One relay, listed once per transport (udp and tcp).
        username:
          type: string
        credential:
          type: string

    DisplayAttachCapabilityResponse:
      type: object
      required:
        [display_endpoint, capability_token, display_id, mode, ice_servers]
      properties:
        display_endpoint:
          type: string
          maxLength: 2048
          description: >
            The HOST's own credential-free WSS WebRTC signalling endpoint.
            Userinfo, query and fragment are forbidden. momo proxies neither the
            signalling nor the media that follows it.
        capability_token:
          type: string
          description: >
            Opaque 60-second bearer returned once. Only its SHA-256 digest is
            persisted; producer-side validation also requires a live host
            signature. Same grammar as a terminal capability — the kind is a
            ledger column, not a second token format.
        display_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        mode:
          type: string
          enum: [observer, controller]
          description: >
            The grade actually minted, so a UI can say "view only" before the
            socket is dialled — a view-only stream that looks identical to a
            controllable one is how a person ends up typing into a window that
            will never deliver a keystroke.
        control_started_at:
          type: integer
          format: int64
          description: >
            Epoch milliseconds at which the control window opened. Present only
            on a controller grant. The caller's own copy of the boundary event
            the work.session.control envelope carries, so the surface can say
            when control began without waiting for the relay.
        ice_servers:
          type: array
          items:
            $ref: "#/components/schemas/IceServer"
          description: >
            The oort relay this grant may allocate through, with a credential
            minted for this session. ALWAYS PRESENT, and EMPTY on an instance
            that was given no relay policy — a client must read empty as "use
            what you were already configured with", never as an error. During
            the credential retirement that configuration is the static
            long-term credential the producer template still carries, and the
            overlap is deliberate: the ephemeral path is proved beside the
            static one before the static one is removed from a relay carrying
            production traffic.

    DisplayControlReturnResponse:
      type: object
      required: [closed]
      properties:
        closed:
          type: boolean
          description: >
            Whether THIS call ended a standing control window. false means there
            was nothing open — a retried return, or a window that had already
            lapsed or ended with the session. Both are success; the status code
            is 200 either way and the flag is what tells them apart.
        control_started_at:
          type: integer
          format: int64
          description: Epoch ms, present only when this call closed a window.
        control_ended_at:
          type: integer
          format: int64
          description: Epoch ms, present only when this call closed a window.

    PublishDisplayBindingRequest:
      type: object
      required: [displayId, displayEndpoint]
      additionalProperties: false
      description: >
        MomoHost-signed publication of the WebRTC display binding for a running
        or idle session the caller already owns. Writing a DIFFERENT binding
        onto a session that already has one is 409; re-sending the identical
        pair is idempotent. The server stores and authorizes the endpoint and
        never carries a frame.
      properties:
        displayId:
          type: string
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        displayEndpoint:
          type: string
          maxLength: 2048
          description: >
            Credential-free HTTPS or WSS WebRTC signalling endpoint. Userinfo,
            query, and fragment are forbidden.

    ValidateDisplayAttachRequest:
      type: object
      required: [capability_token]
      additionalProperties: false
      properties:
        capability_token:
          type: string
          description: Opaque grant presented by the browser to the sandbox producer.
        stream:
          type: boolean
          default: false
          description: >
            True when the producer is re-checking a peer connection it already
            serves rather than admitting a new viewer. It relaxes exactly one
            clause, the capability expiry, because that TTL bounds the
            mint-to-dial window and the producer closed that window under a full
            validation. A media session outlives its 60-second dial window by
            design, so every other authorization clause still applies on every
            call: a live screen is cut within one revalidation period when the
            session ends, the host is revoked, observation closes, the grantee
            leaves the channel, the grantee is deactivated, or the host stops
            advertising a display.

    DisplayAttachValidationResponse:
      type: object
      required:
        [
          work_session_id,
          display_id,
          expires_at,
          mode,
          input_enabled,
          ice_servers,
        ]
      properties:
        work_session_id:
          type: string
          format: uuid
        display_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        expires_at:
          type: string
          format: date-time
          description: PostgreSQL timestamptz capability expiry.
        mode:
          type: string
          enum: [observer, controller]
          description: >
            The grade of the bearer the producer presented. Migration 076
            dropped 075's observer-only CHECK when ADR-0004 증보 3 was Accepted.
        input_enabled:
          type: boolean
          description: >
            Whether this producer may negotiate an input datachannel RIGHT NOW.
            A negative instruction rather than a status: the view-only guarantee
            lives in a channel that was never opened rather than in a client
            flag anyone could flip (ADR-0165 D4).
            True only when the bearer is a controller grant AND its control
            window still stands, so a returned, lapsed or session-ended window
            answers false at the next re-validation — which is how handing
            control back actually takes the keyboard away instead of merely
            recording that somebody asked for it.
        ice_servers:
          type: array
          items:
            $ref: "#/components/schemas/IceServer"
          description: >
            The producer's copy of the same relay credential the browser is
            served, under the same session subject, so both ends of one media
            path appear in coturn's log under one username.
            Re-minted on EVERY validate, and the shipped producer installs only
            the first: webrtcbin cannot swap a TURN server underneath a running
            ICE agent, so the credential a peer connection was built with is the
            one it dies with. The TTL is therefore that connection's CEILING and
            not a sliding window — past it the stream can no longer allocate or
            refresh a relay, and the screen goes black with nothing user-visible
            to explain it. A new viewer is unaffected: new connection, new
            pipeline, credential minted at the moment they attached. Whether the
            answer is renegotiation or accepting the ceiling is a LIVE-5c
            acceptance criterion, measured on a real host rather than decided
            here. Empty on an instance with no relay policy, in which case the
            producer keeps the static credential delivered to it at create time.

    # ---- Work controls ------------------------------------------------------
    CreateWorkControlRequest:
      type: object
      required: [channelId, runId, targetHostId, kind, payload]
      properties:
        channelId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
          description: Active run bound to the requesting agent and channel.
        targetHostId:
          type: string
          format: uuid
          description: Registered, unrevoked work_host in this workspace.
        sessionId:
          type: string
          format: uuid
          description: Required for input/read/kill and forbidden for spawn.
        kind:
          type: string
          enum: [spawn, input, read, kill]
        payload:
          $ref: "#/components/schemas/WorkControlPayload"

    WorkControlPayload:
      description: >
        Closed field union selected by kind: spawn requires exactly tool+label,
        input exactly text, read accepts only optional tail_lines, and kill is
        empty. No path, cwd, environment, process state, or credential fields
        are accepted.
      type: object
      properties:
        tool:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
        label:
          type: string
          minLength: 1
          maxLength: 120
        text:
          type: string
          minLength: 1
          maxLength: 32768
        tail_lines:
          type: integer
          minimum: 1
          maximum: 9999

    WorkControlAckRequest:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        sessionId:
          type: string
          format: uuid
          description: Required when acknowledging a successful spawn.
        errorLabel:
          type: string
          minLength: 1
          maxLength: 160
          description: Optional bounded display label for a failed control.

    WorkControl:
      type: object
      required:
        [id, workspaceId, channelId, requesterMemberId, targetHostId, kind,
         payload, status, createdAtMs, updatedAtMs]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        requesterMemberId:
          type: string
          format: uuid
        targetHostId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [spawn, input, read, kill]
        payload:
          $ref: "#/components/schemas/WorkControlPayload"
        status:
          type: string
          enum: [pending_approval, approved, denied, dispatched, acked, failed]
        approvalMessageId:
          type: string
          format: uuid
        createdAtMs:
          type: integer
          format: int64
        updatedAtMs:
          type: integer
          format: int64

    WorkControlResponse:
      type: object
      required: [workControl]
      properties:
        workControl:
          $ref: "#/components/schemas/WorkControl"

    WorkAutoApproveResponse:
      type: object
      required: [tool, enabled]
      properties:
        tool:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
        enabled:
          type: boolean

    WorkAutoApprovalsResponse:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          uniqueItems: true
          description: Enabled tool identifiers sorted lexicographically.
          items:
            type: string
            pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'

    EventSubscriptionKind:
      type: string
      enum: [mention, approval_request, work.status_changed]

    EventSubscription:
      type: object
      additionalProperties: false
      required:
        [id, workspaceId, url, eventKinds, enabled, deliveryFailureCount,
         createdBy, updatedBy, createdAtMs, updatedAtMs]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        url: {type: string, format: uri, maxLength: 2048}
        eventKinds:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: {$ref: "#/components/schemas/EventSubscriptionKind"}
        enabled: {type: boolean}
        deliveryFailureCount: {type: integer, minimum: 0}
        disabledAtMs: {type: integer, format: int64}
        disabledReason:
          type: string
          enum: [disabled_by_admin, server_5xx_threshold]
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAtMs: {type: integer, format: int64}
        updatedAtMs: {type: integer, format: int64}

    CreateEventSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [url, eventKinds]
      properties:
        url: {type: string, format: uri, maxLength: 2048}
        eventKinds:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: {$ref: "#/components/schemas/EventSubscriptionKind"}
        enabled: {type: boolean, default: true}

    UpdateEventSubscriptionRequest:
      type: object
      additionalProperties: false
      properties:
        url: {type: string, format: uri, maxLength: 2048}
        eventKinds:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: {$ref: "#/components/schemas/EventSubscriptionKind"}
        enabled: {type: boolean}

    EventSubscriptionResponse:
      type: object
      additionalProperties: false
      required: [eventSubscription]
      properties:
        eventSubscription:
          $ref: "#/components/schemas/EventSubscription"

    EventSubscriptionsResponse:
      type: object
      additionalProperties: false
      required: [eventSubscriptions]
      properties:
        eventSubscriptions:
          type: array
          items: {$ref: "#/components/schemas/EventSubscription"}

    CreatedEventSubscriptionResponse:
      type: object
      additionalProperties: false
      required: [eventSubscription, secret, signatureVersion, algorithm]
      properties:
        eventSubscription:
          $ref: "#/components/schemas/EventSubscription"
        secret:
          type: string
          description: One-time HMAC signing secret. Never returned again.
        signatureVersion: {type: string, enum: [v1]}
        algorithm: {type: string, enum: [HMAC-SHA256]}

    WorkToolLaunchTemplate:
      type: object
      additionalProperties: false
      required: [command, arguments]
      description: Portable host-local command key plus arguments; never an executable path or credential.
      properties:
        command:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        arguments:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 4096

    WorkToolProfile:
      type: object
      required:
        [id, workspaceId, toolKey, displayName, launchTemplate, tierDefaults, envPolicy,
         enabled, createdBy, updatedBy, createdAtMs, updatedAtMs]
