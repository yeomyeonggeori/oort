    UpdateWorkToolProfileRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        launchTemplate:
          $ref: "#/components/schemas/WorkToolLaunchTemplate"
        tierDefaults:
          type: object
          additionalProperties: true
        envPolicy:
          $ref: "#/components/schemas/WorkToolEnvironmentPolicy"
        enabled:
          type: boolean

    WorkToolEnvironmentPolicy:
      type: object
      additionalProperties: false
      description: >
        Child-process environment mode and requested host key names. Values are
