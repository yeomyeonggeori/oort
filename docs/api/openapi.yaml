openapi: 3.0.3

# =============================================================================
# momo REST API — web v0 + plugin surface (MOMO-389/MOMO-459)
#
# This file is the canonical client contract for the web v0 surface. Clients
# (clients/web via openapi-typescript, and MomoCore as a conformance target)
# follow this spec; the spec itself is kept field-level identical to the
# server DTOs in server/Sources/MomoServer/Routes/DTOs.swift and the Routes/*
# handlers. Drift between this spec and the running server is detected by
# scripts/verify_openapi_contract.sh (docs/LOCAL_PR_GATE.md).
#
# Scope: web v0 (ADR-0119 D5-A) plus admin agent creation, the plugin
# registry/grant, incoming webhook, hosted Drive MCP, and interactive Work
# Console control surfaces. Other routes (invite admin,
# workspace identity, agent credentials/runs, cost projection, platform admin,
# centrifugo proxy, health) remain intentionally undocumented here.
#
# Encoding rules (server truth):
# - Optional response fields are OMITTED when absent (Swift encodeIfPresent);
#   they are never serialized as JSON null. Fields listed under `required`
#   are always present.
# - Object schemas in this spec are CLOSED for the drift gate: a response key
#   that is not listed here is contract drift. Arbitrary-shape fields are the
#   explicit exceptions (Message.props, ApprovalProjection.payload).
# - Timestamps are epoch milliseconds and carry an `AtMs`/`_ms`/`Ms` suffix.
# - UUID casing is mixed by design: values that pass through Swift
#   Foundation.UUID are UPPERCASE; values passed through from PostgreSQL JSON
#   are lowercase. Clients must compare UUIDs case-insensitively.
# - Message ordering authority is `message.seq` per channel (L4 §3.1);
#   realtime is transport-only and REST backfill uses `?after=<seq>`.
# =============================================================================

info:
  title: momo REST API (web v0 + plugin surface)
  version: 0.1.0
  description: >
    Canonical REST contract for the momo web v0 client surface:
    login/refresh/logout, public invite join, realtime token issuance,
    workspace roster, channels (list/create), messages (send/history with
    seq-cursor pagination and `?after=` backfill), read-state (bulk read +
    cursor advance), direct messages (list/open), and approvals
    (list/decision), plugin registry/grants, incoming webhooks, and the hosted
    read-only Drive MCP endpoint, and ADR-0114 Work Console sessions and
    controls, plus the fresh-database agent creation boundary. Mirrors
    MomoServer field by field.

servers:
  - url: /
    description: >
      Same-origin deployment (ADR-0119 D1-A). The web SPA and the `/v1/*` API
      are served from one origin; the realtime WebSocket address is NOT
      derived from this origin — the only authority is the
      `realtimeWebSocketUrl` field returned by login/join (ADR-0110).

tags:
  - name: auth
    description: Session token issuance, rotation, revocation, realtime token.
  - name: join
    description: Public invite self-signup (no auth required).
  - name: roster
    description: Workspace member roster.
  - name: membership-admin
    description: ADR-0128 workspace/channel roles, suspension, removal, and bans.
  - name: agents
    description: Human-admin agent identity creation; channel membership and credentials remain explicit follow-up steps.
  - name: channels
    description: Workspace channels.
  - name: huddles
    description: Channel-bound ephemeral voice huddle lifecycle and LiveKit room grants.
  - name: work-hosts
    description: Registered execution hosts authenticated by Ed25519 heartbeats.
  - name: work-sessions
    description: Host-owned interactive work session ledger bound to channel thread roots.
  - name: work-pool
    description: Workspace-shared concurrent work-session quota and current derived usage.
  - name: work-controls
    description: Agent-requested, human-gated controls dispatched to a user-owned execution host.
  - name: work-tool-profiles
    description: Workspace-admin tool catalog and enabled host launch projection.
  - name: messages
    description: Channel messages — the single write path (REST -> PG -> outbox).
  - name: attachments
    description: Drive archive resumable uploads, completion, and authorized content proxy.
  - name: read-state
    description: ADR-0109 per-member read cursors and unread/mention counts.
  - name: dms
    description: 1:1 direct message channels.
  - name: approvals
    description: Human-in-the-loop approval projections and decisions.
  - name: plugins
    description: Plugin catalog, workspace installation, delegated grants, and tool policy.
  - name: webhooks
    description: Incoming webhook installation management and public ingress.
  - name: mcp
    description: Hosted MCP JSON-RPC endpoints for agent bearers.
  - name: memories
    description: ADR-0129 workspace memory lifecycle, source links, and admin policy.

paths:
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      summary: Log in with email/password and receive a session token pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credentials verified; session issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: authRefresh
      summary: Rotate a refresh token into a new access/refresh pair.
      description: >
        Single-use rotation (MOMO-300): the presented refresh token is revoked
        atomically; replaying it returns 401. Exactly one concurrent caller
        wins.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New token pair issued; the old refresh token is dead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          description: Invalid, expired, revoked, or already-used refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Member is no longer active in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: Revoke the presented session tokens (idempotent).
      description: >
        Requires a signature-valid access token in the Authorization header
        (an already-revoked access token still gets a 200 — logging out twice
        is idempotent, reported via `alreadyRevoked`). The optional body may
        carry the session's refresh token so the whole session dies at once;
        a refresh token belonging to another member/workspace is rejected
        with 403.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Revocation outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          description: Missing/invalid access token signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Body refresh token does not match this session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/auth/realtime-token:
    post:
      tags: [auth]
      operationId: authRealtimeToken
      summary: Issue a short-lived Centrifugo connection JWT.
      description: >
        The returned token authenticates the WebSocket connection at the
        server-owned `realtimeWebSocketUrl` (ADR-0110). Requires the
        `messages:read` scope for humans.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Connection token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Missing scope or member no longer active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/join:
    post:
      tags: [join]
      operationId: publicJoin
      summary: Join a workspace with an invite code (public, no auth).
      description: >
        Redeems a high-entropy invite code, creating (201) or reusing (200) a
        human member, granting membership in every joinable public channel,
        and issuing a session token pair. Snake-case body aliases accepted by
        the server: `display_name`, `time_zone`/`tz`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequest"
      responses:
        "201":
          description: New member created and joined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResponse"
        "200":
          description: Existing member (same email) re-joined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResponse"
        "400":
          description: Invalid code/email/displayName/handle/password shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role escalation or non-joinable member state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invite code is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already redeemed, exhausted, or no joinable channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Invite code expired or revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/roster:
    get:
      tags: [roster]
      operationId: getRoster
      summary: List active workspace members (humans and agents).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: kind
          in: query
          required: false
          description: Filter by member kind. Alias accepted by the server, `member_kind`.
          schema:
            type: string
            enum: [human, agent]
        - name: limit
          in: query
          required: false
          description: Page size, clamped to 1..500.
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Active workspace roster, restricted to shared-channel members for guests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRosterResponse"
        "400":
          description: kind must be human or agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/members:
    get:
      tags: [roster]
      operationId: getRosterMembersAlias
      summary: Compatibility alias of the roster endpoint.
      description: Same handler, parameters, and response as `/roster`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [human, agent]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Roster of active members with an active channel membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRosterResponse"
        "400":
          description: kind must be human or agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/members/{memberId}/role:
    patch:
      tags: [membership-admin]
      operationId: changeWorkspaceMemberRole
      summary: Change a workspace role under the owner/admin hierarchy.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangeMembershipRoleRequest"}
      responses:
        "200":
          description: Workspace role changed and audited.
          content: {application/json: {schema: {$ref: "#/components/schemas/MembershipRoleResponse"}}}
        "400": {description: Invalid role or member id, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: Workspace member not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "409": {description: The change would remove the last owner, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/members/me:
    delete:
      tags: [membership]
      operationId: leaveWorkspace
      summary: Leave the workspace and revoke the caller's sessions.
      description: >
        Human active members only. Removes all channel memberships and the
        workspace membership, transitions the caller to deleted, revokes every
        token, and preserves authored messages. The final active owner must
        transfer ownership before leaving.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/WorkspaceId"}]
      responses:
        "200": {description: Workspace left and all caller tokens revoked, content: {application/json: {schema: {$ref: "#/components/schemas/MembershipLifecycleResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: Caller is the last active owner, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/channels/{channelId}/members/me:
    delete:
      tags: [membership]
      operationId: leaveChannel
      summary: Leave a public or private channel.
      description: >
        Direct-message channels cannot be left. A private channel is archived
        atomically when its final active member leaves.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200": {description: Channel membership ended, content: {application/json: {schema: {$ref: "#/components/schemas/ChannelLeaveResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Direct-message leave is forbidden, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "404": {description: Active channel membership not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/channels/{channelId}/members/{memberId}/role:
    patch:
      tags: [membership-admin]
      operationId: changeChannelMemberRole
      summary: Change a channel role under workspace/channel admin hierarchy.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangeMembershipRoleRequest"}
      responses:
        "200":
          description: Channel role changed and audited.
          content: {application/json: {schema: {$ref: "#/components/schemas/MembershipRoleResponse"}}}
        "400": {description: Invalid role or identifier, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: Active channel membership not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/members/{memberId}/suspend:
    post:
      tags: [membership-admin]
      operationId: suspendWorkspaceMember
      summary: Suspend a member and revoke all of their tokens.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Member suspended, content: {application/json: {schema: {$ref: "#/components/schemas/MembershipLifecycleResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: Workspace member not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "409": {description: Invalid transition or last-owner invariant, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/members/{memberId}/reinstate:
    post:
      tags: [membership-admin]
      operationId: reinstateWorkspaceMember
      summary: Return a suspended member to active status.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Member reinstated; previously revoked tokens remain revoked, content: {application/json: {schema: {$ref: "#/components/schemas/MembershipLifecycleResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: Workspace member not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "409": {description: Member is not suspended, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/members/{memberId}:
    delete:
      tags: [membership-admin]
      operationId: removeWorkspaceMember
      summary: Remove a member while preserving authored message history.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RemoveWorkspaceMemberRequest"}
      responses:
        "200": {description: Memberships removed, status deleted, and tokens revoked, content: {application/json: {schema: {$ref: "#/components/schemas/MembershipLifecycleResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: Workspace member not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "409": {description: The member is the last active owner, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/bans:
    get:
      tags: [membership-admin]
      operationId: listWorkspaceBans
      summary: List the workspace ban ledger (admin only).
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/WorkspaceId"}]
      responses:
        "200": {description: Ban ledger, content: {application/json: {schema: {$ref: "#/components/schemas/WorkspaceBanListResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [membership-admin]
      operationId: createWorkspaceBan
      summary: Ban an email and/or handle from invite redemption and public join.
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/WorkspaceId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CreateWorkspaceBanRequest"}}}
      responses:
        "201": {description: Ban created and audited, content: {application/json: {schema: {$ref: "#/components/schemas/WorkspaceBanResponse"}}}}
        "400": {description: Neither valid email nor handle supplied, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: A matching ban already exists, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/bans/{banId}:
    delete:
      tags: [membership-admin]
      operationId: deleteWorkspaceBan
      summary: Delete a workspace ban and permit future rejoin.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: banId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Deleted ban, content: {application/json: {schema: {$ref: "#/components/schemas/WorkspaceBanResponse"}}}}
        "400": {description: Invalid ban id, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: Ban not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}

  /v1/workspaces/{workspaceId}/audit:
    get:
      tags: [membership-admin]
      operationId: listWorkspaceAudit
      summary: Read the tenant audit ledger (owner/admin only).
      description: >
        Stable newest-first keyset pagination over `(created_at, id)`. `actions`
        is a comma-separated list of action prefixes. The target member filter
        applies to `subject_member_id`; time bounds are inclusive epoch
        milliseconds. Snake-case filter aliases are canonical, with camelCase
        aliases accepted by the server.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - {name: actions, in: query, schema: {type: string}, description: Comma-separated action prefixes.}
        - {name: target_member_id, in: query, schema: {type: string, format: uuid}}
        - {name: from_ms, in: query, schema: {type: integer, format: int64, minimum: 0}}
        - {name: to_ms, in: query, schema: {type: integer, format: int64, minimum: 0}}
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200": {description: Filtered audit page, content: {application/json: {schema: {$ref: "#/components/schemas/AuditPageResponse"}}}}
        "400": {description: Invalid filter or cursor, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/workspaces/{workspaceId}/agents:
    post:
      tags: [agents]
      operationId: createAgent
      summary: Create an active first-class agent member (workspace admin only).
      description: >
        Human owner/admin bearer only. The member(kind=agent), agent profile,
        and agent.created audit row commit in one tenant transaction. This
        operation intentionally creates no channel membership and issues no
        bearer credential. Pairing continues by calling the existing
        `POST /v1/workspaces/{workspaceId}/channels/{channelId}/members` and
        `POST /v1/workspaces/{workspaceId}/agents/{agentId}/credentials`
        routes. baseUrl never accepts userinfo/query/fragment credential
        material; non-loopback endpoints require HTTPS, while loopback HTTP
        requires the server's explicit local-only opt-in.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "201":
          description: Agent identity created without channel membership or credential issuance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAgentResponse"
        "400":
          description: Invalid identity, owner, endpoint, config, or credential-shaped input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not a human workspace owner/admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The normalized handle already exists in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/agents/from-card:
    post:
      tags: [agents]
      operationId: registerAgentFromCard
      summary: Fetch an A2A v0.3 Agent Card for administrator consent.
      description: >
        Human workspace owner/admin only. The server fetches
        `/.well-known/agent-card.json` with a five-second timeout, a 256KB
        response limit, at most two manually validated redirects, and DNS/IP
        SSRF checks on every hop. HTTPS is required except for an explicit
        local-development opt-in. A successful parse stores public card
        provenance and display-only security requirements with
        status=pending_consent; failures persist nothing. Provider credentials
        and secret-shaped card fields are rejected.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterAgentCardRequest"}
      responses:
        "201":
          description: Public card metadata is pending administrator consent.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentCardRegistrationResponse"}
        "400":
          description: Unsafe URL, failed fetch, redirect violation, oversize response, or invalid card.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/agents/from-card/{registrationId}/confirm:
    post:
      tags: [agents]
      operationId: confirmAgentFromCard
      summary: Confirm a pending Agent Card and issue its first gateway bearer.
      description: >
        Human workspace owner/admin only. The member(kind=agent), agent row,
        workspace membership, one-time per-agent gateway bearer digest,
        registration transition, and audit rows commit in one tenant
        transaction. The raw bearer is returned once with no-store headers;
        no card-provided credential is accepted or persisted.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: registrationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "201":
          description: Agent member and initial gateway credential created atomically.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConfirmAgentCardResponse"}
        "400":
          description: Invalid registration identifier.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: Pending registration not found in this workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "409":
          description: Registration was already confirmed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/channels:
    get:
      tags: [channels]
      operationId: listChannels
      summary: List channels the authenticated member belongs to.
      description: >
        Returns public/private/dm channels where the caller has an active
        membership, ordered public -> private -> dm, then by name.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: include_archived
          in: query
          required: false
          description: Include archived channels when `true`. CamelCase alias accepted by the server, `includeArchived`.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          description: Page size, clamped to 1..500.
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Channels visible to the member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceChannelsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [channels]
      operationId: createChannel
      summary: Create a public/private channel (workspace admin only).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "201":
          description: Channel created with the creator as channel owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateChannelResponse"
        "400":
          description: Invalid kind/name/topic shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not a workspace owner/admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Channel name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/channels/{channelId}/notification-pref:
    put:
      tags: [channels]
      operationId: updateChannelNotificationPref
      summary: Mute or unmute push notifications for one channel.
      description: >
        Active channel members only. `muted: true` stores an indefinite mute;
        `muted: false` deletes the preference. Mute suppresses every push
        reason, including mentions and approval requests, without changing
        unread/read-state.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationPrefRequest"
      responses:
        "200":
          description: The effective channel mute state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPrefResponse"
        "400":
          description: Invalid request body or identifiers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Active channel membership required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/channels/{channelId}/huddles:
    post:
      tags: [huddles]
      operationId: startHuddle
      summary: Start the channel huddle, or return the existing active huddle.
      description: Lifecycle, audit, and realtime event outbox commit in one tenant transaction.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: An active huddle already existed (idempotent replay).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HuddleResponse"
        "201":
          description: Huddle created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HuddleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HuddleNotConfigured"

  /v1/workspaces/{workspaceId}/channels/{channelId}/huddles/active:
    get:
      tags: [huddles]
      operationId: getActiveHuddle
      summary: Get the active huddle and current participants for a channel badge.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: Active huddle when present; otherwise the optional field is omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveHuddleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HuddleNotConfigured"

  /v1/workspaces/{workspaceId}/huddles/{huddleId}/join:
    post:
      tags: [huddles]
      operationId: joinHuddle
      summary: Join or reissue a 10-minute LiveKit room grant.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/HuddleId"
      responses:
        "200":
          description: Current presence plus a freshly issued LiveKit access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinHuddleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Huddle ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/HuddleNotConfigured"

  /v1/workspaces/{workspaceId}/huddles/{huddleId}/leave:
    post:
      tags: [huddles]
      operationId: leaveHuddle
      summary: Leave a huddle; the last participant atomically ends it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/HuddleId"
      responses:
        "200":
          description: Updated huddle and whether this leave ended it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveHuddleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Caller has no current presence to leave.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/HuddleNotConfigured"

  /v1/workspaces/{workspaceId}/work-hosts:
    post:
      tags: [work-hosts]
      operationId: registerWorkHost
      summary: Register an execution host for a member or workspace.
      description: >
        Human bearer only. Any active workspace member may register either
        scope; ownerMemberId is always the registering member. The row and
        work.host.registered audit event commit in one tenant transaction.
        Capabilities are boolean tool-availability flags only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWorkHostRequest"
      responses:
        "201":
          description: Host registered offline until its first signed heartbeat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkHostResponse"
        "400":
          description: Invalid scope, type, display name, public key, or capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Agent bearer, workspace mismatch, or inactive membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      tags: [work-hosts]
      operationId: listWorkHosts
      summary: List registered and revoked hosts in the workspace.
      description: >
        Human members poll this v0 projection. Online is server-computed from
        the signed lastSeenAtMs window and is always false for revoked hosts.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Hosts ordered oldest-first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkHostListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-hosts/{workHostId}/heartbeat:
    post:
      tags: [work-hosts]
      operationId: heartbeatWorkHost
      summary: Refresh host liveness with an Ed25519 signature.
      description: >
        Public signature-authenticated endpoint. The host signs the exact UTF-8
        bytes `momo.work_host.heartbeat.v1\\n<lowercase workspace UUID>\\n<lowercase
        host UUID>\\n<sentAtMs>`. Timestamps outside the five-minute clock-skew
        window, forged signatures, unknown hosts, and revoked hosts return 401.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkHostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkHostHeartbeatRequest"
      responses:
        "200":
          description: Host liveness refreshed with server time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkHostResponse"
        "400":
          description: Invalid path identifiers or request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-hosts/{workHostId}/pending-controls:
    get:
      tags: [work-hosts, work-controls]
      operationId: listPendingWorkHostControls
      summary: Poll dispatched controls targeted at this execution host.
      description: >
        ADR-0125 D2 outbound-only transport. The host signs the exact UTF-8
        bytes `momo.work_host.request.v1\nGET\n<path>\n<lowercase workspace
        UUID>\n<lowercase host UUID>\n<sentAtMs>` with its registered Ed25519
        key. Only unrevoked status=dispatched controls targeted at that host
        are returned; no human or agent bearer is accepted.
      security:
        - workHostAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkHostId"
        - $ref: "#/components/parameters/WorkHostSentAt"
        - $ref: "#/components/parameters/WorkHostSignature"
      responses:
        "200":
          description: Bounded oldest-first dispatched controls for this host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingWorkControlsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-hosts/{workHostId}/terminal-attach/validate:
    post:
      tags: [work-hosts, work-sessions]
      operationId: validateTerminalAttachCapability
      summary: Validate a direct terminal attach capability as its target host.
      description: >
        MomoHost-signed control-plane check performed immediately before the
        direct PTY host accepts a client connection. The opaque bearer is
        matched by SHA-256 digest; the raw token is never persisted or logged.
        Validation joins the running work_session and unrevoked work_host on
        every call, so expiry, session end, and host revoke take effect
        immediately. The returned mode is authoritative: observer connections
        may receive output but the host must reject send_stdin, resize, and kill.
        This endpoint returns binding metadata only: terminal
        bytes never traverse MomoServer, OutboxRelay, or Centrifugo.
      security:
        - workHostAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkHostId"
        - $ref: "#/components/parameters/WorkHostSentAt"
        - $ref: "#/components/parameters/WorkHostSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateTerminalAttachRequest"
      responses:
        "200":
          description: Capability is live and bound to this host and PTY.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalAttachValidationResponse"
        "400":
          description: Invalid path identifier or request body shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid host signature or unknown, expired, ended, or revoked capability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: A human or agent bearer attempted host-side validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-hosts/{workHostId}:
    delete:
      tags: [work-hosts]
      operationId: revokeWorkHost
      summary: Revoke a host and block future control dispatch.
      description: >
        The registering owner or a workspace owner/admin may revoke. Revocation
        is durable and audited in the same tenant transaction; pending approval
        controls can no longer dispatch and settle failed with host_revoked.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkHostId"
      responses:
        "200":
          description: Revoked host projection; repeat revoke is idempotent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkHostResponse"
        "400":
          description: Invalid host identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is neither the registering owner nor workspace admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Host does not exist in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-pool:
    get:
      tags: [work-pool]
      operationId: getWorkPool
      summary: Read workspace work-pool settings and current derived usage.
      description: >
        Available to active human workspace members. Usage is counted from
        running work_session rows; no mutable active counter exists. A missing
        settings row is created with v0 defaults in the same tenant transaction.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Pool settings, workspace usage, and caller usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkPoolResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Active human workspace membership required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      tags: [work-pool]
      operationId: updateWorkPool
      summary: Replace workspace work-pool settings as an owner or admin.
      description: >
        The settings update and work.pool.updated audit row commit in the same
        tenant transaction. Lowering a cap does not preempt running sessions;
        subsequent creates remain rejected until derived usage is below it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkPoolRequest"
      responses:
        "200":
          description: Updated settings and current derived usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkPoolResponse"
        "400":
          description: Invalid cap, included hours, or per-member soft limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Workspace owner or admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-sessions:
    post:
      tags: [work-sessions]
      operationId: createWorkSession
      summary: Create a running host session and its channel thread-root card.
      description: >
        The work_session row, authoritative message seq, system card,
        message.new outbox, and no-version work.session.started outbox commit in
        one tenant transaction. Host-local cwd/path/process and credentials are
        deliberately absent.
      security:
        - bearerAuth: []
        - workHostAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkSessionRequest"
      responses:
        "201":
          description: Session ledger row and channel card created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSessionResponse"
        "400":
          description: Invalid identifiers, tool, or label.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Active channel membership required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            No session was created. error.message is the stable machine-readable
            reason pool_exhausted or member_limit. v0 does not enqueue or emit an
            outbox event; automatic queue start and waiting-card UX are follow-ups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      tags: [work-sessions]
      operationId: listWorkSessions
      summary: List sessions in channels visible to the authenticated member.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: active
          in: query
          required: false
          description: Set to 1 to return running sessions only; 0 or omitted returns all.
          schema:
            type: integer
            enum: [0, 1]
      responses:
        "200":
          description: Sessions ordered newest-first, bounded to 200 rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSessionListResponse"
        "400":
          description: Invalid active filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-tier-policy:
    get:
      tags: [work-sessions]
      operationId: getWorkspaceWorkTierPolicy
      summary: Read the workspace-default host-loss fallback policy.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Stored default, or the virtual ask default when no row exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkTierPolicyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Workspace owner or admin role required.
    put:
      tags: [work-sessions]
      operationId: putWorkspaceWorkTierPolicy
      summary: Replace the workspace-default host-loss fallback policy.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutWorkTierPolicyRequest"
      responses:
        "200":
          description: Updated policy and same-transaction audit record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkTierPolicyResponse"
        "400":
          description: Invalid mode or auto target.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Workspace owner or admin role required.
        "409":
          description: Concrete auto target is unavailable or not workspace-scoped.

  /v1/workspaces/{workspaceId}/work-tier-policy/me:
    get:
      tags: [work-sessions]
      operationId: getMyWorkTierPolicy
      summary: Read the caller's effective fallback policy and inheritance state.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Member override, inherited workspace default, or virtual ask default.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkTierPolicyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Active human membership required.
    put:
      tags: [work-sessions]
      operationId: putMyWorkTierPolicy
      summary: Replace the caller's member-specific fallback policy override.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutWorkTierPolicyRequest"
      responses:
        "200":
          description: Updated member override and same-transaction audit record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkTierPolicyResponse"
        "400":
          description: Invalid mode or auto target.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Active human membership required.
        "409":
          description: Concrete auto target is unavailable or outside the member scope.
  /v1/workspaces/{workspaceId}/work-sessions/{workSessionId}:
    patch:
      tags: [work-sessions]
      operationId: endWorkSession
      summary: End a running session or change its observation policy.
      description: >
        The creating member, or the MomoHost-signed execution host bound to the
        session, may end it. The ledger row and card props update beside a
        no-version work.session.ended outbox; the message row is not edited and
        no channel seq is minted. A human session owner may instead set
        observation to open or owner_only; owner_only invalidates live observer
        grants and blocks new ones.
      security:
        - bearerAuth: []
        - workHostAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkSessionRequest"
      responses:
        "200":
          description: Ended session, or its prior result on an idempotent retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSessionResponse"
        "400":
          description: Invalid session id, status, or body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not the owner or no longer belongs to the channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session does not exist in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session state changed concurrently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-sessions/{workSessionId}/resume:
    post:
      tags: [work-sessions]
      operationId: resumeWorkSession
      summary: Resume an orphaned session on another registered host.
      description: >
        Human session owner only. The source becomes ended(resumed), while a
        new running work_session reuses the same root thread, records
        resumedFromSessionId, and emits the existing spawn dispatch in one
        tenant transaction. Host paths, credentials, and process state are not
        accepted or persisted.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeWorkSessionRequest"
      responses:
        "201":
          description: New running session with durable lineage and dispatched spawn control.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSessionResponse"
        "400":
          description: Invalid source session or target host identifier.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Human caller is not the source session owner.
        "404":
          description: Source session does not exist in this workspace.
        "409":
          description: >
            Source is not orphaned, target host is revoked/unavailable/outside
            policy, or the workspace/member pool has no available slot.

  /v1/workspaces/{workspaceId}/work-sessions/{workSessionId}/terminal-attach:
    post:
      tags: [work-sessions]
      operationId: issueTerminalAttachCapability
      summary: Issue an ephemeral capability for direct remote PTY attach.
      description: >
        Human bearer only. mode defaults to controller, which remains session
        owner-only. observer requires active workspace and session-channel
        membership while observation=open. The running session must carry a
        MomoHost-signed remote PTY binding and its work_host must be unrevoked.
        The raw capability is returned exactly once, while PostgreSQL stores
        only its SHA-256 digest and timestamptz expiry. The same transaction
        audits only owner, mode, issue time, and expiry. Observer issuance also
        enqueues work.session.observer with a count-only projection.
        attach_endpoint contains no
        bearer or credential; the client connects there directly with the
        separate capability_token. MomoServer and relay expose no PTY stream.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkSessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueTerminalAttachRequest"
      responses:
        "200":
          description: Exact three-field direct attach grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalAttachCapabilityResponse"
        "400":
          description: Invalid work session identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an authorized active human/channel member, or observation is owner_only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session does not exist in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session ended, lacks a remote PTY binding, or host is revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-controls:
    post:
      tags: [work-controls]
      operationId: createWorkControl
      summary: Request a host control from the agent bound to an active run.
      description: >
        Agent bearer only and requires the work:control scope. Spawn dispatches
        immediately only when the human host owner has enabled the exact tool;
        otherwise it creates the canonical approval_request card. Input and
        kill require a running session in the same requester lineage, while
        read requires the lineage but no approval. The target must be a
        registered, unrevoked host in this workspace. Member-scoped hosts must
        belong to the session owner; workspace-scoped hosts accept all members.
        Host-local paths,
        environment, process state, and credentials are forbidden payloads.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkControlRequest"
      responses:
        "201":
          description: Control recorded as pending_approval or dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkControlResponse"
        "400":
          description: Invalid kind, identifiers, session shape, or closed payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Human bearer, wrong agent/run lineage, or member-host owner mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Target host is missing, revoked, or belongs to another workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Run or required work session is not running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-controls/{workControlId}/ack:
    post:
      tags: [work-controls]
      operationId: acknowledgeWorkControl
      summary: Acknowledge one dispatched control from its registered execution host.
      description: >
        The registering human owner or the MomoHost-signed execution host may
        acknowledge. A successful spawn acknowledgement must bind a running
        work_session owned by the requesting agent's human owner with the same
        channel and host UUID. Pending or denied controls cannot be acknowledged.
      security:
        - bearerAuth: []
        - workHostAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkControlId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkControlAckRequest"
      responses:
        "200":
          description: Control settled as acked or failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkControlResponse"
        "400":
          description: Invalid acknowledgement or spawn session binding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not the registered host owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Control does not exist in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Control is pending, denied, settled, or changed concurrently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-auto-approvals:
    get:
      tags: [work-controls]
      operationId: listWorkAutoApprovals
      summary: List this human owner's enabled spawn auto-approval tools.
      description: >
        Human bearer only. Returns only the caller's enabled tool identifiers,
        sorted lexicographically. Host identifiers, paths, process environment,
        and credentials are never included.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Deterministically ordered auto-approval snapshot for the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkAutoApprovalsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Agent bearer or inactive human.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-auto-approvals/{tool}:
    put:
      tags: [work-controls]
      operationId: enableWorkAutoApproval
      summary: Allow this human owner's agent spawn requests for one tool.
      description: >
        Human bearer only. A real setting change and its audit_log row commit
        in the same tenant transaction; retries are idempotent.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkTool"
      responses:
        "200":
          description: Effective auto-approval setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkAutoApproveResponse"
        "400":
          description: Unsupported tool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Agent bearer or inactive human.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [work-controls]
      operationId: disableWorkAutoApproval
      summary: Remove this human owner's spawn auto-approval for one tool.
      description: >
        Human bearer only. A real setting change and its audit_log row commit
        in the same tenant transaction; retries are idempotent.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkTool"
      responses:
        "200":
          description: Effective auto-approval setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkAutoApproveResponse"
        "400":
          description: Unsupported tool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Agent bearer or inactive human.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-tool-profiles:
    get:
      tags: [work-tool-profiles]
      operationId: listWorkToolProfiles
      summary: List the workspace tool catalog or its enabled work-host projection.
      description: >
        Human callers require workspace owner/admin authority and receive all
        profiles. A MomoHost-signed caller receives enabled profiles only.
        Launch templates contain a portable command key and arguments; no
        executable path, environment value, provider credential, or token is
        accepted or returned.
      security:
        - bearerAuth: []
        - workHostAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Deterministically ordered profile projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkToolProfilesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Workspace admin or signed work-host authority required.
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [work-tool-profiles]
      operationId: createWorkToolProfile
      summary: Register a workspace work tool profile.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkToolProfileRequest"
      responses:
        "201":
          description: Profile and same-transaction audit record created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkToolProfileResponse"
        "400":
          description: Invalid profile or credential/path-shaped launch template.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Workspace owner or admin required.
        "409":
          description: Tool key is already registered.
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/work-tool-profiles/{tool}:
    put:
      tags: [work-tool-profiles]
      operationId: updateWorkToolProfile
      summary: Replace supplied fields of a registered work tool profile.
      description: >
        Disabling a profile also clears its auto-approval rows. New spawn,
        approval dispatch, session creation, and resume all fail closed while
        the profile is disabled.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkTool"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkToolProfileRequest"
      responses:
        "200":
          description: Updated profile and same-transaction audit record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkToolProfileResponse"
        "400":
          description: Empty or invalid update.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Workspace owner or admin required.
        "404":
          description: Tool profile not found.
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [work-tool-profiles]
      operationId: deleteWorkToolProfile
      summary: Delete a workspace work tool profile and clear auto-approval rows.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WorkTool"
      responses:
        "200":
          description: Deleted profile snapshot and same-transaction audit record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkToolProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Workspace owner or admin required.
        "404":
          description: Tool profile not found.
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/workspaces/{workspaceId}/channels/{channelId}/attachments/uploads:
    post:
      tags: [attachments]
      operationId: createAttachmentUpload
      summary: Create a Drive resumable upload session without proxying file bytes.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttachmentUploadRequest"
      responses:
        "201":
          description: Pending attachment row and resumable capability URL created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentUploadResponse"
        "400":
          description: Invalid name, mime, or size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Active channel membership required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Attachment exceeds 100 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Drive archive is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{workspaceId}/channels/{channelId}/attachments/{attachmentId}/complete:
    post:
      tags: [attachments]
      operationId: completeAttachmentUpload
      summary: Verify Drive size and mime, then mark the uploader's attachment complete.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: Drive metadata verified; attachment is complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Active channel membership and original uploader are required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Attachment or uploaded Drive file not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Size/mime mismatch or invalid lifecycle state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{workspaceId}/channels/{channelId}/attachments/{attachmentId}/content:
    get:
      tags: [attachments]
      operationId: getAttachmentContent
      summary: Stream complete attachment bytes from Drive after channel membership validation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: Original attachment bytes, streamed from Drive alt=media.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Active channel membership required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Completed attachment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{workspaceId}/search/messages:
    get:
      tags: [messages]
      operationId: searchWorkspaceMessages
      summary: Search messages in channels where the caller is an active member.
      description: >
        Read-only v0 substring search backed by the existing partial GIN trigram
        index. Results exclude deleted/body-less messages and channels where the
        caller has left. Ordering is newest first by created time, then channel
        sequence; the opaque cursor preserves that keyset across new inserts.
        Search is limited to 30 requests per authenticated member per minute.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque keyset cursor returned as `nextCursor`.
      responses:
        "200":
          description: Membership-filtered message search page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMessageSearchResponse"
        "400":
          description: Query shorter than two characters or malformed cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Workspace scope mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Search member rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/workspaces/{workspaceId}/messages/{messageId}:
    patch:
      tags: [messages]
      operationId: editMessage
      summary: Edit an authored, undeleted message without changing its seq.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: messageId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EditMessageRequest"}
      responses:
        "200":
          description: Full edited message with its original seq.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
        "400":
          description: Empty body, malformed id, or an already-deleted message.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Not the author/channel member, or workspace scope mismatch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: Message not found.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}
    delete:
      tags: [messages]
      operationId: deleteMessage
      summary: Soft-delete an authored message and remove all its reactions.
      description: >
        The tombstone keeps the original seq but sets body to null. The original
        body is not copied into audit detail. Repeating an already-completed
        delete returns the same tombstone without another outbox event.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: messageId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Tombstone message with body omitted and state=deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
        "400":
          description: Malformed message id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Not the author/channel member, or workspace scope mismatch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: Message not found.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/messages/{messageId}/reactions/{emoji}:
    put:
      tags: [messages]
      operationId: addMessageReaction
      summary: Add the authenticated member's reaction idempotently.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: messageId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: emoji
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 32}
      responses:
        "200":
          description: Added delta; an existing identical reaction is also success.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReactionDelta"}
        "400":
          description: Invalid emoji/message id or deleted message.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Not a channel member, or workspace scope mismatch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: Message not found.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "409":
          description: The message already has the maximum 200 reaction rows.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}
    delete:
      tags: [messages]
      operationId: removeMessageReaction
      summary: Remove the authenticated member's reaction idempotently.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: messageId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: emoji
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 32}
      responses:
        "200":
          description: Removed delta; an already-absent reaction is also success.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReactionDelta"}
        "400":
          description: Invalid emoji or message id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Not a channel member, or workspace scope mismatch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: Message not found.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/channels/{channelId}/reactions:
    get:
      tags: [messages]
      operationId: getChannelReactionSnapshot
      summary: Load message-to-emoji-to-member reaction sets for a channel.
      description: Deleted messages are excluded. Empty channels return an empty object.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: Direct message id -> emoji -> member id array mapping.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReactionSnapshot"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Not a channel member, or workspace scope mismatch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/channels/{channelId}/messages:
    post:
      tags: [messages]
      operationId: sendMessage
      summary: Send a message (idempotent via clientMsgId).
      description: >
        The single write path (L4 §3.1): one transaction bumps the gapless
        per-channel `seq`, inserts the message, and enqueues the realtime
        broadcast through the transactional outbox. Retrying with the same
        `clientMsgId` returns the original message (exactly-once effect) —
        the response status is 201 in both cases.
        Supplying `rootId` creates a one-level thread reply. The root must be an
        undeleted top-level message in the same channel; cross-channel roots are
        reported as not found.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Message committed with its authoritative `seq`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid workspace/channel id, deleted root, or nested reply root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a member of this channel, or workspace scope mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Channel/root not found or not provisioned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      tags: [messages]
      operationId: getMessageHistory
      summary: Read message history (seq-cursor pagination).
      description: >
        Without cursors, returns the newest messages ordered by `seq`
        descending. `before=<seq>` pages older history (descending).
        `after=<seq>` is the realtime-recovery backfill: it returns messages
        with `seq > after` in ASCENDING order and takes precedence over
        `before` when both are present. All variants include deleted messages as
        tombstones (`state=deleted`, omitted/null `body`, populated `deletedAtMs`)
        and project the durable `state`, `editedAtMs`, and `deletedAtMs` values so
        clients converge after restart or backfill.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
        - name: limit
          in: query
          required: false
          description: Page size, clamped to 1..200.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: before
          in: query
          required: false
          description: Return messages with `seq` strictly below this cursor (older).
          schema:
            type: integer
            format: int64
        - name: after
          in: query
          required: false
          description: Return messages with `seq` strictly above this cursor (backfill, ascending).
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: One page of messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "400":
          description: Invalid workspace/channel id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a member of this channel, or workspace scope mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/channels/{channelId}/messages/{rootId}/replies:
    get:
      tags: [messages]
      operationId: getThreadReplies
      summary: Read all replies to a top-level message in ascending seq order.
      description: >
        Uses an exclusive message-seq cursor. Deleted replies remain visible as
        tombstones. The root must exist in this channel and be top-level; a root
        in another channel is reported as not found. Active channel membership is
        enforced before the root lookup.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
        - name: rootId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          description: Return replies with `seq` strictly above this cursor.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Page size, clamped to 1..200.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: One oldest-first page of replies, including tombstones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadRepliesPage"
        "400":
          description: Invalid id/cursor, or the selected root is itself a reply.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Not a channel member, or workspace scope mismatch.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404":
          description: Root absent from this channel (including cross-channel roots).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/read-state:
    get:
      tags: [read-state]
      operationId: listReadStates
      summary: Bulk read-state for every channel the member belongs to.
      description: >
        ADR-0109 read surface. One entry per active membership on a
        non-archived channel, bound to the authenticated principal.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Read-state projections for the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadStateListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/channels/{channelId}/read-state:
    put:
      tags: [read-state]
      operationId: updateReadState
      summary: Advance the caller's read cursor for a channel.
      description: >
        Monotonic: the effective cursor is
        `max(current, min(requested, latestSeq))` — it never moves backward
        and never beyond the channel head. The cursor owner is always the
        authenticated principal; no member id is accepted in the body.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReadStateRequest"
      responses:
        "200":
          description: Effective read-state after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadState"
        "400":
          description: last_read_seq must be non-negative, or invalid ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a member of this channel, or workspace scope mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/dms:
    get:
      tags: [dms]
      operationId: listDms
      summary: List the caller's active 1:1 DM channels.
      description: Newest-created first; at most 500 channels.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: DM channels with active participant ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceChannelsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [dms]
      operationId: openDm
      summary: Open (or reuse) the 1:1 DM channel with another member.
      description: >
        Idempotent per participant pair: creates the DM channel on first call
        (201) and returns the existing one afterwards (200). Snake-case body
        alias accepted by the server, `member_id`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenDirectMessageRequest"
      responses:
        "201":
          description: DM channel newly created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenDirectMessageResponse"
        "200":
          description: Existing DM channel returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenDirectMessageResponse"
        "400":
          description: Target must be another member / invalid ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Active workspace member not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: List approval projections visible to the caller.
      description: >
        Requires an active human member; only approvals on channels where the
        caller has an active membership are returned. Ordered by expiry
        (soonest first, NULLs last), then newest first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: status
          in: query
          required: false
          description: Approval status filter; defaults to `pending`.
          schema:
            type: string
            enum: [pending, approved, rejected, expired, cancelled]
            default: pending
        - name: limit
          in: query
          required: false
          description: Page size, clamped to 1..500.
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Approval projections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalProjectionPage"
        "400":
          description: Invalid status filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not an active human workspace member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/approvals/{approvalId}/decision:
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: Approve or reject a pending approval (idempotent).
      description: >
        Human-only. `client_decision_id` provides idempotency — retrying the
        same decision returns the original receipt (200); a different
        decision under the same `client_decision_id` returns a 409 receipt
        with status `idempotency_conflict`. Expected failures (403/404/409)
        return the SAME receipt schema (not the generic error envelope) with
        a diagnostic `status`; the generic error envelope is used only for
        400 body/path mismatches and 401 auth failures.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: approvalId
          in: path
          required: true
          description: Approval UUID; must match the body `approval_id`.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          description: Decision committed (or identical idempotent retry).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionReceipt"
        "400":
          description: approval_id does not match path / invalid ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Receipt-shaped expected failure (not human / not a channel member).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionReceipt"
        "404":
          description: Receipt-shaped expected failure (approval not found).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionReceipt"
        "409":
          description: >
            Receipt-shaped expected failure — already decided, expired before
            decision, or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionReceipt"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/plugins:
    get:
      tags: [plugins]
      operationId: listPlugins
      summary: List the plugin catalog and caller-effective tool policy.
      description: >
        Human bearers receive policy for themselves. Agent bearers must supply
        both delegatedMemberId and channelId; the server verifies that the
        delegated human and agent are active members of that channel. The
        response contains policy metadata only, never provider credentials.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DelegatedMemberId"
        - $ref: "#/components/parameters/DelegatedChannelId"
      responses:
        "200":
          description: Plugin catalog and effective credential-free tool policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginCatalogResponse"
        "400":
          description: Agent bearer omitted or malformed delegation query parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/plugins/{pluginId}:
    get:
      tags: [plugins]
      operationId: getPlugin
      summary: Get one plugin manifest and installation state.
      description: Human bearer only. The manifest is registry metadata and contains no credential.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PluginId"
      responses:
        "200":
          description: Plugin detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Plugin is not registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Registered manifest fails validation or is revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/plugins/{pluginId}/install:
    post:
      tags: [plugins]
      operationId: installPlugin
      summary: Install or re-enable a plugin for the workspace.
      description: Human bearer only; manifest serverPolicy and workspace role are enforced.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PluginId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallPluginRequest"
      responses:
        "200":
          description: Existing installation updated or restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginMutationResponse"
        "201":
          description: Installation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginMutationResponse"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Plugin is not registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Registered manifest fails validation or is revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [plugins]
      operationId: revokePluginInstall
      summary: Revoke a workspace plugin installation and all its grants.
      description: Human workspace owner/admin only. Repeating a revoke is idempotent.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PluginId"
      responses:
        "200":
          description: Installation is revoked and capability projections are removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginMutationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Plugin installation does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/plugins/{pluginId}/grants:
    post:
      tags: [plugins]
      operationId: grantPluginScope
      summary: Grant one declared plugin scope to the calling human.
      description: The plugin must be actively installed; no provider credential is accepted or returned.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PluginId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantPluginRequest"
      responses:
        "200":
          description: Existing grant restored or refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginMutationResponse"
        "201":
          description: Grant created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginMutationResponse"
        "400":
          description: Scope is invalid or not declared by the plugin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Plugin is not installed and enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/plugins/{pluginId}/grants/{scope}:
    delete:
      tags: [plugins]
      operationId: revokePluginScope
      summary: Revoke one plugin scope belonging to the calling human.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PluginId"
        - name: scope
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: Grant is revoked and its capability projection removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginMutationResponse"
        "400":
          description: Scope path value is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Plugin grant does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/webhooks:
    get:
      tags: [webhooks]
      operationId: listWebhookInstallations
      summary: List incoming webhook installations.
      description: Human workspace owner/admin only. Secrets and Slack URL tokens are never returned.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: At most 200 installations, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookInstallationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [webhooks]
      operationId: createWebhookInstallation
      summary: Create an incoming webhook installation.
      description: >
        Human workspace owner/admin only. The native HMAC secret or
        Slack-compatible URL token is revealed exactly once in this response,
        is never persisted in raw form, and the response is `no-store`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        "201":
          description: Installation and one-time ingress credential issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretResponse"
        "400":
          description: Invalid channel, mode, or label.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Active target channel not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/webhooks/{installationId}/rotate:
    post:
      tags: [webhooks]
      operationId: rotateWebhookSecret
      summary: Rotate an incoming webhook credential.
      description: >
        The replacement secret or secret-bearing URL is revealed exactly once
        and returned with `Cache-Control: no-store`. The previous credential
        remains valid only for overlapSeconds.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WebhookInstallationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateWebhookRequest"
      responses:
        "200":
          description: Replacement credential issued once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretResponse"
        "400":
          description: overlapSeconds is outside 0..604800.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Installation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Installation is revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/webhooks/{installationId}:
    delete:
      tags: [webhooks]
      operationId: revokeWebhookInstallation
      summary: Revoke an incoming webhook installation and all its credentials.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WebhookInstallationId"
      responses:
        "200":
          description: Installation is revoked; no secret is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookRevokeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Installation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/webhooks/{workspaceId}/{installationId}:
    post:
      tags: [webhooks]
      operationId: receiveNativeWebhook
      summary: Receive a native momo HMAC-signed webhook.
      description: >
        Public ingress authenticated by X-Momo-Signature-Version,
        X-Momo-Key-Id, X-Momo-Timestamp, X-Momo-Delivery-Id, and
        X-Momo-Signature. The signature base and replay window are defined by
        ADR-0115. A first delivery returns 201; an idempotent replay returns 200.
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/WebhookInstallationId"
        - $ref: "#/components/parameters/MomoSignatureVersion"
        - $ref: "#/components/parameters/MomoKeyId"
        - $ref: "#/components/parameters/MomoTimestamp"
        - $ref: "#/components/parameters/MomoDeliveryId"
        - $ref: "#/components/parameters/MomoSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeWebhookPayload"
      responses:
        "200":
          description: Duplicate delivery; original receipt returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookIngressResponse"
        "201":
          description: Delivery committed through message + transactional outbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookIngressResponse"
        "400":
          description: Payload is not a supported native webhook object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Signature, key, timestamp, delivery ID, or installation is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Body exceeds 262144 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /hooks/{token}:
    post:
      tags: [webhooks]
      operationId: receiveSlackCompatibleWebhook
      summary: Receive a Slack-compatible incoming webhook.
      description: >
        The URL token is the credential and must be treated as a secret.
        Supported Slack/Mattermost text and legacy attachment fields are
        rendered; identity overrides are ignored. `blocks` is explicitly
        rejected with 400. First delivery returns 201 and a body-hash/window
        duplicate returns 200.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: One-time-issued opaque URL credential. Never log or persist in plaintext.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlackCompatibleWebhookPayload"
      responses:
        "200":
          description: Duplicate delivery; original receipt returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookIngressResponse"
        "201":
          description: Delivery committed through message + transactional outbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookIngressResponse"
        "400":
          description: Malformed JSON, missing content, or unsupported blocks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: URL credential is invalid, expired, rotated out, or revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Body exceeds 262144 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/mcp/drive:
    post:
      tags: [mcp]
      operationId: driveMcp
      summary: Call the hosted read-only Drive MCP JSON-RPC endpoint.
      description: >
        Agent bearer only. delegatedMemberId and channelId are mandatory and
        bind every call to a shared channel. `initialize`, `tools/list`, and
        `tools/call` are supported. JSON-RPC failures use HTTP 200 with codes
        -32700, -32600, -32601, -32602, or -32003; -32003 means the delegated
        human lacks an active drive:read grant. No Google credential is exposed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DelegatedMemberIdRequired"
        - $ref: "#/components/parameters/DelegatedChannelIdRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriveMCPRequest"
      responses:
        "200":
          description: JSON-RPC success or protocol/application error envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveMCPResponse"
        "400":
          description: Delegation query is missing or malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Bearer is human or delegation/channel binding fails.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/workspaces/{workspaceId}/context-packets/{packetId}:
    get:
      tags: [agents]
      operationId: getContextPacket
      summary: Inspect the immutable Context Packet consumed by an agent run.
      description: >
        Returns the original frozen packet, including expired historical packets.
        The caller must still be an active member of the run channel. This read
        never refreshes or mutates packet content.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: packetId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Immutable packet metadata and content.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ContextPacketResponse"}
        "400":
          description: Malformed workspace or packet id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: Packet is absent or not visible through current run-channel membership.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/memories:
    get:
      tags: [memories]
      operationId: listMemories
      summary: List active, source-readable workspace memories.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: scope
          in: query
          schema: {$ref: "#/components/schemas/MemoryScope"}
        - name: agent
          in: query
          schema: {type: string, format: uuid}
        - name: includeInvalid
          in: query
          schema: {type: boolean, default: false}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: Memory page filtered through current source-channel membership.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryPageResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}

    post:
      tags: [memories]
      operationId: createMemory
      summary: Create a sourced memory through the tenant write path.
      description: Source references contain message/channel identifiers only; message bodies are not copied.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMemoryRequest"}
      responses:
        "200":
          description: Memory, lifecycle, audit, and memory.updated outbox records committed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryItemResponse"}
        "400":
          description: Invalid scope, kind, body, confidence, subject, or source shape.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: Workspace memory is disabled.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}
    delete:
      tags: [memories]
      operationId: disableAndDeleteAllMemories
      summary: Disable workspace memory and purge all memory projections.
      description: Human workspace admin only. Individual memory DELETE does not exist; normal removal is invalidation.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Policy disabled and all memory items/candidates deleted atomically.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryPolicyResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/memories/search:
    get:
      tags: [memories]
      operationId: searchMemories
      summary: Search active memories with FTS and vector reciprocal-rank fusion.
      description: >
        Runs through the caller's normal FORCE RLS tenant path and current
        source-channel membership. Items without embeddings remain eligible
        through FTS. Query embedding failure degrades to FTS-only retrieval.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 2}
        - name: scope
          in: query
          schema: {$ref: "#/components/schemas/MemoryScope"}
        - name: agent
          in: query
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        "200":
          description: RRF-ranked memory hits; FTS-only and vector-only hits are valid.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemorySearchResponse"}
        "400":
          description: Query, scope, agent, or limit is malformed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/memories/{memoryId}:
    patch:
      tags: [memories]
      operationId: updateMemory
      summary: Edit the bounded body or confidence of an active memory.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/MemoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateMemoryRequest"}
      responses:
        "200":
          description: Updated memory and committed lifecycle/audit/outbox evidence.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryItemResponse"}
        "400":
          description: No editable field or invalid value.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: Memory does not exist in this workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "409":
          description: Memory is disabled or the item was already invalidated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/memories/{memoryId}/invalidate:
    post:
      tags: [memories]
      operationId: invalidateMemory
      summary: Time-invalidate a memory without deleting its source or lifecycle evidence.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/MemoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InvalidateMemoryRequest"}
      responses:
        "200":
          description: Invalidated memory and committed lifecycle/audit/outbox evidence.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryItemResponse"}
        "400":
          description: Invalid replacement memory or self-invalidation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: Memory does not exist in this workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/memory-policy:
    get:
      tags: [memories]
      operationId: getMemoryPolicy
      summary: Read the workspace memory switch.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Current policy; absent rows project as enabled by default.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryPolicyResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
    put:
      tags: [memories]
      operationId: putMemoryPolicy
      summary: Enable memory, or disable and purge it atomically.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PutMemoryPolicyRequest"}
      responses:
        "200":
          description: Updated policy and deleted count when disabled.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryPolicyResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        App access token (15m TTL) from login/join/refresh, sent as
        `Authorization: Bearer <accessToken>`. Tokens are hash-persisted
        server-side and revocable (MOMO-300).
    workHostAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >
        `Authorization: MomoHost <workHostId>` plus X-Momo-Work-Host-Sent-At
        and X-Momo-Work-Host-Signature. This is an Ed25519 request signature,
        not a durable bearer credential.

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: >
        Workspace UUID. Must equal the workspace bound into the access token;
        any other value is rejected with 403 (tenant isolation, L4 §1.3).
      schema:
        type: string
        format: uuid
    ChannelId:
      name: channelId
      in: path
      required: true
      description: Channel UUID.
      schema:
        type: string
        format: uuid
    HuddleId:
      name: huddleId
      in: path
      required: true
      description: Huddle UUID; also used as the LiveKit room name.
      schema:
        type: string
        format: uuid
    WorkSessionId:
      name: workSessionId
      in: path
      required: true
      description: UUIDv7 work session ledger id.
      schema:
        type: string
        format: uuid
    WorkHostId:
      name: workHostId
      in: path
      required: true
      description: UUIDv7 registered execution host id.
      schema:
        type: string
        format: uuid
    WorkHostSentAt:
      name: X-Momo-Work-Host-Sent-At
      in: header
      required: true
      description: Unix epoch milliseconds inside the five-minute clock-skew window.
      schema:
        type: integer
        format: int64
    WorkHostSignature:
      name: X-Momo-Work-Host-Signature
      in: header
      required: true
      description: Raw 64-byte Ed25519 signature in standard base64.
      schema:
        type: string
    WorkControlId:
      name: workControlId
      in: path
      required: true
      description: UUIDv7 work control ledger id.
      schema:
        type: string
        format: uuid
    MemoryId:
      name: memoryId
      in: path
      required: true
      description: UUIDv7 memory item id.
      schema:
        type: string
        format: uuid
    WorkTool:
      name: tool
      in: path
      required: true
      description: Workspace-registered execution tool key.
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: Attachment UUID owned by PostgreSQL.
      schema:
        type: string
        format: uuid
    PluginId:
      name: pluginId
      in: path
      required: true
      description: Stable plugin manifest identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    DelegatedMemberId:
      name: delegatedMemberId
      in: query
      required: false
      description: Required for an agent bearer; ignored for a human bearer.
      schema:
        type: string
        format: uuid
    DelegatedChannelId:
      name: channelId
      in: query
      required: false
      description: Required for an agent bearer; must contain both agent and delegated human.
      schema:
        type: string
        format: uuid
    DelegatedMemberIdRequired:
      name: delegatedMemberId
      in: query
      required: true
      description: Active human whose grant is delegated to the agent call.
      schema:
        type: string
        format: uuid
    DelegatedChannelIdRequired:
      name: channelId
      in: query
      required: true
      description: Active channel containing both the delegated human and calling agent.
      schema:
        type: string
        format: uuid
    WebhookInstallationId:
      name: installationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MomoSignatureVersion:
      name: X-Momo-Signature-Version
      in: header
      required: true
      schema:
        type: string
        enum: [v1]
    MomoKeyId:
      name: X-Momo-Key-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    MomoTimestamp:
      name: X-Momo-Timestamp
      in: header
      required: true
      description: Unix seconds; accepted only inside the five-minute replay window.
      schema:
        type: integer
        format: int64
    MomoDeliveryId:
      name: X-Momo-Delivery-Id
      in: header
      required: true
      description: Idempotency key, 1..200 characters from the server allowlist.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    MomoSignature:
      name: X-Momo-Signature
      in: header
      required: true
      description: Lower/uppercase hexadecimal HMAC-SHA256, optionally prefixed with `v1=`.
      schema:
        type: string

  responses:
    Unauthorized:
      description: Missing, invalid, expired, or revoked access token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Not an active workspace member, or workspace scope mismatch.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    HuddleNotConfigured:
      description: LiveKit API key, secret, or URL is absent/invalid; huddles fail closed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: >
        Per-IP or per-member sliding-window rate limit exceeded (MOMO-300).
        Carries a `Retry-After` header in seconds.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ---- Error envelope (Hummingbird HTTPError) ------------------------------
    ErrorResponse:
      type: object
      description: >
        Generic error envelope. Some errors (no message) may return an empty
        body with only the status code.
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string

    # ---- Memory Plane (ADR-0129 / MOMO-526) ---------------------------------
    MemoryScope:
      type: string
      enum: [workspace, member, agent, conversation]

    MemoryKind:
      type: string
      enum: [profile, fact, episode, procedure]

    MemorySourceRefRequest:
      type: object
      additionalProperties: false
      required: [messageId, channelId]
      properties:
        messageId: {type: string, format: uuid}
        channelId: {type: string, format: uuid}

    MemorySourceRef:
      type: object
      additionalProperties: false
      required: [messageId, channelId]
      properties:
        messageId: {type: string, format: uuid}
        channelId: {type: string, format: uuid}

    CreateMemoryRequest:
      type: object
      additionalProperties: false
      required: [scope, kind, body, confidence, sourceRefs]
      properties:
        scope: {$ref: "#/components/schemas/MemoryScope"}
        subjectMemberId: {type: string, format: uuid}
        agentMemberId: {type: string, format: uuid}
        channelId: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/MemoryKind"}
        body: {type: string, minLength: 1, maxLength: 16384}
        confidence: {type: number, format: double, minimum: 0, maximum: 1}
        validAtMs: {type: integer, format: int64, minimum: 0}
        sourceRefs:
          type: array
          minItems: 1
          maxItems: 32
          items: {$ref: "#/components/schemas/MemorySourceRefRequest"}

    UpdateMemoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        body: {type: string, minLength: 1, maxLength: 16384}
        confidence: {type: number, format: double, minimum: 0, maximum: 1}

    InvalidateMemoryRequest:
      type: object
      additionalProperties: false
      properties:
        invalidatedByMemoryId: {type: string, format: uuid}

    PutMemoryPolicyRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}

    ContextPacketResponse:
      type: object
      additionalProperties: false
      required: [packetId, runId, workspaceId, createdAtMs, expiresAtMs, expired, content]
      properties:
        packetId: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        createdAtMs: {type: integer, format: int64}
        expiresAtMs: {type: integer, format: int64}
        expired: {type: boolean}
        content:
          type: object
          description: Frozen momo.context_packet.v0 JSON object.
          additionalProperties: true

    MemoryItem:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - scope
        - kind
        - body
        - confidence
        - validAtMs
        - createdByKind
        - createdAtMs
        - updatedAtMs
        - sourceRefs
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        scope: {$ref: "#/components/schemas/MemoryScope"}
        subjectMemberId: {type: string, format: uuid}
        agentMemberId: {type: string, format: uuid}
        channelId: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/MemoryKind"}
        body: {type: string}
        confidence: {type: number, format: double}
        validAtMs: {type: integer, format: int64}
        invalidAtMs: {type: integer, format: int64}
        invalidatedByMemoryId: {type: string, format: uuid}
        createdByKind: {type: string, enum: [human, agent, worker]}
        createdByMemberId: {type: string, format: uuid}
        createdAtMs: {type: integer, format: int64}
        updatedAtMs: {type: integer, format: int64}
        sourceRefs:
          type: array
          items: {$ref: "#/components/schemas/MemorySourceRef"}

    MemoryItemResponse:
      type: object
      additionalProperties: false
      required: [memory]
      properties:
        memory: {$ref: "#/components/schemas/MemoryItem"}

    MemoryPageResponse:
      type: object
      additionalProperties: false
      required: [memories]
      properties:
        memories:
          type: array
          items: {$ref: "#/components/schemas/MemoryItem"}

    MemorySearchHit:
      type: object
      additionalProperties: false
      required: [memory, score]
      properties:
        memory: {$ref: "#/components/schemas/MemoryItem"}
        score: {type: number, format: double, minimum: 0}
        ftsRank: {type: integer, minimum: 1}
        vectorRank: {type: integer, minimum: 1}
        vectorDistance: {type: number, format: double, minimum: 0}

    MemorySearchResponse:
      type: object
      additionalProperties: false
      required: [hits]
      properties:
        hits:
          type: array
          items: {$ref: "#/components/schemas/MemorySearchHit"}

    MemoryPolicy:
      type: object
      additionalProperties: false
      required: [workspaceId, enabled]
      properties:
        workspaceId: {type: string, format: uuid}
        enabled: {type: boolean}
        updatedBy: {type: string, format: uuid}
        updatedAtMs: {type: integer, format: int64}

    MemoryPolicyResponse:
      type: object
      additionalProperties: false
      required: [memoryPolicy]
      properties:
        memoryPolicy: {$ref: "#/components/schemas/MemoryPolicy"}
        deletedCount: {type: integer, minimum: 0}

    # ---- Auth ----------------------------------------------------------------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: Human member email within the workspace.
        password:
          type: string
        workspace:
          type: string
          format: uuid
          description: >
            Optional explicit workspace UUID. When omitted (or not a valid
            UUID) the server falls back to the seeded demo workspace
            (single-tenant v0 convenience).
        platformAdminSecret:
          type: string
          description: >
            Optional platform-admin elevation secret (snake-case alias
            `platform_admin_secret`). Irrelevant to the web v0 client; the
            account password must still verify before it can add scope.

    LoginResponse:
      type: object
      required: [accessToken, refreshToken, member, realtimeWebSocketUrl]
      properties:
        accessToken:
          type: string
          description: Bearer access JWT, 15 minute TTL.
        refreshToken:
          type: string
          description: Single-use rotating refresh JWT, 30 day TTL.
        member:
          $ref: "#/components/schemas/Member"
        realtimeWebSocketUrl:
          type: string
          description: >
            The ONLY authority for the realtime WebSocket address (ADR-0110).
            Never derive it from the API origin.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    RefreshResponse:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: >
            Optional refresh token of the same session to revoke alongside
            the access token.

    LogoutResponse:
      type: object
      required: [status, revokedAccess, revokedRefresh, alreadyRevoked]
      properties:
        status:
          type: string
          enum: [ok]
        revokedAccess:
          type: boolean
          description: The access token transitioned to revoked in this call.
        revokedRefresh:
          type: boolean
          description: The body refresh token transitioned to revoked in this call.
        alreadyRevoked:
          type: boolean
          description: Nothing new was revoked (idempotent repeat logout).

    RealtimeTokenResponse:
      type: object
      required: [token, tokenType, expiresAtMs, ttlSeconds, workspaceId, memberId]
      properties:
        token:
          type: string
          description: Centrifugo connection JWT.
        tokenType:
          type: string
          enum: [centrifugo.connection.jwt]
        expiresAtMs:
          type: integer
          format: int64
        ttlSeconds:
          type: integer
        workspaceId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid

    Member:
      type: object
      description: Minimal member identity as returned by login/join.
      required: [id, workspaceId, kind, displayName, handle]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [human, agent]
        displayName:
          type: string
        handle:
          type: string

    # ---- Public join -----------------------------------------------------------
    JoinRequest:
      type: object
      required: [code, email, displayName, password]
      properties:
        code:
          type: string
          description: Raw invite code (shown once at creation; server stores only the hash).
        email:
          type: string
          description: Lowercased/trimmed server-side; must contain `@`.
        displayName:
          type: string
          description: 1..100 chars after trimming. Snake-case alias `display_name`.
        handle:
          type: string
          pattern: "^[a-z0-9_-]{2,32}$"
          description: Optional; derived from the email local part when omitted.
        password:
          type: string
          description: Required, at most 1024 chars.
        timeZone:
          type: string
          description: Optional IANA time zone; defaults to UTC. Aliases `time_zone`, `tz`.

    JoinMembership:
      type: object
      required: [id, channelId, role]
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/MembershipRole"

    InviteCode:
      type: object
      description: >
        Invite metadata. The raw code is intentionally absent (only returned
        once at creation, outside this surface).
      required:
        - id
        - workspaceId
        - codePreview
        - role
        - maxUses
        - usedCount
        - expiresAtMs
        - createdBy
        - createdAtMs
        - updatedAtMs
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        codePreview:
          type: string
          description: Safe display hint (may be empty).
        role:
          $ref: "#/components/schemas/MembershipRole"
        maxUses:
          type: integer
        usedCount:
          type: integer
        expiresAtMs:
          type: integer
          format: int64
        revokedAtMs:
          type: integer
          format: int64
        revokedBy:
          type: string
          format: uuid
        revocationReason:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAtMs:
          type: integer
          format: int64
        updatedAtMs:
          type: integer
          format: int64

    JoinResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - workspaceId
        - member
        - realtimeWebSocketUrl
        - memberships
        - invite
        - redemptionId
        - createdMember
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        workspaceId:
          type: string
          format: uuid
        member:
          $ref: "#/components/schemas/Member"
        realtimeWebSocketUrl:
          type: string
          description: Server-owned WebSocket address authority (ADR-0110).
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/JoinMembership"
          description: Public-channel memberships granted by this join.
        invite:
          $ref: "#/components/schemas/InviteCode"
        redemptionId:
          type: string
          format: uuid
        createdMember:
          type: boolean
          description: True when a new member row was created (response status 201).

    # ---- Roster ----------------------------------------------------------------
    RosterMember:
      type: object
      description: >
        Roster entry. Human-only fields (email/timeZone) and agent-only
        fields (agentModel/ownerHumanId/maxConcurrentRuns/maxRunSteps) are
        present only for the matching kind; agent secrets and execution
        config are never exposed.
      required:
        - id
        - workspaceId
        - kind
        - status
        - displayName
        - handle
        - channelCount
        - channelIds
        - capabilities
        - createdAtMs
        - updatedAtMs
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [human, agent]
        status:
          type: string
          enum: [active, invited, suspended, deleted]
        displayName:
          type: string
        handle:
          type: string
        avatarUrl:
          type: string
        role:
          $ref: "#/components/schemas/MembershipRole"
        channelCount:
          type: integer
        channelIds:
          type: array
          items:
            type: string
            format: uuid
        capabilities:
          type: array
          items:
            type: string
          description: Public capability projection for agents; empty for humans.
        origin:
          type: string
          enum: [card, local]
          description: Present for agents only; additive origin projection from the confirmed card ledger.
        email:
          type: string
        timeZone:
          type: string
        agentModel:
          type: string
        ownerHumanId:
          type: string
          format: uuid
        maxConcurrentRuns:
          type: integer
        maxRunSteps:
          type: integer
        createdAtMs:
          type: integer
          format: int64
        updatedAtMs:
          type: integer
          format: int64

    WorkspaceRosterResponse:
      type: object
      required: [members, humanCount, agentCount]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/RosterMember"
        humanCount:
          type: integer
        agentCount:
          type: integer

    # ---- Membership lifecycle (ADR-0128) ------------------------------------
    ChangeMembershipRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/MembershipRole"

    MembershipRoleResponse:
      type: object
      required: [memberId, scope, role]
      properties:
        memberId: {type: string, format: uuid}
        scope: {type: string, enum: [workspace, channel]}
        role: {$ref: "#/components/schemas/MembershipRole"}

    MembershipLifecycleResponse:
      type: object
      required: [memberId, status]
      properties:
        memberId: {type: string, format: uuid}
        status: {type: string, enum: [active, suspended, deleted]}

    ChannelLeaveResponse:
      type: object
      required: [channelId, memberId, archived]
      properties:
        channelId: {type: string, format: uuid}
        memberId: {type: string, format: uuid}
        archived: {type: boolean}

    AuditEvent:
      type: object
      required: [id, action, detail, createdAtMs]
      properties:
        id: {type: string, format: uuid}
        actorMemberId: {type: string, format: uuid}
        subjectMemberId: {type: string, format: uuid}
        action: {type: string}
        targetType: {type: string}
        targetId: {type: string, format: uuid}
        viaTokenId: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        detail: {type: object, additionalProperties: true}
        createdAtMs: {type: integer, format: int64}

    AuditPageResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: {$ref: "#/components/schemas/AuditEvent"}
        nextCursor: {type: string, format: uuid}

    RemoveWorkspaceMemberRequest:
      type: object
      additionalProperties: false
      properties:
        ban: {type: boolean, default: false}
        reason: {type: string, maxLength: 500}

    CreateWorkspaceBanRequest:
      type: object
      description: At least one of email or handle is required.
      anyOf:
        - required: [email]
        - required: [handle]
      additionalProperties: false
      properties:
        email: {type: string, maxLength: 320}
        handle: {type: string, pattern: "^[a-z0-9_-]{2,32}$"}
        reason: {type: string, maxLength: 500}

    WorkspaceBan:
      type: object
      required: [id, createdBy, createdAtMs]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        handle: {type: string}
        createdBy: {type: string, format: uuid}
        reason: {type: string}
        createdAtMs: {type: integer, format: int64}

    WorkspaceBanResponse:
      type: object
      required: [ban]
      properties:
        ban: {$ref: "#/components/schemas/WorkspaceBan"}

    WorkspaceBanListResponse:
      type: object
      required: [bans]
      properties:
        bans:
          type: array
          items: {$ref: "#/components/schemas/WorkspaceBan"}

    # ---- Agent creation -------------------------------------------------------
    CreateAgentRequest:
      type: object
      required: [displayName, handle, model, baseUrl]
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        handle:
          type: string
          pattern: "^[a-z0-9_-]{2,32}$"
          description: Trimmed and lowercased server-side; unique and not banned per workspace.
        model:
          type: string
          minLength: 1
          maxLength: 200
        baseUrl:
          type: string
          format: uri
          description: >
            OpenAI-compatible base URL. Userinfo, query, and fragment are
            forbidden. Non-loopback hosts require HTTPS; local loopback HTTP
            requires MOMO_ENV=local plus AGENT_PROVIDER_ALLOW_LOCAL_LOOPBACK=1
            and an explicit port.
        systemPrompt:
          type: string
          maxLength: 32768
          description: Optional; blank collapses to absent. The server enforces a 32768-byte limit.
        config:
          type: object
          additionalProperties: true
          description: >
            Optional provider-neutral runtime tuning, at most 65536 encoded
            bytes. Credential-like keys (OAuth/API keys, bearer tokens,
            passwords, private keys) are rejected recursively.
        ownerHumanId:
          type: string
          format: uuid
          description: Optional active human owner in this workspace; defaults to the caller.

    AgentMember:
      type: object
      required: [id, handle, displayName]
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        displayName:
          type: string

    CreateAgentResponse:
      type: object
      required: [agent]
      properties:
        agent:
          $ref: "#/components/schemas/AgentMember"

    RegisterAgentCardRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Agent origin or exact /.well-known/agent-card.json URL; userinfo, query, and fragment are forbidden.

    AgentCardRegistration:
      type: object
      required: [id, status, name, url, capabilities, securitySchemes, createdAtMs]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [pending_consent, confirmed]}
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, maxLength: 2000}
        url: {type: string, format: uri}
        capabilities:
          type: object
          additionalProperties: true
        securitySchemes:
          type: object
          description: Display-only summary; never includes submitted credentials or secrets.
          additionalProperties: true
        agentMemberId: {type: string, format: uuid}
        createdAtMs: {type: integer, format: int64}
        confirmedAtMs: {type: integer, format: int64}

    AgentCardRegistrationResponse:
      type: object
      required: [registration]
      properties:
        registration: {$ref: "#/components/schemas/AgentCardRegistration"}

    AgentCredential:
      type: object
      required: [id, agentMemberId, status, scopes, createdAtMs]
      properties:
        id: {type: string, format: uuid}
        agentMemberId: {type: string, format: uuid}
        status: {type: string, enum: [active, expired, revoked]}
        scopes:
          type: array
          items: {type: string}
        label: {type: string}
        lastUsedAtMs: {type: integer, format: int64}
        expiresAtMs: {type: integer, format: int64}
        revokedAtMs: {type: integer, format: int64}
        createdAtMs: {type: integer, format: int64}

    ConfirmAgentCardResponse:
      type: object
      required: [registrationId, status, agent, credential, token, tokenType, confirmedAtMs]
      properties:
        registrationId: {type: string, format: uuid}
        status: {type: string, enum: [confirmed]}
        agent: {$ref: "#/components/schemas/AgentMember"}
        credential: {$ref: "#/components/schemas/AgentCredential"}
        token:
          type: string
          writeOnly: true
          description: One-time-issued scoped gateway bearer; only its SHA-256 digest is persisted.
        tokenType: {type: string, enum: [Bearer]}
        confirmedAtMs: {type: integer, format: int64}

    # ---- Channels ----------------------------------------------------------------
    Channel:
      type: object
      required: [id, workspaceId, kind, muted]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [public, private, dm]
        name:
          type: string
          description: Absent for DM channels.
        topic:
          type: string
        dmKey:
          type: string
          description: Canonical participant-pair hash; DM channels only.
        memberIds:
          type: array
          items:
            type: string
            format: uuid
          description: Active participants for DM channels; empty array for public/private.
        createdBy:
          type: string
          format: uuid
        archivedAtMs:
          type: integer
          format: int64
          description: Present only when the channel is archived.
        muted:
          type: boolean
          description: Whether push dispatch is suppressed for the authenticated member.

    WorkspaceChannelsResponse:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"

    UpdateNotificationPrefRequest:
      type: object
      required: [muted]
      properties:
        muted:
          type: boolean

    NotificationPrefResponse:
      type: object
      required: [muted]
      properties:
        muted:
          type: boolean

    CreateChannelRequest:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [public, private]
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]*[a-z0-9]$|^[a-z0-9]$"
          description: 1..80 chars; lowercased server-side.
        topic:
          type: string
          description: At most 280 chars; blank collapses to absent.

    ChannelMembership:
      type: object
      required: [id, workspaceId, channelId, memberId, role, joinedAtMs]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/MembershipRole"
        joinedAtMs:
          type: integer
          format: int64
        leftAtMs:
          type: integer
          format: int64
          description: Present only after the member left the channel.

    CreateChannelResponse:
      type: object
      required: [channel, creatorMembership]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        creatorMembership:
          $ref: "#/components/schemas/ChannelMembership"

    MembershipRole:
      type: string
      enum: [owner, admin, member, guest]

    # ---- Work hosts ---------------------------------------------------------
    RegisterWorkHostRequest:
      type: object
      required: [scope, type, displayName, publicKey]
      properties:
        scope:
          type: string
          enum: [member, workspace]
        type:
          type: string
          enum: [app, workd, cloud]
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        publicKey:
          type: string
          minLength: 44
          maxLength: 44
          description: Raw 32-byte Ed25519 public key in standard base64.
        capabilities:
          type: object
          additionalProperties:
            type: boolean
          description: Boolean tool-availability flags only.

    WorkHostHeartbeatRequest:
      type: object
      required: [sentAtMs, signature]
      properties:
        sentAtMs:
          type: integer
          format: int64
        signature:
          type: string
          description: Raw 64-byte Ed25519 signature in standard base64.

    WorkHost:
      type: object
      required:
        [id, workspaceId, scope, ownerMemberId, type, displayName, publicKey,
         capabilities, createdAtMs, online]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        scope:
          type: string
          enum: [member, workspace]
        ownerMemberId:
          type: string
          format: uuid
        type:
          type: string
          enum: [app, workd, cloud]
        displayName:
          type: string
        publicKey:
          type: string
        capabilities:
          type: object
          additionalProperties:
            type: boolean
        lastSeenAtMs:
          type: integer
          format: int64
        revokedAtMs:
          type: integer
          format: int64
        createdAtMs:
          type: integer
          format: int64
        online:
          type: boolean

    WorkHostResponse:
      type: object
      required: [workHost]
      properties:
        workHost:
          $ref: "#/components/schemas/WorkHost"

    WorkHostListResponse:
      type: object
      required: [workHosts]
      properties:
        workHosts:
          type: array
          items:
            $ref: "#/components/schemas/WorkHost"

    PendingWorkControlsResponse:
      type: object
      required: [workControls]
      properties:
        workControls:
          type: array
          items:
            $ref: "#/components/schemas/WorkControl"

    # ---- Work sessions ------------------------------------------------------
    UpdateWorkPoolRequest:
      type: object
      required: [maxActive, perMemberSoftLimit]
      properties:
        maxActive:
          type: integer
          minimum: 1
          maximum: 1000
        includedActiveHours:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1000000
          description: Omitted or null means no included-hours setting.
        perMemberSoftLimit:
          type: integer
          minimum: 1
          maximum: 1000
          description: Must not exceed maxActive.

    WorkPool:
      type: object
      required:
        - workspaceId
        - maxActive
        - perMemberSoftLimit
        - activeSessions
        - memberActiveSessions
      properties:
        workspaceId:
          type: string
          format: uuid
        maxActive:
          type: integer
        includedActiveHours:
          type: integer
          nullable: true
        perMemberSoftLimit:
          type: integer
        activeSessions:
          type: integer
          description: Workspace running work_session count.
        memberActiveSessions:
          type: integer
          description: Calling member's running work_session count.

    WorkPoolResponse:
      type: object
      required: [workPool]
      properties:
        workPool:
          $ref: "#/components/schemas/WorkPool"

    CreateWorkSessionRequest:
      type: object
      required: [channelId, hostId, tool, label]
      properties:
        channelId:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
          description: Registered work_host identity enforced by a database FK.
        tool:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
        label:
          type: string
          minLength: 1
          maxLength: 120
          description: Display-only label. Filesystem cwd/path is never stored.
        controlId:
          type: string
          format: uuid
          description: >
            Required only for MomoHost-signed spawn dispatch. The server binds
            host, channel, tool, label, and session owner to this dispatched control.
        ptyId:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          description: >
            MomoHost-signed remote PTY binding only; must appear together with
            attachEndpoint. create returns this id, while connect, send_stdin,
            resize, and kill target the same id. Human-created local sessions
            omit both fields.
        attachEndpoint:
          type: string
          maxLength: 2048
          description: >
            Credential-free HTTPS or WSS direct PTY endpoint. Userinfo, query,
            and fragment are forbidden. MomoServer never proxies this stream.

    UpdateWorkSessionRequest:
      oneOf:
        - $ref: "#/components/schemas/EndWorkSessionRequest"
        - $ref: "#/components/schemas/UpdateWorkSessionObservationRequest"

    EndWorkSessionRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ended]
        exitCode:
          type: integer
          format: int32

    ResumeWorkSessionRequest:
      type: object
      required: [targetHostId]
      properties:
        targetHostId:
          type: string
          format: uuid
          description: Active registered host allowed by the effective tier policy.

    PutWorkTierPolicyRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [t1_only, ask, auto]
          default: ask
        autoTarget:
          type: string
          description: Required only for auto; a work_host UUID or the reserved cloud selector.
          pattern: '^(cloud|[0-9a-fA-F-]{36})$'

    WorkTierPolicy:
      type: object
      required: [workspaceId, mode, inherited]
      properties:
        workspaceId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
          description: Present for a member override or inherited effective member policy.
        mode:
          type: string
          enum: [t1_only, ask, auto]
        autoTarget:
          type: string
          description: Concrete work_host UUID or the reserved cloud selector in auto mode.
        inherited:
          type: boolean
        updatedAtMs:
          type: integer
          format: int64
          description: Absent for the virtual ask default.

    WorkTierPolicyResponse:
      type: object
      required: [workTierPolicy]
      properties:
        workTierPolicy:
          $ref: "#/components/schemas/WorkTierPolicy"

    UpdateWorkSessionObservationRequest:
      type: object
      required: [observation]
      additionalProperties: false
      properties:
        observation:
          type: string
          enum: [open, owner_only]

    WorkSession:
      type: object
      required:
        [id, workspaceId, channelId, memberId, hostId, rootMessageId,
         tool, label, status, observation, observerGrantCount,
         remoteAttachAvailable, startedAtMs]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
        rootMessageId:
          type: string
          format: uuid
        tool:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
        label:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [running, orphaned, ended]
        observation:
          type: string
          enum: [open, owner_only]
        observerGrantCount:
          type: integer
          format: int64
          minimum: 0
          description: Currently valid observer capabilities only; expired or invalid grants are excluded.
        remoteAttachAvailable:
          type: boolean
          description: True only when the session has a complete remote PTY binding; endpoint and capability remain unprojected.
        startedAtMs:
          type: integer
          format: int64
        endedAtMs:
          type: integer
          format: int64
          description: Present only after the session ends.
        exitCode:
          type: integer
          format: int32
          description: Present only when the ending host reports an exit code.
        endReason:
          type: string
          enum: [orphaned, resumed]
          description: Terminal host-loss or resume reason when applicable.
        resumedFromSessionId:
          type: string
          format: uuid
          description: Source orphaned session; the root thread remains unchanged.

    WorkSessionResponse:
      type: object
      required: [workSession]
      properties:
        workSession:
          $ref: "#/components/schemas/WorkSession"

    WorkSessionListResponse:
      type: object
      required: [workSessions]
      properties:
        workSessions:
          type: array
          items:
            $ref: "#/components/schemas/WorkSession"

    TerminalAttachCapabilityResponse:
      type: object
      required: [attach_endpoint, capability_token, pty_id]
      properties:
        attach_endpoint:
          type: string
          description: Credential-free direct HTTPS or WSS host endpoint.
        capability_token:
          type: string
          description: >
            Opaque 60-second bearer returned once. Only its SHA-256 digest is
            persisted; host-side validation also requires a live host signature.
        pty_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'

    IssueTerminalAttachRequest:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [controller, observer]
          default: controller

    ValidateTerminalAttachRequest:
      type: object
      required: [capability_token]
      properties:
        capability_token:
          type: string
          description: Opaque grant presented by the direct client to its target host.

    TerminalAttachValidationResponse:
      type: object
      required: [work_session_id, pty_id, expires_at, mode]
      properties:
        work_session_id:
          type: string
          format: uuid
        pty_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        expires_at:
          type: string
          format: date-time
          description: PostgreSQL timestamptz capability expiry.
        mode:
          type: string
          enum: [controller, observer]
          description: Host authorization grade; observer forbids send_stdin, resize, and kill.

    # ---- Work controls ------------------------------------------------------
    CreateWorkControlRequest:
      type: object
      required: [channelId, runId, targetHostId, kind, payload]
      properties:
        channelId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
          description: Active run bound to the requesting agent and channel.
        targetHostId:
          type: string
          format: uuid
          description: Registered, unrevoked work_host in this workspace.
        sessionId:
          type: string
          format: uuid
          description: Required for input/read/kill and forbidden for spawn.
        kind:
          type: string
          enum: [spawn, input, read, kill]
        payload:
          $ref: "#/components/schemas/WorkControlPayload"

    WorkControlPayload:
      description: >
        Closed field union selected by kind: spawn requires exactly tool+label,
        input exactly text, read accepts only optional tail_lines, and kill is
        empty. No path, cwd, environment, process state, or credential fields
        are accepted.
      type: object
      properties:
        tool:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
        label:
          type: string
          minLength: 1
          maxLength: 120
        text:
          type: string
          minLength: 1
          maxLength: 32768
        tail_lines:
          type: integer
          minimum: 1
          maximum: 9999

    WorkControlAckRequest:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        sessionId:
          type: string
          format: uuid
          description: Required when acknowledging a successful spawn.
        errorLabel:
          type: string
          minLength: 1
          maxLength: 160
          description: Optional bounded display label for a failed control.

    WorkControl:
      type: object
      required:
        [id, workspaceId, channelId, requesterMemberId, targetHostId, kind,
         payload, status, createdAtMs, updatedAtMs]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        requesterMemberId:
          type: string
          format: uuid
        targetHostId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [spawn, input, read, kill]
        payload:
          $ref: "#/components/schemas/WorkControlPayload"
        status:
          type: string
          enum: [pending_approval, approved, denied, dispatched, acked, failed]
        approvalMessageId:
          type: string
          format: uuid
        createdAtMs:
          type: integer
          format: int64
        updatedAtMs:
          type: integer
          format: int64

    WorkControlResponse:
      type: object
      required: [workControl]
      properties:
        workControl:
          $ref: "#/components/schemas/WorkControl"

    WorkAutoApproveResponse:
      type: object
      required: [tool, enabled]
      properties:
        tool:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
        enabled:
          type: boolean

    WorkAutoApprovalsResponse:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          uniqueItems: true
          description: Enabled tool identifiers sorted lexicographically.
          items:
            type: string
            pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'

    WorkToolLaunchTemplate:
      type: object
      additionalProperties: false
      required: [command, arguments]
      description: Portable host-local command key plus arguments; never an executable path or credential.
      properties:
        command:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        arguments:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 4096

    WorkToolProfile:
      type: object
      required:
        [id, workspaceId, toolKey, displayName, launchTemplate, tierDefaults,
         enabled, createdBy, updatedBy, createdAtMs, updatedAtMs]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        toolKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        launchTemplate:
          $ref: "#/components/schemas/WorkToolLaunchTemplate"
        tierDefaults:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid
        createdAtMs:
          type: integer
          format: int64
        updatedAtMs:
          type: integer
          format: int64

    CreateWorkToolProfileRequest:
      type: object
      additionalProperties: false
      required: [toolKey, displayName, launchTemplate]
      properties:
        toolKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        launchTemplate:
          $ref: "#/components/schemas/WorkToolLaunchTemplate"
        tierDefaults:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
          default: true

    UpdateWorkToolProfileRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        launchTemplate:
          $ref: "#/components/schemas/WorkToolLaunchTemplate"
        tierDefaults:
          type: object
          additionalProperties: true
        enabled:
          type: boolean

    WorkToolProfileResponse:
      type: object
      required: [workToolProfile]
      properties:
        workToolProfile:
          $ref: "#/components/schemas/WorkToolProfile"

    WorkToolProfilesResponse:
      type: object
      required: [workToolProfiles]
      properties:
        workToolProfiles:
          type: array
          items:
            $ref: "#/components/schemas/WorkToolProfile"

    # ---- Huddles ------------------------------------------------------------
    HuddleParticipant:
      type: object
      required: [memberId, displayName, joinedAtMs]
      properties:
        memberId:
          type: string
          format: uuid
        displayName:
          type: string
        joinedAtMs:
          type: integer
          format: int64

    Huddle:
      type: object
      required: [id, workspaceId, channelId, startedBy, startedAtMs, participants]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        startedBy:
          type: string
          format: uuid
        startedAtMs:
          type: integer
          format: int64
        endedAtMs:
          type: integer
          format: int64
          description: Present only after the last participant leaves.
        participants:
          type: array
          description: Current participants only; re-entry history remains server-side.
          items:
            $ref: "#/components/schemas/HuddleParticipant"

    HuddleResponse:
      type: object
      required: [huddle]
      properties:
        huddle:
          $ref: "#/components/schemas/Huddle"

    ActiveHuddleResponse:
      type: object
      properties:
        huddle:
          $ref: "#/components/schemas/Huddle"

    JoinHuddleResponse:
      type: object
      required: [huddle, livekitUrl, token, expiresAtMs, ttlSeconds]
      properties:
        huddle:
          $ref: "#/components/schemas/Huddle"
        livekitUrl:
          type: string
        token:
          type: string
          description: Short-lived LiveKit HS256 access token; never persisted or logged.
        expiresAtMs:
          type: integer
          format: int64
        ttlSeconds:
          type: integer
          enum: [600]

    LeaveHuddleResponse:
      type: object
      required: [huddle, ended]
      properties:
        huddle:
          $ref: "#/components/schemas/Huddle"
        ended:
          type: boolean

    # ---- Messages ----------------------------------------------------------------
    SendMessageRequest:
      type: object
      required: [clientMsgId]
      properties:
        clientMsgId:
          type: string
          format: uuid
          description: Client-generated idempotency key (L4 §3.1).
        rootId:
          type: string
          format: uuid
          description: Undeleted top-level message in this channel used as the thread root.
        type:
          type: string
          enum: [text, tool_call, tool_result, diff, artifact, approval_request, system]
          default: text
        body:
          type: string
        props:
          type: object
          additionalProperties:
            type: string
          description: >
            Simplified structured payload for v0 — a flat string-to-string
            map on send. The server-owned `mention_member_ids` key is
            stripped and recomputed server-side.
        runId:
          type: string
          format: uuid
          description: Agent-run binding; agent principals only.
        attachmentIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
          uniqueItems: true
          description: >
            Completed attachments uploaded by this actor in this channel. They
            are linked to the new message inside the canonical message transaction.

    EditMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1

    ReactionDelta:
      type: object
      required: [action, messageId, memberId, emoji]
      properties:
        action:
          type: string
          enum: [added, removed]
        messageId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        emoji:
          type: string
          minLength: 1
          maxLength: 32

    ReactionSnapshot:
      type: object
      additionalProperties:
        type: object
        additionalProperties:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid

    CreateAttachmentUploadRequest:
      type: object
      required: [name, mime, size]
      properties:
        name:
          type: string
          maxLength: 255
        mime:
          type: string
          maxLength: 255
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 104857600

    AttachmentUploadResponse:
      type: object
      required: [id, status, uploadUrl]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending]
        uploadUrl:
          type: string
          format: uri
          description: Opaque Google resumable upload capability URL.

    Attachment:
      type: object
      required: [id, channelId, uploaderMemberId, name, mime, size, status, createdAtMs]
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        uploaderMemberId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        name:
          type: string
        mime:
          type: string
        size:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, complete, failed]
        createdAtMs:
          type: integer
          format: int64

    Message:
      type: object
      required: [id, channelId, seq, hlcTs, hlcCount, authorMemberId, type, createdAtMs]
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        rootId:
          type: string
          format: uuid
          description: Thread root for a reply; omitted for top-level messages.
        seq:
          type: integer
          format: int64
          description: Gapless per-channel sequence; the ordering authority.
        hlcTs:
          type: integer
          format: int64
        hlcCount:
          type: integer
        authorMemberId:
          type: string
          format: uuid
        type:
          type: string
          enum: [text, tool_call, tool_result, diff, artifact, approval_request, system]
        body:
          type: string
        state:
          type: string
          enum: [sent, edited, deleted, failed]
          description: Durable message state; history always projects the stored value.
        props:
          type: object
          additionalProperties: true
          description: >
            Arbitrary JSON object; includes the server-computed
            `mention_member_ids` array when the message mentions members.
            Omitted when empty.
        runId:
          type: string
          format: uuid
        clientMsgId:
          type: string
          format: uuid
        createdAtMs:
          type: integer
          format: int64
        editedAtMs:
          type: integer
          format: int64
          description: Epoch milliseconds of the latest edit when state is edited or deleted after an edit.
        deletedAtMs:
          type: integer
          format: int64
          description: Epoch milliseconds of deletion; populated for history tombstones.
        attachments:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MessageAttachment"
          description: >
            Completed attachments bound to this message, ordered by creation time.
            Omitted when empty. Upload capability URLs and archive provider identifiers
            are never included; download bytes through the authenticated content proxy.
        thread:
          $ref: "#/components/schemas/ThreadRollup"

    MessageAttachment:
      type: object
      required: [id, name, mime, sizeBytes]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mime:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 104857600

    ThreadRollup:
      type: object
      required: [reply_count, last_reply_seq, last_reply_at]
      properties:
        reply_count:
          type: integer
          minimum: 1
        last_reply_seq:
          type: integer
          format: int64
        last_reply_at:
          type: integer
          format: int64
          description: Epoch milliseconds for the latest reply timestamp.

    MessagePage:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
          description: >
            Descending by seq for head/`before` reads; ASCENDING for
            `after` backfill reads.
        nextBefore:
          type: integer
          format: int64
          description: >
            Smallest seq in this page — pass as `before` to fetch older
            messages. Omitted when the page is empty.

    ThreadRepliesPage:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
          description: Replies ordered by authoritative channel `seq` ascending.
        nextCursor:
          type: integer
          format: int64
          description: Last seq in this page when more replies remain; pass as `cursor`.

    WorkspaceMessageSearchHit:
      type: object
      required: [channelId, messageId, seq, authorMemberId, createdAtMs, snippet, matchOffset]
      properties:
        channelId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
          description: Authoritative per-channel message sequence.
        authorMemberId:
          type: string
          format: uuid
        createdAtMs:
          type: integer
          format: int64
        snippet:
          type: string
          description: Bounded text around the first match, with about 80 characters of context per side.
        matchOffset:
          type: integer
          minimum: 0
          description: Zero-based character offset of the first match within `snippet`.

    WorkspaceMessageSearchResponse:
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMessageSearchHit"
        nextCursor:
          type: string
          description: Opaque cursor for the next older page; omitted when exhausted.

    # ---- Read state (snake_case wire contract, ADR-0109) --------------------------
    UpdateReadStateRequest:
      type: object
      required: [last_read_seq]
      properties:
        last_read_seq:
          type: integer
          format: int64
          minimum: 0

    ReadState:
      type: object
      required: [channel_id, last_read_seq, latest_seq, unread_count, mention_count]
      properties:
        channel_id:
          type: string
          format: uuid
        last_read_seq:
          type: integer
          format: int64
        latest_seq:
          type: integer
          format: int64
        unread_count:
          type: integer
          format: int64
        mention_count:
          type: integer

    ReadStateListResponse:
      type: object
      required: [read_states]
      properties:
        read_states:
          type: array
          items:
            $ref: "#/components/schemas/ReadState"

    # ---- DMs ----------------------------------------------------------------------
    OpenDirectMessageRequest:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
          format: uuid
          description: >
            The other participant (must differ from the caller). Snake-case
            alias accepted by the server, `member_id`.

    OpenDirectMessageResponse:
      type: object
      required: [channel, created]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        created:
          type: boolean
          description: True when the DM channel was created by this call (status 201).

    # ---- Approvals (snake_case wire contract) ---------------------------------------
    ApprovalProjection:
      type: object
      required:
        - id
        - workspace_id
        - run_id
        - channel_id
        - requested_by
        - action_type
        - payload
        - status
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        request_message_id:
          type: string
          format: uuid
          description: The approval_request message, when one exists.
        requested_by:
          type: string
          format: uuid
          description: The requesting agent member.
        on_behalf_of:
          type: string
          description: Delegation subject, projected from `payload.on_behalf_of`.
        action_type:
          type: string
          description: e.g. `tool_call`, `deploy`, `spend`.
        payload: {}
        status:
          type: string
          enum: [pending, approved, rejected, expired, cancelled]
        estimated_micro_usd:
          type: integer
          format: int64
          description: Projected from payload when present as a number or numeric string.
        is_reversible:
          type: boolean
        decided_by:
          type: string
          format: uuid
        decided_at_ms:
          type: integer
          format: int64
        decision_reason:
          type: string
        expires_at_ms:
          type: integer
          format: int64

    # ---- Plugin registry and delegated tool policy --------------------------
    InstallPluginRequest:
      type: object
      properties:
        enabled:
          type: boolean

    GrantPluginRequest:
      type: object
      required: [scope]
      properties:
        scope:
          type: string

    PluginCatalogItem:
      type: object
      required:
        - pluginId
        - name
        - version
        - description
        - official
        - recommended
        - egressDomains
        - recommendedFor
        - installed
        - enabled
      properties:
        pluginId: {type: string}
        name: {type: string}
        version: {type: string}
        description: {type: string}
        official: {type: boolean}
        recommended:
          type: boolean
          description: True for the fixed onboarding set (GitHub, Drive, external webhook).
        egressDomains:
          type: array
          items: {type: string}
        recommendedFor:
          type: array
          items: {type: string}
        installed: {type: boolean}
        enabled: {type: boolean}

    PluginPolicyTool:
      type: object
      required: [name, risk, approvalTier]
      properties:
        name: {type: string}
        risk: {type: string}
        approvalTier: {type: string}

    PluginPolicyMCP:
      type: object
      required: [url, transport]
      properties:
        url: {type: string}
        transport: {type: string}

    PluginPolicyDescriptor:
      type: object
      required: [pluginId, mcp, egressDomains, tools]
      properties:
        pluginId: {type: string}
        mcp:
          $ref: "#/components/schemas/PluginPolicyMCP"
        egressDomains:
          type: array
          items: {type: string}
        tools:
          type: array
          items:
            $ref: "#/components/schemas/PluginPolicyTool"

    PluginToolPolicy:
      type: object
      required: [plugins]
      properties:
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/PluginPolicyDescriptor"

    PluginCatalogResponse:
      type: object
      required: [plugins, toolPolicy]
      properties:
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/PluginCatalogItem"
        toolPolicy:
          $ref: "#/components/schemas/PluginToolPolicy"

    PluginDetail:
      type: object
      required:
        - pluginId
        - name
        - version
        - description
        - official
        - egressDomains
        - recommendedFor
        - installed
        - enabled
        - manifest
      properties:
        pluginId: {type: string}
        name: {type: string}
        version: {type: string}
        description: {type: string}
        official: {type: boolean}
        egressDomains:
          type: array
          items: {type: string}
        recommendedFor:
          type: array
          items: {type: string}
        installed: {type: boolean}
        enabled: {type: boolean}
        manifest:
          description: Validated registry manifest. Its manifest-version-specific shape is preserved.
          type: object
          additionalProperties: true

    PluginDetailResponse:
      type: object
      required: [plugin]
      properties:
        plugin:
          $ref: "#/components/schemas/PluginDetail"

    PluginMutationResponse:
      type: object
      required: [pluginId, status, enabled, capabilities]
      properties:
        pluginId: {type: string}
        memberId:
          type: string
          format: uuid
        scope: {type: string}
        status: {type: string}
        enabled: {type: boolean}
        auditRef:
          type: string
          format: uuid
        capabilities:
          type: array
          items: {type: string}

    # ---- Incoming webhooks --------------------------------------------------
    CreateWebhookRequest:
      type: object
      required: [channelId, mode]
      properties:
        channelId:
          type: string
          format: uuid
        mode:
          type: string
          enum: [native, slack_compatible]
        label:
          type: string
          minLength: 1
          maxLength: 80

    RotateWebhookRequest:
      type: object
      properties:
        overlapSeconds:
          type: integer
          minimum: 0
          maximum: 604800
          default: 86400

    WebhookInstallation:
      type: object
      required: [id, channelId, authorMemberId, mode, label, status, createdAtMs, updatedAtMs]
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        authorMemberId:
          type: string
          format: uuid
        mode:
          type: string
          enum: [native, slack_compatible]
        label: {type: string}
        status:
          type: string
          enum: [active, revoked]
        createdAtMs:
          type: integer
          format: int64
        updatedAtMs:
          type: integer
          format: int64

    WebhookInstallationListResponse:
      type: object
      required: [installations]
      properties:
        installations:
          type: array
          items:
            $ref: "#/components/schemas/WebhookInstallation"

    WebhookSecretResponse:
      type: object
      description: >
        One-time credential response. Native mode includes secret,
        signatureVersion, and algorithm; Slack-compatible mode embeds the
        opaque secret only in url. Absent mode-specific fields are omitted.
      required: [installation, keyId, url]
      properties:
        installation:
          $ref: "#/components/schemas/WebhookInstallation"
        keyId:
          type: string
          format: uuid
        secret:
          type: string
          description: Native HMAC secret, revealed once and never persisted in raw form.
        url:
          type: string
          description: Native relative ingress path or one-time Slack-compatible secret URL.
        signatureVersion:
          type: string
          enum: [v1]
        algorithm:
          type: string
          enum: [HMAC-SHA256]
        overlapSeconds:
          type: integer

    WebhookRevokeResponse:
      type: object
      required: [installation, revoked]
      properties:
        installation:
          $ref: "#/components/schemas/WebhookInstallation"
        revoked: {type: boolean}

    WebhookIngressResponse:
      type: object
      required: [receiptId, messageId, seq, duplicate]
      properties:
        receiptId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
        duplicate: {type: boolean}

    NativeWebhookPayload:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 40000
        event_type:
          type: string
          minLength: 1
          maxLength: 120
        metadata:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
            maxLength: 1000

    SlackCompatibleWebhookPayload:
      type: object
      description: >
        Mattermost-compatible subset. text and legacy attachments are read;
        unsupported fields are ignored except blocks, which returns 400.
      not:
        required: [blocks]
      properties:
        text: {type: string}
        attachments:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    # ---- Hosted Drive MCP JSON-RPC -----------------------------------------
    DriveMCPRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          description: Required by the server for a valid request; string, number, or null on parse errors.
        method:
          type: string
          enum: [initialize, tools/list, tools/call]
        params:
          type: object
          additionalProperties: true

    DriveMCPError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          enum: [-32700, -32600, -32601, -32602, -32003]
        message: {type: string}
        data:
          type: object
          additionalProperties: true

    DriveMCPResponse:
      type: object
      description: Exactly one of result or error is emitted; nil fields are omitted by Swift.
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id: {}
        result: {}
        error:
          $ref: "#/components/schemas/DriveMCPError"

    ApprovalProjectionPage:
      type: object
      required: [approvals]
      properties:
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalProjection"

    ApprovalDecisionRequest:
      type: object
      required: [approval_id, approve, client_decision_id]
      properties:
        approval_id:
          type: string
          format: uuid
          description: Must equal the path approvalId.
        approve:
          type: boolean
        reason:
          type: string
          description: Optional; trimmed and truncated to 2000 chars server-side.
        client_decision_id:
          type: string
          format: uuid
          description: Client-generated idempotency key for the decision.

    ApprovalDecisionReceipt:
      type: object
      description: >
        Decision acknowledgement. Committed decisions carry status
        approved/rejected; expected failures reuse this shape with a
        diagnostic status (e.g. idempotency_conflict, forbidden, not_found,
        bad_request, expired, or the approval's current status on a 409).
      required: [approval_id, status]
      properties:
        approval_id:
          type: string
          format: uuid
        status:
          type: string
        decided_by:
          type: string
          format: uuid
          description: Absent for system-side outcomes such as expiry.
        decided_at_ms:
          type: integer
          format: int64
        decision_reason:
          type: string
