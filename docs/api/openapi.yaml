      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 2}
        - name: scope
          in: query
          schema: {$ref: "#/components/schemas/MemoryScope"}
        - name: agent
          in: query
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        "200":
          description: RRF-ranked memory hits; FTS-only and vector-only hits are valid.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemorySearchResponse"}
        "400":
          description: Query, scope, agent, or limit is malformed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/memories/{memoryId}:
    patch:
      tags: [memories]
      operationId: updateMemory
      summary: Edit the bounded body or confidence of an active memory.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/MemoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateMemoryRequest"}
      responses:
        "200":
          description: Updated memory and committed lifecycle/audit/outbox evidence.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryItemResponse"}
        "400":
          description: No editable field or invalid value.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: Memory does not exist in this workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "409":
          description: Memory is disabled or the item was already invalidated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/memories/{memoryId}/invalidate:
    post:
      tags: [memories]
      operationId: invalidateMemory
      summary: Time-invalidate a memory without deleting its source or lifecycle evidence.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/MemoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InvalidateMemoryRequest"}
      responses:
        "200":
          description: Invalidated memory and committed lifecycle/audit/outbox evidence.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryItemResponse"}
        "400":
          description: Invalid replacement memory or self-invalidation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: Memory does not exist in this workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/memories/{memoryId}/grants:
    get:
      tags: [memories]
      operationId: listMemoryVisibilityGrants
      summary: List active and revoked explicit visibility grants for one memory.
      description: >
        Workspace owner/admin, the member-scope subject, or the human
        owner of an agent-scope memory only. The read runs through FORCE RLS.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/MemoryId"
      responses:
        "200":
          description: Grant ledger rows, with active grants first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryVisibilityGrantPageResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: Memory does not exist in this workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}
    post:
      tags: [memories]
      operationId: grantMemoryVisibility
      summary: Grant explicit memory visibility to one active member or agent.
      description: >
        Workspace owner/admin, the member-scope subject, or the human
        owner of an agent-scope memory only. A revoked ledger row is reactivated;
        posting an already-active grant is idempotent. Grant changes and audit
        evidence commit in one ordinary tenant transaction through FORCE RLS.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/MemoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MemoryVisibilityGrantRequest"}
      responses:
        "200":
          description: Active grant projection.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryVisibilityGrantResponse"}
        "400":
          description: Invalid grantee kind/id or no matching active grantee.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: Memory does not exist in this workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}
    delete:
      tags: [memories]
      operationId: revokeMemoryVisibility
      summary: Revoke explicit memory visibility without deleting its ledger row.
      description: >
        Uses the same manager boundary as grant creation. The first call marks
        revokedAtMs and writes audit evidence; revoking the same row again is an
        idempotent 200 with no duplicate revoke audit row.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/MemoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MemoryVisibilityGrantRequest"}
      responses:
        "200":
          description: Revoked grant projection.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryVisibilityGrantResponse"}
        "400":
          description: Invalid grantee kind or identifier.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: Memory or visibility grant does not exist in this workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/memory-policy:
    get:
      tags: [memories]
      operationId: getMemoryPolicy
      summary: Read the workspace memory switch.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Current policy; absent rows project as enabled by default.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryPolicyResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
    put:
      tags: [memories]
      operationId: putMemoryPolicy
      summary: Enable memory, or disable and purge it atomically.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PutMemoryPolicyRequest"}
      responses:
        "200":
          description: Updated policy and deleted count when disabled.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryPolicyResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/workspaces/{workspaceId}/memory-external-provider-consent:
    get:
      tags: [memories]
      operationId: getMemoryExternalProviderConsent
      summary: Read external-provider memory consent and the server policy verdict.
      description: >
        Active workspace members may read this projection. Provider trust is
        classified by the server from its configured provider mode and endpoint;
        credentials and raw endpoint query data are never returned. The consent
        value is a separate axis from the workspace memory enabled switch.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Current explicit consent, provider trust, and extraction verdict.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryExternalProviderConsentResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
    put:
      tags: [memories]
      operationId: putMemoryExternalProviderConsent
      summary: Replace the workspace external-provider memory consent.
      description: >
        Human workspace admin only. Existing workspaces default to false, and
        every update is recorded in the workspace audit ledger. This operation
        does not enable/disable or purge workspace memory.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PutMemoryExternalProviderConsentRequest"}
      responses:
        "200":
          description: Updated consent and the server policy verdict.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryExternalProviderConsentResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/provider/link/chain:
    get:
      tags: [agents]
      operationId: getProviderLinkChain
      summary: Read every configured provider cascade hop, including unavailable ciphertext rows.
      description: >
        Instance-global operator surface (MOMO-583 / ADR-0135 D1): a human
        principal carrying the platform:read scope, or an owner/admin whose
        verified email is on the instance operator allowlist. Position 0 is the
        legacy provider-link singleton and remains editable only through it.
        Bearers are never echoed — a hop carries a masked 4-character tail only
        (ADR-0004).
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Provider chain projection, position 0 first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderChainResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/ProviderOperatorForbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
    put:
      tags: [agents]
      operationId: replaceProviderLinkChain
      summary: Atomically replace fallback provider cascade hops.
      description: >
        Same operator boundary as the read. Replaces positions >= 1 in one
        transaction; position 0 is rejected by name. Omitting an entry's bearer
        keeps the ciphertext already stored at that position, so a hop can be
        reordered or parked without re-typing a write-only secret.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PutProviderChainRequest"}
      responses:
        "200":
          description: Chain projection after the replace, position 0 first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderChainResponse"}
        "400":
          description: >
            Unknown body key, position 0 or a duplicate position, more than
            eight hops, an unusable baseUrl, an unknown mode, an empty bearer,
            or a new position submitted without one.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/ProviderOperatorForbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
    delete:
      tags: [agents]
      operationId: clearProviderLinkChain
      summary: Remove every fallback provider cascade hop.
      description: >
        Same operator boundary as the read. Drops every fallback hop; the
        response then projects the cascade as position 0 alone.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Chain projection after the clear — position 0 alone.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderChainResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/ProviderOperatorForbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/provider/effort-table:
    get:
      tags: [agents]
      operationId: getProviderEffortTable
      summary: Read the provider and model effort capabilities used by routing.
      description: >
        Any authenticated principal — human access token or agent gateway
        bearer, both sent as `Authorization: Bearer`. The table carries no
        tenant row and no provider credential (ADR-0134 D2), and a model absent
        from it resolves to the conservative low/medium/high fallback rather
        than silently accepting a level the provider would reject.

        Two provider groups are served. `hermes` holds oort's own
        provider-agnostic gateway handles (ADR-0130). `openai-codex` holds model
        ids the upstream publishes in its own catalog, measured 2026-08-04 from
        GET https://chatgpt.com/backend-api/codex/models — the base URL an
        ADR-0147 OAuth link stores. The upstream lists a sixth level, `ultra`,
        on some of those models; oort deliberately does not serve it, so
        `levels` stays low/medium/high/xhigh/max and an `ultra` request is a
        400.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Effort capability table.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderEffortTableResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/RateLimited"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        App access token (15m TTL) from login/join/refresh, sent as
        `Authorization: Bearer <accessToken>`. Tokens are hash-persisted
        server-side and revocable (MOMO-300).
    agentPortBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: oort agent bearer
      description: >
        Static agent bearer presented only as
        `Authorization: Bearer <agentCredential>`. The active agent principal
        must carry the non-default `agent:port:connect` reachability scope and
        match its workspace. This scheme is deliberately separate from the app
        JWT scheme and is not OAuth or protected-resource discovery; Agent Port
        credentials are never accepted from a URL or query parameter.
    workHostAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >
        `Authorization: MomoHost <workHostId>` plus X-Momo-Work-Host-Sent-At,
        X-Momo-Work-Host-Request-ID, and X-Momo-Work-Host-Signature. The v2
        Ed25519 payload also binds SHA-256(raw request body); this is not a
        durable bearer credential.

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: >
        Workspace UUID. Must equal the workspace bound into the access token;
        any other value is rejected with 403 (tenant isolation, L4 §1.3).
      schema:
        type: string
        format: uuid
    InviteId:
      name: inviteId
      in: path
      required: true
      description: Invite-code row UUID. Never a raw invite code.
      schema:
        type: string
        format: uuid
    ChannelId:
      name: channelId
      in: path
      required: true
      description: Channel UUID.
      schema:
        type: string
        format: uuid
    HuddleId:
      name: huddleId
      in: path
      required: true
      description: Huddle UUID; also used as the LiveKit room name.
      schema:
        type: string
        format: uuid
    WorkSessionId:
      name: workSessionId
      in: path
      required: true
      description: UUIDv7 work session ledger id.
      schema:
        type: string
        format: uuid
    WorkstreamId:
      name: workstreamId
      in: path
      required: true
      description: UUIDv7 workstream (goal layer) id.
      schema:
        type: string
        format: uuid
    WorkHostId:
      name: workHostId
      in: path
      required: true
      description: UUIDv7 registered execution host id.
      schema:
        type: string
        format: uuid
    WorkHostSentAt:
      name: X-Momo-Work-Host-Sent-At
      in: header
      required: true
      description: Unix epoch milliseconds inside the five-minute clock-skew window.
      schema:
        type: integer
        format: int64
    WorkHostSignature:
      name: X-Momo-Work-Host-Signature
      in: header
      required: true
      description: Raw 64-byte Ed25519 signature in standard base64.
      schema:
        type: string
    WorkHostRequestId:
      name: X-Momo-Work-Host-Request-ID
      in: header
      required: true
      description: >
        Unique UUID bound into the v2 signature and atomically accepted once
        within its ten-minute replay-retention lifetime.
      schema:
        type: string
        format: uuid
    WorkControlId:
      name: workControlId
      in: path
      required: true
      description: UUIDv7 work control ledger id.
      schema:
        type: string
        format: uuid
    MemoryId:
      name: memoryId
      in: path
      required: true
      description: UUIDv7 memory item id.
      schema:
        type: string
        format: uuid
    WorkTool:
      name: tool
      in: path
      required: true
      description: Workspace-registered execution tool key.
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: Attachment UUID owned by PostgreSQL.
      schema:
        type: string
        format: uuid
    PluginId:
      name: pluginId
      in: path
      required: true
      description: Stable plugin manifest identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    DelegatedMemberId:
      name: delegatedMemberId
      in: query
      required: false
      description: Required for an agent bearer; ignored for a human bearer.
      schema:
        type: string
        format: uuid
    DelegatedChannelId:
      name: channelId
      in: query
      required: false
      description: Required for an agent bearer; must contain both agent and delegated human.
      schema:
        type: string
        format: uuid
    DelegatedMemberIdRequired:
      name: delegatedMemberId
      in: query
      required: true
      description: Active human whose grant is delegated to the agent call.
      schema:
        type: string
        format: uuid
    DelegatedChannelIdRequired:
      name: channelId
      in: query
      required: true
      description: Active channel containing both the delegated human and calling agent.
      schema:
        type: string
        format: uuid
    WebhookInstallationId:
      name: installationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MomoSignatureVersion:
      name: X-Momo-Signature-Version
      in: header
      required: true
      schema:
        type: string
        enum: [v1]
    MomoKeyId:
      name: X-Momo-Key-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    MomoTimestamp:
      name: X-Momo-Timestamp
      in: header
      required: true
      description: Unix seconds; accepted only inside the five-minute replay window.
      schema:
        type: integer
        format: int64
    MomoDeliveryId:
      name: X-Momo-Delivery-Id
      in: header
      required: true
      description: Idempotency key, 1..200 characters from the server allowlist.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    MomoSignature:
      name: X-Momo-Signature
      in: header
      required: true
      description: Lower/uppercase hexadecimal HMAC-SHA256, optionally prefixed with `v1=`.
      schema:
        type: string

    MCPProtocolVersion:
      name: MCP-Protocol-Version
      in: header
      required: false
      description: >
        Exact protocol version mirrored from the request body. Required and
        equal to `2026-07-28` on every modern call. A legacy `initialize` may
        omit it; all later legacy calls require exact `2025-11-25`.
      schema:
        type: string
        enum: ["2026-07-28", "2025-11-25"]
    MCPMethod:
      name: Mcp-Method
      in: header
      required: false
      description: >
        Required on modern calls and byte-for-byte equal to the JSON-RPC
        method. Legacy clients may omit it; when present it must match.
      schema:
        type: string
        enum:
          - server/discover
          - initialize
          - notifications/initialized
          - ping
          - tools/list
          - tools/call
    MCPName:
      name: Mcp-Name
      in: header
      required: false
      description: >
        Required only for modern `tools/call`; must exactly equal
        `params.name`. Forbidden on methods that do not call a tool.
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    Unauthorized:
      description: Missing, invalid, expired, or revoked access token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Not an active workspace member, or workspace scope mismatch.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProviderOperatorForbidden:
      description: >
        The instance-global operator boundary (MOMO-583): the caller is not a
        human principal, or carries neither the `platform:read` scope nor an
        owner/admin role with a verified email on the instance operator
        allowlist. A workspace admin alone is not enough.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    HuddleNotConfigured:
      description: LiveKit API key, secret, or URL is absent/invalid; huddles fail closed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: >
        Per-IP or per-member sliding-window rate limit exceeded (MOMO-300).
        Carries a `Retry-After` header in seconds.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AgentPortUnauthorized:
      description: >
        Agent bearer is missing, malformed, expired, revoked, inactive, or
        otherwise invalid. The response body is empty. A missing credential
        has no `error` parameter; a presented invalid credential uses
        `error="invalid_token"`.
      headers:
        WWW-Authenticate:
          description: Bearer challenge scoped to `agent:port:connect`.
          schema:
            type: string
        Cache-Control:
          description: Agent Port responses are private and must never be stored.
          schema:
            type: string
            enum: ["private, no-store"]
    AgentPortForbidden:
      description: >
        A present Origin is not the configured canonical HTTPS origin, or the
        authenticated agent lacks `agent:port:connect`. The response body is
        empty. Scope denial includes `error="insufficient_scope"`; Origin
        denial occurs before authentication and carries no challenge.
      headers:
        WWW-Authenticate:
          description: Optional Bearer insufficient-scope challenge.
          schema:
            type: string
        Cache-Control:
          description: Agent Port responses are private and must never be stored.
          schema:
            type: string
            enum: ["private, no-store"]
    AgentPortRateLimited:
      description: >
        Dedicated per-token, per-agent, or per-IP Agent Port sliding-window
        limit exceeded. No raw token, token hash, body, or client metadata is
        returned or logged.
      headers:
        Retry-After:
          description: Whole seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          description: Agent Port responses are private and must never be stored.
          schema:
            type: string
            enum: ["private, no-store"]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentPortJSONRPCErrorResponse"

  schemas:
    # ---- Error envelope (Hummingbird HTTPError) ------------------------------
    ErrorResponse:
      type: object
      description: >
        Generic error envelope. Some errors (no message) may return an empty
        body with only the status code.
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string

    # ---- Memory Plane (ADR-0129 / MOMO-526) ---------------------------------
    MemoryScope:
      type: string
      enum: [workspace, member, agent, conversation]

    MemoryKind:
      type: string
      enum: [profile, fact, episode, procedure]

    MemorySourceRefRequest:
      type: object
      additionalProperties: false
      required: [messageId, channelId]
      properties:
        messageId: {type: string, format: uuid}
        channelId: {type: string, format: uuid}

    MemorySourceRef:
      type: object
      additionalProperties: false
      required: [messageId, channelId]
      properties:
        messageId: {type: string, format: uuid}
        channelId: {type: string, format: uuid}

    CreateMemoryRequest:
      type: object
      additionalProperties: false
      required: [scope, kind, body, confidence, sourceRefs]
      properties:
        scope: {$ref: "#/components/schemas/MemoryScope"}
        subjectMemberId: {type: string, format: uuid}
        agentMemberId: {type: string, format: uuid}
        channelId: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/MemoryKind"}
        body: {type: string, minLength: 1, maxLength: 16384}
        confidence: {type: number, format: double, minimum: 0, maximum: 1}
        validAtMs: {type: integer, format: int64, minimum: 0}
        sourceRefs:
          type: array
          minItems: 1
          maxItems: 32
          items: {$ref: "#/components/schemas/MemorySourceRefRequest"}

    UpdateMemoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        body: {type: string, minLength: 1, maxLength: 16384}
        confidence: {type: number, format: double, minimum: 0, maximum: 1}

    InvalidateMemoryRequest:
      type: object
      additionalProperties: false
      properties:
        invalidatedByMemoryId: {type: string, format: uuid}

    MemoryVisibilityGrantRequest:
      type: object
      additionalProperties: false
      required: [granteeKind, granteeId]
      properties:
        granteeKind: {type: string, enum: [member, agent]}
        granteeId: {type: string, format: uuid}

    MemoryVisibilityGrant:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - memoryId
        - granteeKind
        - granteeId
        - grantedBy
        - createdAtMs
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        memoryId: {type: string, format: uuid}
        granteeKind: {type: string, enum: [member, agent]}
        granteeId: {type: string, format: uuid}
        grantedBy: {type: string, format: uuid}
        createdAtMs: {type: integer, format: int64}
        revokedAtMs: {type: integer, format: int64}

    MemoryVisibilityGrantResponse:
      type: object
      additionalProperties: false
      required: [grant]
      properties:
        grant: {$ref: "#/components/schemas/MemoryVisibilityGrant"}

    MemoryVisibilityGrantPageResponse:
      type: object
      additionalProperties: false
      required: [grants]
      properties:
        grants:
          type: array
          items: {$ref: "#/components/schemas/MemoryVisibilityGrant"}

    PutMemoryPolicyRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}

    PutMemoryExternalProviderConsentRequest:
      type: object
      additionalProperties: false
      required: [consented]
      properties:
        consented: {type: boolean}

    ContextPacketResponse:
      type: object
      additionalProperties: false
      required: [packetId, runId, workspaceId, createdAtMs, expiresAtMs, expired, content]
      properties:
        packetId: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        createdAtMs: {type: integer, format: int64}
        expiresAtMs: {type: integer, format: int64}
        expired: {type: boolean}
        content:
          type: object
          description: Frozen momo.context_packet.v0 JSON object.
          additionalProperties: true

    MemoryItem:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - scope
        - kind
        - body
        - confidence
        - validAtMs
        - createdByKind
        - createdAtMs
        - updatedAtMs
        - sourceRefs
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        scope: {$ref: "#/components/schemas/MemoryScope"}
        subjectMemberId: {type: string, format: uuid}
        agentMemberId: {type: string, format: uuid}
        channelId: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/MemoryKind"}
        body: {type: string}
        confidence: {type: number, format: double}
        validAtMs: {type: integer, format: int64}
        invalidAtMs: {type: integer, format: int64}
        invalidatedByMemoryId: {type: string, format: uuid}
        createdByKind: {type: string, enum: [human, agent, worker]}
        createdByMemberId: {type: string, format: uuid}
        createdAtMs: {type: integer, format: int64}
        updatedAtMs: {type: integer, format: int64}
        sourceRefs:
          type: array
          items: {$ref: "#/components/schemas/MemorySourceRef"}

    MemoryItemResponse:
      type: object
      additionalProperties: false
      required: [memory]
      properties:
        memory: {$ref: "#/components/schemas/MemoryItem"}

    MemoryPageResponse:
      type: object
      additionalProperties: false
      required: [memories]
      properties:
        memories:
          type: array
          items: {$ref: "#/components/schemas/MemoryItem"}

    MemorySearchHit:
      type: object
      additionalProperties: false
      required: [memory, score]
      properties:
        memory: {$ref: "#/components/schemas/MemoryItem"}
        score: {type: number, format: double, minimum: 0}
        ftsRank: {type: integer, minimum: 1}
        vectorRank: {type: integer, minimum: 1}
        vectorDistance: {type: number, format: double, minimum: 0}

    MemorySearchResponse:
      type: object
      additionalProperties: false
      required: [hits]
      properties:
        hits:
          type: array
          items: {$ref: "#/components/schemas/MemorySearchHit"}

    MemoryPolicy:
      type: object
      additionalProperties: false
      required: [workspaceId, enabled]
      properties:
        workspaceId: {type: string, format: uuid}
        enabled: {type: boolean}
        updatedBy: {type: string, format: uuid}
        updatedAtMs: {type: integer, format: int64}

    MemoryPolicyResponse:
      type: object
      additionalProperties: false
      required: [memoryPolicy]
      properties:
        memoryPolicy: {$ref: "#/components/schemas/MemoryPolicy"}
        deletedCount: {type: integer, minimum: 0}

    MemoryExternalProviderConsent:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - consented
        - providerTrust
        - providerEndpointLabel
        - extractionAllowed
      properties:
        workspaceId: {type: string, format: uuid}
        consented: {type: boolean, default: false}
        providerTrust: {type: string, enum: [local-mock, self-hosted, external]}
        providerEndpointLabel:
          type: string
          description: Redacted provider scheme/host/port/path without credentials or query.
        extractionAllowed: {type: boolean}
        updatedBy: {type: string, format: uuid}
        updatedAtMs: {type: integer, format: int64}

    MemoryExternalProviderConsentResponse:
      type: object
      additionalProperties: false
      required: [memoryExternalProviderConsent]
      properties:
        memoryExternalProviderConsent:
          $ref: "#/components/schemas/MemoryExternalProviderConsent"

    # ---- Auth ----------------------------------------------------------------
    ClaimRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: >
            Raw 32-byte claim token (43-char base64url, no padding). Shown once
            at issue (migrate bootstrap or operator reset); the server stores
            only sha256.
        password:
          type: string
          description: Required, at most 1024 chars.

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          description: The caller's current password. Reconfirm is mandatory.
        newPassword:
          type: string
          description: Replacement password, at most 1024 chars, must differ.

    RenameSelfMemberRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          description: >
            1..100 chars after trimming. Same rule and 400 sentence as join
            (`displayName is required`). Handle/role/avatar are not accepted.

    SelfMemberResponse:
      type: object
      required: [member]
      properties:
        member:
          $ref: "#/components/schemas/Member"

    PasswordResetClaimResponse:
      type: object
      additionalProperties: false
      required: [token, kind, expiresAtMs, claimPath]
      properties:
        token:
          type: string
          description: Raw 32-byte token. Present only on this 201.
        kind:
          type: string
          enum: [password_reset]
        expiresAtMs:
          type: integer
          format: int64
        claimPath:
          type: string
          description: >
            /claim/<token> — the existing ClaimPage route.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: Human member email within the workspace.
        password:
          type: string
        workspace:
          type: string
          format: uuid
          description: >
            Optional explicit workspace UUID. When omitted (or not a valid
            UUID) the server falls back to the seeded demo workspace
            (single-tenant v0 convenience).
        platformAdminSecret:
          type: string
          description: >
            Optional platform-admin elevation secret (snake-case alias
            `platform_admin_secret`). Irrelevant to the web v0 client; the
            account password must still verify before it can add scope.

    LoginResponse:
      type: object
      required: [accessToken, refreshToken, member, realtimeWebSocketUrl]
      properties:
        accessToken:
          type: string
          description: Bearer access JWT, 15 minute TTL.
        refreshToken:
          type: string
          description: Single-use rotating refresh JWT, 30 day TTL.
        member:
          $ref: "#/components/schemas/Member"
        realtimeWebSocketUrl:
          type: string
          description: >
            The ONLY authority for the realtime WebSocket address (ADR-0110).
            Never derive it from the API origin.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    RefreshResponse:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: >
            Optional refresh token of the same session to revoke alongside
            the access token.

    LogoutResponse:
      type: object
      required: [status, revokedAccess, revokedRefresh, alreadyRevoked]
      properties:
        status:
          type: string
          enum: [ok]
        revokedAccess:
          type: boolean
          description: The access token transitioned to revoked in this call.
        revokedRefresh:
          type: boolean
          description: The body refresh token transitioned to revoked in this call.
        alreadyRevoked:
          type: boolean
          description: Nothing new was revoked (idempotent repeat logout).

    RealtimeTokenResponse:
      type: object
      required: [token, tokenType, expiresAtMs, ttlSeconds, workspaceId, memberId]
      properties:
        token:
          type: string
          description: Centrifugo connection JWT.
        tokenType:
          type: string
          enum: [centrifugo.connection.jwt]
        expiresAtMs:
          type: integer
          format: int64
        ttlSeconds:
          type: integer
        workspaceId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid

    Member:
      type: object
      description: Minimal member identity as returned by login/join.
      required: [id, workspaceId, kind, displayName, handle]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [human, agent]
        displayName:
          type: string
        handle:
          type: string

    # ---- Public join -----------------------------------------------------------
    JoinRequest:
      type: object
      required: [code, email, displayName, password]
      properties:
        code:
          type: string
          description: Raw invite code (shown once at creation; server stores only the hash).
        email:
          type: string
          description: Lowercased/trimmed server-side; must contain `@`.
        displayName:
          type: string
          description: 1..100 chars after trimming. Snake-case alias `display_name`.
        handle:
          type: string
          pattern: "^[a-z0-9_-]{2,32}$"
          description: Optional; derived from the email local part when omitted.
        password:
          type: string
          description: Required, at most 1024 chars.
        timeZone:
          type: string
          description: Optional IANA time zone; defaults to UTC. Aliases `time_zone`, `tz`.

    JoinMembership:
      type: object
      required: [id, channelId, role]
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/MembershipRole"

    InviteCode:
      type: object
      description: >
        Invite metadata. The raw code is intentionally absent (only returned
        once at creation, outside this surface).
      required:
        - id
        - workspaceId
        - codePreview
        - role
        - maxUses
        - usedCount
        - expiresAtMs
        - createdBy
        - createdAtMs
        - updatedAtMs
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        codePreview:
          type: string
          description: Safe display hint (may be empty).
        role:
          $ref: "#/components/schemas/MembershipRole"
        maxUses:
          type: integer
        usedCount:
          type: integer
        expiresAtMs:
          type: integer
          format: int64
        revokedAtMs:
          type: integer
          format: int64
        revokedBy:
          type: string
          format: uuid
        revocationReason:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAtMs:
          type: integer
          format: int64
        updatedAtMs:
          type: integer
          format: int64

    CreateInviteRequest:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/MembershipRole"
        maxUses:
          type: integer
          minimum: 1
          maximum: 10000
        expiresAtMs:
          type: integer
          format: int64

    CreateInviteResponse:
      type: object
      required: [invite, code]
      properties:
        invite:
          $ref: "#/components/schemas/InviteCode"
        code:
          type: string
          description: >
            One-time raw invite code. Shown once at creation/regenerate.
            Never store this in examples, samples, or logs.

    InviteListResponse:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items:
            $ref: "#/components/schemas/InviteCode"

    RevokeInviteRequest:
      type: object
      properties:
        reason:
          type: string

    RedeemInviteRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Raw invite code supplied by the caller. Not echoed.
        email:
          type: string

    RedeemInviteResponse:
      type: object
      required: [invite, redemptionId]
      properties:
        invite:
          $ref: "#/components/schemas/InviteCode"
        redemptionId:
          type: string
          format: uuid

    InviteRedemption:
      type: object
      required: [id, memberId, redeemedAtMs]
      properties:
        id:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        email:
          type: string
        redeemedAtMs:
          type: integer
          format: int64

    InviteStatusResponse:
      type: object
      required: [invite, redemptions]
      properties:
        invite:
          $ref: "#/components/schemas/InviteCode"
        redemptions:
          type: array
          items:
            $ref: "#/components/schemas/InviteRedemption"

    JoinResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - workspaceId
        - member
        - realtimeWebSocketUrl
        - memberships
        - invite
        - redemptionId
        - createdMember
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        workspaceId:
          type: string
          format: uuid
        member:
          $ref: "#/components/schemas/Member"
        realtimeWebSocketUrl:
          type: string
          description: Server-owned WebSocket address authority (ADR-0110).
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/JoinMembership"
          description: Public-channel memberships granted by this join.
        invite:
          $ref: "#/components/schemas/InviteCode"
        redemptionId:
          type: string
          format: uuid
        createdMember:
          type: boolean
          description: True when a new member row was created (response status 201).

    # ---- Roster ----------------------------------------------------------------
    RosterMember:
      type: object
      description: >
        Roster entry. Human-only fields (email/timeZone) and agent-only
        fields (agentModel/ownerHumanId/maxConcurrentRuns/maxRunSteps/paused)
        are present only for the matching kind; agent secrets and execution
        config are never exposed.
      required:
        - id
        - workspaceId
        - kind
        - status
        - displayName
        - handle
        - channelCount
        - channelIds
        - capabilities
        - createdAtMs
        - updatedAtMs
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [human, agent]
        status:
          type: string
          enum: [active, invited, suspended, deleted]
        displayName:
          type: string
        handle:
          type: string
        avatarUrl:
          type: string
        role:
          $ref: "#/components/schemas/MembershipRole"
        channelCount:
          type: integer
        channelIds:
          type: array
          items:
            type: string
            format: uuid
        capabilities:
          type: array
          items:
            type: string
          description: Public capability projection for agents; empty for humans.
        origin:
          type: string
          enum: [card, local]
          description: Present for agents only; additive origin projection from the confirmed card ledger.
        email:
          type: string
        timeZone:
          type: string
        agentModel:
          type: string
        ownerHumanId:
          type: string
          format: uuid
        maxConcurrentRuns:
          type: integer
        maxRunSteps:
          type: integer
        paused:
          type: boolean
          description: >
            Present for agents only, and always present for them including when
            false, so a list can tell "awake" apart from "not reported".
            `agent_profile.paused`; an agent with no profile row reports false.
            This is not a new disclosure: mentioning a paused agent already posts
            a public system line in the channel saying so, and the rest of the
            profile (instructions, enabled tools, triggers) stays behind the
            owner-gated profile read.
        presenceStatus:
          type: string
          enum: [auto, away, dnd]
          description: >
            Declared presence status (ADR-0160 ③), present for humans only.
            `member.presence_status`; the durable intent, not the effective dot,
            which the client computes as f(this, availability) and never stores.
            `auto` means no manual override (renders online when connected,
            offline otherwise); `away`/`dnd` are the two manual overrides.
            Absent for agents (presence is human-only, their liveness is
            agent_run) and absent from a server too old to carry the column.
        statusEmoji:
          type: string
          description: >
            ADR-0176 custom status emoji, human only. Omitted when unset, empty,
            expired (`statusExpiresAtMs` reached — lazy delete), or for an agent.
        statusText:
          type: string
          maxLength: 80
          description: >
            ADR-0176 custom status text (trimmed, ≤80), human only. Omitted when
            unset, empty, expired, or for an agent.
        statusExpiresAtMs:
          type: integer
          format: int64
          description: >
            ADR-0176 optional expiry as epoch milliseconds. Omitted when there is
            no visible custom status (including when the stamp has been reached).
        createdAtMs:
          type: integer
          format: int64
        updatedAtMs:
          type: integer
          format: int64

    WorkspaceRosterResponse:
      type: object
      required: [members, humanCount, agentCount]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/RosterMember"
        humanCount:
          type: integer
        agentCount:
          type: integer

    SetPresenceRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [auto, away, dnd]
          description: ADR-0160 declared presence. Required so a pre-0176 body still decodes.
        statusEmoji:
          type: string
          nullable: true
          maxLength: 32
          description: >
            ADR-0176. Omitted = leave stored value. JSON null = clear. Empty or
            whitespace-only is stored as cleared. Length/code-point cap only.
        statusText:
          type: string
          nullable: true
          maxLength: 80
          description: >
            ADR-0176. Omitted = leave stored value. JSON null = clear. Trimmed;
            empty becomes cleared. Over 80 characters is 400.
        statusExpiresAtMs:
          type: integer
          format: int64
          nullable: true
          description: >
            ADR-0176 optional expiry. Omitted = leave stored value. JSON null =
            clear. A reached stamp is accepted on write and ignored on read.

    PresenceStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [auto, away, dnd]
        statusEmoji:
          type: string
        statusText:
          type: string
          maxLength: 80
        statusExpiresAtMs:
          type: integer
          format: int64

    # ---- Membership lifecycle (ADR-0128) ------------------------------------
    ChangeMembershipRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/MembershipRole"

    MembershipRoleResponse:
      type: object
      required: [memberId, scope, role]
      properties:
        memberId: {type: string, format: uuid}
        scope: {type: string, enum: [workspace, channel]}
        role: {$ref: "#/components/schemas/MembershipRole"}

    MembershipLifecycleResponse:
      type: object
      required: [memberId, status]
      properties:
        memberId: {type: string, format: uuid}
        status: {type: string, enum: [active, suspended, deleted]}

    ChannelLeaveResponse:
      type: object
      required: [channelId, memberId, archived]
      properties:
        channelId: {type: string, format: uuid}
        memberId: {type: string, format: uuid}
        archived: {type: boolean}

    AuditEvent:
      type: object
      required: [id, action, detail, createdAtMs]
      properties:
        id: {type: string, format: uuid}
        actorMemberId: {type: string, format: uuid}
        subjectMemberId: {type: string, format: uuid}
        action: {type: string}
        targetType: {type: string}
        targetId: {type: string, format: uuid}
        viaTokenId: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        detail: {type: object, additionalProperties: true}
        createdAtMs: {type: integer, format: int64}

    AuditPageResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: {$ref: "#/components/schemas/AuditEvent"}
        nextCursor: {type: string, format: uuid}

    RemoveWorkspaceMemberRequest:
      type: object
      additionalProperties: false
      properties:
        ban: {type: boolean, default: false}
        reason: {type: string, maxLength: 500}

    CreateWorkspaceBanRequest:
      type: object
      description: At least one of email or handle is required.
      anyOf:
        - required: [email]
        - required: [handle]
      additionalProperties: false
      properties:
        email: {type: string, maxLength: 320}
        handle: {type: string, pattern: "^[a-z0-9_-]{2,32}$"}
        reason: {type: string, maxLength: 500}

    WorkspaceBan:
      type: object
      required: [id, createdBy, createdAtMs]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        handle: {type: string}
        createdBy: {type: string, format: uuid}
        reason: {type: string}
        createdAtMs: {type: integer, format: int64}

    WorkspaceBanResponse:
      type: object
      required: [ban]
      properties:
        ban: {$ref: "#/components/schemas/WorkspaceBan"}

    WorkspaceBanListResponse:
      type: object
      required: [bans]
      properties:
        bans:
          type: array
          items: {$ref: "#/components/schemas/WorkspaceBan"}

    # ---- Agent creation -------------------------------------------------------
    CreateAgentRequest:
      type: object
      required: [displayName, handle, model, baseUrl]
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        handle:
          type: string
          pattern: "^[a-z0-9_-]{2,32}$"
          description: Trimmed and lowercased server-side; unique and not banned per workspace.
        model:
          type: string
          minLength: 1
          maxLength: 200
        baseUrl:
          type: string
          format: uri
          description: >
            OpenAI-compatible base URL. Userinfo, query, and fragment are
            forbidden. Non-loopback hosts require HTTPS; local loopback HTTP
            requires MOMO_ENV=local plus AGENT_PROVIDER_ALLOW_LOCAL_LOOPBACK=1
            and an explicit port.
        systemPrompt:
          type: string
          maxLength: 32768
          description: Optional; blank collapses to absent. The server enforces a 32768-byte limit.
        config:
          type: object
          additionalProperties: true
          description: >
            Optional provider-neutral runtime tuning, at most 65536 encoded
            bytes. Credential-like keys (OAuth/API keys, bearer tokens,
            passwords, private keys) are rejected recursively.
        ownerHumanId:
          type: string
          format: uuid
          description: Optional active human owner in this workspace; defaults to the caller.
        profile:
          $ref: "#/components/schemas/AgentProfileInput"

    AgentProfileInput:
      type: object
      additionalProperties: false
      required: [instructions, enabledTools]
      properties:
        instructions:
          type: string
          description: UTF-8 content is limited to 8192 bytes by the server.
        modelPref:
          type: string
          minLength: 1
          maxLength: 200
          description: Applied only when listed in workspace.settings.allowed_agent_models.
        effortPref:
          type: string
          enum: [low, medium, high, xhigh, max]
        enabledTools:
          type: array
          maxItems: 128
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 200}
        triggers:
