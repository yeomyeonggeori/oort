# MOMO-186 deterministic local e2e stack.
#
# This compose file is intentionally separate from:
#   - infra/docker-compose.yml              dev PG18 + Centrifugo for local iteration
#   - infra/prod/docker-compose.prod.yml    image-based staging/prod skeleton
#
# Purpose:
#   Local gate boundary for API/relay/worker/mock-Hermes/Postgres/Centrifugo.
#   It may use the source checkout and local Swift builds; prod compose must not.
#
# Static validation:
#   docker compose --env-file .env.worktree -f infra/docker-compose.e2e.yml config

x-e2e-common-env: &e2e-common-env
  POSTGRES_DB: ${POSTGRES_DB:-momo}
  POSTGRES_USER: ${POSTGRES_USER:-momo}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
  CENT_TOKEN_HMAC: ${CENT_TOKEN_HMAC:-change-me-cent-token-hmac}
  CENT_API_KEY: ${CENT_API_KEY:-change-me-cent-api-key}
  CENT_PROXY_SECRET: ${CENT_PROXY_SECRET:-change-me-cent-proxy-secret}
  JWT_HMAC: ${JWT_HMAC:-change-me-jwt-hmac}
  HERMES_API_KEY: ${HERMES_API_KEY:-change-me-hermes-bearer}

x-source-mount: &source-mount
  type: bind
  source: ..
  target: /workspace
  read_only: true

services:
  postgres:
    image: postgres:18
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-momo}
      POSTGRES_USER: ${POSTGRES_USER:-momo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - e2e-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-momo} -d ${POSTGRES_DB:-momo}"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  centrifugo:
    image: centrifugo/centrifugo:v6
    restart: "no"
    command: centrifugo --config=/centrifugo/centrifugo.json
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENT_TOKEN_HMAC:-change-me-cent-token-hmac}
      CENTRIFUGO_HTTP_API_KEY: ${CENT_API_KEY:-change-me-cent-api-key}
      # MOMO-300: subscribe proxy shared-secret header (must match the api
      # service's CENT_PROXY_SECRET below; unauthenticated callbacks are 401).
      CENTRIFUGO_CHANNEL_PROXY_SUBSCRIBE_HTTP_STATIC_HEADERS: '{"X-Centrifugo-Proxy-Secret":"${CENT_PROXY_SECRET:-change-me-cent-proxy-secret}"}'
    ports:
      - "${CENT_PORT:-8000}:8000"
    volumes:
      - ./centrifugo.json:/centrifugo/centrifugo.json:ro
    healthcheck:
      test: ["CMD", "centrifugo", "healthcheck", "--config=/centrifugo/centrifugo.json"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy

  mock-hermes:
    image: python:3.12-slim
    restart: "no"
    working_dir: /workspace
    command: ["python3", "scripts/mock_hermes.py", "--host", "0.0.0.0", "--port", "8088"]
    ports:
      - "${HERMES_PORT:-8088}:8088"
    volumes:
      - *source-mount
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8088/health\", timeout=2).read()'",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

  migrate:
    image: postgres:18
    restart: "no"
    working_dir: /workspace
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-momo}:${POSTGRES_PASSWORD:-change-me-postgres}@postgres:5432/${POSTGRES_DB:-momo}
      MOMO_AGENT_SEED_MODE: e2e
    command: ["sh", "-lc", "sh scripts/migrate.sh"]
    volumes:
      - *source-mount
    depends_on:
      postgres:
        condition: service_healthy

  db-roles:
    image: postgres:18
    restart: "no"
    working_dir: /workspace
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-momo}:${POSTGRES_PASSWORD:-change-me-postgres}@postgres:5432/${POSTGRES_DB:-momo}
    command: ["sh", "-lc", "psql \"$$DATABASE_URL\" -v ON_ERROR_STOP=1 -f infra/e2e/bootstrap_roles.sql"]
    volumes:
      - *source-mount
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    image: swift:6.2
    restart: "no"
    init: true
    working_dir: /workspace
    command:
      [
        "bash",
        "-lc",
        "rm -rf /tmp/momo-src && mkdir -p /tmp/momo-src && cp -R /workspace/server /tmp/momo-src/server && cd /tmp/momo-src && swift run --package-path server --scratch-path /tmp/momo-swiftpm/server MomoServer",
      ]
    environment:
      <<: *e2e-common-env
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://momo_app:momo_app_dev_pw@postgres:5432/${POSTGRES_DB:-momo}
      CENT_API_URL: http://centrifugo:8000/api
      # MOMO-391: the web login smoke fronts realtime with the web-edge Caddy
      # site, so login must hand browsers the wss:// edge address instead of
      # the raw host-port Centrifugo URL (ADR-0110: this response field is the
      # only websocket address authority). Default (unset) keeps the existing
      # direct ws:// URL for every other gate.
      MOMO_CENTRIFUGO_WS_URL: ${MOMO_E2E_REALTIME_WS_URL:-ws://127.0.0.1:${CENT_PORT:-8000}/connection/websocket}
      HERMES_BASE_URL: http://mock-hermes:8088/v1
      HERMES_API_KEY: ${HERMES_API_KEY:-change-me-hermes-bearer}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - *source-mount
      - api-swiftpm:/tmp/momo-swiftpm/server
    depends_on:
      db-roles:
        condition: service_completed_successfully
      centrifugo:
        condition: service_healthy
      mock-hermes:
        condition: service_healthy

  relay:
    image: swift:6.2
    restart: "no"
    init: true
    working_dir: /workspace
    command:
      [
        "bash",
        "-lc",
        "rm -rf /tmp/momo-src && mkdir -p /tmp/momo-src/relay && cp -R /workspace/relay/OutboxRelay /tmp/momo-src/relay/OutboxRelay && cd /tmp/momo-src && swift run --package-path relay/OutboxRelay --scratch-path /tmp/momo-swiftpm/relay OutboxRelay",
      ]
    environment:
      <<: *e2e-common-env
      RELAY_DATABASE_URL: postgres://momo_relay:momo_relay_dev_pw@postgres:5432/${POSTGRES_DB:-momo}
      CENT_API_URL: http://centrifugo:8000/api
      RELAY_POLL_INTERVAL_MS: ${RELAY_POLL_INTERVAL_MS:-100}
    volumes:
      - *source-mount
      - relay-swiftpm:/tmp/momo-swiftpm/relay
    depends_on:
      db-roles:
        condition: service_completed_successfully
      centrifugo:
        condition: service_healthy

  worker:
    image: swift:6.2
    restart: "no"
    init: true
    working_dir: /workspace
    command:
      [
        "bash",
        "-lc",
        "rm -rf /tmp/momo-src && mkdir -p /tmp/momo-src/workers /tmp/momo-src/clients && cp -R /workspace/workers/AgentWorker /tmp/momo-src/workers/AgentWorker && cp -R /workspace/clients/Core /tmp/momo-src/clients/Core && cd /tmp/momo-src && swift run --package-path workers/AgentWorker --scratch-path /tmp/momo-swiftpm/worker AgentWorker",
      ]
    environment:
      <<: *e2e-common-env
      RELAY_DATABASE_URL: postgres://momo_worker:momo_worker_dev_pw@postgres:5432/${POSTGRES_DB:-momo}
      CENT_API_URL: http://centrifugo:8000/api
      HERMES_BASE_URL: http://mock-hermes:8088/v1
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-100}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-1}
    volumes:
      - *source-mount
      - worker-swiftpm:/tmp/momo-swiftpm/worker
    depends_on:
      db-roles:
        condition: service_completed_successfully
      centrifugo:
        condition: service_healthy
      mock-hermes:
        condition: service_healthy

  # MOMO-390: web serving smoke boundary. Runs the prod Caddyfile (the real
  # deploy artifact) against localhost-only domains to verify the {$APP_DOMAIN}
  # SPA site: placeholder index.html serving, SPA deep-link fallback, /v1/*
  # proxy wiring, and the /v1/centrifugo/* edge 403. Profile-gated (`web`) so
  # existing runtime gate profiles never boot it; scripts/web_serving_smoke.sh
  # is the entry point (MOMO-391 reuses this edge for the full login smoke).
  # `.localhost` site addresses use Caddy's internal CA only — no ACME traffic,
  # no production domains (ADR-0002 e2e boundary).
  web-edge:
    image: caddy:2-alpine
    profiles: ["web"]
    restart: "no"
    environment:
      ACME_EMAIL: ${WEB_EDGE_ACME_EMAIL:-e2e-web@momo.localhost}
      API_DOMAIN: ${WEB_EDGE_API_DOMAIN:-api.localhost}
      REALTIME_DOMAIN: ${WEB_EDGE_REALTIME_DOMAIN:-rt.localhost}
      APP_DOMAIN: ${WEB_EDGE_APP_DOMAIN:-app.localhost}
    ports:
      - "127.0.0.1:${WEB_EDGE_HTTP_PORT:-19080}:80"
      - "127.0.0.1:${WEB_EDGE_HTTPS_PORT:-19443}:443"
    volumes:
      - ./prod/Caddyfile:/etc/caddy/Caddyfile:ro
      # MOMO-391: the login smoke mounts the built SPA (clients/web/dist,
      # absolute path) here; default stays the MOMO-390 placeholder so the
      # serving smoke's expectations are unchanged.
      - ${WEB_EDGE_ASSETS_DIR:-./e2e/web-placeholder}:/srv/momo-web:ro
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 2s

  # MOMO-404 (ADR-0120 P-2): push notifier boundary. Profile-gated (`push`) so
  # every existing gate profile renders byte-identically (MOMO-390 precedent);
  # scripts/verify_push_notifier.sh is the entry point. mock-push-relay stands
  # in for the Dawn-operated PushRelay (P-3) and exposes /received so the
  # verifier can assert the id-only dispatch contract (no message body, no
  # display names — ADR-0120 D2).
  mock-push-relay:
    image: python:3.12-slim
    profiles: ["push"]
    restart: "no"
    working_dir: /workspace
    command: ["python3", "scripts/mock_push_relay.py", "--host", "0.0.0.0", "--port", "8090"]
    ports:
      - "${PUSH_RELAY_PORT:-8090}:8090"
    volumes:
      - *source-mount
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8090/health\", timeout=2).read()'",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

  # NotifierWorker: outbox kind='push_candidate' consumer — judgment v0 (DM +
  # mention + approval request) + push_dispatch_log + relay dispatch. Connects
  # as the BYPASSRLS momo_notifier role (bootstrap_roles.sql). Scratch lives in
  # the container filesystem (no named volume) so the default-profile compose
  # render stays untouched; `docker compose restart notifier` keeps the build.
  notifier:
    image: swift:6.2
    profiles: ["push"]
    restart: "no"
    init: true
    working_dir: /workspace
    command:
      [
        "bash",
        "-lc",
        "rm -rf /tmp/momo-src && mkdir -p /tmp/momo-src/workers && cp -R /workspace/workers/NotifierWorker /tmp/momo-src/workers/NotifierWorker && cd /tmp/momo-src && swift run --package-path workers/NotifierWorker --scratch-path /tmp/momo-swiftpm/notifier NotifierWorker",
      ]
    environment:
      <<: *e2e-common-env
      NOTIFIER_DATABASE_URL: postgres://momo_notifier:momo_notifier_dev_pw@postgres:5432/${POSTGRES_DB:-momo}
      PUSH_RELAY_URL: http://mock-push-relay:8090/v1/push
      PUSH_RELAY_SERVER_ID: momo-e2e
      NOTIFIER_POLL_INTERVAL_MS: ${NOTIFIER_POLL_INTERVAL_MS:-100}
    volumes:
      - *source-mount
    depends_on:
      db-roles:
        condition: service_completed_successfully
      mock-push-relay:
        condition: service_healthy

volumes:
  e2e-pgdata:
  api-swiftpm:
  relay-swiftpm:
  worker-swiftpm:
