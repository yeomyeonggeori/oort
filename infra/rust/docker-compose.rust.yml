# momo Rust stack — prod-shaped compose for the messenger-partial smoke.
# ADR-0145 B안 / batch B1.7. Companion runbook: infra/rust/README.md,
# docs/planning/2026-07-30-ncp-rust-smoke-prep.md §3.
#
# This file mirrors infra/prod/docker-compose.prod.yml — same image digests for
# postgres and centrifugo, same service names, same command/env contract
# (`command: ["api"]`, `DATABASE_URL`, `JWT_HMAC`, `CENT_API_*`) — reduced to the
# minimum set the Rust binaries can actually serve today:
#
#   postgres · centrifugo · runtime-roles · migrate · api · relay · agent-worker
#
# ## Overlays (#1228) — this file is the base, not the whole deployment
#
# A production stack is this file plus named overlays. Until #1228 three of
# them existed only on the deploy host and in no commit, which is why this
# header used to describe their absence as scope rather than as a gap:
#
#   docker-compose.push.yml     push-relay · notifier   (ADR-0120, default-off)
#   caddy.override.yml          caddy · web-init        (TLS edge + the SPA)
#   cent-origin.override.yml    the WSS origin allowlist
#   t3.override.yml             ADR-0140 platform surfaces on the api
#   docker-compose.rust.build.yml / .lane-phone.yml     local build / phone lane
#
# Still deliberately absent everywhere: redis (Centrifugo runs its memory
# engine, single node), prometheus, linkshort, workd.
#
# Static validation (no daemon needed):
#   docker compose --env-file infra/rust/rust-smoke.secrets.env \
#     -f infra/rust/docker-compose.rust.yml config

name: ${COMPOSE_PROJECT_NAME:-momo-rust}

# The janitor labels are load bearing on this host: unlabeled stacks were the
# blind spot behind the Docker VM resource accumulation, and every service here
# must be reclaimable by project label.
x-momo-janitor-labels: &momo-janitor-labels
  com.momo.janitor.managed: "true"
  com.momo.janitor.match-label: com.docker.compose.project

# ONE image, six commands (server-rust/Dockerfile). Compose interpolates this
# anchor per service, so api/relay/agent-worker/migrate/runtime-roles — and the
# overlays' notifier and web-init — can never drift apart. Since #1228 the SPA
# is in that image too, so this one variable pins the browser as well.
x-rust-image: &rust-image ${MOMO_RUST_IMAGE:?set MOMO_RUST_IMAGE}

services:
  # Same digest as prod (docker-compose.prod.yml:64) — PG18 + pgvector, because
  # migrations 027/028 create vector columns.
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-trixie@sha256:9d2e61c7352b9e9f4798df5fd9a498f043f4cda1cdacc707de3d198650f4321e
    mem_limit: ${MOMO_POSTGRES_MEM_LIMIT:-2g}
    labels: *momo-janitor-labels
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Same digest as prod (:103). Config is the existing infra/centrifugo.json —
  # no new Centrifugo configuration is introduced by this batch. It carries no
  # `engine` block, so Centrifugo uses its in-memory engine; prod's redis engine
  # exists for multi-node fan-out, which a single-VPS smoke does not need.
  centrifugo:
    image: centrifugo/centrifugo:v6@sha256:8ba0c9443dadedc21b20254b3fc76f35c1998b29acc7cdec877ea0c3636c237e
    mem_limit: ${MOMO_CENTRIFUGO_MEM_LIMIT:-512m}
    labels: *momo-janitor-labels
    restart: unless-stopped
    command: centrifugo --config=/centrifugo/centrifugo.json
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENT_TOKEN_HMAC:?set CENT_TOKEN_HMAC}
      CENTRIFUGO_HTTP_API_KEY: ${CENT_API_KEY:?set CENT_API_KEY}
      CENTRIFUGO_LOG_LEVEL: ${CENTRIFUGO_LOG_LEVEL:-info}
      # 배포 도메인의 WSS Origin. v6 env는 **공백 구분** 목록이다 — JSON 배열
      # 문자열을 주면 통째로 원소 하나가 되어 전부 403이 된다(2026-08-01 실측,
      # QA Blocker B1). 마운트된 config보다 env가 우선한다.
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:-https://app.localhost http://localhost:5173 tauri://localhost http://tauri.localhost}
      # The mounted config ships a `dev-insecure-...` placeholder for this
      # header. Overriding it here means no committed placeholder secret can
      # ever reach a deployed stack. **B4: this is now load bearing** — the Rust
      # api serves /v1/centrifugo/subscribe and rejects any callback that does
      # not present exactly this value, so the two services must agree or every
      # subscribe is denied.
      CENTRIFUGO_CHANNEL_PROXY_SUBSCRIBE_HTTP_STATIC_HEADERS: '{"X-Centrifugo-Proxy-Secret":"${CENT_PROXY_SECRET:?set CENT_PROXY_SECRET}"}'
    ports:
      # Loopback only: the smoke reads /api/history from the host, and nothing
      # about this stack should be reachable from the internet without Caddy.
      - "127.0.0.1:${CENT_HOST_PORT:-8000}:8000"
    volumes:
      - ../centrifugo.json:/centrifugo/centrifugo.json:ro
    networks:
      - private
    healthcheck:
      test: ["CMD", "centrifugo", "healthcheck", "--config=/centrifugo/centrifugo.json"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # MOMO-554 parity (prod :319): idempotent runtime-role creation / password
  # rotation, run BEFORE migrate so its ALTER DEFAULT PRIVILEGES cover every
  # table the migrations are about to create.
  runtime-roles:
    image: *rust-image
    command: ["migrate"]
    mem_limit: ${MOMO_RUNTIME_ROLES_MEM_LIMIT:-256m}
    labels: *momo-janitor-labels
    restart: "no"
    environment:
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?set MIGRATE_DATABASE_URL}
      MOMO_RUNTIME_ROLE_PROVISION: "1"
      MOMO_APP_POSTGRES_PASSWORD: ${MOMO_APP_POSTGRES_PASSWORD:?set MOMO_APP_POSTGRES_PASSWORD}
      RELAY_POSTGRES_PASSWORD: ${RELAY_POSTGRES_PASSWORD:?set RELAY_POSTGRES_PASSWORD}
      WORKER_POSTGRES_PASSWORD: ${WORKER_POSTGRES_PASSWORD:?set WORKER_POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  # One-shot, source-checkout-free migration (prod :298). MOMO_BOOTSTRAP_RUNTIME_ROLES=0
  # makes this fail closed unless runtime-roles produced the exact posture, so the
  # committed development role passwords in infra/e2e/bootstrap_roles.sql are
  # never applied by this stack.
  #
  # Ops one-shots use the same service:
  #   docker compose ... run --rm migrate set-owner
  migrate:
    image: *rust-image
    command: ["migrate"]
    mem_limit: ${MOMO_MIGRATE_MEM_LIMIT:-1g}
    labels: *momo-janitor-labels
    restart: "no"
    environment:
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?set MIGRATE_DATABASE_URL}
      MOMO_BOOTSTRAP_RUNTIME_ROLES: "0"
      # `none` is the product default (no legacy agent fixtures, seeded owner
      # password locked by migration 012). A local smoke may select `e2e`.
      MOMO_AGENT_SEED_MODE: ${MOMO_AGENT_SEED_MODE:-none}
      MIGRATE_IDEMPOTENCY_CHECK: ${MIGRATE_IDEMPOTENCY_CHECK:-1}
      # Consumed only by `run --rm migrate set-owner`; unset otherwise.
      MOMO_INITIAL_OWNER_EMAIL: ${MOMO_INITIAL_OWNER_EMAIL:-}
      MOMO_INITIAL_OWNER_PASSWORD: ${MOMO_INITIAL_OWNER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      runtime-roles:
        condition: service_completed_successfully
    networks:
      - private

  # prod :142. Env names are the prod names; the values differ only in that the
  # keys this server does not read are not injected at all:
  #   * HERMES_*/AGENT_*/S3/webhook+provider master keys — no route consumes
  #     them yet, and an unread secret in the environment is pure exposure.
  # They come back with the batch that implements the feature.
  #
  # B4 adds the two Centrifugo keys the api reads for *authorization*:
  # CENT_TOKEN_HMAC signs connection tokens and CENT_PROXY_SECRET authenticates
  # the subscribe callback. Neither can publish anything.
  #
  # goal SRV-T2 / ADR-0149 adds CENT_API_URL + CENT_API_KEY, which this block
  # previously withheld on the grounds that "momo-server has NO HTTP client
  # (invariant #2: publishing is the relay's alone)". That sentence stops being
  # true here, and the ADR is the decision that says so: 휘발 신호 (「작성 중」)
  # cannot ride the outbox — 100 rows per typist per five minutes, none of them
  # ever read — so the server publishes it directly.
  #
  # What replaces the withheld credential as the guard: the only code in the api
  # image that can reach Centrifugo is `momo-ephemeral`, whose entire API takes
  # a sealed `EphemeralSignal` (today: 「작성 중」 and nothing else). The durable
  # rail is untouched — a persisted message still travels outbox → relay →
  # Centrifugo, and this key cannot make one.
  #
  # Leaving both unset is supported and is what an un-updated deployment gets:
  # the two 휘발 routes answer 503 and nothing else changes.
  api:
    image: *rust-image
    command: ["api"]
    mem_limit: ${MOMO_API_MEM_LIMIT:-1g}
    labels: *momo-janitor-labels
    restart: unless-stopped
    environment:
      MOMO_ENV: ${MOMO_ENV:-staging}
      HOST: 0.0.0.0
      PORT: 8080
      # momo_app — NOBYPASSRLS, so every request is filtered by the same RLS
      # policies production uses (invariant #6).
      DATABASE_URL: ${MOMO_APP_DATABASE_URL:?set MOMO_APP_DATABASE_URL}
      JWT_HMAC: ${JWT_HMAC:?set JWT_HMAC}
      # ADR-0110: the ONLY authority for the realtime address handed to clients.
      # No default — a wrong guess silently points every client at nothing.
      MOMO_CENTRIFUGO_WS_URL: ${MOMO_CENTRIFUGO_WS_URL:?set MOMO_CENTRIFUGO_WS_URL}
      # B4 (prod parity :159, :164). Must equal what the centrifugo service above
      # is given, or the rail fails closed in the two ways it can: a connection
      # token the broker cannot verify, or a subscribe callback the api 401s.
      CENT_TOKEN_HMAC: ${CENT_TOKEN_HMAC:?set CENT_TOKEN_HMAC}
      CENT_PROXY_SECRET: ${CENT_PROXY_SECRET:?set CENT_PROXY_SECRET}
      # ADR-0149 (SRV-T2): the 휘발 신호 publish credential. Same values the relay
      # gets below — one Centrifugo, one server API key. Unset ⇒ 휘발 신호 off
      # (503), which is why neither line uses the `:?` required form.
      CENT_API_URL: http://centrifugo:8000/api
      CENT_API_KEY: ${CENT_API_KEY:-}
      # MOMO-605 / DESK-1. Empty (the default) means the CORS layer is not
      # mounted at all, which is exactly the web deployment's same-origin case.
      # A value is required only for non-browser origins — the Tauri desktop
      # webview is `tauri://localhost`, and without this it cannot reach the API
      # at all. Explicit allowlist; `*` is refused at boot.
      MOMO_CORS_ALLOWED_ORIGINS: ${MOMO_CORS_ALLOWED_ORIGINS:-}
      # ADR-0151 — the workspace Drive archive. All three defaults are EMPTY, and
      # empty means the attachment routes answer 503 "Drive archive is not
      # configured": the surface is mounted but closed, which is what an
      # un-updated deployment gets and is the only safe default for a stack that
      # holds no service-account key.
      #
      # `MOMO_DRIVE_ARCHIVE_BACKEND=stub` is deliberately NOT usable here — this
      # stack runs MOMO_ENV=staging, where a stub archive is a boot error. An
      # in-memory archive accepts uploads, reports them complete and loses every
      # byte on restart; that is the one Drive configuration worth refusing to
      # start over.
      MOMO_DRIVE_ARCHIVE_BACKEND: ${MOMO_DRIVE_ARCHIVE_BACKEND:-}
      # A path INSIDE the api container. The key never enters the image or this
      # file — mount it read-only and name it here (ADR-0004: provider
      # credentials do not flow through momo's request path).
      MOMO_DRIVE_SA_KEY_PATH: ${MOMO_DRIVE_SA_KEY_PATH:-}
      MOMO_DRIVE_SHARED_DRIVE_ID: ${MOMO_DRIVE_SHARED_DRIVE_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Loopback only. The NCP smoke drives it over an SSH tunnel; nothing here
      # is published to the public interface. Public exposure is the job of
      # caddy.override.yml, which reaches the api over the `private` network
      # and never through this host port.
      - "127.0.0.1:${MOMO_RUST_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - private
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # prod :200. The relay is the workspace's only Centrifugo writer, so it is the
  # only service here holding CENT_API_KEY.
  relay:
    image: *rust-image
    command: ["relay"]
    mem_limit: ${MOMO_RELAY_MEM_LIMIT:-512m}
    labels: *momo-janitor-labels
    restart: unless-stopped
    environment:
      MOMO_ENV: ${MOMO_ENV:-staging}
      # momo_relay — BYPASSRLS: the drain loop crosses every tenant (L4 §2.2).
      RELAY_DATABASE_URL: ${RELAY_DATABASE_URL:?set RELAY_DATABASE_URL}
      CENT_API_URL: http://centrifugo:8000/api
      CENT_API_KEY: ${CENT_API_KEY:?set CENT_API_KEY}
      RELAY_POLL_INTERVAL_MS: ${RELAY_POLL_INTERVAL_MS:-300}
      RELAY_CLAIM_BATCH: ${RELAY_CLAIM_BATCH:-64}
      RELAY_MAX_ATTEMPTS: ${RELAY_MAX_ATTEMPTS:-8}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - private

  # B5.1/B5.4 — the tikitaka worker: drains agent_job, calls the LLM provider
  # (the ONLY outbound-HTTP service besides the relay's Centrifugo hop), writes
  # the reply through the message spine as the agent member.
  agent-worker:
    image: *rust-image
    command: ["agent-worker"]
    mem_limit: ${MOMO_AGENT_WORKER_MEM_LIMIT:-512m}
    labels: *momo-janitor-labels
    restart: unless-stopped
    environment:
      MOMO_ENV: ${MOMO_ENV:-staging}
      # momo_worker — BYPASSRLS drain across tenants (bootstrap_roles.sql).
      WORKER_DATABASE_URL: postgres://momo_worker:${WORKER_POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      PROVIDER_LINK_MASTER_KEY: ${PROVIDER_LINK_MASTER_KEY:?set PROVIDER_LINK_MASTER_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - private

networks:
  private:
    labels: *momo-janitor-labels

volumes:
  pgdata:
    # A distinct default from prod's `momo-pgdata`: this stack must never adopt
    # or overwrite a Swift-stack volume on the same host.
    name: ${DB_VOLUME_NAME:-momo-rust-pgdata}
