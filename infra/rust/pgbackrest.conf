# oort PostgreSQL 18 pgBackRest runtime contract (#1330).
#
# This file is deliberately non-secret.  The image wrapper reads the repository
# cipher passphrase only from /run/secrets/pgbackrest_repo1_cipher_pass and
# refuses PGBACKREST_REPO1_CIPHER_PASS in its environment.

[momo]
pg1-path=/var/lib/postgresql/18/docker
pg1-database=momo
pg1-user=momo

[global]
repo1-type=posix
repo1-path=/var/lib/pgbackrest
repo1-retention-full=4
repo1-retention-full-type=count
repo1-retention-diff=7
repo1-cipher-type=aes-256-cbc
archive-async=n
compress-type=gz
process-max=2
start-fast=y
log-level-console=info
log-level-file=off
spool-path=/tmp/pgbackrest

[global:archive-push]
compress-level=3
