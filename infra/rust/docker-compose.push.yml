# ADR-0120 push path overlay for docker-compose.rust.yml — goal PUSH-1.
#
#   docker compose --env-file infra/rust/rust-smoke.secrets.env \
#     --env-file infra/rust/push-relay.secrets.env \
#     -f infra/rust/docker-compose.rust.yml \
#     -f infra/rust/docker-compose.push.yml up -d
#
# ## Default-off, and off by construction rather than by a flag someone can miss
#
# This file adds two services the base stack deliberately does not have. It is
# an OVERLAY, so the push path exists only when an operator names it with a
# second `-f`: the running dogfooding stack reads `docker-compose.rust.yml` and
# nothing in it changed, so `momorust up -d` cannot start a relay, cannot pull an
# image it does not reference, and cannot fail on a variable it does not
# interpolate. That is the convention this directory already uses to separate
# optional wiring (`docker-compose.rust.build.yml`); `profiles:` appears nowhere
# under infra/rust, and one gate an operator can see beats two they can forget.
#
# The push drain is default-off a second time inside the notifier
# (`MOMO_PUSH_NOTIFIER_ENABLED`, default 0 — server-rust/bins/momo-notifier).
#
# ## Why the notifier is here too
#
# The relay alone dispatches nothing. `notifier` is the process that drains
# `push_candidate` and posts signed dispatches, and the base compose omits it
# ("Deliberately absent (B1.7 scope)"). Without it this overlay would be a relay
# with no client and the runbook could not reach a device. It carries no APNs
# credential — only the Ed25519 key that identifies this server to the relay.
#
# ## Placement caveat
#
# Co-locating the relay with the self-hosted stack is a single-VPS convenience
# for the Dawn-operated smoke, not the architecture. ADR-0120 D1-A makes the
# relay a boundary that serves *many* self-hosted servers, and
# infra/prod/prometheus.yml:18 already records it as "a Dawn-operated deployment
# boundary, not a service in the stack". See the placement section of
# docs/cicd/12-push-relay-deploy-runbook.md.

# YAML anchors do not cross files, so the janitor labels are redeclared here.
# They are load bearing on this host: unlabeled stacks were the blind spot
# behind the Docker VM resource accumulation.
x-momo-janitor-labels: &momo-janitor-labels
  com.momo.janitor.managed: "true"
  com.momo.janitor.match-label: com.docker.compose.project

services:
  # The APNs boundary. Built from relay/PushRelay/Dockerfile; the deployed stack
  # references a published tag exactly like MOMO_RUST_IMAGE does.
  #
  # Where the required-variable check lives is a deliberate split:
  #   * `${VAR:?}` for the two BIND MOUNT SOURCES only. A missing mount source
  #     is the one failure compose alone can catch — an unset path silently
  #     becomes a directory bind on some daemons, and the process then fails
  #     obscurely on a "key" that is a folder. Fail at render instead.
  #   * `${VAR:-}` for everything else. The binaries already refuse to boot on
  #     a missing credential and say which variable is missing; keeping that
  #     path live means the runbook's fail-closed check exercises real product
  #     behaviour rather than compose's interpolator.
  # `:?` is safe in this file precisely because it is an overlay: it is only
  # ever interpolated when an operator names it with a second `-f`, so it can
  # never break `docker compose config` for the running base stack.
  push-relay:
    image: ${MOMO_PUSH_RELAY_IMAGE:-momo-push-relay:dev}
    mem_limit: ${MOMO_PUSH_RELAY_MEM_LIMIT:-512m}
    labels: *momo-janitor-labels
    restart: unless-stopped
    environment:
      # `{"<server-id>":"<raw Ed25519 public key, base64>"}`. Generated by
      # scripts/push_relay_keygen.sh on the SERVER side; only the public half
      # is ever given to the relay.
      MOMO_RELAY_SERVERS: ${MOMO_RELAY_SERVERS:-}
      # In a container the compiled-in 127.0.0.1 default would bind loopback
      # inside the netns: healthy to its own healthcheck, unreachable to the
      # notifier. Set explicitly, never defaulted.
      MOMO_PUSH_RELAY_HOST: 0.0.0.0
      MOMO_PUSH_RELAY_PORT: 28195
      MOMO_PUSH_RELAY_RATE_LIMIT_PER_MINUTE: ${MOMO_PUSH_RELAY_RATE_LIMIT_PER_MINUTE:-60}
      # live is the binary's default; named here so the deployed posture is
      # readable in the compose file rather than implied by an absent variable.
      MOMO_APNS_SENDER: ${MOMO_APNS_SENDER:-live}
      # Only meaningful with MOMO_APNS_SENDER=stub, which additionally refuses
      # to boot unless MOMO_APNS_ALLOW_STUB=1. Empty in a real deployment.
      MOMO_APNS_ALLOW_STUB: ${MOMO_APNS_ALLOW_STUB:-}
      MOMO_APNS_ENV: ${MOMO_APNS_ENV:-sandbox}
      # A path INSIDE the container, pointing at the read-only mount below.
      # The key itself never enters the image or this repo (ADR-0120 D1-A).
      MOMO_APNS_KEY_PATH: /run/secrets/apns-key.p8
      MOMO_APNS_KEY_ID: ${MOMO_APNS_KEY_ID:-}
      MOMO_APNS_TEAM_ID: ${MOMO_APNS_TEAM_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # The one thing an operator supplies that is not an environment variable.
      # MOMO_APNS_KEY_HOST_PATH is an absolute path on the host, outside this
      # repo. Read-only, and it must be readable by uid 10001 (the image's
      # unprivileged `momo` user) or the relay refuses to boot and names the
      # variable in its log line.
      - type: bind
        source: ${MOMO_APNS_KEY_HOST_PATH:?set MOMO_APNS_KEY_HOST_PATH to the absolute host path of the APNs .p8 (outside this repo)}
        target: /run/secrets/apns-key.p8
        read_only: true
    networks:
      - private
    healthcheck:
      # Proves the process is up and listening. It does NOT prove the relay can
      # reach Apple — nothing short of a real dispatch does, which is why the
      # runbook's success criterion is an APNs receipt, not a green container.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:28195/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # The push-candidate drain (ADR-0120 batch P2). Same image and same role
  # contract as every other Rust service: `command: ["notifier"]`.
  notifier:
    image: ${MOMO_RUST_IMAGE:-momo-rust:dev}
    command: ["notifier"]
    mem_limit: ${MOMO_NOTIFIER_MEM_LIMIT:-512m}
    labels: *momo-janitor-labels
    restart: unless-stopped
    environment:
      MOMO_ENV: ${MOMO_ENV:-staging}
      # A BYPASSRLS connection string — a durable intent must converge whichever
      # tenant owns it.
      #
      # ⚠ PREREQUISITE GAP, not an oversight: the canonical role for this is
      # `momo_notifier`, and `infra/prod/bootstrap_runtime_roles.sql` does NOT
      # create it — it provisions momo_app / momo_relay / momo_worker only.
      # (`momo_notifier` exists solely in infra/e2e/bootstrap_roles.sql with a
      # committed dev password, which this stack deliberately never applies.)
      # So there is no correct default to write here, and inventing one would
      # hand the notifier a role with the wrong privileges. The operator supplies
      # the URL; unset is a boot refusal naming this variable. See the
      # prerequisites section of docs/cicd/12-push-relay-deploy-runbook.md.
      NOTIFIER_DATABASE_URL: ${NOTIFIER_DATABASE_URL:-}
      # The drain's own switch. Off by default even inside this overlay: adding
      # the file gets you the processes, turning this on gets you dispatches.
      MOMO_PUSH_NOTIFIER_ENABLED: ${MOMO_PUSH_NOTIFIER_ENABLED:-0}
      PUSH_RELAY_URL: ${PUSH_RELAY_URL:-http://push-relay:28195/v1/push}
      # This server's opaque identity at the relay. Must be a key in the
      # relay's MOMO_RELAY_SERVERS registry or every dispatch is a 403.
      PUSH_RELAY_SERVER_ID: ${PUSH_RELAY_SERVER_ID:-momo-local}
      # The Ed25519 PRIVATE key — this server's identity, not an APNs
      # credential. Enabled-without-a-key is a boot refusal (config.rs).
      MOMO_PUSH_RELAY_PRIVATE_KEY_PATH: /run/secrets/relay-signing-key.pem
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - type: bind
        source: ${MOMO_RELAY_SIGNING_KEY_HOST_PATH:?set MOMO_RELAY_SIGNING_KEY_HOST_PATH to the absolute host path of this server's Ed25519 private key (scripts/push_relay_keygen.sh)}
        target: /run/secrets/relay-signing-key.pem
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      push-relay:
        condition: service_healthy
    networks:
      - private
