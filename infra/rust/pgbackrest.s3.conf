# S3-compatible repository topology. All secrets and endpoint coordinates are
# injected by /usr/local/bin/oort-pgbackrest from the strict file/env seam.
[momo]
pg1-path=/var/lib/postgresql/18/docker

[global]
repo1-type=s3
repo1-retention-full=4
repo1-retention-full-type=count
repo1-retention-diff=7
repo1-cipher-type=aes-256-cbc
archive-async=n
compress-type=gz
process-max=2
start-fast=y
log-level-console=info

[global:archive-push]
compress-level=3
