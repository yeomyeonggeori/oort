# Hermes config for the Google read-only connector trial (K-S1b, #3952). Reference copy of what runs on the
# Railway service hermes-kwak (written to /opt/data/config.yaml from HERMES_CONFIG_B64 on every start).
# Client id/secret are NOT here: they are service variables, read through ${VAR} interpolation.
# oort-team Hermes Agent config (ADR-0203 D6 tool lock).
# Re-written to /opt/data/config.yaml from $HERMES_CONFIG_B64 on EVERY start, then checked by
# lockgate.py BEFORE the Hermes entrypoint (and so before any listener) runs.
# Deny-list is Hermes' only switch (agent.disabled_toolsets); lockgate.py adds the allow-list.
# Remaining chat-only surface after this list: todo. `memory` and `session_search` are off too (#4898, ADR-0203 augmentation of 2026-11-01):
# a Hermes that reads mail and drive keeps the tool results in ONE history for every run, and `memory` writes ONE file that every session loads.
agent:
  max_turns: 12           # chat-only agent: bound tool-loop cost (Hermes default is 500)
  disabled_toolsets:
    - terminal        # OWNER-MANDATED. Shell: terminal + process_manage (a tool inside this toolset, not a toolset). Verified: ran an echo with no approval
    - code_execution  # OWNER-MANDATED. execute_code (arbitrary Python)
    - browser         # OWNER-MANDATED. browser_* incl. browser_exec (drives Chromium)
    - file            # read_file/write_file/patch/search_files: verified to read /opt/data/.env and write anywhere under /opt/data (sessions and memories live in the same tree); Hermes itself guards config.yaml
    - connections     # manage_connections: links hosted connectors and installs local MCP servers from a catalog (a way around the terminal lock)
    - delegation      # delegate_task: sub-agents (children inherit this list; off for cost and blast radius)
    - cronjob         # cronjob_manage: unattended scheduled runs that outlive the chat
    - computer_use    # desktop control (Hermes already drops it for api_server; explicit on purpose)
    - web             # web_search/web_extract: model-directed outbound fetches = exfil path for chat content (private ranges are blocked by Hermes)
    - vision          # vision_analyze: model-chosen image URLs or paths
    - image_gen       # image_generate (outbound provider call)
    - video           # video_analyze
    - video_gen       # video generation and editing
    - x_search        # X (Twitter) search
    - skills          # skill_manage writes persistent instructions that outlive the chat (verified: creates a skill on the volume)
    - memory          # memory: ONE MEMORY.md / USER.md per Hermes home, loaded into the system prompt of every session: what a run of one workspace writes, a run of another reads (#4898)
    - session_search  # session_search: full-text search and read over the whole state.db, every earlier run of every workspace, tool-call arguments included (#4898)
    - tts             # text_to_speech
    - stt             # speech-to-text
    - kanban          # kanban_* task board
    - context_engine  # context engine plugin
    - clarify         # interactive clarify (no human in API mode; Hermes drops it anyway)
    - discord         # discord messaging tool
    - discord_admin   # discord admin tool
    - yuanbao         # yuanbao messaging tools
    - a2a             # agent-to-agent calls to other endpoints
memory:
  memory_enabled: false        # no MEMORY.md in any system prompt. `_init_memory` reads this flag, not the toolset: an existing file would stay injected otherwise (#4898)
  user_profile_enabled: false  # the same for USER.md; the gate needs both explicitly false, and no `memory.provider`
approvals:
  mode: manual            # never "off"; no HERMES_YOLO_MODE
  unattended_mode: deny   # API sessions cannot approve anything
telemetry:
  shared_metrics:
    enabled: false        # explicit: nothing is collected or sent to Nous
    send: false
updates:
  check: false            # no passive version checks (image is pinned by digest)
model:                    # K-S1b: subscription OAuth held in the Hermes volume (auth.json), never in oort
  provider: openai-codex  # primary: ChatGPT/Codex subscription (login: hermes auth add openai-codex --type oauth)
  default: gpt-5.6-sol
fallback_model:           # tried when the primary fails (rate limit / overload / connection)
  provider: anthropic     # Claude Pro/Max subscription (login: hermes auth add anthropic --type oauth)
  model: claude-sonnet-5
# K-S1b (#3952): Google official remote MCP, READ tools only. Client id/secret come from service
# variables (never in this file). Names in tools.include are from the vendor docs; confirm with tools/list.
mcp_servers:
  gmail:
    url: https://gmailmcp.googleapis.com/mcp/v1
    auth: oauth
    trust: untrusted
    sampling:
      enabled: false
    oauth:
      client_id: ${GOOGLE_OAUTH_CLIENT_ID}
      client_secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
      redirect_port: 41821
      scope: "https://www.googleapis.com/auth/gmail.readonly"
    tools:
      resources: false
      prompts: false
      include:
        - search_threads
        - get_thread
        - get_message
        - list_drafts
        - get_draft
        - list_labels
  google_calendar:
    url: https://calendarmcp.googleapis.com/mcp/v1
    auth: oauth
    trust: untrusted
    sampling:
      enabled: false
    oauth:
      client_id: ${GOOGLE_OAUTH_CLIENT_ID}
      client_secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
      redirect_port: 41822
      scope: "https://www.googleapis.com/auth/calendar.calendarlist.readonly https://www.googleapis.com/auth/calendar.events.freebusy https://www.googleapis.com/auth/calendar.events.readonly"
    tools:
      resources: false
      prompts: false
      include:
        - list_events
        - get_event
        - list_calendars
        - suggest_time
        - search_events
  google_drive:
    url: https://drivemcp.googleapis.com/mcp/v1
    auth: oauth
    trust: untrusted
    sampling:
      enabled: false
    oauth:
      client_id: ${GOOGLE_OAUTH_CLIENT_ID}
      client_secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
      redirect_port: 41823
      scope: "https://www.googleapis.com/auth/drive.readonly"
    tools:
      resources: false
      prompts: false
      include:
        - download_file_content
        - get_file_metadata
        - get_file_permissions
        - list_recent_files
        - read_file_content
        - search_files
