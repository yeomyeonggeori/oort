# MOMO-001 runtime-verified: PostgreSQL 18 + Centrifugo v6 compose health passes
# with worktree-scoped env/ports. Relay/worker runtime services are later M1 gates.
#
# momo v0 인프라 — L4 스펙 §1.1 단일 호스트 토폴로지.
#   - PostgreSQL 18 : SOURCE OF TRUTH (msg/seq/hlc/outbox/ledger). native uuidv7().
#   - Centrifugo v6 : transport only (DB 아님). Memory engine(v0). subscribe proxy → api:8080.
#   - relay/worker  : 추후(후속 티켓 T06/T07에서 Swift 실행 패키지로 추가) → 아래 주석 참고.
#
# 환경변수는 infra/.env.example 참고(cp infra/.env.example .env 후 값 채움).
# `make up` / `make down`이 이 파일(infra/docker-compose.yml)을 사용한다.

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 18 — SoT. uuidv7() 네이티브 전제(스펙 §0.5 D1 / schema_v0.sql).
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-trixie@sha256:9d2e61c7352b9e9f4798df5fd9a498f043f4cda1cdacc707de3d198650f4321e
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-momo}
      POSTGRES_USER: ${POSTGRES_USER:-momo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-momo}
      # 멀티테넌트 RLS는 세션변수(app.workspace_id)로 강제 — 초기화 불필요.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep versioned data directories under this root.
      # Mounting /var/lib/postgresql/data makes the container reject startup.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # pg_isready: DB가 연결 수락 가능한지 확인 → healthcheck green 게이트(§9.1).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-momo} -d ${POSTGRES_DB:-momo}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Centrifugo v6 — realtime fan-out (transport only). config 파일 마운트.
  # 8000 포트(WS/HTTP API). subscribe proxy 콜백은 api:8080(후속 T05 server).
  # ---------------------------------------------------------------------------
  centrifugo:
    image: centrifugo/centrifugo:v6
    restart: unless-stopped
    # config 파일을 명시한다. Centrifugo v6는 CENTRIFUGO_* env override를
    # 공식 설정으로 읽는다.
    command: centrifugo --config=/centrifugo/centrifugo.json
    environment:
      # MOMO-353: immutable-at-create fingerprint of the repo config actually
      # selected for this process. ensure_runtime_env.sh compares this marker
      # with the current file because bind-mount changes do not reload Centrifugo.
      MOMO_CENTRIFUGO_CONFIG_SHA256: ${MOMO_CENTRIFUGO_CONFIG_SHA256:-missing}
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENT_TOKEN_HMAC}
      CENTRIFUGO_HTTP_API_KEY: ${CENT_API_KEY}
      # MOMO-300: subscribe proxy 콜백에 공유 시크릿 헤더 주입(env가 파일값을
      # override). API는 이 헤더 없는 proxy 요청을 401로 거부한다.
      CENTRIFUGO_CHANNEL_PROXY_SUBSCRIBE_HTTP_STATIC_HEADERS: '{"X-Centrifugo-Proxy-Secret":"${CENT_PROXY_SECRET:-dev-insecure-cent-proxy-secret}"}'
    ports:
      - "${CENT_PORT:-8000}:8000"
    volumes:
      # config 마운트(읽기전용). centrifugo.json은 §4.2 namespace 스펙 그대로.
      - ./centrifugo.json:/centrifugo/centrifugo.json:ro
    healthcheck:
      # Centrifugo 내장 /health 엔드포인트(200 OK) → healthcheck green.
      test: ["CMD", "centrifugo", "healthcheck", "--config=/centrifugo/centrifugo.json"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # LiveKit — ADR-0122 voice huddle SFU. Heavy/optional: never starts with the
  # default stack; opt in with `docker compose --profile huddle up -d livekit`.
  # API credentials are injected through LIVEKIT_KEYS and must match the
  # MOMO_LIVEKIT_* values used by MomoServer.
  # ---------------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:v1.13.3
    profiles: ["huddle", "transcription"]
    restart: unless-stopped
    command: --config=/etc/livekit/livekit.yaml
    environment:
      LIVEKIT_KEYS: '${MOMO_LIVEKIT_API_KEY:-devkey}: ${MOMO_LIVEKIT_API_SECRET:-change-me-livekit-api-secret}'
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_RTC_UDP_START:-50000}-${LIVEKIT_RTC_UDP_END:-50100}:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7880/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------------------
  # LiveKit Egress — ADR-0122 post-call participant-track recording.
  # Heavy/optional: `--profile transcription` starts this service and its
  # dev-only Redis. Production already has the pinned Redis service used by
  # Centrifugo; no Centrifugo configuration is changed here.
  # ---------------------------------------------------------------------------
  transcription-redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    profiles: ["transcription"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  livekit-egress:
    image: livekit/egress:v1.9.1
    profiles: ["transcription"]
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${MOMO_LIVEKIT_API_KEY:-devkey}
        api_secret: ${MOMO_LIVEKIT_API_SECRET:-change-me-livekit-api-secret}
        ws_url: ws://livekit:7880
        health_port: 8080
        redis:
          address: transcription-redis:6379
    tmpfs:
      - /tmp:size=2g
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      transcription-redis:
        condition: service_healthy
      livekit:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # eve — optional self-hosted custom-agent build/runtime environment.
  # `docker compose --profile eve up -d` is the only activation path. The
  # MOMO-534 preset stays read-only; entrypoint stages it into a named volume.
  # ---------------------------------------------------------------------------
  eve-db-roles:
    image: pgvector/pgvector:0.8.5-pg18-trixie@sha256:9d2e61c7352b9e9f4798df5fd9a498f043f4cda1cdacc707de3d198650f4321e
    profiles: ["eve"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: ${POSTGRES_USER:-momo}
      PGPASSWORD: ${POSTGRES_PASSWORD:-momo}
      MOMO_DB_NAME: ${POSTGRES_DB:-momo}
      EVE_WORLD_DB: ${EVE_WORLD_DB:-eve_world}
      EVE_WORLD_USER: ${EVE_WORLD_USER:-eve_world}
      EVE_WORLD_PASSWORD: ${EVE_WORLD_PASSWORD:-change-me-eve-world}
    command: ["sh", "/bootstrap/bootstrap_world.sh"]
    volumes:
      - ./eve/bootstrap_world.sh:/bootstrap/bootstrap_world.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  eve:
    image: node:24.4.1-bookworm-slim@sha256:36ae19f59c91f3303c7a648f07493fe14c4bd91320ac8d898416327bacf1bbfa
    profiles: ["eve"]
    restart: unless-stopped
    init: true
    working_dir: /eve-runtime
    command: ["sh", "/bootstrap/entrypoint.sh"]
    environment:
      EVE_PORT: 28140
      WORKFLOW_TARGET_WORLD: "@workflow/world-postgres"
      WORKFLOW_POSTGRES_URL: postgres://${EVE_WORLD_USER:-eve_world}:${EVE_WORLD_PASSWORD:-change-me-eve-world}@postgres:5432/${EVE_WORLD_DB:-eve_world}
      WORKFLOW_POSTGRES_JOB_PREFIX: ${EVE_WORLD_JOB_PREFIX:-momo_eve}
      WORKFLOW_POSTGRES_WORKER_CONCURRENCY: ${EVE_WORLD_WORKER_CONCURRENCY:-10}
      WORKFLOW_POSTGRES_MAX_POOL_SIZE: ${EVE_WORLD_MAX_POOL_SIZE:-10}
      MOMO_BASE_URL: ${EVE_MOMO_BASE_URL:-http://host.docker.internal:8080}
      MOMO_WORKSPACE_ID: ${MOMO_WORKSPACE_ID:-}
      MOMO_AGENT_MEMBER_ID: ${MOMO_AGENT_MEMBER_ID:-}
      MOMO_AGENT_TOKEN: ${MOMO_AGENT_TOKEN:-}
      MOMO_CHANNEL_ROUTE_TOKEN: ${MOMO_CHANNEL_ROUTE_TOKEN:-}
      AI_GATEWAY_API_KEY: ${EVE_AI_GATEWAY_API_KEY:-}
    ports:
      - "${EVE_PORT:-28140}:28140"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../examples/eve-momo-channel:/preset:ro
      - ./eve/entrypoint.sh:/bootstrap/entrypoint.sh:ro
      - eve-runtime:/eve-runtime
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:28140/eve/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      eve-db-roles:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # relay / worker — 추후(후속 티켓에서 Swift 실행 패키지 빌드 후 서비스로 추가).
  #   relay  (T06 relay/OutboxRelay): outbox SKIP LOCKED 클레임 → Centrifugo /api/publish.
  #            BYPASSRLS role로 전 테넌트 폴링. depends_on: postgres(healthy), centrifugo.
  #   worker (T07 workers/AgentWorker): outbox(kind='agent_job') 클레임 → hermes SSE 중계.
  #            depends_on: postgres(healthy). HERMES_BASE_URL/HERMES_API_KEY 사용.
  #   api    (T05 server): Hummingbird 2. centrifugo subscribe proxy 대상(api:8080).
  # 예시(주석, 미활성):
  # relay:
  #   build: ../relay/OutboxRelay
  #   environment:
  #     DATABASE_URL: ${DATABASE_URL}
  #     CENT_API_URL: http://centrifugo:8000/api
  #     CENT_API_KEY: ${CENT_API_KEY}
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     centrifugo: { condition: service_healthy }
  # worker:
  #   build: ../workers/AgentWorker
  #   environment:
  #     DATABASE_URL: ${DATABASE_URL}
  #     HERMES_BASE_URL: ${HERMES_BASE_URL}
  #     HERMES_API_KEY: ${HERMES_API_KEY}
  #   depends_on:
  #     postgres: { condition: service_healthy }

volumes:
  pgdata:
  eve-runtime:
