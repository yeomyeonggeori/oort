# MOMO-005 runtime-unverified staging/prod skeleton.
# This file defines the intended single-VPS stack but does not deploy anything.
# Real secrets must come from a host-local env file or SOPS/age in MOMO-006.

name: ${COMPOSE_PROJECT_NAME:-momo-prod}

# Shared immutable tag emitted by publish-images.yml. The full per-service image
# refs below are derived from this value in env files, but may be replaced by
# distinct @sha256 digests for a verified deploy or rollback.
x-momo-image-release:
  tag: ${MOMO_IMAGE_TAG:?set MOMO_IMAGE_TAG}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      REALTIME_DOMAIN: ${REALTIME_DOMAIN:?set REALTIME_DOMAIN}
      # MOMO-390 (ADR-0119): optional web SPA domain. `:-` (not `-`) is load
      # bearing — Caddy cannot parse an empty site address, so a set-but-empty
      # host value must also fall back to the reserved sentinel. Unset means
      # web serving is disabled (the sentinel site only answers 404) and the
      # existing 2-site deploy behavior is unchanged.
      APP_DOMAIN: ${APP_DOMAIN:-momo-app-domain-unset.localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # MOMO-390: web SPA build output served by Caddy's file_server (the api
      # container never serves web assets — ADR-0119). Default is a named
      # volume that stays empty until an operator (or a future momo-web asset
      # image) populates it; an empty root simply 404s, which is correct for a
      # web-less deploy. Operators may instead set MOMO_WEB_DIST_DIR to an
      # absolute host path that holds the built clients/web dist.
      - ${MOMO_WEB_DIST_DIR:-momo-web-dist}:/srv/momo-web:ro
    depends_on:
      api:
        condition: service_started
      centrifugo:
        condition: service_started
    networks:
      - public
      - private
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  centrifugo:
    image: centrifugo/centrifugo:v6
    restart: unless-stopped
    command: centrifugo --config=/centrifugo/centrifugo.prod.json
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENT_TOKEN_HMAC:?set CENT_TOKEN_HMAC}
      CENTRIFUGO_HTTP_API_KEY: ${CENT_API_KEY:?set CENT_API_KEY}
      CENTRIFUGO_ENGINE_TYPE: redis
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: ${CENTRIFUGO_REDIS_ADDRESS:?set CENTRIFUGO_REDIS_ADDRESS}
      CENTRIFUGO_LOG_LEVEL: ${CENTRIFUGO_LOG_LEVEL:-info}
      # MOMO-398: browser Origin allowance for web realtime, derived from
      # APP_DOMAIN so the only origin that can ever be injected is
      # https://<APP_DOMAIN> (single-origin contract, no separate operator
      # knob to drift). `:+` renders an empty value when APP_DOMAIN is unset
      # OR set-but-empty — the same emptiness rule the caddy sentinel above
      # applies — and Centrifugo v6 treats empty env vars as unset, so a
      # web-less deploy keeps `client.allowed_origins` undefined exactly as
      # before (browser Origins stay rejected, fail closed). Native clients
      # send no Origin header and bypass the check entirely in both modes.
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${APP_DOMAIN:+https://${APP_DOMAIN}}
      # MOMO-300: subscribe proxy shared-secret header. This env override wins
      # over the change-me placeholder committed in centrifugo.prod.json; the
      # API rejects proxy callbacks without the exact secret (fail closed).
      CENTRIFUGO_CHANNEL_PROXY_SUBSCRIBE_HTTP_STATIC_HEADERS: '{"X-Centrifugo-Proxy-Secret":"${CENT_PROXY_SECRET:?set CENT_PROXY_SECRET}"}'
    volumes:
      - ./centrifugo.prod.json:/centrifugo/centrifugo.prod.json:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - private
    healthcheck:
      test: ["CMD", "centrifugo", "healthcheck", "--config=/centrifugo/centrifugo.prod.json"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: ${MOMO_API_IMAGE:?set MOMO_API_IMAGE}
    restart: unless-stopped
    environment:
      MOMO_ENV: ${MOMO_ENV:-staging}
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_HMAC: ${JWT_HMAC:?set JWT_HMAC}
      CENT_TOKEN_HMAC: ${CENT_TOKEN_HMAC:?set CENT_TOKEN_HMAC}
      CENT_API_URL: http://centrifugo:8000/api
      CENT_API_KEY: ${CENT_API_KEY:?set CENT_API_KEY}
      MOMO_CENTRIFUGO_WS_URL: ${MOMO_CENTRIFUGO_WS_URL:?set MOMO_CENTRIFUGO_WS_URL}
      # MOMO-300: must match the centrifugo service's static proxy header.
      CENT_PROXY_SECRET: ${CENT_PROXY_SECRET:?set CENT_PROXY_SECRET}
      AGENT_PROVIDER_MODE: ${AGENT_PROVIDER_MODE:?set AGENT_PROVIDER_MODE}
      AGENT_MODEL: ${AGENT_MODEL:-hermes-agent}
      AGENT_HANDLE: ${AGENT_HANDLE:-kim-intern}
      AGENT_DISPLAY_NAME: ${AGENT_DISPLAY_NAME:-김인턴}
      HERMES_BASE_URL: ${HERMES_BASE_URL:?set HERMES_BASE_URL}
      HERMES_API_KEY: ${HERMES_API_KEY:?set HERMES_API_KEY}
      MOMO_ARCHIVE_BACKEND: ${MOMO_ARCHIVE_BACKEND:-drive}
      MOMO_S3_ENDPOINT: ${MOMO_S3_ENDPOINT:-}
      MOMO_S3_REGION: ${MOMO_S3_REGION:-}
      MOMO_S3_BUCKET: ${MOMO_S3_BUCKET:-}
      MOMO_S3_ACCESS_KEY: ${MOMO_S3_ACCESS_KEY:-}
      MOMO_S3_SECRET_KEY: ${MOMO_S3_SECRET_KEY:-}
      MOMO_S3_FORCE_PATH_STYLE: ${MOMO_S3_FORCE_PATH_STYLE:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - private

  relay:
    image: ${MOMO_RELAY_IMAGE:?set MOMO_RELAY_IMAGE}
    restart: unless-stopped
    environment:
      MOMO_ENV: ${MOMO_ENV:-staging}
      RELAY_DATABASE_URL: ${RELAY_DATABASE_URL:?set RELAY_DATABASE_URL}
      CENT_API_URL: http://centrifugo:8000/api
      CENT_API_KEY: ${CENT_API_KEY:?set CENT_API_KEY}
      RELAY_POLL_INTERVAL_MS: ${RELAY_POLL_INTERVAL_MS:-300}
      RELAY_CLAIM_BATCH: ${RELAY_CLAIM_BATCH:-64}
      RELAY_MAX_ATTEMPTS: ${RELAY_MAX_ATTEMPTS:-8}
    depends_on:
      postgres:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - private

  worker:
    image: ${MOMO_WORKER_IMAGE:?set MOMO_WORKER_IMAGE}
    restart: unless-stopped
    environment:
      MOMO_ENV: ${MOMO_ENV:-staging}
      RELAY_DATABASE_URL: ${RELAY_DATABASE_URL:?set RELAY_DATABASE_URL}
      CENT_API_URL: http://centrifugo:8000/api
      CENT_API_KEY: ${CENT_API_KEY:?set CENT_API_KEY}
      AGENT_PROVIDER_MODE: ${AGENT_PROVIDER_MODE:?set AGENT_PROVIDER_MODE}
      AGENT_MODEL: ${AGENT_MODEL:-hermes-agent}
      HERMES_BASE_URL: ${HERMES_BASE_URL:?set HERMES_BASE_URL}
      HERMES_API_KEY: ${HERMES_API_KEY:?set HERMES_API_KEY}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-300}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-8}
      MAX_CONSECUTIVE_AUTO: ${MAX_CONSECUTIVE_AUTO:-3}
      MAX_STEPS: ${MAX_STEPS:-12}
      MAX_DEPTH: ${MAX_DEPTH:-4}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - private

  # One-shot, source-checkout-free migration. `pull && up --no-build` runs this
  # pinned image before api/relay/worker. Roll back by restoring the previous
  # per-image digests (or previous MOMO_IMAGE_TAG-derived refs) and rerunning the
  # same compose command; migrations must remain forward-compatible.
  migrate:
    image: ${MOMO_MIGRATE_IMAGE:?set MOMO_MIGRATE_IMAGE}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      MOMO_BOOTSTRAP_RUNTIME_ROLES: "0"
      MOMO_AGENT_SEED_MODE: none
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  # ADR-0127 self-host option. Select with `--profile s3`; Dawn-hosted
  # deployments keep the default Drive archive and never start these services.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["s3"]
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MOMO_S3_ACCESS_KEY:-change-me-s3-access-key}
      MINIO_ROOT_PASSWORD: ${MOMO_S3_SECRET_KEY:-change-me-s3-secret-key}
    volumes:
      - minio-data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["s3"]
    restart: "no"
    environment:
      MOMO_S3_ACCESS_KEY: ${MOMO_S3_ACCESS_KEY:-change-me-s3-access-key}
      MOMO_S3_SECRET_KEY: ${MOMO_S3_SECRET_KEY:-change-me-s3-secret-key}
      MOMO_S3_BUCKET: ${MOMO_S3_BUCKET:-momo-attachments}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set momo http://minio:9000 "$$MOMO_S3_ACCESS_KEY" "$$MOMO_S3_SECRET_KEY"
        mc mb --ignore-existing "momo/$$MOMO_S3_BUCKET"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - private

networks:
  public:
  private:

volumes:
  pgdata:
    name: ${DB_VOLUME_NAME:-momo-pgdata}
  redis-data:
    name: ${REDIS_VOLUME_NAME:-momo-redis-data}
  minio-data:
    name: ${MINIO_VOLUME_NAME:-momo-minio-data}
  caddy-data:
  caddy-config:
  # MOMO-390: default (empty) web asset volume; unused when MOMO_WEB_DIST_DIR
  # points the caddy mount at a host path instead.
  momo-web-dist:
    name: ${WEB_DIST_VOLUME_NAME:-momo-web-dist}
