# MOMO-005 runtime-unverified staging/prod skeleton.
# This file defines the intended single-VPS stack but does not deploy anything.
# Real secrets must come from a host-local env file or SOPS/age in MOMO-006.

name: ${COMPOSE_PROJECT_NAME:-momo-prod}

# Shared immutable tag emitted by publish-images.yml. MOMO_IMAGE is the canonical
# single image; the six MOMO_*_IMAGE aliases remain accepted for old env/state
# files and default to the same ref in the shipped templates.
x-momo-image-release:
  tag: ${MOMO_IMAGE_TAG:?set MOMO_IMAGE_TAG}

x-momo-janitor-labels: &momo-janitor-labels
  com.momo.janitor.managed: "true"
  com.momo.janitor.match-label: com.docker.compose.project

services:
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    mem_limit: ${MOMO_CADDY_MEM_LIMIT:-256m}
    labels: *momo-janitor-labels
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      REALTIME_DOMAIN: ${REALTIME_DOMAIN:?set REALTIME_DOMAIN}
      # MOMO-390 (ADR-0119): optional web SPA domain. `:-` (not `-`) is load
      # bearing — Caddy cannot parse an empty site address, so a set-but-empty
      # host value must also fall back to the reserved sentinel. Unset means
      # web serving is disabled (the sentinel site only answers 404) and the
      # existing 2-site deploy behavior is unchanged.
      APP_DOMAIN: ${APP_DOMAIN:-momo-app-domain-unset.localhost}
      # ADR-0127: optional public MinIO host, separate from the API's generic
      # S3 endpoint so AWS/R2/B2 deployments never become Caddy sites.
      MINIO_PUBLIC_DOMAIN: ${MINIO_PUBLIC_DOMAIN:-momo-minio-domain-unset.localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # web-init copies the immutable momo image's bundled dist into this named
      # volume before Caddy starts. The api process never serves browser assets.
      - momo-web-static:/srv/momo-web:ro
    depends_on:
      api:
        condition: service_started
      centrifugo:
        condition: service_started
      linkshort:
        condition: service_started
    networks:
      - public
      - private
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: pgvector/pgvector:0.8.5-pg18-trixie@sha256:9d2e61c7352b9e9f4798df5fd9a498f043f4cda1cdacc707de3d198650f4321e
    mem_limit: ${MOMO_POSTGRES_MEM_LIMIT:-2g}
    labels: *momo-janitor-labels
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    mem_limit: ${MOMO_REDIS_MEM_LIMIT:-512m}
    labels: *momo-janitor-labels
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  centrifugo:
    image: centrifugo/centrifugo:v6@sha256:8ba0c9443dadedc21b20254b3fc76f35c1998b29acc7cdec877ea0c3636c237e
    mem_limit: ${MOMO_CENTRIFUGO_MEM_LIMIT:-512m}
    labels: *momo-janitor-labels
    restart: unless-stopped
    command: centrifugo --config=/centrifugo/centrifugo.prod.json
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENT_TOKEN_HMAC:?set CENT_TOKEN_HMAC}
      CENTRIFUGO_HTTP_API_KEY: ${CENT_API_KEY:?set CENT_API_KEY}
      CENTRIFUGO_ENGINE_TYPE: redis
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: ${CENTRIFUGO_REDIS_ADDRESS:?set CENTRIFUGO_REDIS_ADDRESS}
      CENTRIFUGO_LOG_LEVEL: ${CENTRIFUGO_LOG_LEVEL:-info}
      # MOMO-398: browser Origin allowance for web realtime, derived from
      # APP_DOMAIN so the only origin that can ever be injected is
      # https://<APP_DOMAIN> (single-origin contract, no separate operator
      # knob to drift). `:+` renders an empty value when APP_DOMAIN is unset
      # OR set-but-empty — the same emptiness rule the caddy sentinel above
      # applies — and Centrifugo v6 treats empty env vars as unset, so a
      # web-less deploy keeps `client.allowed_origins` undefined exactly as
      # before (browser Origins stay rejected, fail closed). Native clients
      # send no Origin header and bypass the check entirely in both modes.
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${APP_DOMAIN:+https://${APP_DOMAIN}}
      # MOMO-300: subscribe proxy shared-secret header. This env override wins
      # over the change-me placeholder committed in centrifugo.prod.json; the
      # API rejects proxy callbacks without the exact secret (fail closed).
      CENTRIFUGO_CHANNEL_PROXY_SUBSCRIBE_HTTP_STATIC_HEADERS: '{"X-Centrifugo-Proxy-Secret":"${CENT_PROXY_SECRET:?set CENT_PROXY_SECRET}"}'
    volumes:
      - ./centrifugo.prod.json:/centrifugo/centrifugo.prod.json:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - private
    healthcheck:
      test: ["CMD", "centrifugo", "healthcheck", "--config=/centrifugo/centrifugo.prod.json"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: ${MOMO_API_IMAGE:?set MOMO_API_IMAGE}
    command: ["api"]
    mem_limit: ${MOMO_API_MEM_LIMIT:-1g}
    labels: *momo-janitor-labels
    restart: unless-stopped
    environment:
      MOMO_ENV: ${MOMO_ENV:-staging}
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: ${MOMO_APP_DATABASE_URL:?set MOMO_APP_DATABASE_URL}
      JWT_HMAC: ${JWT_HMAC:?set JWT_HMAC}
      OUTBOUND_WEBHOOK_MASTER_KEY: ${OUTBOUND_WEBHOOK_MASTER_KEY:?set OUTBOUND_WEBHOOK_MASTER_KEY}
      # ADR-0004 증보 1 (MOMO-572/573): seals the provider_link bearer here and is
      # decrypted by the worker at job time. Strict-env boot validation rejects a
      # missing/placeholder value, so the api cannot boot without it.
      PROVIDER_LINK_MASTER_KEY: ${PROVIDER_LINK_MASTER_KEY:?set PROVIDER_LINK_MASTER_KEY}
      CENT_TOKEN_HMAC: ${CENT_TOKEN_HMAC:?set CENT_TOKEN_HMAC}
      CENT_API_URL: http://centrifugo:8000/api
      CENT_API_KEY: ${CENT_API_KEY:?set CENT_API_KEY}
      MOMO_CENTRIFUGO_WS_URL: ${MOMO_CENTRIFUGO_WS_URL:?set MOMO_CENTRIFUGO_WS_URL}
      # MOMO-300: must match the centrifugo service's static proxy header.
      CENT_PROXY_SECRET: ${CENT_PROXY_SECRET:?set CENT_PROXY_SECRET}
      AGENT_PROVIDER_MODE: ${AGENT_PROVIDER_MODE:?set AGENT_PROVIDER_MODE}
      AGENT_MODEL: ${AGENT_MODEL:-hermes-agent}
      AGENT_HANDLE: ${AGENT_HANDLE:-kim-intern}
      AGENT_DISPLAY_NAME: ${AGENT_DISPLAY_NAME:-김인턴}
      HERMES_BASE_URL: ${HERMES_BASE_URL:?set HERMES_BASE_URL}
      HERMES_API_KEY: ${HERMES_API_KEY:?set HERMES_API_KEY}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-text-embedding-3-small}
      MOMO_METRICS_HOST: 0.0.0.0
      MOMO_METRICS_PORT: 9090
      MOMO_ARCHIVE_BACKEND: ${MOMO_ARCHIVE_BACKEND:-drive}
      MOMO_S3_ENDPOINT: ${MOMO_S3_ENDPOINT:-}
      MOMO_S3_REGION: ${MOMO_S3_REGION:-}
      MOMO_S3_BUCKET: ${MOMO_S3_BUCKET:-}
      MOMO_S3_ACCESS_KEY: ${MOMO_S3_ACCESS_KEY:-}
      MOMO_S3_SECRET_KEY: ${MOMO_S3_SECRET_KEY:-}
      MOMO_S3_FORCE_PATH_STYLE: ${MOMO_S3_FORCE_PATH_STYLE:-0}
      # MOMO-605 (ADR-0133 P2): exact-match CORS origin allowlist. Unlike the
      # MOMO-398 Centrifugo allowance above this is NOT derived from APP_DOMAIN
      # — the web SPA is served same-origin (ADR-0119 D1-A) and needs no CORS at
      # all; this knob exists only for packaged desktop webviews whose origin is
      # `tauri://localhost` (or `http://tauri.localhost` on Windows), which no
      # domain can derive. Unset/empty is the shipped default and mounts no CORS
      # middleware whatsoever. Wildcards are refused by the server at boot.
      MOMO_CORS_ALLOWED_ORIGINS: ${MOMO_CORS_ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - private

  relay:
    image: ${MOMO_RELAY_IMAGE:?set MOMO_RELAY_IMAGE}
    command: ["relay"]
    mem_limit: ${MOMO_RELAY_MEM_LIMIT:-512m}
    labels: *momo-janitor-labels
    restart: unless-stopped
    environment:
      MOMO_ENV: ${MOMO_ENV:-staging}
      RELAY_DATABASE_URL: ${RELAY_DATABASE_URL:?set RELAY_DATABASE_URL}
      OUTBOUND_WEBHOOK_MASTER_KEY: ${OUTBOUND_WEBHOOK_MASTER_KEY:?set OUTBOUND_WEBHOOK_MASTER_KEY}
      CENT_API_URL: http://centrifugo:8000/api
      CENT_API_KEY: ${CENT_API_KEY:?set CENT_API_KEY}
      RELAY_POLL_INTERVAL_MS: ${RELAY_POLL_INTERVAL_MS:-300}
      RELAY_CLAIM_BATCH: ${RELAY_CLAIM_BATCH:-64}
      RELAY_MAX_ATTEMPTS: ${RELAY_MAX_ATTEMPTS:-8}
      MOMO_METRICS_HOST: 0.0.0.0
      MOMO_METRICS_PORT: 9091
    depends_on:
      postgres:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - private

  worker:
    image: ${MOMO_WORKER_IMAGE:?set MOMO_WORKER_IMAGE}
    command: ["worker"]
    mem_limit: ${MOMO_WORKER_MEM_LIMIT:-2g}
    labels: *momo-janitor-labels
    restart: unless-stopped
    environment:
      MOMO_ENV: ${MOMO_ENV:-staging}
      RELAY_DATABASE_URL: ${WORKER_DATABASE_URL:?set WORKER_DATABASE_URL}
      CENT_API_URL: http://centrifugo:8000/api
      CENT_API_KEY: ${CENT_API_KEY:?set CENT_API_KEY}
      AGENT_PROVIDER_MODE: ${AGENT_PROVIDER_MODE:?set AGENT_PROVIDER_MODE}
      AGENT_MODEL: ${AGENT_MODEL:-hermes-agent}
      HERMES_BASE_URL: ${HERMES_BASE_URL:?set HERMES_BASE_URL}
      HERMES_API_KEY: ${HERMES_API_KEY:?set HERMES_API_KEY}
      # ADR-0004 증보 1 (MOMO-573): decrypts the operator's provider_link bearer at
      # job time so a GUI provider change reaches the conversation. Must match the
      # api's PROVIDER_LINK_MASTER_KEY (same value seals + opens the bearer).
      PROVIDER_LINK_MASTER_KEY: ${PROVIDER_LINK_MASTER_KEY:?set PROVIDER_LINK_MASTER_KEY}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-300}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-8}
      MAX_CONSECUTIVE_AUTO: ${MAX_CONSECUTIVE_AUTO:-3}
      MAX_STEPS: ${MAX_STEPS:-12}
      MAX_DEPTH: ${MAX_DEPTH:-4}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-1}
      MEMORY_EMBEDDING_ENABLED: ${MEMORY_EMBEDDING_ENABLED:-1}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-text-embedding-3-small}
      MEMORY_EMBEDDING_POLL_INTERVAL_MS: ${MEMORY_EMBEDDING_POLL_INTERVAL_MS:-5000}
      MEMORY_EMBEDDING_BATCH_SIZE: ${MEMORY_EMBEDDING_BATCH_SIZE:-50}
      MOMO_METRICS_HOST: 0.0.0.0
      MOMO_METRICS_PORT: 9092
    depends_on:
      postgres:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - private

  # ADR-0121 D7: absent from the default stack. It starts only when the
  # operator supplies `--profile observability`; no Prometheus or metrics port
  # is published to the host or attached to the public network.
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:8672a850efe2f9874702406c8318704edb363587f8c2ca88586b4c8fdb5cea24
    mem_limit: ${MOMO_PROMETHEUS_MEM_LIMIT:-512m}
    labels: *momo-janitor-labels
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_started
      relay:
        condition: service_started
      worker:
        condition: service_started
    networks:
      - private

  # One-shot, source-checkout-free migration. `pull && up --no-build` runs this
  # pinned image before api/relay/worker. Roll back by restoring the previous
  # image digest and rerunning the same compose command; migrations must remain
  # forward-compatible.
  migrate:
    image: ${MOMO_MIGRATE_IMAGE:?set MOMO_MIGRATE_IMAGE}
    command: ["migrate"]
    mem_limit: ${MOMO_MIGRATE_MEM_LIMIT:-1g}
    labels: *momo-janitor-labels
    restart: "no"
    environment:
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?set MIGRATE_DATABASE_URL}
      MOMO_BOOTSTRAP_RUNTIME_ROLES: "0"
      MOMO_AGENT_SEED_MODE: none
      MOMO_INITIAL_OWNER_EMAIL: ${MOMO_INITIAL_OWNER_EMAIL:-}
      MOMO_INITIAL_OWNER_PASSWORD: ${MOMO_INITIAL_OWNER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  # MOMO-554: idempotent runtime-role creation/password rotation. install.sh and
  # upgrade.sh run this one-shot before migrate; migrate then fails closed unless
  # the three expected roles have the exact RLS posture.
  runtime-roles:
    image: ${MOMO_MIGRATE_IMAGE:?set MOMO_MIGRATE_IMAGE}
    command: ["migrate"]
    mem_limit: ${MOMO_RUNTIME_ROLES_MEM_LIMIT:-256m}
    labels: *momo-janitor-labels
    restart: "no"
    environment:
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?set MIGRATE_DATABASE_URL}
      MOMO_RUNTIME_ROLE_PROVISION: "1"
      MOMO_APP_POSTGRES_PASSWORD: ${MOMO_APP_POSTGRES_PASSWORD:?set MOMO_APP_POSTGRES_PASSWORD}
      RELAY_POSTGRES_PASSWORD: ${RELAY_POSTGRES_PASSWORD:?set RELAY_POSTGRES_PASSWORD}
      WORKER_POSTGRES_PASSWORD: ${WORKER_POSTGRES_PASSWORD:?set WORKER_POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  # One-shot SPA asset initializer. install.sh/upgrade.sh run the web-assets
  # command before (re)starting Caddy.
  web-init:
    image: ${MOMO_WEB_IMAGE:?set MOMO_WEB_IMAGE}
    command: ["web-assets"]
    mem_limit: ${MOMO_WEB_INIT_MEM_LIMIT:-128m}
    labels: *momo-janitor-labels
    restart: "no"
    volumes:
      - momo-web-static:/srv/momo-web

  # ADR-0121 D2: stateless invite redirector. The code is never stored or
  # validated here; Caddy forwards /i/* and LinkShort sends the browser back
  # to this installation's same-origin /join landing.
  linkshort:
    image: ${MOMO_LINKSHORT_IMAGE:?set MOMO_LINKSHORT_IMAGE}
    command: ["linkshort"]
    mem_limit: ${MOMO_LINKSHORT_MEM_LIMIT:-256m}
    labels: *momo-janitor-labels
    restart: unless-stopped
    environment:
      MOMO_LINKSHORT_HOST: 0.0.0.0
      MOMO_LINKSHORT_PORT: 28190
      MOMO_LINKSHORT_TARGET_BASE_URL: https://${APP_DOMAIN:-momo-app-domain-unset.localhost}
    networks:
      - private

  # MOMO-538 self-host option. The default production stack remains unchanged;
  # opt in explicitly with `--profile eve`. The pinned Node 24 base installs
  # the MOMO-534 lockfile (eve 0.27.0) and mounts no momo database credential.
  eve-db-roles:
    image: pgvector/pgvector:0.8.5-pg18-trixie@sha256:9d2e61c7352b9e9f4798df5fd9a498f043f4cda1cdacc707de3d198650f4321e
    mem_limit: ${MOMO_EVE_DB_ROLES_MEM_LIMIT:-256m}
    labels: *momo-janitor-labels
    profiles: ["eve"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      MOMO_DB_NAME: ${POSTGRES_DB:?set POSTGRES_DB}
      EVE_WORLD_DB: ${EVE_WORLD_DB:-eve_world}
      EVE_WORLD_USER: ${EVE_WORLD_USER:-eve_world}
      EVE_WORLD_PASSWORD: ${EVE_WORLD_PASSWORD:-change-me-eve-world}
    command: ["sh", "/bootstrap/bootstrap_world.sh"]
    volumes:
      - ../eve/bootstrap_world.sh:/bootstrap/bootstrap_world.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  eve:
    image: node:24.4.1-bookworm-slim@sha256:36ae19f59c91f3303c7a648f07493fe14c4bd91320ac8d898416327bacf1bbfa
    mem_limit: ${MOMO_EVE_MEM_LIMIT:-2g}
    labels: *momo-janitor-labels
    profiles: ["eve"]
    restart: unless-stopped
    init: true
    working_dir: /eve-runtime
    command: ["sh", "/bootstrap/entrypoint.sh"]
    environment:
      EVE_PORT: 28140
      WORKFLOW_TARGET_WORLD: "@workflow/world-postgres"
      WORKFLOW_POSTGRES_URL: postgres://${EVE_WORLD_USER:-eve_world}:${EVE_WORLD_PASSWORD:-change-me-eve-world}@postgres:5432/${EVE_WORLD_DB:-eve_world}
      WORKFLOW_POSTGRES_JOB_PREFIX: ${EVE_WORLD_JOB_PREFIX:-momo_eve}
      WORKFLOW_POSTGRES_WORKER_CONCURRENCY: ${EVE_WORLD_WORKER_CONCURRENCY:-10}
      WORKFLOW_POSTGRES_MAX_POOL_SIZE: ${EVE_WORLD_MAX_POOL_SIZE:-10}
      MOMO_BASE_URL: ${EVE_MOMO_BASE_URL:-http://api:8080}
      MOMO_WORKSPACE_ID: ${MOMO_WORKSPACE_ID:-}
      MOMO_AGENT_MEMBER_ID: ${MOMO_AGENT_MEMBER_ID:-}
      MOMO_AGENT_TOKEN: ${MOMO_AGENT_TOKEN:-}
      MOMO_CHANNEL_ROUTE_TOKEN: ${MOMO_CHANNEL_ROUTE_TOKEN:-}
      AI_GATEWAY_API_KEY: ${EVE_AI_GATEWAY_API_KEY:-}
    ports:
      - "${EVE_PORT:-28140}:28140"
    volumes:
      - ../../examples/eve-momo-channel:/preset:ro
      - ../eve/entrypoint.sh:/bootstrap/entrypoint.sh:ro
      - eve-runtime:/eve-runtime
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:28140/eve/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      eve-db-roles:
        condition: service_completed_successfully
      api:
        condition: service_started
    networks:
      - private

  # ADR-0127 self-host option. Select with `--profile s3`; Dawn-hosted
  # deployments keep the default Drive archive and never start these services.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    mem_limit: ${MOMO_MINIO_MEM_LIMIT:-1g}
    labels: *momo-janitor-labels
    profiles: ["s3"]
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MOMO_S3_ACCESS_KEY:-change-me-s3-access-key}
      MINIO_ROOT_PASSWORD: ${MOMO_S3_SECRET_KEY:-change-me-s3-secret-key}
    volumes:
      - minio-data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    mem_limit: ${MOMO_MINIO_INIT_MEM_LIMIT:-256m}
    labels: *momo-janitor-labels
    profiles: ["s3"]
    restart: "no"
    environment:
      MOMO_S3_ACCESS_KEY: ${MOMO_S3_ACCESS_KEY:-change-me-s3-access-key}
      MOMO_S3_SECRET_KEY: ${MOMO_S3_SECRET_KEY:-change-me-s3-secret-key}
      MOMO_S3_BUCKET: ${MOMO_S3_BUCKET:-momo-attachments}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set momo http://minio:9000 "$$MOMO_S3_ACCESS_KEY" "$$MOMO_S3_SECRET_KEY"
        mc mb --ignore-existing "momo/$$MOMO_S3_BUCKET"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - private

  # WH-1 (MOMO-579 / ADR-0114 증보1) opt-in work host sidecar. Absent from the
  # default stack; starts only with `--profile workhost`. Bundles opencode (MIT)
  # + goose (Apache-2.0) + momo-workd (see infra/prod/docker/workhost.Dockerfile);
  # Codex is never bundled. ADR-0004: no provider key / OAuth is set here — the
  # sidecar is a credential consumer. It talks to the API over the public HTTPS
  # domain (the daemon requires https unless the target is loopback).
  workhost:
    image: ${MOMO_WORKHOST_IMAGE:?set MOMO_WORKHOST_IMAGE}
    mem_limit: ${MOMO_WORKHOST_MEM_LIMIT:-2g}
    labels: *momo-janitor-labels
    profiles: ["workhost"]
    restart: unless-stopped
    init: true
    environment:
      MOMO_WORKD_SERVER_URL: ${MOMO_WORKHOST_SERVER_URL:-https://${API_DOMAIN:?set API_DOMAIN}}
      MOMO_WORKD_WORKSPACE_ID: ${MOMO_WORKHOST_WORKSPACE_ID:?set MOMO_WORKHOST_WORKSPACE_ID}
      # ADR-0114 증보1 B: default engine opencode; a DB-backed per-workspace
      # override (migration 040) wins at dispatch time.
      MOMO_WORKD_ENGINE: ${MOMO_WORKHOST_ENGINE:-opencode}
      # One-shot bootstrap token; consumed on first registration, never persisted.
      MOMO_WORKD_REGISTRATION_TOKEN: ${MOMO_WORKHOST_REGISTRATION_TOKEN:-}
      MOMO_WORKD_SCOPE: ${MOMO_WORKHOST_SCOPE:-workspace}
      # opencode HTTP basic auth (opt-in). Empty => opencode serve boots open on
      # the loopback interface inside the container only.
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
    depends_on:
      api:
        condition: service_started
    networks:
      - private

networks:
  public:
    labels: *momo-janitor-labels
  private:
    labels: *momo-janitor-labels

volumes:
  pgdata:
    name: ${DB_VOLUME_NAME:-momo-pgdata}
  redis-data:
    name: ${REDIS_VOLUME_NAME:-momo-redis-data}
  minio-data:
    name: ${MINIO_VOLUME_NAME:-momo-minio-data}
  caddy-data:
  caddy-config:
  momo-web-static:
    name: ${WEB_STATIC_VOLUME_NAME:-momo-web-static}
  prometheus-data:
    name: ${PROMETHEUS_VOLUME_NAME:-momo-prometheus-data}
  eve-runtime:
    name: ${EVE_RUNTIME_VOLUME_NAME:-momo-eve-runtime}
