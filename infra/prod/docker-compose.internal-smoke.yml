# MOMO-216 internal single-node hosting smoke override.
#
# Use with:
#   docker compose --env-file infra/prod/internal-smoke.env.example \
#     -f infra/prod/docker-compose.prod.yml \
#     -f infra/prod/docker-compose.internal-smoke.yml config
#
# This override keeps api/relay/worker/migrate/mock-hermes image-based. Local
# smoke points those images at locally built tags, but production hosts must pull
# pinned registry images and must not build from a source checkout.

name: ${COMPOSE_PROJECT_NAME:-momo-internal-smoke}

services:
  caddy:
    ports:
      - "${HTTP_PORT:-18080}:80"
      - "${HTTPS_PORT:-18443}:443"
      - "${HTTPS_PORT:-18443}:443/udp"
    # MOMO-316: prod 정본의 caddy healthcheck는 interval 30s라 `--wait`가
    # 첫 프로브까지 최대 30초를 기다리게 된다. 스모크에서는 같은 테스트를
    # 짧은 간격으로 돌려 부팅 대기 시간 회귀를 막는다(검증 시맨틱 동일).
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 2s

  api:
    image: ${MOMO_API_IMAGE:-momo-api:internal-smoke}
    pull_policy: never
    environment:
      DATABASE_URL: ${MOMO_APP_DATABASE_URL:?set MOMO_APP_DATABASE_URL}
    # MOMO-316: /health 기반 healthcheck. `docker compose up -d --wait`가
    # "HTTP 준비 완료"까지 보장하도록 한다(--wait는 healthcheck가 있어야만
    # HTTP readiness를 의미한다). curl 바이너리는 swift-service.Dockerfile
    # 런타임 스테이지에 포함. prod 정본 compose에는 넣지 않는다 —
    # 레지스트리 핀 이미지에 curl이 있다는 보장이 없어 스모크 경계에서만 강제.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  relay:
    image: ${MOMO_RELAY_IMAGE:-momo-outbox-relay:internal-smoke}
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    image: ${MOMO_WORKER_IMAGE:-momo-agent-worker:internal-smoke}
    pull_policy: never
    environment:
      RELAY_DATABASE_URL: ${WORKER_DATABASE_URL:?set WORKER_DATABASE_URL}
      HERMES_BASE_URL: ${HERMES_BASE_URL:-http://mock-hermes:8088/v1}
    depends_on:
      postgres:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mock-hermes:
        condition: service_healthy

  linkshort:
    image: ${MOMO_LINKSHORT_IMAGE:-momo-linkshort:internal-smoke}
    pull_policy: never

  migrate:
    image: ${MOMO_MIGRATE_IMAGE:-momo-migrate:internal-smoke}
    pull_policy: never
    restart: "no"
    environment:
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?set MIGRATE_DATABASE_URL}
      MOMO_BOOTSTRAP_RUNTIME_ROLES: ${MOMO_BOOTSTRAP_RUNTIME_ROLES:-1}
      MOMO_AGENT_SEED_MODE: e2e
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  mock-hermes:
    image: ${MOMO_MOCK_HERMES_IMAGE:-momo-mock-hermes:internal-smoke}
    pull_policy: never
    restart: "no"
    environment:
      HERMES_API_KEY: ${HERMES_API_KEY:-change-me-hermes-bearer}
    networks:
      - private
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8088/health\", timeout=2).read()'",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
