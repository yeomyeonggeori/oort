version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /clients/web
      - /examples/cloudflare-agent-momo
      - /examples/eve-momo-channel
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /infra
      - /infra/prod
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
