# oort — CI 캐시 데우기 (#5494, F1).
#
# 기준 브랜치(`main`·`track/engine`·`track/uxui`)에 push 될 때만 돌아서 PR CI(`pr-ci.yml`)가 읽을 Rust·npm 캐시를
# 저장한다. **캐시를 저장하는 곳은 여기뿐이다.** PR 의 잡은 복원만 한다(rust-cache `save-if`, `actions/cache/restore`).
#
# 왜: 전에는 모든 캐시가 PR 전용 범위(`refs/pull/N/merge`)에 저장됐다. GitHub 캐시는 같은 ref · PR 의 기준 브랜치 ·
# 기본 브랜치(`main`) 것만 읽을 수 있는데 `pr-ci` 는 기준 브랜치 push 에서 돌지 않아서, PR 이 읽을 캐시가 하나도 없었고
# 새 PR 의 첫 실행은 늘 처음부터 빌드했다(로그의 「No cache found」). PR 마다 쌓인 캐시가 무료 한도 10GB 도 채웠다.
#
# 권한과 신뢰: 권한은 `contents: read` 뿐이고 비밀값을 쓰지 않는다. 기준 브랜치에 이미 들어온 커밋만 빌드하므로 PR 코드는
# 여기서 돌지 않는다. PR 은 읽기만 해서 PR 이 기준 브랜치 캐시를 바꿀 수도 없다.
#
# 키가 같아야 한다 — 이 파일의 불변식. PR 잡이 여기서 저장한 캐시를 찾으려면 키가 글자 그대로 같아야 하고, 키는 입력에서
# 나온다. 아래 짝은 `pr-ci.yml` 의 짝 잡과 함께 바꾼다(한쪽만 바꾸면 PR 이 조용히 콜드로 돌아가서 티가 안 난다):
#   rust          ↔ pr-ci `rust`          shared-key `oort-rust-test`     · workspaces 2개 · `CARGO_PROFILE_*_DEBUG`
#   security_pack ↔ pr-ci `security_pack` shared-key `oort-security-pack` · workspaces `server-rust`
#   node_core·node_web·node_mobile ↔ pr-ci 의 같은 이름 잡(`header_fit` 은 `node_web` 과 잠금 파일이 같아 같은 키)
# rust-cache 키 = 접두 + shared-key + OS·arch + 해시(rustc 버전 · `CARGO*`·`RUST*` 등 환경 변수) + 해시(`workspaces` 의
# Cargo.lock·매니페스트). 환경 변수나 workspaces 가 다르면 키가 달라서 PR 이 못 찾는다. 반대로 컴파일 명령(`-p`·`--test`·
# 기능 플래그)은 키에 들어가지 않는다: 키가 같아도 명령이 다르면 다른 산출물이 저장되므로 PR 잡과 같은 명령으로 컴파일한다.
#
# Rust 키가 둘인 이유: `rust` 잡에는 `CARGO_PROFILE_*_DEBUG=line-tables-only`(#5182)와 `clients/desktop/src-tauri`
# workspace 가 있고 `security_pack` 에는 없어서 컴파일 설정이 다르다. 한 키로 합치면 먼저 저장한 쪽 산출물만 남고, 다른 잡은
# 자기 것과 맞지 않는 캐시를 받아 다시 빌드한다. 두 설정을 맞추는 일(F5, #5495)이 끝나면 `shared-key` 를 하나로 합칠 수 있다.
#
# 같은 키가 이미 있으면 컴파일·설치를 건너뛴다(rust-cache 의 `cache-hit`, npm 은 `lookup-only` 조회). GitHub 캐시는 한 번
# 저장되면 바뀌지 않아서 그때는 저장할 것이 없다. 키가 없을 때만(잠금 파일이 바뀌었거나 러너 이미지의 rustc 가 바뀐 뒤 첫
# push) 컴파일하고 저장한다.
name: ci-cache-warm

on:
  push:
    branches:
      - main
      - track/engine
      - track/uxui

permissions:
  contents: read

concurrency:
  group: ci-cache-warm-${{ github.ref }}
  # 취소하지 않는다. 착륙이 몰릴 때 새 push 가 도는 실행을 계속 죽이면 10분짜리 잡이 끝나지 못해 캐시가 저장되지 않는다.
  # 도는 실행은 두고, 대기 중인 실행만 가장 새 push 로 바뀐다.
  cancel-in-progress: false

jobs:
  # ── Rust: pr-ci `rust` 잡(cargo test + 카고 라이선스 게이트)의 캐시 ─────────────────
  rust:
    name: 데우기 — cargo test (Rust)
    runs-on: ubuntu-latest
    # 행 방지용 상한. 콜드 컴파일 약 6분 + 레지스트리 내려받기.
    timeout-minutes: 30
    # pr-ci `rust` 잡과 같은 환경 변수. rust-cache 키의 환경 해시에 들어간다.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # 저장 단계는 이 단계의 post 가 한다. 끝날 때 `clients/desktop/src-tauri` 의 `cargo metadata` 도 돌아서, pr-ci 의
      # 라이선스 게이트가 읽는 그 workspace 의 크레이트도 레지스트리 캐시에 같이 담긴다.
      - name: cargo 캐시(레지스트리 + target)
        id: rust_cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            server-rust
            clients/desktop/src-tauri
          shared-key: oort-rust-test

      - name: cargo test --workspace 컴파일만(--no-run — pr-ci rust 잡과 같은 명령)
        if: steps.rust_cache.outputs.cache-hit != 'true'
        run: cargo test --workspace --locked --manifest-path server-rust/Cargo.toml --no-run

  # ── Rust: pr-ci `security_pack` 잡(Security pack)의 캐시 ───────────────────────────
  security_pack:
    name: 데우기 — Security pack (Rust)
    runs-on: ubuntu-latest
    # 행 방지용 상한. 콜드 컴파일 약 8분(선택 목록 42개 대상).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: cargo 캐시(레지스트리 + target)
        id: rust_cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: server-rust
          shared-key: oort-security-pack

      # pr-ci 의 `scripts/security_pack.sh run` 은 선택 목록의 `패키지 타깃` 쌍마다 `cargo test --locked --manifest-path
      # server-rust/Cargo.toml -p <패키지> --test <타깃> -- --ignored --test-threads=1` 을 따로 돈다. 의존 크레이트의 기능
      # 합집합(feature unification)이 호출마다 달라서 `--workspace` 한 번으로는 같은 산출물이 안 나온다. 그래서 같은 쌍을
      # 같은 순서로, 시험 실행(`-- --ignored …`)만 빼고 `--no-run` 으로 컴파일한다. DB 는 필요 없다.
      - name: 보안 팩 대상 컴파일만(--no-run — 선택 목록 그대로)
        if: steps.rust_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          pairs="$(scripts/security_pack.sh list)"
          [ -n "$pairs" ] || { echo "선택 목록이 비었어요" >&2; exit 1; }
          count=0
          while read -r pkg target; do
            echo "::group::$pkg / $target"
            cargo test --locked --manifest-path "$PWD/server-rust/Cargo.toml" -p "$pkg" --test "$target" --no-run
            echo "::endgroup::"
            count=$((count + 1))
          done <<<"$pairs"
          echo "컴파일한 대상: $count"

  # ── npm: pr-ci `node_core`·`node_web`·`node_mobile`(+`header_fit`)의 캐시 ──────────
  # 잠금 파일 해시가 키라서 잠금 파일이 같으면 키가 같다. 키가 이미 있으면(`lookup-only` 조회) 설치도 저장도 건너뛴다. 없으면
  # **빈 npm 캐시에서** 설치해 그 잠금 파일에 필요한 것만 담는다(옛 캐시를 이어받아 오래된 압축 파일이 쌓이는 것을 막는다).
  # 저장 키는 조회 단계의 `cache-primary-key` 출력이 아니라 같은 식을 다시 쓴다 — 출력 이름에 기대어 저장이 조용히 빠지는 일이 없게.
  node_core:
    name: 데우기 — npm 캐시 (TS core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: npm 캐시 조회(같은 키가 있으면 아래 설치·저장을 건너뜀)
        id: npm_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: oort-npm-${{ runner.os }}-${{ runner.arch }}-core-${{ hashFiles('package-lock.json') }}
          lookup-only: true

      - name: npm ci (워크스페이스 루트 = packages/momo-core)
        if: steps.npm_cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: npm 캐시 저장
        if: steps.npm_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: oort-npm-${{ runner.os }}-${{ runner.arch }}-core-${{ hashFiles('package-lock.json') }}

  node_web:
    name: 데우기 — npm 캐시 (TS web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: npm 캐시 조회(같은 키가 있으면 아래 설치·저장을 건너뜀)
        id: npm_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: oort-npm-${{ runner.os }}-${{ runner.arch }}-web-${{ hashFiles('package-lock.json', 'clients/web/package-lock.json') }}
          lookup-only: true

      - name: npm ci (워크스페이스 루트 = packages/momo-core)
        if: steps.npm_cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: npm ci (clients/web)
        if: steps.npm_cache.outputs.cache-hit != 'true'
        # pr-ci `node_web` 과 같은 명령·같은 변수(브라우저 내려받기 없음).
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --prefix clients/web

      - name: npm 캐시 저장
        if: steps.npm_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: oort-npm-${{ runner.os }}-${{ runner.arch }}-web-${{ hashFiles('package-lock.json', 'clients/web/package-lock.json') }}

  node_mobile:
    name: 데우기 — npm 캐시 (TS mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: npm 캐시 조회(같은 키가 있으면 아래 설치·저장을 건너뜀)
        id: npm_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: oort-npm-${{ runner.os }}-${{ runner.arch }}-mobile-${{ hashFiles('package-lock.json', 'clients/mobile/package-lock.json') }}
          lookup-only: true

      - name: npm ci (워크스페이스 루트 = packages/momo-core)
        if: steps.npm_cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: npm ci (clients/mobile)
        if: steps.npm_cache.outputs.cache-hit != 'true'
        run: npm ci --prefix clients/mobile

      - name: npm 캐시 저장
        if: steps.npm_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: oort-npm-${{ runner.os }}-${{ runner.arch }}-mobile-${{ hashFiles('package-lock.json', 'clients/mobile/package-lock.json') }}
