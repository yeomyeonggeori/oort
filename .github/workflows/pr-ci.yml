# oort — PR CI (#1241 신설 · #1243 적립 집행). PR마다 자동으로 도는 유일한 워크플로다.
#
# 왜 신설했나: 감사 D(research/2026-08-10-buzz-audit-D.md §6)의 실측 —
#   · 워크플로 5개가 전부 `workflow_dispatch`(2026-06-26 과금 중단 조치)
#   · 마지막 실제 빌드 2026-06-25, 그보다 뒤에 들어온 `server-rust`는
#     **CI에서 한 번도 컴파일된 적이 없다**(오늘 프로덕션에서 도는 코드다)
#   · `pull_request` 트리거를 가진 워크플로 0개 → 외부 기여 PR을 기계적으로
#     판정할 수단이 0
# 감사 A(§A5)는 같은 구멍의 라이선스 쪽을 잰다: `deny.toml`·
# `scripts/check_npm_licenses.mjs` 게이트가 `scripts/local_gate.sh`에서만 돌고
# CI에는 없어서, 외부 PR은 라이선스 검사를 한 번도 받지 않는다.
#
# ── 2026-08-10 공개 전환: 분 상한 논리 폐기, 스위트 확장 ───────────────────
# 이 파일의 원래 설계는 **private + GitHub Free = 월 2,000분**이라는 제약 위에
# 서 있었다(#1243 §4: PR 495건/월 × 2.9분 ≈ 1,440~1,870분, 여유 7~28%). 그래서
# `cargo check`이지 `cargo test`가 아니었고, 타입체크는 있어도 단위 테스트는
# 없었다 — 둘 다 "분이 없어서" 내린 결정이지 "검증이 불필요해서"가 아니다.
# 레포가 public이 되면서 Actions는 **무료·무제한**이 됐고, 그 제약이 사라졌다.
# 따라서:
#   · **분 상한 논리는 제거한다.** ubuntu 전용도, 잡 수 최소화도, 런당 32분
#     상한도 더는 근거가 없다. `timeout-minutes`는 남기되 의미가 바뀐다 —
#     소모 상한이 아니라 **행(hang) 방지 안전장치**다(그래서 넉넉하다).
#   · **path filter와 `cancel-in-progress`는 유지한다.** 이 둘은 과금 장치가
#     아니라 피드백 지연 장치다. 문서 PR을 8분 기다리게 하지 않는 것과, 3초 뒤
#     푸시한 커밋이 앞선 런을 죽이는 것은 무료여도 여전히 옳다.
#   · **스위트를 확장한다**(#1243 적립 3): `cargo check` → `cargo test
#     --workspace`, 타입체크 3트리 → 타입체크 + 단위 테스트 3트리.
#
# Rust는 확장을 기존 잡에 **흡수**시켰지 잡을 늘리지 않았다. `cargo test`는
# lib·bin·test 타깃을 전부 컴파일하므로 `cargo check --workspace`를 그대로
# 포함한다 — 둘을 함께 두면 같은 크레이트를 두 번 컴파일한다.
#
# ── 2026-10-28 구조 변경(#4696, 검수·시험 v2 T1) ───────────────────────────
# 위 문단이 Node에 대해 한 말(「한 잡 안에서 `npm ci` 한 번」)은 폐기한다. 이유는
# 실측이다(성공 18회 중앙값): TS 잡 524초 중 시험 3개가 직렬로 400초(web 217·
# mobile 150·core 34)였고, 설치는 트리마다 3~15초뿐이었다. 그래서 Node 레인을
# 트리별 3잡(`node_core`·`node_web`·`node_mobile`)으로 나눴다. 중복되는 비용은
# 잡마다의 root `npm ci` 3초뿐이고, 대기는 가장 긴 줄(web)로 줄어든다. 시험
# 수·명령·타입체크는 그대로다 — 줄인 검사는 0이다.
# 같은 실측에서 「정책 회귀 fixtures」 114초가 `if:` 없이 모든 PR에서 돌았다.
# 그 시험들의 입력은 게이트 스크립트·워크플로·정책 문서이고(`test_pr_ci_guardrails.sh`는
# 거기에 더해 러스트 트리 밖에서 읽는 파일을 찾느라 러스트 소스 전체를 훑는다), 그래서
# 별도 `policy` 잡으로 떼어 `changes`의 정책 레인에서만 돌린다. 레인 정의와 근거는
# 아래 `changes` 잡에 있다.
# `PR CI gate`는 새 잡을 모두 `needs`에 더하고 선택/결과를 교차검증한다.
#
# 스코프: 여전히 **전체 게이트가 아니다.** DB가 필요한 러스트 conformance
# 테스트(`*_pg.rs`, 전부 `#[ignore]`)·런타임 검증기·Docker 스택·e2e·웹 e2e
# 게이트는 `docs/LOCAL_PR_GATE.md`의 로컬 게이트 몫으로 남는다. 웹 게이트 중 하나는
# 예외다: `gate:channel-header-fit`은 머리를 건드린 PR에서 `header_fit` 잡이 돌린다(#5185).
# 남은 휴면 워크플로(release-desktop)는 무접촉이다.
# (W-S1 #1215: `ci-build`·`release-ios`·`release-macos` 셋은 Swift 클라 3트리와
#  함께 삭제됐다 — 전부 `workflow_dispatch` 전용이었고 자동 실행 0이었다.)
name: pr-ci

on:
  pull_request:
    branches:
      # 트랙 파이프라인(docs/TRACKS.md): 워커 PR은 자기 track으로, 통합만
      # main으로 간다. 셋 모두 걸어야 실제 머지 경로를 덮는다.
      - main
      - track/engine
      - track/uxui
  # PR 없이 레인을 한 번 돌려보고 싶을 때. 이때는 변경 파일 목록이 없으므로
  # 두 레인을 모두 돈다.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── ① 어떤 레인을 돌릴지 판정 ────────────────────────────────────────────
  # checkout 없이 GitHub API로 변경 파일만 읽는다(체크아웃 100MB·수십 초를
  # 문서 전용 PR에 물리지 않기 위해서다). third-party path-filter 액션을 쓰지
  # 않는 이유도 같다 — 이 판정에 공급망을 하나 더 늘릴 이유가 없다.
  changes:
    name: 변경 경로로 레인 선택
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      node: ${{ steps.filter.outputs.node }}
      policy: ${{ steps.filter.outputs.policy }}
      header_fit: ${{ steps.filter.outputs.header_fit }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          run_all() {
            echo "→ rust=true node=true policy=true header_fit=true ($1)"
            {
              echo "rust=true"
              echo "node=true"
              echo "policy=true"
              echo "header_fit=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          # workflow_dispatch: PR 번호가 없다.
          [ -n "$PR" ] || run_all "no pull request context"

          # 조회 실패는 "변경 없음"이 아니라 "모르겠음"이다. 모르면 전부 돈다
          # (fail-open의 방향이 CI를 *거르는* 쪽이 되면 게이트가 무의미해진다).
          metadata="$RUNNER_TEMP/pr-$PR-metadata.json"
          pages="$RUNNER_TEMP/pr-$PR-files-pages.json"
          if ! gh api "repos/$REPO/pulls/$PR" > "$metadata"; then
            run_all "could not read pull request metadata"
          fi
          if ! jq -e '
            type == "object"
            and (.changed_files | type == "number" and . >= 1 and floor == .)
          ' "$metadata" >/dev/null; then
            run_all "malformed pull request metadata"
          fi
          expected_count="$(jq -r '.changed_files' "$metadata")"

          # REST lists at most 3,000 PR files. At exactly that boundary we cannot
          # prove completeness, even if the metadata count also says 3,000.
          [ "$expected_count" -lt 3000 ] || run_all "3,000-file API cap is ambiguous"

          if ! gh api --paginate --slurp \
            "repos/$REPO/pulls/$PR/files?per_page=100" > "$pages"; then
            run_all "could not list changed files"
          fi
          if ! jq -e '
            type == "array"
            and length > 0
            and all(.[]; type == "array")
            and all(.[][];
              type == "object"
              and (.filename | type == "string" and length > 0)
              and (
                (has("previous_filename") | not)
                or .previous_filename == null
                or (.previous_filename | type == "string" and length > 0)
              )
            )
          ' "$pages" >/dev/null; then
            run_all "malformed changed-files response"
          fi

          row_count="$(jq -r '[.[][]] | length' "$pages")"
          unique_count="$(jq -r '[.[][] | .filename] | unique | length' "$pages")"
          if [ "$row_count" -ne "$expected_count" ] \
            || [ "$unique_count" -ne "$expected_count" ]; then
            run_all "incomplete or duplicate changed-files response: expected=$expected_count rows=$row_count unique=$unique_count"
          fi
          [ "$row_count" -lt 3000 ] || run_all "3,000-file retrieval cap is ambiguous"

          # A rename can move code out of a guarded tree. Classify both the new
          # path and previous_filename, then deduplicate the union.
          files="$(jq -r '
            [.[][] | (.filename, (.previous_filename // empty))]
            | unique[]
          ' "$pages")"
          [ -n "$files" ] || run_all "empty changed path set"

          echo "changed paths (including rename sources):"
          printf '%s\n' "$files"

          # 레인별 관심 경로. 목록에 없는 경로(docs/·STATUS.md·infra/·scripts/·
          # 은퇴한 Swift 트리 f399e417:server/ · f399e417:relay/ ·
          # f399e417:workers/ · f399e417:services/)만 바뀐 PR은
          # rust/node 레인이 skip된다. skip된 잡은 GitHub에서 성공으로 집계되므로,
          # required check으로 승격해도 문서 PR이 막히지 않는다.
          # gitleaks는 여기 없다: 시크릿은 전 경로라 그 잡은 상시 실행한다.
          #
          # 테스트를 돌리기 시작하면서 레인이 **자기 트리 밖의 입력**도 읽게
          # 됐다. 그 둘은 실측으로 찾아 목록에 넣었다(넣지 않으면 그 파일만
          # 바꾼 PR이 초록으로 통과한 뒤 base에서 빨강이 된다):
          #   · `server/Fixtures/plugin-manifests/*.json` — `clients/web`의
          #     `features/plugins/model.test.ts`·`lib/pluginApi.test.ts`가
          #     레포 상대경로로 import한다.
          #   · `docs/api/openapi.yaml`·`docs/api/*.golden.json`·
          #     `docs/api/*.vector(s).json` — Rust 시험이 읽는다
          #     (`include_str!`, `read_to_string`). 예: `routes::actions`의
          #     `the_suggestable_ids_are_one_list_in_four_places`는 openapi의
          #     `SuggestableCommandId`를 Rust 등록표와 맞춘다. 이 경로를 빼면
          #     openapi만 바꾼 PR은 cargo 레인이 skip되어 base에서 빨강이
          #     된다(#4042, PR #4032·#4039 전례). 새 파일을 Rust 시험이 읽게
          #     되면 이 패턴이 덮는지 확인한다.
          #   · 그 밖에 Rust 소스가 `include_str!`/`read_to_string`/
          #     `CARGO_MANIFEST_DIR`로 읽는 server-rust·src-tauri 밖 파일
          #     (`server/Migrations/`·`server/Fixtures/plugin-manifests/`·`plugin-wire/`·
          #     `infra/rust/sql/`·`infra/**/centrifugo*.json`·`docs/SELF_HOST_AGENT.md`·
          #     `scripts/desktop/build_workd_sidecar.sh`·core `http.ts`·`aiHubModel.ts`·
          #     `timeline/`·`__fixtures__`·web `session.ts`/`settingsNav.ts`/`tokens.css`/work `__fixtures__`·
          #     mobile `__tests__/fixtures/`)도 같다(#4055).
          #     Hermes 출처 벡터 `infra/hermes/self_media_vectors.json`(#4820 C2a)과
          #     core 실패 카드 골든 `approvals/expression-failure-copy.json`(#4820 C2b, #4905)도 같다.
          #     `scripts/tests/test_pr_ci_guardrails.sh`가
          #     `pr_ci_rust_external_inputs.py`로 그 경로를 소스에서 뽑아 이
          #     필터가 덮는지 확인한다. 새 참조가 생기면 그 시험이 빨개진다.
          # 레인 매칭은 파이프가 아니라 **파일**을 읽는다(#4728). `printf … | grep -q`는
          # grep 이 첫 일치에서 먼저 끝나면 printf 가 SIGPIPE(141)를 받고, pipefail 이 그
          # 줄을 "불일치"로 읽어 레인이 통째로 false 가 된다(파일 수백 개부터 재현). 그러면
          # rust·보안 팩·node·policy 가 모두 skip 인데 gate 는 초록이라 필수 검사가 조용히
          # 빠진다. 새 레인 줄도 `lane_hit`을 쓴다 — 파이프로 되돌리지 않는다.
          # grep 종료 코드는 0 일치 · 1 불일치뿐이다. 그 밖(정규식·I/O 오류)은 "불일치"가
          # 아니라 분류 실패라서 step 을 실패시킨다(changes 잡 실패 → gate 빨강).
          list="$RUNNER_TEMP/pr-$PR-changed-paths.txt"
          printf '%s\n' "$files" > "$list" || run_all "could not write changed path list"
          lane_hit() {
            local rc=0
            grep -Eq "$1" "$list" || rc=$?
            [ "$rc" -le 1 ] || { echo "::error::lane classifier failed: grep exit $rc"; exit 1; }
            return "$rc"
          }

          rust=false
          node=false
          lane_hit \
            '^(server-rust/|clients/desktop/src-tauri/|deny\.toml$|scripts/check_cargo_licenses\.sh$|scripts/generate_ghcr_notice_bundle\.py$|scripts/check_ghcr_notice_bundle\.sh$|scripts/check_debian_copyrights\.sh$|scripts/sample_expression_contract\.py$|scripts/openapi_sampled_on_rust\.txt$|scripts/verify_openapi_contract_rust\.sh$|scripts/tests/test_ghcr_notice_bundle\.sh$|legal/generated/|legal/THIRD_PARTY_NOTICES\.md$|NOTICE$|docs/api/openapi\.yaml$|docs/api/[^/]+\.golden\.json$|docs/api/[^/]+\.vectors?\.json$|server/Migrations/|server/Fixtures/plugin-manifests/|server/Fixtures/plugin-wire/|infra/rust/sql/|infra/hermes/self_media_vectors\.json$|infra/security-pack/|scripts/security_pack\.sh$|scripts/tests/test_security_pack\.sh$|infra/([^/]+/)*centrifugo[^/]*\.json$|docs/SELF_HOST_AGENT\.md$|scripts/desktop/build_workd_sidecar\.sh$|packages/momo-core/src/lib/http\.ts$|packages/momo-core/src/features/ai/aiHubModel\.ts$|packages/momo-core/src/features/approvals/settlement-copy\.json$|packages/momo-core/src/features/approvals/expression-failure-copy\.json$|packages/momo-core/src/features/emoji/emojiCatalog\.json$|packages/momo-core/src/features/expressions/fixtureServer\.ts$|packages/momo-core/src/features/timeline/|packages/momo-core/src/features/auth/__fixtures__/|packages/momo-core/src/features/workbench/__fixtures__/|clients/web/src/lib/session\.ts$|clients/web/src/features/settings/settingsNav\.ts$|clients/web/src/design/tokens\.css$|clients/web/src/features/work/__fixtures__/|clients/mobile/__tests__/fixtures/|\.github/workflows/pr-ci\.yml$)' \
            && rust=true
          # 반대 방향도 있다(#5193 후속): 웹 시험이 **데스크탑 셸 파일**을 읽는다. 그 파일만 바뀐 PR에서도 웹 짝 시험이
          # 돌아야 해서 아래 두 디렉터리를 넣었다. 셸 트리 전체를 넣지 않은 이유: rust 레인이 이미 그 트리 전체를 보고,
          # 웹이 읽지 않는 파일(소스 `.rs` 등)까지 넣으면 셸 PR마다 웹·폰·코어 잡이 도는 비용이 생긴다.
          #   · `clients/desktop/src-tauri/tests/fixtures/` — 트레이 와이어·상한 정본(`tray_status.json`·`tray_limits.json`).
          #     `clients/web/src/features/notifications/trayModel.test.ts`가 셸 시험과 같은 JSON을 읽어 맞춘다.
          #   · `clients/desktop/src-tauri/capabilities/` — `clients/web/src/app/desktopShellContract.test.ts`가
          #     `capabilities/default.json`을 읽어 번들이 기대는 권한(창 끌기·알림 확인 등)이 셸에 있는지 본다.
          lane_hit \
            '^(clients/web/|clients/mobile/|packages/|server/Fixtures/|clients/desktop/src-tauri/tests/fixtures/|clients/desktop/src-tauri/capabilities/|package\.json$|package-lock\.json$|scripts/check_npm_licenses\.mjs$|\.github/workflows/pr-ci\.yml$)' \
            && node=true

          # 정책 레인(#4696) — `policy` 잡의 시험 6개가 읽는 입력의 합집합이다.
          #   · `scripts/`·`.github/`: 시험 대상인 게이트 스크립트·워크플로(트랙 정렬·
          #     정책 무결성·보호 가드·GHCR 고지 묶음·pr-ci 자신).
          #   · `policy_path()`(scripts/verify_policy_integrity.sh)가 정책 파일이라 부르는
          #     문서·설정(AGENTS.md·CONTRIBUTING.md·deny.toml·osv-scanner.toml·
          #     docs/security/claims.yaml·docs/GITHUB_OPS.md·docs/LOCAL_PR_GATE.md·
          #     docs/TRACKS.md·docs/adr/0153-…). 정책 PR이면 정책 회귀가 돈다.
          #   · `REVIEW.md`: 위험 등급 경로표를 `policy_path()`에 묶는 시험의 입력이다.
          #   · `packages/momo-core/src/i18n/tooling/direct-copy.mjs`: 직접 문구 장부의 봉인(ANCHOR_SEAL)과
          #     세는 규칙(#5589). `policy_path()`가 정책 파일로 부르니 경로표 시험이 이 레인을 요구한다.
          #   · **rust 레인 전체.** `test_pr_ci_guardrails.sh`는 server-rust·src-tauri 의
          #     `.rs` 를 훑어 레포 안 다른 경로를 읽는 참조를 뽑고 위 rust 필터가 덮는지
          #     확인한다(#4055). 러스트 소스만 바꾼 PR이 새 참조를 만들면 그 시험이
          #     빨개져야 하므로, 이 시험은 스크립트·워크플로를 안 건드린 러스트 PR에도 돈다.
          #     `test_ghcr_notice_bundle.sh`가 복사해 쓰는 legal/generated/spdx-texts 도
          #     rust 필터가 덮는다.
          # 그래서 policy=true ⊇ rust=true 다. 그 밖의 경로만 바뀐 PR(웹·폰·코어·문서)은
          # 정책 회귀를 건너뛴다 — gate 가 선택/결과를 교차검증해 조용한 skip 은 빨강이다.
          policy="$rust"
          lane_hit \
            '^(scripts/|\.github/|REVIEW\.md$|AGENTS\.md$|CONTRIBUTING\.md$|deny\.toml$|osv-scanner\.toml$|docs/security/claims\.yaml$|docs/GITHUB_OPS\.md$|docs/LOCAL_PR_GATE\.md$|docs/TRACKS\.md$|docs/adr/0153-ci-stack-selfhosted-runners\.md$|packages/momo-core/src/i18n/tooling/direct-copy\.mjs$)' \
            && policy=true

          # 채널 머리 맞춤 레인(#5185, #4230 후속) — `header_fit` 잡 하나가 읽는 입력이다. 그 잡은 `gate:channel-header-fit`
          # (`vite build --mode huddle-gate` 뒤 크로미엄으로 장면 수천 개를 잰다)을 돌리는데 몇 분이 걸리고 브라우저를 받아야
          # 해서, 웹 PR 전부가 아니라 **머리를 그리거나 그 폭·글자를 정하는 파일**이 바뀐 PR에서만 돈다. 목록은 게이트가 실제로
          # 쓰는 것만이다(그 밖의 웹 파일을 넣으면 이 잡이 `node_web`처럼 모든 웹 PR의 상시 비용이 된다):
          #   · 게이트와 그 입력: `gates/gate-channel-header-fit.mjs` 자신과 그것이 import하는 `gates/preview-guard.mjs`·
          #     `e2e/advanceOnboarding.mjs`, 게이트 빌드(`huddle-gate` 모드)의 진입점 `huddleRuntimeLoader.ts`, 스크립트를
          #     정의하는 `clients/web/package.json`.
          #   · 머리를 그리는 컴포넌트: `ChatShell.tsx`(머리 마크업)와 그 안에 서는 컨트롤(`channelHeaderControl.ts`·
          #     `ChannelHeaderMenu`·`ChannelContextControls`·`HuddleHeaderControl`·`HuddleMicMenu`·`WorkPlanDock`·`PinListMenu`·
          #     `SidebarDrawerToggle`), 머리가 쓸 폭을 정하는 판(`.app-pane`)과 셸 격자의 `AppShell.tsx`.
          #   · 툴팁(게이트의 12번 단정): `tooltip.tsx`·`tooltipFit.ts`·`tooltipGroup.ts`.
          #   · 폭을 정하는 CSS: `tokens.css`(`channel-head-*`·`app-pane`·툴팁 면)와 `appearance/density.css`·
          #     `appearance/typography-scale.css`(게이트가 글자 크기 3단계 × 밀도 3단계를 곱한다).
          #   · 무엇이 서는지 정하는 코어: `huddleModel.ts`(`huddleControlShown`·`huddleNamesTarget`), `workPlan.ts`(계획 독 글),
          #     `directory.ts`(`channelLabelParts`: 제목과 같은 이름 DM의 핸들).
          #   · 이 파일 자신: 잡을 고친 PR이 그 잡으로 증명되도록 rust·node 레인과 같은 관례로 넣는다.
          #   · 일부러 뺀 것: 게이트 장면이 그리지 않는 조각. 게이트의 모의 응답에는 에이전트 상대와 접속 정보가 없어서 에이전트
          #     DM 머리(`DmAgentsMenu`·`AgentLivenessLabel`)와 접속 라벨(`HumanPresence`)은 이 잡이 돌아도 보지 못한다. 게이트가
          #     그것을 그리게 되면 그때 목록에 더한다.
          # 전부 `node` 레인 경로 안이라 header_fit ⊂ node 이다. 이 출력은 `gate`의 선택/결과 교차검증 밖에 있다: 필수 상태로
          # 쓸지는 정책 결정이고(그때 `gate`의 `needs`·`*_RESULT`·`require_optional_lane`을 함께 늘린다), 그 전까지는 이 잡이
          # 빨개도 `PR CI gate`를 막지 않는다.
          header_fit=false
          lane_hit \
            '^(clients/web/gates/gate-channel-header-fit\.mjs$|clients/web/gates/preview-guard\.mjs$|clients/web/e2e/advanceOnboarding\.mjs$|clients/web/package\.json$|clients/web/src/features/huddles/huddleRuntimeLoader\.ts$|clients/web/src/features/chat/ChatShell\.tsx$|clients/web/src/features/chat/channelHeaderControl\.ts$|clients/web/src/features/chat/ChannelHeaderMenu\.tsx$|clients/web/src/features/channels/ChannelContextControls\.tsx$|clients/web/src/features/huddles/HuddleHeaderControl\.tsx$|clients/web/src/features/huddles/HuddleMicMenu\.tsx$|clients/web/src/features/work/WorkPlanDock\.tsx$|clients/web/src/features/timeline/PinListMenu\.tsx$|clients/web/src/app/SidebarDrawerToggle\.tsx$|clients/web/src/app/AppShell\.tsx$|clients/web/src/design/ui/tooltip\.tsx$|clients/web/src/design/ui/tooltipFit\.ts$|clients/web/src/design/ui/tooltipGroup\.ts$|clients/web/src/design/tokens\.css$|clients/web/src/design/appearance/density\.css$|clients/web/src/design/appearance/typography-scale\.css$|packages/momo-core/src/features/huddles/huddleModel\.ts$|packages/momo-core/src/features/work/workPlan\.ts$|packages/momo-core/src/features/workspace/directory\.ts$|\.github/workflows/pr-ci\.yml$)' \
            && header_fit=true

          echo "→ rust=$rust node=$node policy=$policy header_fit=$header_fit"
          {
            echo "rust=$rust"
            echo "node=$node"
            echo "policy=$policy"
            echo "header_fit=$header_fit"
          } >> "$GITHUB_OUTPUT"

  # Every PR gets a topology check, including documentation-only changes. For
  # track targets, GitHub's synthetic merge commit must contain current main;
  # workflow_dispatch checks the remote canonical graph instead.
  alignment:
    name: canonical track alignment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: canonical refs 새로고침
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/track/engine:refs/remotes/origin/track/engine \
            +refs/heads/track/uxui:refs/remotes/origin/track/uxui

      - name: PR candidate 또는 remote topology 검사
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            trusted_checker="$RUNNER_TEMP/check_track_alignment.sh"
            base_oid="$(git rev-parse "origin/$BASE_REF")"
            if git show "origin/main:scripts/check_track_alignment.sh" > "$trusted_checker" 2>/dev/null; then
              : # Normal path: execute the canonical policy from main, not PR code.
            else
              # One-time #1297/#1302 bootstrap. The checker does not exist on
              # main during this initial integration chain; only these reviewed
              # immutable bases may use the candidate copy. Once main lands the
              # chain, this path is dead.
              case "$base_oid" in
                915d00bff14fda55b909fcdda72067e3d480dbda|27718c0e68715ae44fc65cdb632e70b8a347ea7c|38587b53c088049e42f9fba1f8d0118985523faf)
                  cp scripts/check_track_alignment.sh "$trusted_checker"
                  ;;
                *)
                  echo "trusted base alignment checker is unavailable" >&2
                  exit 1
                  ;;
              esac
            fi
            chmod +x "$trusted_checker"
            "$trusted_checker" --candidate "$BASE_REF" "$CANDIDATE_SHA"
          else
            trusted_checker="$RUNNER_TEMP/check_track_alignment.sh"
            git show origin/main:scripts/check_track_alignment.sh > "$trusted_checker"
            chmod +x "$trusted_checker"
            "$trusted_checker" --remote
          fi

      # 상시 검사(#4696에서 정책 회귀 fixtures 6개를 `policy` 잡으로 떼어도 이것은
      # 여기에 남긴다). 이 검사는 게이트 스크립트의 회귀 시험이 아니라 **레포 상태**
      # 검사다: server-rust/Cargo.lock·clients/web/package-lock.json 해시가 커밋된 고지
      # 묶음과 맞는지, server-rust/Dockerfile 의존 캐시 COPY 목록이 Cargo 워크스페이스와
      # 맞는지(크레이트를 더하고 COPY 줄을 잊으면 이미지 빌드만 깨진다, #3876)를 본다.
      # 락파일·크레이트만 바꾼 PR이 입력이라 경로 조건을 못 건다. 실측 0초.
      - name: GHCR 고지 묶음 신선도 + Dockerfile COPY 목록(상시)
        run: scripts/check_ghcr_notice_bundle.sh --stale-only

  # ── ①-b 정책 회귀 레인 (#4696, 검수·시험 v2 T1) ──────────────────────────
  # 게이트 스크립트·워크플로 자체의 회귀 시험 6개. 전에는 `alignment` 잡의 한 step 으로
  # **모든 PR에서** 114초(실측 중앙값, 18/18)를 썼고, 로컬 실측(부하 낮은 때 아님)으로
  # 그중 `test_github_track_guardrails.sh` 가 대부분이다. 입력이 바뀐 PR에서만 돌린다:
  # `changes` 의 `policy` 출력(정의·근거는 그 잡의 주석). 웹·폰·코어·문서 PR은 건너뛴다.
  # 별도 잡으로 둔 이유: `gate` 가 「선택됐는데 skip」을 빨강으로 잡으려면 잡 단위
  # 결과가 필요하다(step 의 `if:` 는 오타가 나도 조용히 skip 된다).
  policy:
    name: 정책 회귀 fixtures
    needs: changes
    if: needs.changes.outputs.policy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: alignment/required-gate policy regression fixtures
        run: |
          scripts/tests/test_track_alignment_guard.sh
          scripts/tests/test_pr_ci_guardrails.sh
          scripts/tests/test_github_track_guardrails.sh
          scripts/tests/test_policy_integrity_gate.sh
          scripts/tests/test_trusted_policy_runner.sh
          scripts/tests/test_ghcr_notice_bundle.sh

  # Role split with scripts/check_secrets.sh (#1236 local vs #1629 CI):
  # this job scans the PR commit range (base.sha..head.sha). Full-history
  # scanning stays in the local gate. Both reuse .gitleaksignore. Fail-closed.
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned CLI download. A third-party scanner Action would need an org
      # license secret, which would break fork PRs (packet: secrets 불요).
      - name: install pinned gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          [ "$arch" = "x86_64" ] || {
            echo "gitleaks pin is linux_x64; unsupported runner arch $arch" >&2
            exit 1
          }
          command -v curl >/dev/null || {
            echo "curl is not installed; cannot fetch pinned gitleaks" >&2
            exit 1
          }
          [ -n "${RUNNER_TEMP:-}" ] || {
            echo "RUNNER_TEMP is unset" >&2
            exit 1
          }
          tmp="$RUNNER_TEMP/gitleaks-install"
          mkdir -p "$tmp"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -fsSL "$url" -o "$tmp/$tarball"
          echo "${GITLEAKS_SHA256}  $tmp/$tarball" | sha256sum -c -
          tar -xzf "$tmp/$tarball" -C "$tmp" gitleaks
          test -x "$tmp/gitleaks" || {
            echo "gitleaks binary missing after extract" >&2
            exit 1
          }
          install_dir="$HOME/.local/bin"
          mkdir -p "$install_dir"
          install -m 0755 "$tmp/gitleaks" "$install_dir/gitleaks"
          [ -n "${GITHUB_PATH:-}" ] || {
            echo "GITHUB_PATH is unset; cannot export gitleaks" >&2
            exit 1
          }
          echo "$install_dir" >> "$GITHUB_PATH"
          export PATH="$install_dir:$PATH"
          command -v gitleaks >/dev/null || {
            echo "gitleaks is not installed" >&2
            exit 1
          }
          got="$(gitleaks version)"
          got="${got#v}"
          test "$got" = "$GITLEAKS_VERSION" || {
            echo "gitleaks version drift: got $got want $GITLEAKS_VERSION" >&2
            exit 1
          }

      - name: scan PR commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          command -v gitleaks >/dev/null || {
            echo "gitleaks is not installed" >&2
            exit 1
          }
          test -f .gitleaksignore || {
            echo "missing triage baseline: .gitleaksignore" >&2
            exit 1
          }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ] || {
              echo "missing pull_request base/head SHA" >&2
              exit 1
            }
            git cat-file -e "${BASE_SHA}^{commit}" || {
              echo "base SHA $BASE_SHA is not in this checkout" >&2
              exit 1
            }
            git cat-file -e "${HEAD_SHA}^{commit}" || {
              echo "head SHA $HEAD_SHA is not in this checkout" >&2
              exit 1
            }
            log_opts="${BASE_SHA}..${HEAD_SHA}"
          else
            log_opts="-1"
          fi
          echo "[gitleaks] version=$(gitleaks version) log-opts=$log_opts baseline=.gitleaksignore"
          gitleaks detect \
            --source . \
            --gitleaks-ignore-path .gitleaksignore \
            --log-opts "$log_opts" \
            --redact=90

  # ── 의존성 어드바이저리 게이트 (#4243, SEC-05) ───────────────────────────
  # 새 RUSTSEC·GHSA는 lockfile을 건드리지 않은 PR에도 생긴다. 그래서 gitleaks처럼
  # 경로 필터 없이 항상 돌고(`changes`에 의존하지 않는다), 게이트가 이 결과를 필수로
  # 요구한다. 대가는 명시한다: 고칠 수 없는 새 권고는 정책 PR(deny.toml·
  # osv-scanner.toml에 이유+만료일 예외)이 들어올 때까지 모든 PR을 막는다.
  # 판정은 scripts/check_advisories.py 한 곳이다(예외 장부 만료 검사, cargo deny
  # advisories, npm audit --omit=dev --audit-level=high, OSV-Scanner 5개 lockfile).
  # 스캐너 도구는 버전을 못 박는다: cargo-deny는 아래 rust 레인과 같은 핀, OSV-Scanner는
  # gitleaks처럼 릴리스 바이너리 + sha256 검증이다(서드파티 액션 없음).
  # 음성 대조(test_advisory_gate.sh --online)가 실전 스캔 바로 뒤에 같은 러너에서 돈다:
  # 알려진 취약 버전 픽스처가 빨강이 아니면(DB가 비었거나 경로가 틀린 눈먼 스캐너)
  # 이 레인이 빨강이다.
  advisories:
    name: dependency advisory gate
    runs-on: ubuntu-latest
    # 행 방지용 상한: cargo metadata가 두 워크스페이스 크레이트를 내려받는 콜드 실행이 가장 길다.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: cargo-deny 설치
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-deny@0.20.2

      - name: install pinned osv-scanner
        env:
          OSV_VERSION: 2.7.0
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          [ "$arch" = "x86_64" ] || {
            echo "osv-scanner pin is linux_amd64; unsupported runner arch $arch" >&2
            exit 1
          }
          [ -n "${RUNNER_TEMP:-}" ] || {
            echo "RUNNER_TEMP is unset" >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/osv-bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/osv-bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-bin/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-bin/osv-scanner"
          echo "$RUNNER_TEMP/osv-bin" >> "$GITHUB_PATH"

      - name: advisory gate (ledger + cargo deny + npm audit + OSV-Scanner)
        run: python3 scripts/check_advisories.py

      - name: negative controls (known-vulnerable fixtures must be red)
        run: bash scripts/tests/test_advisory_gate.sh --online

  # ── ② Rust 레인 ─────────────────────────────────────────────────────────
  # `cargo test --workspace` + 카고 라이선스 게이트.
  #
  # 공개 전환 전에는 `cargo check`이었다. `cargo test`는 그것을 포함하면서
  # 회귀까지 잡으므로 대체이지 추가가 아니다 — 두 명령을 함께 두면 같은
  # 크레이트를 두 번 컴파일한다.
  #
  # DB가 필요한 conformance 테스트는 전부 `#[ignore]`라 여기서 자동으로
  # 빠진다(파일 37개·`#[ignore]` 수가 `#[test]` 수 이상임을 실측). 그것들은
  # 실제 pgvector/pg18 컨테이너를 세우는 로컬 게이트 몫이다.
  rust:
    name: cargo test + 카고 라이선스 게이트
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # 행 방지용 상한이지 소모 상한이 아니다(공개 전환으로 분은 무료·무제한).
    # 러너 실측(이 PR): `cargo test --workspace` 콜드 107초 · 캐시 히트 77초,
    # 잡 전체 1분32초. 20분은 그 ~10배 여유다.
    timeout-minutes: 20
    # 시험 빌드의 디버그 정보를 줄인다(#5182). 서버를 통째로 링크하는 시험 바이너리가
    # 수십 개라 전체 디버그 정보로는 ubuntu-latest 러너 디스크가 거의 차서, 임시 폴더에
    # 100MB를 쓰는 `momo-drive` 시험이 디스크 부족으로 깨졌다(#5180). `line-tables-only`는
    # 패닉의 파일:줄을 남긴다.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 툴체인 확인(러너 사전설치 stable)
        # rustup 툴체인 액션을 쓰지 않는다. 레포에 rust-toolchain.toml이 없고
        # (#1442에서 신설하지 않기로 판정 — 판정문은 그 PR 본문), ubuntu-latest
        # 이미지에 stable이 이미 들어 있다. 이 레인은 stable을 쓰지 MSRV를 쓰지
        # 않는다 — 즉 **MSRV는 여기서 검증되지 않는다**(#1442 후속 제안).
        #
        # MSRV는 두 카고 워크스페이스가 각각 선언하며 둘 다 #1442 실측치다:
        #   server-rust/Cargo.toml            rust-version = "1.88.0"  (time 0.3.54 계열)
        #   clients/desktop/src-tauri/…       rust-version = "1.89.0"  (notify-rust 4.18.0)
        # 이 잡이 초록인 것은 러너 stable이 그 둘보다 높다는 뜻일 뿐이다. 아래
        # 출력이 그 사실의 유일한 증거이므로 지우지 말 것.
        run: |
          rustc --version
          cargo --version

      # 캐시는 읽기만 한다(#5494). 저장은 기준 브랜치 push 때 `ci-cache-warm.yml` 의 `rust` 잡이 하고, PR 이 저장하면 PR 전용
      # 범위라 다른 PR 이 못 읽고 한도(10GB)만 채운다. shared-key·workspaces·위 `env:`·아래 컴파일 명령은 그 잡과 글자 그대로
      # 같아야 키가 맞는다(rust-cache 키 = shared-key + rustc·`CARGO*` 환경 해시 + 이 workspaces 의 락 해시).
      # `security_pack` 과 키를 합치지 않은 이유(컴파일 설정이 다르다)는 그 파일 머리 주석에 있다.
      - name: cargo 캐시(레지스트리 + target)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            server-rust
            clients/desktop/src-tauri
          shared-key: oort-rust-test
          save-if: ${{ github.event_name != 'pull_request' }}

      # 시험은 nextest 로 돌린다(#5495, F4). `cargo test` 는 시험 실행 파일 329개를 한 줄로 차례로 돌지만 nextest 는 시험을 프로세스
      # 하나씩 vCPU 수(4)만큼 바이너리 경계 없이 동시에 돌린다. 컴파일은 `cargo test --no-run` 과 같은 산출물을 쓴다(로컬 실측:
      # `cargo test --no-run` 뒤 `cargo nextest run` 에 Compiling 0줄, 시험 수도 같다) — 그래서 `ci-cache-warm.yml` 의 `--no-run`
      # 캐시가 그대로 맞는다. 설치는 `cargo-deny` 와 같은 액션 핀·버전 고정이다(0.9.143 은 이 핀의 매니페스트에 있어 체크섬 검증됨).
      # CI 전용 도구라 앱 번들·NOTICE 에는 들어가지 않는다(Apache-2.0 OR MIT, 라이선스 게이트 대상 아님).
      # **nextest 는 doc 시험을 돌리지 않는다.** 이 워크스페이스에는 지금 doc 시험이 0개다(이전 로그의 `Doc-tests … running 0 tests`
      # 33개 크레이트; 문서 주석의 코드 펜스는 전부 ```text·```json 이라 rustdoc 이 시험으로 돌리지 않는다). 실행되는 펜스(info 가 없거나
      # rust 속성뿐)가 생기면 `cargo test --doc --workspace --locked --manifest-path server-rust/Cargo.toml` 단계를 아래에 더해야 하고,
      # scripts/tests/test_pr_ci_guardrails.sh 가 그런 펜스가 생기면 그 단계가 없는 한 빨강이 된다.
      - name: cargo-nextest 설치
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-nextest@0.9.143

      - name: cargo nextest run --workspace (server-rust)
        # --locked: Cargo.lock을 고쳐야 하는 매니페스트 변경이 락 커밋 없이
        # 들어오면 여기서 빨강. 락 갱신은 리뷰 대상이지 CI의 부작용이 아니다.
        # --no-fail-fast: 빨강이 여러 개여도 한 번에 보인다(다시 돌리는 왕복 한 번이 7~10분이다).
        # 앞뒤 `df -h /`는 러너 디스크 여유의 증거다(#5182).
        run: |
          df -h /
          cargo nextest run --workspace --locked --manifest-path server-rust/Cargo.toml --no-fail-fast
          df -h /

      - name: cargo-deny 설치
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-deny@0.20.2

      - name: 카고 의존 라이선스 게이트(deny.toml, 두 워크스페이스)
        # #1225가 만든 게이트를 그대로 호출한다. 여기서 CI가 정책을 다시 쓰면
        # 로컬 게이트와 CI가 서로 다른 정책으로 갈라진다.
        # `check licenses`만 돈다(advisories/bans는 #1225 스코프 밖).
        run: scripts/check_cargo_licenses.sh

  # ── ②-b 보안 팩 레인 (#4241 SEC-03) ──────────────────────────────────────
  # 위의 `rust` 잡은 DB 시험을 전부 `#[ignore]`라 돌리지 못한다(그래서 RLS·인증·승인·푸시·
  # 첨부·웹훅 시험이 PR 증거에 없었다). 이 잡은 실제 `pgvector/pgvector:pg18` 서비스
  # 컨테이너에 마이그레이션 + bootstrap_roles.sql 을 얹고, infra/security-pack/selection.txt 가
  # 고른 `_pg` 시험을 `--ignored --test-threads=1` 로 돌린다. 선택은 SEC-02(#4224) claims.yaml
  # 이 착륙하면 거기서 파생한다. 나머지 PG 시험은 야간 잡(security-nightly.yml) 몫이다.
  # 시크릿 없음: `pull_request` + `contents: read`, DB 비밀번호는 일회용 서비스 컨테이너 것.
  # 필수 컨텍스트 이름은 「Security pack」 — 브랜치 보호 등록은 owner 설정 변경이다.
  security_pack:
    name: Security pack
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # 행 방지 안전장치. 콜드 실측은 첫 런에서 PR 본문에 기록한다(목표 15분, 상한 25분).
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: momo
          POSTGRES_PASSWORD: momo
          POSTGRES_DB: momo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U momo -d momo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://momo:momo@localhost:5432/momo
      # 시험 빌드의 디버그 정보를 줄인다(#5495, F5 — `rust` 잡의 #5182 와 같은 값). 대상 42개를 따로 링크하는 빌드의 링크 시간과 캐시 크기
      # (캐시 하나가 0.68GB)를 줄인다. `line-tables-only` 는 패닉의 파일:줄을 남긴다. 이 값은 rust-cache 키의 환경 해시에도 들어가서,
      # `ci-cache-warm.yml` 의 `security_pack` 잡 `env:` 와 글자 그대로 같아야 한다.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 선택 목록 lint + lint 음성 대조(DB 없이)
        run: |
          scripts/security_pack.sh lint
          bash scripts/tests/test_security_pack.sh

      # 캐시는 읽기만 한다(#5494). 저장은 `ci-cache-warm.yml` 의 `security_pack` 잡이 하고, 그 잡은 이 잡의 `scripts/security_pack.sh run`
      # 과 같은 쌍을 `--no-run` 으로 컴파일한다. shared-key·workspaces·위 `env:` 는 그 잡과 글자 그대로 같아야 한다. `rust` 잡과는 이제
      # `CARGO_PROFILE_*_DEBUG` 가 같지만(#5495) 키는 합치지 않았다: workspaces 가 다르고(`rust` 는 `clients/desktop/src-tauri` 도), 컴파일 명령이
      # 다르다(`--workspace` 한 번 ↔ 선택 쌍마다 `-p … --test …`). 호출마다 의존 크레이트의 기능 합집합이 달라 같은 키로 합치면 먼저 저장한
      # 쪽 산출물만 남고 다른 잡이 다시 빌드한다(로컬 실측: 선택 쌍을 빌드해 둔 타깃 디렉터리에서 `-p momo-wire --no-run` 이 `crypto-common`·`rustls`·
      # `sha2` 등을 다시 컴파일했다).
      - name: cargo 캐시(레지스트리 + target)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: server-rust
          shared-key: oort-security-pack
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: DB 준비(마이그레이션 + bootstrap_roles.sql)
        run: |
          psql --version
          scripts/security_pack.sh setup

      - name: 보안 팩 시험(--ignored --test-threads=1)
        run: scripts/security_pack.sh run

      - name: 음성 대조 — FORCE 없는 테넌트 테이블이면 tenant_catalog_pg 가 빨강
        run: scripts/security_pack.sh negative

  # ── ③ Node 레인 — 트리별 3잡 (#4696) ─────────────────────────────────────
  # npm 라이선스 게이트 + 타입체크 3트리 + 단위 테스트 3트리를 트리마다 한 잡으로 나눴다
  # (core·web·mobile). 전에는 한 잡 안에서 직렬이었다(성공 18회 중앙값 524초: 시험 400초 —
  # web 217·mobile 150·core 34 — 와 타입체크 56초, 설치 25초, checkout 27초). 설치는
  # 트리마다 3~15초뿐이라 잡을 나눠도 늘어나는 비용은 잡마다의 root `npm ci` 3초다.
  # web·mobile 이 `@momo/core` 를 경로로 쓰고(core 의 서드파티 의존은 root node_modules 로
  # 올라온다) 그래서 세 잡 모두 root `npm ci` 를 먼저 한다. 대기는 가장 긴 줄인 web 으로
  # 줄어든다(예상 ≈ 300초). 시험은 각 트리가 이미 쓰는 스크립트를 그대로 호출한다
  # (core·web = vitest, mobile = jest) — CI가 러너를 다시 고르면 개발자가 로컬에서 돌리는
  # 것과 다른 명령이 된다. 셋 모두 `node` 레인 하나(`changes` 출력)로 선택되고, `gate` 가
  # 잡마다 선택/결과를 교차검증한다.
  #
  # npm 캐시는 읽기만 한다(#5494). 잡마다 `setup-node` 의 `cache: npm` 대신 `actions/cache/restore` 를 쓴다(`header_fit` 포함):
  # `setup-node` 는 저장을 끌 수 없어서 PR 마다 PR 전용 범위(다른 PR 이 못 읽는 곳)에 캐시를 쌓았다. 저장은 기준 브랜치 push 때
  # `ci-cache-warm.yml` 이 한다. 키는 `setup-node` 가 쓰던 입력 그대로(`cache-dependency-path` 의 잠금 파일 해시)에 트리 이름을
  # 붙인 것이고(`header_fit` 은 `node_web` 과 같은 잠금 파일이라 같은 키), 그 파일의 같은 이름 잡과 글자 그대로 같아야 한다.
  # `package-manager-cache: false` 는 package.json 에 `packageManager` 가 생겨도 `setup-node` 가 몰래 저장하지 않게 막는다.
  node_core:
    name: TS core — npm 라이선스 게이트 + 타입체크 + 단위 시험
    needs: changes
    if: needs.changes.outputs.node == 'true'
    # pull-requests: read — 직접 문구 장부 비교가 PR 라벨을 지금 값으로 읽는다(아래 단계).
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    # 행 방지용 상한(실측 약 1분 10초의 ~10배).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # clients/mobile/package.json engines = ">= 22.11.0"이 레포의 유일한
          # 선언 제약이고, 24는 개발 머신에서 실제로 npm ci가 도는 버전이다.
          node-version: '24'
          package-manager-cache: false

      - name: npm 캐시 복원(읽기 전용 — 저장은 ci-cache-warm.yml)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: oort-npm-${{ runner.os }}-${{ runner.arch }}-core-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            oort-npm-${{ runner.os }}-${{ runner.arch }}-core-

      - name: npm 의존 라이선스 게이트(워크스페이스 루트 + web + mobile)
        # 설치 전에 돈다 — 이 스크립트는 세 트리의 package-lock.json만 읽으므로 npm ci가
        # 필요 없다. 이 게이트는 세 트리 전부를 한 번 보는 검사라서 가장 짧은 core 잡에 둔다.
        run: node scripts/check_npm_licenses.mjs

      - name: npm ci (워크스페이스 루트 = packages/momo-core)
        run: npm ci

      - name: typecheck — @momo/core
        run: npm run typecheck --workspace @momo/core

      # 타입체크가 초록이어도 동작은 틀릴 수 있다. 단위 테스트는 타입이 못 보는
      # 계약(seq 순서·재연결 복원·카피·권한 표면)을 본다.
      - name: test — @momo/core (vitest)
        run: npm run test --workspace @momo/core

      # 직접 문구 장부(#5589)가 트리만으로 못 보는 두 가지를 병합 ref의 base와 비교해 막는다: 기준·봉인(anchor·
      # anchorHead·ANCHOR_SEAL) 손대기, 그리고 파일마다 (lowered ?? anchor)를 base보다 올리기(올리는 길은 raise뿐).
      # 새 raise는 파일별로 로그에 찍힌다. `land --check`는 여기 두지 않는다 — CI는 병합 ref에서 돌아서, 트랙이 움직여
      # 장부 JSON이 자동으로 합쳐지면 바이트 비교가 헛빨강을 낸다.
      #   · base = 병합 ref(HEAD)의 첫 부모 = 이 실행이 합친 트랙 끝. `github.event.pull_request.base.sha`는 GitHub가
      #     PR 머리와 트랙의 merge-base로 둬서, 트랙이 움직인 뒤에는 남의 raise를 이 PR의 새 raise로 찍고 승인된
      #     재기준 뒤에는 헛빨강을 낸다(#5589 r2 M1). 얕은 체크아웃은 부모를 숨기므로(`HEAD^1` 실패) 커밋 객체를 바로
      #     읽고, 부모가 둘이 아니면(병합 ref가 아니면) 멈춘다. 그 커밋 하나만 얕게 받는다.
      #   · 기준을 다시 잡는 PR은 direct-copy.mjs(정책 경로)의 ANCHOR_SEAL을 바꾸므로 정책 승인 라벨이 어차피 필요하다.
      #     같은 라벨을 이벤트 페이로드가 아니라 API로 지금 값을 읽어서, 라벨을 붙인 뒤에는 이 잡을 다시 돌리기만 하면
      #     된다. 조회가 실패하면 승인 없음으로 본다(기준이 그대로인 PR은 영향이 없다). 토큰은 셸의 라벨 조회에만 쓰고
      #     node(PR이 바꾼 의존이 실리는 프로세스)에는 넘기지 않는다.
      #   · 세 표면 `check`를 먼저 돌린다(git 없음): 표면별 시험 파일이 지워져도 CI가 웹·폰을 본다. `check`가 빨강이어도
      #     비교까지 돌고 끝에 실패한다 — 장부가 빨강의 이유일 때 새 raise 요약이 가장 필요하다.
      #   · 앞 단계(vitest)가 빨강이어도 돈다(같은 이유).
      # 이 단계는 `packages/momo-core/src/i18n/direct-copy-ci.test.ts`가 가짜 저장소의 얕은 병합 ref에서 그대로 돌린다.
      - name: 직접 문구 장부 — 병합 ref의 base와 비교(세 표면 check, 기준·봉인·lowered, 새 raise 요약)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          tool=packages/momo-core/src/i18n/tooling/direct-copy.mjs
          rc=0
          env -u GH_TOKEN node "$tool" check || rc=1
          parents="$(git cat-file -p HEAD | awk '/^parent /{print $2}')"
          if [ "$(printf '%s\n' "$parents" | grep -c .)" -ne 2 ]; then
            echo "직접 문구 장부: HEAD가 PR 병합 ref(부모 둘)가 아니에요 — 비교할 base를 정할 수 없어요" >&2
            exit 1
          fi
          base="$(printf '%s\n' "$parents" | head -n 1)"
          git fetch --no-tags --depth=1 origin "$base"
          approved=false
          if labels="$(gh api "repos/$REPO/pulls/$PR" --jq '.labels[].name')" \
            && printf '%s\n' "$labels" | grep -Fxq policy-change-approved; then
            approved=true
          fi
          env -u GH_TOKEN DIRECT_COPY_REANCHOR_APPROVED="$approved" node "$tool" compare-base "$base" || rc=1
          exit "$rc"

  node_web:
    name: TS web — 타입체크 + 단위 시험
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    # 행 방지용 상한(실측 약 5분의 3배).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: npm 캐시 복원(읽기 전용 — 저장은 ci-cache-warm.yml)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: oort-npm-${{ runner.os }}-${{ runner.arch }}-web-${{ hashFiles('package-lock.json', 'clients/web/package-lock.json') }}
          restore-keys: |
            oort-npm-${{ runner.os }}-${{ runner.arch }}-web-

      - name: npm ci (워크스페이스 루트 = packages/momo-core)
        run: npm ci

      - name: npm ci (clients/web)
        # playwright devDependency의 postinstall이 브라우저 3종을 내려받는데,
        # 이 레인은 e2e를 돌리지 않으므로 전부 버려지는 다운로드다
        # (server-rust/Dockerfile의 web 스테이지와 같은 이유·같은 변수).
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --prefix clients/web

      - name: typecheck — clients/web
        run: npm --prefix clients/web run typecheck

      - name: test — clients/web (vitest)
        # TZ 정본은 clients/web/vite.config.ts `test.env` (#1267).
        # 러너 env에 다시 박으면 UTC 호스트의 로컬 빨강을 가린다.
        run: npm --prefix clients/web run test

  node_mobile:
    name: TS mobile — 타입체크 + 단위 시험 + Maestro 문법
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    # 행 방지용 상한(실측 약 3분 30초의 ~4배).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: npm 캐시 복원(읽기 전용 — 저장은 ci-cache-warm.yml)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: oort-npm-${{ runner.os }}-${{ runner.arch }}-mobile-${{ hashFiles('package-lock.json', 'clients/mobile/package-lock.json') }}
          restore-keys: |
            oort-npm-${{ runner.os }}-${{ runner.arch }}-mobile-

      - name: npm ci (워크스페이스 루트 = packages/momo-core)
        run: npm ci

      - name: npm ci (clients/mobile)
        run: npm ci --prefix clients/mobile

      - name: typecheck — clients/mobile
        run: npm --prefix clients/mobile run typecheck

      - name: test — clients/mobile (jest)
        run: npm --prefix clients/mobile run test

      # ── Maestro 흐름 문법 검사 (#5081) ─────────────────────────────────────
      # 폰 흐름의 문법 오류 — 머리 `---` 누락(#4869), 숫자 칸의 자리표시자(#5081) — 는
      # 시뮬레이터가 그 단계에 닿을 때까지 드러나지 않아 검증 줄에서 몇 시간 뒤에야 잡혔다.
      # `maestro check-syntax` 는 기기·앱·서버 없이 Maestro 자신의 파서로 파일 하나를 읽는다.
      # 폴더 전체(`clients/mobile/maestro/**`, 하위 흐름 포함)를 이 잡에서 건다.
      #
      # 단계를 `node` 레인 안에 둔 이유: clients/mobile/ 변경이 이미 이 레인을 고르므로
      # 경로 선택이 공짜이고, 새 잡이 없어 `gate` 의 needs·선택/결과 교차검증이 그대로다.
      # 검사 본체는 `clients/mobile/scripts/check-maestro-syntax.sh` 한 곳이다(로컬:
      # `npm --prefix clients/mobile run check:maestro-syntax`). 그 스크립트는 시작할 때
      # 음성 대조(머리 없는 흐름·숫자 칸의 자리표시자는 반드시 거부)를 먼저 돌려서, 눈먼
      # 검사기가 초록을 내지 못하게 하고, 파일 0개도 통과로 세지 않는다. 이 단계는 Maestro
      # 만 고정해서 깐다(아래 gitleaks 처럼 릴리스 파일 + sha256 검증, 서드파티 액션 없음).
      # sha256 은 GitHub 가 릴리스 자산에 알려 주는 digest 와 내려받은 파일 계산값이 같은
      # 것을 확인한 값이다. 버전을 올릴 때는 두 값을 함께 바꾸고 그 스크립트를 다시 돌린다.
      # Java 는 러너 기본 `java` 를 쓴다 — Maestro 2.8.0 은 17 이상이면 되고(런처가 17 미만이면
      # 스스로 거부한다) 개발 머신의 JDK 27 에서도 통과했다.
      #
      # 비용(실측): 이 두 단계를 파일에서 그대로 뽑아 Linux · Temurin 17 · 4 vCPU 컨테이너에서
      # 돌렸을 때 설치 57초(배포본 314,743,119바이트 내려받기 + 풀기; 그 VM 의 NAT 를 거쳐 느린
      # 편) + 84개 검사 51초(병렬 4, 음성 대조 포함; JVM 옵션 없이는 77~84초) = 108초. 개발
      # 머신(M 시리즈, JDK 27)은 내려받기 13초 + 풀기 1.5초 + 검사 32~58초다. node_mobile(≈3.5분)이
      # 약 1.8분 길어져 node_web(≈5분)보다 몇십 초 더 걸릴 수 있다 — PR 대기가 그만큼 늘 수 있다.
      # 실제 GitHub 러너의 값은 이 PR 에서 처음 잴 수 있다. 행 방지 상한 15분은 그대로다.
      - name: Maestro CLI 설치(버전·sha256 고정)
        env:
          MAESTRO_VERSION: 2.8.0
          MAESTRO_SHA256: b3e561161904fb391875ca5834d5b22cf0b01c052dd1b408ad83e30d8f8951b3
        run: |
          set -euo pipefail
          for tool in curl unzip java sha256sum; do
            command -v "$tool" >/dev/null || {
              echo "$tool is not installed; cannot install pinned Maestro" >&2
              exit 1
            }
          done
          [ -n "${RUNNER_TEMP:-}" ] || {
            echo "RUNNER_TEMP is unset" >&2
            exit 1
          }
          [ -n "${GITHUB_PATH:-}" ] || {
            echo "GITHUB_PATH is unset; cannot export maestro" >&2
            exit 1
          }
          tmp="$RUNNER_TEMP/maestro-install"
          mkdir -p "$tmp"
          url="https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 "$url" -o "$tmp/maestro.zip"
          echo "${MAESTRO_SHA256}  $tmp/maestro.zip" | sha256sum -c -
          unzip -q "$tmp/maestro.zip" -d "$tmp"
          test -x "$tmp/maestro/bin/maestro" || {
            echo "maestro launcher missing or not executable after unzip" >&2
            exit 1
          }
          echo "$tmp/maestro/bin" >> "$GITHUB_PATH"
          export PATH="$tmp/maestro/bin:$PATH"
          java -version
          got="$(MAESTRO_CLI_NO_ANALYTICS=1 MAESTRO_DISABLE_UPDATE_CHECK=true maestro --version 2>/dev/null | tail -n 1)"
          test "$got" = "$MAESTRO_VERSION" || {
            echo "maestro version drift: got '$got' want '$MAESTRO_VERSION'" >&2
            exit 1
          }

      - name: check-syntax — clients/mobile/maestro (전 흐름 + 음성 대조)
        run: bash clients/mobile/scripts/check-maestro-syntax.sh

  # ── ③-b 채널 머리 맞춤 레인 (#5185, #4230 후속) ─────────────────────────
  # `gate:channel-header-fit`: 채널 머리의 컨트롤·툴팁이 지원하는 모든 폭(320~1440)·글자 크기·밀도에서 뷰포트 안에
  # 남고 서로 겹치지 않는지 크로미엄으로 잰다(실측 장면 5356개 + 툴팁 1000개). 판(`app-pane`)과 셸이 `overflow: clip`
  # 이라 밀려난 단추는 스크롤로도 드러나지 않아서, 타입체크·단위 시험·`gate:channel-header`(390 문서 폭)로는 잡히지
  # 않는다. 이 게이트는 지금까지 로컬 레인뿐이었다.
  #
  # `node_web`의 단계로 넣지 않고 별도 잡으로 뗀 이유: ① `node_web`은 브라우저를 받지 않는다
  # (`PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD`). 거기에 크로미엄과 몇 분짜리 게이트를 얹으면 모든 웹 PR의 대기가 늘어난다.
  # ② 머리를 건드린 PR에서만 돌아야 한다: `changes`의 `header_fit` 출력(경로 목록과 근거는 그 잡의 주석). 이 잡은
  # `node_web`과 나란히 돌아서, `node_web`보다 길어지지 않는 한 PR 대기를 늘리지 않는다.
  #
  # 이 잡은 `gate`의 `needs`에 없다: 필수 상태로 쓸지는 정책 결정이고, `gate`에 더하려면 고정된 환경 변수 집합으로
  # 게이트 단계를 실행해 보는 `scripts/tests/test_pr_ci_guardrails.sh`도 함께 고쳐야 한다. 그 전에는 이 잡이 빨개도
  # `PR CI gate`를 막지 않는다. 상태 이름은 아래 `name:`이 정본이다 — 필수 상태로 등록한 뒤에는 바꾸지 않는다.
  header_fit:
    name: TS web — 채널 머리 맞춤 게이트 (크로미엄)
    needs: changes
    if: needs.changes.outputs.header_fit == 'true'
    runs-on: ubuntu-latest
    # 행 방지용 상한. 로컬 실측(맥, `npm --prefix clients/web run gate:channel-header-fit`, 빌드 포함) 세 번: 2분 34초
    # (부하 평균 25 안팎), 3분 8초(부하 평균이 50~280으로 튄 때), 7분 26초(부하 평균 43~67에 다른 시험을 병행). 평균 4분
    # 23초, ×3 ≈ 13분. 러너의 설치(`npm ci` 둘)와 크로미엄·OS 의존 내려받기 몫(1~2분)을 더하고, 첫 러너 실행의 불확실성
    # (리눅스 글꼴, 코어 수)을 남겨 15분으로 둔다.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      # `node_web` 과 같은 잠금 파일이라 같은 키를 읽는다 — `ci-cache-warm.yml` 의 `node_web` 잡이 저장한 캐시다. 읽기 전용(#5494).
      - name: npm 캐시 복원(읽기 전용 — 저장은 ci-cache-warm.yml)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: oort-npm-${{ runner.os }}-${{ runner.arch }}-web-${{ hashFiles('package-lock.json', 'clients/web/package-lock.json') }}
          restore-keys: |
            oort-npm-${{ runner.os }}-${{ runner.arch }}-web-

      - name: npm ci (워크스페이스 루트 = packages/momo-core)
        run: npm ci

      - name: npm ci (clients/web)
        # `node_web`과 같은 이유로 설치 중에는 브라우저를 받지 않는다. 필요한 크로미엄 하나는 아래 단계가 받는다.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --prefix clients/web

      - name: 크로미엄만 내려받기 (OS 의존 포함)
        # 게이트의 기본 엔진이 크로미엄이다(`HEADER_FIT_ENGINES`로 웨빗을 켜는 것은 로컬 몫). `working-directory`가
        # 있어야 `npx`가 `clients/web`에 설치된 playwright를 쓴다 — 루트에는 playwright가 없어서 레지스트리에서 다른
        # 판을 받아 오면 게이트가 찾는 브라우저 판과 어긋난다.
        working-directory: clients/web
        run: npx playwright install --with-deps chromium

      - name: gate:channel-header-fit
        # 빌드는 이 스크립트가 `huddle-gate` 모드로 직접 한다(허들 접속을 가짜로 대신하는 컴파일 시점 분기라서, 일반
        # 빌드를 먼저 돌리거나 `npm run build`로 갈음할 수 없다).
        run: npm --prefix clients/web run gate:channel-header-fit

  # Branch protection requires this one stable context. Optional path lanes may
  # be skipped, but a failure/cancellation in any selected lane keeps it red.
  # alignment, gitleaks and advisories always run; a skip there is red.
  # The context name `PR CI gate` is the contract (branch protection lists exactly
  # this and `Policy integrity gate`); job keys behind it may be split or renamed
  # as long as every one of them is in `needs` and cross-checked below (#4696).
  gate:
    name: PR CI gate
    needs:
      - changes
      - alignment
      - gitleaks
      - advisories
      - policy
      - rust
      - security_pack
      - node_core
      - node_web
      - node_mobile
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      ALIGNMENT_RESULT: ${{ needs.alignment.result }}
      GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
      ADVISORIES_RESULT: ${{ needs.advisories.result }}
      POLICY_RESULT: ${{ needs.policy.result }}
      RUST_RESULT: ${{ needs.rust.result }}
      SECURITY_PACK_RESULT: ${{ needs.security_pack.result }}
      NODE_CORE_RESULT: ${{ needs.node_core.result }}
      NODE_WEB_RESULT: ${{ needs.node_web.result }}
      NODE_MOBILE_RESULT: ${{ needs.node_mobile.result }}
      POLICY_SELECTED: ${{ needs.changes.outputs.policy }}
      RUST_SELECTED: ${{ needs.changes.outputs.rust }}
      NODE_SELECTED: ${{ needs.changes.outputs.node }}
    steps:
      - name: required and selected lanes are green
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          test "$ALIGNMENT_RESULT" = success
          test "$GITLEAKS_RESULT" = success
          test "$ADVISORIES_RESULT" = success
          require_optional_lane() {
            selected="$1"
            result="$2"
            label="$3"
            case "$selected:$result" in
              true:success|false:skipped) ;;
              *) echo "$label lane selection/result mismatch: selected=$selected result=$result" >&2; exit 1 ;;
            esac
          }
          require_optional_lane "$POLICY_SELECTED" "$POLICY_RESULT" policy
          require_optional_lane "$RUST_SELECTED" "$RUST_RESULT" rust
          require_optional_lane "$RUST_SELECTED" "$SECURITY_PACK_RESULT" security_pack
          require_optional_lane "$NODE_SELECTED" "$NODE_CORE_RESULT" node_core
          require_optional_lane "$NODE_SELECTED" "$NODE_WEB_RESULT" node_web
          require_optional_lane "$NODE_SELECTED" "$NODE_MOBILE_RESULT" node_mobile
