# oort — PR CI (#1241 신설 · #1243 적립 집행). PR마다 자동으로 도는 유일한 워크플로다.
#
# 왜 신설했나: 감사 D(research/2026-08-10-buzz-audit-D.md §6)의 실측 —
#   · 워크플로 5개가 전부 `workflow_dispatch`(2026-06-26 과금 중단 조치)
#   · 마지막 실제 빌드 2026-06-25, 그보다 뒤에 들어온 `server-rust`는
#     **CI에서 한 번도 컴파일된 적이 없다**(오늘 프로덕션에서 도는 코드다)
#   · `pull_request` 트리거를 가진 워크플로 0개 → 외부 기여 PR을 기계적으로
#     판정할 수단이 0
# 감사 A(§A5)는 같은 구멍의 라이선스 쪽을 잰다: `deny.toml`·
# `scripts/check_npm_licenses.mjs` 게이트가 `scripts/local_gate.sh`에서만 돌고
# CI에는 없어서, 외부 PR은 라이선스 검사를 한 번도 받지 않는다.
#
# ── 2026-08-10 공개 전환: 분 상한 논리 폐기, 스위트 확장 ───────────────────
# 이 파일의 원래 설계는 **private + GitHub Free = 월 2,000분**이라는 제약 위에
# 서 있었다(#1243 §4: PR 495건/월 × 2.9분 ≈ 1,440~1,870분, 여유 7~28%). 그래서
# `cargo check`이지 `cargo test`가 아니었고, 타입체크는 있어도 단위 테스트는
# 없었다 — 둘 다 "분이 없어서" 내린 결정이지 "검증이 불필요해서"가 아니다.
# 레포가 public이 되면서 Actions는 **무료·무제한**이 됐고, 그 제약이 사라졌다.
# 따라서:
#   · **분 상한 논리는 제거한다.** ubuntu 전용도, 잡 수 최소화도, 런당 32분
#     상한도 더는 근거가 없다. `timeout-minutes`는 남기되 의미가 바뀐다 —
#     소모 상한이 아니라 **행(hang) 방지 안전장치**다(그래서 넉넉하다).
#   · **path filter와 `cancel-in-progress`는 유지한다.** 이 둘은 과금 장치가
#     아니라 피드백 지연 장치다. 문서 PR을 8분 기다리게 하지 않는 것과, 3초 뒤
#     푸시한 커밋이 앞선 런을 죽이는 것은 무료여도 여전히 옳다.
#   · **스위트를 확장한다**(#1243 적립 3): `cargo check` → `cargo test
#     --workspace`, 타입체크 3트리 → 타입체크 + 단위 테스트 3트리.
#
# Rust는 확장을 기존 잡에 **흡수**시켰지 잡을 늘리지 않았다. `cargo test`는
# lib·bin·test 타깃을 전부 컴파일하므로 `cargo check --workspace`를 그대로
# 포함한다 — 둘을 함께 두면 같은 크레이트를 두 번 컴파일한다.
#
# ── 2026-10-28 구조 변경(#4696, 검수·시험 v2 T1) ───────────────────────────
# 위 문단이 Node에 대해 한 말(「한 잡 안에서 `npm ci` 한 번」)은 폐기한다. 이유는
# 실측이다(성공 18회 중앙값): TS 잡 524초 중 시험 3개가 직렬로 400초(web 217·
# mobile 150·core 34)였고, 설치는 트리마다 3~15초뿐이었다. 그래서 Node 레인을
# 트리별 3잡(`node_core`·`node_web`·`node_mobile`)으로 나눴다. 중복되는 비용은
# 잡마다의 root `npm ci` 3초뿐이고, 대기는 가장 긴 줄(web)로 줄어든다. 시험
# 수·명령·타입체크는 그대로다 — 줄인 검사는 0이다.
# 같은 실측에서 「정책 회귀 fixtures」 114초가 `if:` 없이 모든 PR에서 돌았다.
# 그 시험들의 입력은 게이트 스크립트·워크플로·정책 문서이고(`test_pr_ci_guardrails.sh`는
# 거기에 더해 러스트 트리 밖에서 읽는 파일을 찾느라 러스트 소스 전체를 훑는다), 그래서
# 별도 `policy` 잡으로 떼어 `changes`의 정책 레인에서만 돌린다. 레인 정의와 근거는
# 아래 `changes` 잡에 있다.
# `PR CI gate`는 새 잡을 모두 `needs`에 더하고 선택/결과를 교차검증한다.
#
# 스코프: 여전히 **전체 게이트가 아니다.** DB가 필요한 러스트 conformance
# 테스트(`*_pg.rs`, 전부 `#[ignore]`)·런타임 검증기·Docker 스택·e2e·웹 e2e
# 게이트는 `docs/LOCAL_PR_GATE.md`의 로컬 게이트 몫으로 남는다.
# 남은 휴면 워크플로(release-desktop)는 무접촉이다.
# (W-S1 #1215: `ci-build`·`release-ios`·`release-macos` 셋은 Swift 클라 3트리와
#  함께 삭제됐다 — 전부 `workflow_dispatch` 전용이었고 자동 실행 0이었다.)
name: pr-ci

on:
  pull_request:
    branches:
      # 트랙 파이프라인(docs/TRACKS.md): 워커 PR은 자기 track으로, 통합만
      # main으로 간다. 셋 모두 걸어야 실제 머지 경로를 덮는다.
      - main
      - track/engine
      - track/uxui
  # PR 없이 레인을 한 번 돌려보고 싶을 때. 이때는 변경 파일 목록이 없으므로
  # 두 레인을 모두 돈다.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── ① 어떤 레인을 돌릴지 판정 ────────────────────────────────────────────
  # checkout 없이 GitHub API로 변경 파일만 읽는다(체크아웃 100MB·수십 초를
  # 문서 전용 PR에 물리지 않기 위해서다). third-party path-filter 액션을 쓰지
  # 않는 이유도 같다 — 이 판정에 공급망을 하나 더 늘릴 이유가 없다.
  changes:
    name: 변경 경로로 레인 선택
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      node: ${{ steps.filter.outputs.node }}
      policy: ${{ steps.filter.outputs.policy }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          run_all() {
            echo "→ rust=true node=true policy=true ($1)"
            {
              echo "rust=true"
              echo "node=true"
              echo "policy=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          # workflow_dispatch: PR 번호가 없다.
          [ -n "$PR" ] || run_all "no pull request context"

          # 조회 실패는 "변경 없음"이 아니라 "모르겠음"이다. 모르면 전부 돈다
          # (fail-open의 방향이 CI를 *거르는* 쪽이 되면 게이트가 무의미해진다).
          metadata="$RUNNER_TEMP/pr-$PR-metadata.json"
          pages="$RUNNER_TEMP/pr-$PR-files-pages.json"
          if ! gh api "repos/$REPO/pulls/$PR" > "$metadata"; then
            run_all "could not read pull request metadata"
          fi
          if ! jq -e '
            type == "object"
            and (.changed_files | type == "number" and . >= 1 and floor == .)
          ' "$metadata" >/dev/null; then
            run_all "malformed pull request metadata"
          fi
          expected_count="$(jq -r '.changed_files' "$metadata")"

          # REST lists at most 3,000 PR files. At exactly that boundary we cannot
          # prove completeness, even if the metadata count also says 3,000.
          [ "$expected_count" -lt 3000 ] || run_all "3,000-file API cap is ambiguous"

          if ! gh api --paginate --slurp \
            "repos/$REPO/pulls/$PR/files?per_page=100" > "$pages"; then
            run_all "could not list changed files"
          fi
          if ! jq -e '
            type == "array"
            and length > 0
            and all(.[]; type == "array")
            and all(.[][];
              type == "object"
              and (.filename | type == "string" and length > 0)
              and (
                (has("previous_filename") | not)
                or .previous_filename == null
                or (.previous_filename | type == "string" and length > 0)
              )
            )
          ' "$pages" >/dev/null; then
            run_all "malformed changed-files response"
          fi

          row_count="$(jq -r '[.[][]] | length' "$pages")"
          unique_count="$(jq -r '[.[][] | .filename] | unique | length' "$pages")"
          if [ "$row_count" -ne "$expected_count" ] \
            || [ "$unique_count" -ne "$expected_count" ]; then
            run_all "incomplete or duplicate changed-files response: expected=$expected_count rows=$row_count unique=$unique_count"
          fi
          [ "$row_count" -lt 3000 ] || run_all "3,000-file retrieval cap is ambiguous"

          # A rename can move code out of a guarded tree. Classify both the new
          # path and previous_filename, then deduplicate the union.
          files="$(jq -r '
            [.[][] | (.filename, (.previous_filename // empty))]
            | unique[]
          ' "$pages")"
          [ -n "$files" ] || run_all "empty changed path set"

          echo "changed paths (including rename sources):"
          printf '%s\n' "$files"

          # 레인별 관심 경로. 목록에 없는 경로(docs/·STATUS.md·infra/·scripts/·
          # 은퇴한 Swift 트리 f399e417:server/ · f399e417:relay/ ·
          # f399e417:workers/ · f399e417:services/)만 바뀐 PR은
          # rust/node 레인이 skip된다. skip된 잡은 GitHub에서 성공으로 집계되므로,
          # required check으로 승격해도 문서 PR이 막히지 않는다.
          # gitleaks는 여기 없다: 시크릿은 전 경로라 그 잡은 상시 실행한다.
          #
          # 테스트를 돌리기 시작하면서 레인이 **자기 트리 밖의 입력**도 읽게
          # 됐다. 그 둘은 실측으로 찾아 목록에 넣었다(넣지 않으면 그 파일만
          # 바꾼 PR이 초록으로 통과한 뒤 base에서 빨강이 된다):
          #   · `server/Fixtures/plugin-manifests/*.json` — `clients/web`의
          #     `features/plugins/model.test.ts`·`lib/pluginApi.test.ts`가
          #     레포 상대경로로 import한다.
          #   · `docs/api/openapi.yaml`·`docs/api/*.golden.json`·
          #     `docs/api/*.vector(s).json` — Rust 시험이 읽는다
          #     (`include_str!`, `read_to_string`). 예: `routes::actions`의
          #     `the_suggestable_ids_are_one_list_in_four_places`는 openapi의
          #     `SuggestableCommandId`를 Rust 등록표와 맞춘다. 이 경로를 빼면
          #     openapi만 바꾼 PR은 cargo 레인이 skip되어 base에서 빨강이
          #     된다(#4042, PR #4032·#4039 전례). 새 파일을 Rust 시험이 읽게
          #     되면 이 패턴이 덮는지 확인한다.
          #   · 그 밖에 Rust 소스가 `include_str!`/`read_to_string`/
          #     `CARGO_MANIFEST_DIR`로 읽는 server-rust·src-tauri 밖 파일
          #     (`server/Migrations/`·`server/Fixtures/plugin-manifests/`·`plugin-wire/`·
          #     `infra/rust/sql/`·`infra/**/centrifugo*.json`·`docs/SELF_HOST_AGENT.md`·
          #     `scripts/desktop/build_workd_sidecar.sh`·core `http.ts`·`aiHubModel.ts`·
          #     `timeline/`·`__fixtures__`·web `session.ts`/`settingsNav.ts`/`tokens.css`/work `__fixtures__`·
          #     mobile `__tests__/fixtures/`)도 같다(#4055).
          #     Hermes 출처 벡터 `infra/hermes/self_media_vectors.json`(#4820 C2a)과
          #     core 실패 카드 골든 `approvals/expression-failure-copy.json`(#4820 C2b, #4905)도 같다.
          #     `scripts/tests/test_pr_ci_guardrails.sh`가
          #     `pr_ci_rust_external_inputs.py`로 그 경로를 소스에서 뽑아 이
          #     필터가 덮는지 확인한다. 새 참조가 생기면 그 시험이 빨개진다.
          # 레인 매칭은 파이프가 아니라 **파일**을 읽는다(#4728). `printf … | grep -q`는
          # grep 이 첫 일치에서 먼저 끝나면 printf 가 SIGPIPE(141)를 받고, pipefail 이 그
          # 줄을 "불일치"로 읽어 레인이 통째로 false 가 된다(파일 수백 개부터 재현). 그러면
          # rust·보안 팩·node·policy 가 모두 skip 인데 gate 는 초록이라 필수 검사가 조용히
          # 빠진다. 새 레인 줄도 `lane_hit`을 쓴다 — 파이프로 되돌리지 않는다.
          # grep 종료 코드는 0 일치 · 1 불일치뿐이다. 그 밖(정규식·I/O 오류)은 "불일치"가
          # 아니라 분류 실패라서 step 을 실패시킨다(changes 잡 실패 → gate 빨강).
          list="$RUNNER_TEMP/pr-$PR-changed-paths.txt"
          printf '%s\n' "$files" > "$list" || run_all "could not write changed path list"
          lane_hit() {
            local rc=0
            grep -Eq "$1" "$list" || rc=$?
            [ "$rc" -le 1 ] || { echo "::error::lane classifier failed: grep exit $rc"; exit 1; }
            return "$rc"
          }

          rust=false
          node=false
          lane_hit \
            '^(server-rust/|clients/desktop/src-tauri/|deny\.toml$|scripts/check_cargo_licenses\.sh$|scripts/generate_ghcr_notice_bundle\.py$|scripts/check_ghcr_notice_bundle\.sh$|scripts/check_debian_copyrights\.sh$|scripts/sample_expression_contract\.py$|scripts/openapi_sampled_on_rust\.txt$|scripts/tests/test_ghcr_notice_bundle\.sh$|legal/generated/|legal/THIRD_PARTY_NOTICES\.md$|NOTICE$|docs/api/openapi\.yaml$|docs/api/[^/]+\.golden\.json$|docs/api/[^/]+\.vectors?\.json$|server/Migrations/|server/Fixtures/plugin-manifests/|server/Fixtures/plugin-wire/|infra/rust/sql/|infra/hermes/self_media_vectors\.json$|infra/security-pack/|scripts/security_pack\.sh$|scripts/tests/test_security_pack\.sh$|infra/([^/]+/)*centrifugo[^/]*\.json$|docs/SELF_HOST_AGENT\.md$|scripts/desktop/build_workd_sidecar\.sh$|packages/momo-core/src/lib/http\.ts$|packages/momo-core/src/features/ai/aiHubModel\.ts$|packages/momo-core/src/features/approvals/settlement-copy\.json$|packages/momo-core/src/features/approvals/expression-failure-copy\.json$|packages/momo-core/src/features/emoji/emojiCatalog\.json$|packages/momo-core/src/features/expressions/fixtureServer\.ts$|packages/momo-core/src/features/timeline/|packages/momo-core/src/features/auth/__fixtures__/|packages/momo-core/src/features/workbench/__fixtures__/|clients/web/src/lib/session\.ts$|clients/web/src/features/settings/settingsNav\.ts$|clients/web/src/design/tokens\.css$|clients/web/src/features/work/__fixtures__/|clients/mobile/__tests__/fixtures/|\.github/workflows/pr-ci\.yml$)' \
            && rust=true
          lane_hit \
            '^(clients/web/|clients/mobile/|packages/|server/Fixtures/|package\.json$|package-lock\.json$|scripts/check_npm_licenses\.mjs$|\.github/workflows/pr-ci\.yml$)' \
            && node=true

          # 정책 레인(#4696) — `policy` 잡의 시험 6개가 읽는 입력의 합집합이다.
          #   · `scripts/`·`.github/`: 시험 대상인 게이트 스크립트·워크플로(트랙 정렬·
          #     정책 무결성·보호 가드·GHCR 고지 묶음·pr-ci 자신).
          #   · `policy_path()`(scripts/verify_policy_integrity.sh)가 정책 파일이라 부르는
          #     문서·설정(AGENTS.md·CONTRIBUTING.md·deny.toml·osv-scanner.toml·
          #     docs/security/claims.yaml·docs/GITHUB_OPS.md·docs/LOCAL_PR_GATE.md·
          #     docs/TRACKS.md·docs/adr/0153-…). 정책 PR이면 정책 회귀가 돈다.
          #   · `REVIEW.md`: 위험 등급 경로표를 `policy_path()`에 묶는 시험의 입력이다.
          #   · **rust 레인 전체.** `test_pr_ci_guardrails.sh`는 server-rust·src-tauri 의
          #     `.rs` 를 훑어 레포 안 다른 경로를 읽는 참조를 뽑고 위 rust 필터가 덮는지
          #     확인한다(#4055). 러스트 소스만 바꾼 PR이 새 참조를 만들면 그 시험이
          #     빨개져야 하므로, 이 시험은 스크립트·워크플로를 안 건드린 러스트 PR에도 돈다.
          #     `test_ghcr_notice_bundle.sh`가 복사해 쓰는 legal/generated/spdx-texts 도
          #     rust 필터가 덮는다.
          # 그래서 policy=true ⊇ rust=true 다. 그 밖의 경로만 바뀐 PR(웹·폰·코어·문서)은
          # 정책 회귀를 건너뛴다 — gate 가 선택/결과를 교차검증해 조용한 skip 은 빨강이다.
          policy="$rust"
          lane_hit \
            '^(scripts/|\.github/|REVIEW\.md$|AGENTS\.md$|CONTRIBUTING\.md$|deny\.toml$|osv-scanner\.toml$|docs/security/claims\.yaml$|docs/GITHUB_OPS\.md$|docs/LOCAL_PR_GATE\.md$|docs/TRACKS\.md$|docs/adr/0153-ci-stack-selfhosted-runners\.md$)' \
            && policy=true

          echo "→ rust=$rust node=$node policy=$policy"
          {
            echo "rust=$rust"
            echo "node=$node"
            echo "policy=$policy"
          } >> "$GITHUB_OUTPUT"

  # Every PR gets a topology check, including documentation-only changes. For
  # track targets, GitHub's synthetic merge commit must contain current main;
  # workflow_dispatch checks the remote canonical graph instead.
  alignment:
    name: canonical track alignment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: canonical refs 새로고침
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/track/engine:refs/remotes/origin/track/engine \
            +refs/heads/track/uxui:refs/remotes/origin/track/uxui

      - name: PR candidate 또는 remote topology 검사
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            trusted_checker="$RUNNER_TEMP/check_track_alignment.sh"
            base_oid="$(git rev-parse "origin/$BASE_REF")"
            if git show "origin/main:scripts/check_track_alignment.sh" > "$trusted_checker" 2>/dev/null; then
              : # Normal path: execute the canonical policy from main, not PR code.
            else
              # One-time #1297/#1302 bootstrap. The checker does not exist on
              # main during this initial integration chain; only these reviewed
              # immutable bases may use the candidate copy. Once main lands the
              # chain, this path is dead.
              case "$base_oid" in
                915d00bff14fda55b909fcdda72067e3d480dbda|27718c0e68715ae44fc65cdb632e70b8a347ea7c|38587b53c088049e42f9fba1f8d0118985523faf)
                  cp scripts/check_track_alignment.sh "$trusted_checker"
                  ;;
                *)
                  echo "trusted base alignment checker is unavailable" >&2
                  exit 1
                  ;;
              esac
            fi
            chmod +x "$trusted_checker"
            "$trusted_checker" --candidate "$BASE_REF" "$CANDIDATE_SHA"
          else
            trusted_checker="$RUNNER_TEMP/check_track_alignment.sh"
            git show origin/main:scripts/check_track_alignment.sh > "$trusted_checker"
            chmod +x "$trusted_checker"
            "$trusted_checker" --remote
          fi

      # 상시 검사(#4696에서 정책 회귀 fixtures 6개를 `policy` 잡으로 떼어도 이것은
      # 여기에 남긴다). 이 검사는 게이트 스크립트의 회귀 시험이 아니라 **레포 상태**
      # 검사다: server-rust/Cargo.lock·clients/web/package-lock.json 해시가 커밋된 고지
      # 묶음과 맞는지, server-rust/Dockerfile 의존 캐시 COPY 목록이 Cargo 워크스페이스와
      # 맞는지(크레이트를 더하고 COPY 줄을 잊으면 이미지 빌드만 깨진다, #3876)를 본다.
      # 락파일·크레이트만 바꾼 PR이 입력이라 경로 조건을 못 건다. 실측 0초.
      - name: GHCR 고지 묶음 신선도 + Dockerfile COPY 목록(상시)
        run: scripts/check_ghcr_notice_bundle.sh --stale-only

  # ── ①-b 정책 회귀 레인 (#4696, 검수·시험 v2 T1) ──────────────────────────
  # 게이트 스크립트·워크플로 자체의 회귀 시험 6개. 전에는 `alignment` 잡의 한 step 으로
  # **모든 PR에서** 114초(실측 중앙값, 18/18)를 썼고, 로컬 실측(부하 낮은 때 아님)으로
  # 그중 `test_github_track_guardrails.sh` 가 대부분이다. 입력이 바뀐 PR에서만 돌린다:
  # `changes` 의 `policy` 출력(정의·근거는 그 잡의 주석). 웹·폰·코어·문서 PR은 건너뛴다.
  # 별도 잡으로 둔 이유: `gate` 가 「선택됐는데 skip」을 빨강으로 잡으려면 잡 단위
  # 결과가 필요하다(step 의 `if:` 는 오타가 나도 조용히 skip 된다).
  policy:
    name: 정책 회귀 fixtures
    needs: changes
    if: needs.changes.outputs.policy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: alignment/required-gate policy regression fixtures
        run: |
          scripts/tests/test_track_alignment_guard.sh
          scripts/tests/test_pr_ci_guardrails.sh
          scripts/tests/test_github_track_guardrails.sh
          scripts/tests/test_policy_integrity_gate.sh
          scripts/tests/test_trusted_policy_runner.sh
          scripts/tests/test_ghcr_notice_bundle.sh

  # Role split with scripts/check_secrets.sh (#1236 local vs #1629 CI):
  # this job scans the PR commit range (base.sha..head.sha). Full-history
  # scanning stays in the local gate. Both reuse .gitleaksignore. Fail-closed.
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned CLI download. A third-party scanner Action would need an org
      # license secret, which would break fork PRs (packet: secrets 불요).
      - name: install pinned gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          [ "$arch" = "x86_64" ] || {
            echo "gitleaks pin is linux_x64; unsupported runner arch $arch" >&2
            exit 1
          }
          command -v curl >/dev/null || {
            echo "curl is not installed; cannot fetch pinned gitleaks" >&2
            exit 1
          }
          [ -n "${RUNNER_TEMP:-}" ] || {
            echo "RUNNER_TEMP is unset" >&2
            exit 1
          }
          tmp="$RUNNER_TEMP/gitleaks-install"
          mkdir -p "$tmp"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -fsSL "$url" -o "$tmp/$tarball"
          echo "${GITLEAKS_SHA256}  $tmp/$tarball" | sha256sum -c -
          tar -xzf "$tmp/$tarball" -C "$tmp" gitleaks
          test -x "$tmp/gitleaks" || {
            echo "gitleaks binary missing after extract" >&2
            exit 1
          }
          install_dir="$HOME/.local/bin"
          mkdir -p "$install_dir"
          install -m 0755 "$tmp/gitleaks" "$install_dir/gitleaks"
          [ -n "${GITHUB_PATH:-}" ] || {
            echo "GITHUB_PATH is unset; cannot export gitleaks" >&2
            exit 1
          }
          echo "$install_dir" >> "$GITHUB_PATH"
          export PATH="$install_dir:$PATH"
          command -v gitleaks >/dev/null || {
            echo "gitleaks is not installed" >&2
            exit 1
          }
          got="$(gitleaks version)"
          got="${got#v}"
          test "$got" = "$GITLEAKS_VERSION" || {
            echo "gitleaks version drift: got $got want $GITLEAKS_VERSION" >&2
            exit 1
          }

      - name: scan PR commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          command -v gitleaks >/dev/null || {
            echo "gitleaks is not installed" >&2
            exit 1
          }
          test -f .gitleaksignore || {
            echo "missing triage baseline: .gitleaksignore" >&2
            exit 1
          }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ] || {
              echo "missing pull_request base/head SHA" >&2
              exit 1
            }
            git cat-file -e "${BASE_SHA}^{commit}" || {
              echo "base SHA $BASE_SHA is not in this checkout" >&2
              exit 1
            }
            git cat-file -e "${HEAD_SHA}^{commit}" || {
              echo "head SHA $HEAD_SHA is not in this checkout" >&2
              exit 1
            }
            log_opts="${BASE_SHA}..${HEAD_SHA}"
          else
            log_opts="-1"
          fi
          echo "[gitleaks] version=$(gitleaks version) log-opts=$log_opts baseline=.gitleaksignore"
          gitleaks detect \
            --source . \
            --gitleaks-ignore-path .gitleaksignore \
            --log-opts "$log_opts" \
            --redact=90

  # ── 의존성 어드바이저리 게이트 (#4243, SEC-05) ───────────────────────────
  # 새 RUSTSEC·GHSA는 lockfile을 건드리지 않은 PR에도 생긴다. 그래서 gitleaks처럼
  # 경로 필터 없이 항상 돌고(`changes`에 의존하지 않는다), 게이트가 이 결과를 필수로
  # 요구한다. 대가는 명시한다: 고칠 수 없는 새 권고는 정책 PR(deny.toml·
  # osv-scanner.toml에 이유+만료일 예외)이 들어올 때까지 모든 PR을 막는다.
  # 판정은 scripts/check_advisories.py 한 곳이다(예외 장부 만료 검사, cargo deny
  # advisories, npm audit --omit=dev --audit-level=high, OSV-Scanner 5개 lockfile).
  # 스캐너 도구는 버전을 못 박는다: cargo-deny는 아래 rust 레인과 같은 핀, OSV-Scanner는
  # gitleaks처럼 릴리스 바이너리 + sha256 검증이다(서드파티 액션 없음).
  # 음성 대조(test_advisory_gate.sh --online)가 실전 스캔 바로 뒤에 같은 러너에서 돈다:
  # 알려진 취약 버전 픽스처가 빨강이 아니면(DB가 비었거나 경로가 틀린 눈먼 스캐너)
  # 이 레인이 빨강이다.
  advisories:
    name: dependency advisory gate
    runs-on: ubuntu-latest
    # 행 방지용 상한: cargo metadata가 두 워크스페이스 크레이트를 내려받는 콜드 실행이 가장 길다.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: cargo-deny 설치
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-deny@0.20.2

      - name: install pinned osv-scanner
        env:
          OSV_VERSION: 2.7.0
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          [ "$arch" = "x86_64" ] || {
            echo "osv-scanner pin is linux_amd64; unsupported runner arch $arch" >&2
            exit 1
          }
          [ -n "${RUNNER_TEMP:-}" ] || {
            echo "RUNNER_TEMP is unset" >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/osv-bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/osv-bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-bin/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-bin/osv-scanner"
          echo "$RUNNER_TEMP/osv-bin" >> "$GITHUB_PATH"

      - name: advisory gate (ledger + cargo deny + npm audit + OSV-Scanner)
        run: python3 scripts/check_advisories.py

      - name: negative controls (known-vulnerable fixtures must be red)
        run: bash scripts/tests/test_advisory_gate.sh --online

  # ── ② Rust 레인 ─────────────────────────────────────────────────────────
  # `cargo test --workspace` + 카고 라이선스 게이트.
  #
  # 공개 전환 전에는 `cargo check`이었다. `cargo test`는 그것을 포함하면서
  # 회귀까지 잡으므로 대체이지 추가가 아니다 — 두 명령을 함께 두면 같은
  # 크레이트를 두 번 컴파일한다.
  #
  # DB가 필요한 conformance 테스트는 전부 `#[ignore]`라 여기서 자동으로
  # 빠진다(파일 37개·`#[ignore]` 수가 `#[test]` 수 이상임을 실측). 그것들은
  # 실제 pgvector/pg18 컨테이너를 세우는 로컬 게이트 몫이다.
  rust:
    name: cargo test + 카고 라이선스 게이트
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # 행 방지용 상한이지 소모 상한이 아니다(공개 전환으로 분은 무료·무제한).
    # 러너 실측(이 PR): `cargo test --workspace` 콜드 107초 · 캐시 히트 77초,
    # 잡 전체 1분32초. 20분은 그 ~10배 여유다.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 툴체인 확인(러너 사전설치 stable)
        # rustup 툴체인 액션을 쓰지 않는다. 레포에 rust-toolchain.toml이 없고
        # (#1442에서 신설하지 않기로 판정 — 판정문은 그 PR 본문), ubuntu-latest
        # 이미지에 stable이 이미 들어 있다. 이 레인은 stable을 쓰지 MSRV를 쓰지
        # 않는다 — 즉 **MSRV는 여기서 검증되지 않는다**(#1442 후속 제안).
        #
        # MSRV는 두 카고 워크스페이스가 각각 선언하며 둘 다 #1442 실측치다:
        #   server-rust/Cargo.toml            rust-version = "1.88.0"  (time 0.3.54 계열)
        #   clients/desktop/src-tauri/…       rust-version = "1.89.0"  (notify-rust 4.18.0)
        # 이 잡이 초록인 것은 러너 stable이 그 둘보다 높다는 뜻일 뿐이다. 아래
        # 출력이 그 사실의 유일한 증거이므로 지우지 말 것.
        run: |
          rustc --version
          cargo --version

      - name: cargo 캐시(레지스트리 + target)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            server-rust
            clients/desktop/src-tauri

      - name: cargo test --workspace (server-rust)
        # --locked: Cargo.lock을 고쳐야 하는 매니페스트 변경이 락 커밋 없이
        # 들어오면 여기서 빨강. 락 갱신은 리뷰 대상이지 CI의 부작용이 아니다.
        run: cargo test --workspace --locked --manifest-path server-rust/Cargo.toml

      - name: cargo-deny 설치
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-deny@0.20.2

      - name: 카고 의존 라이선스 게이트(deny.toml, 두 워크스페이스)
        # #1225가 만든 게이트를 그대로 호출한다. 여기서 CI가 정책을 다시 쓰면
        # 로컬 게이트와 CI가 서로 다른 정책으로 갈라진다.
        # `check licenses`만 돈다(advisories/bans는 #1225 스코프 밖).
        run: scripts/check_cargo_licenses.sh

  # ── ②-b 보안 팩 레인 (#4241 SEC-03) ──────────────────────────────────────
  # 위의 `rust` 잡은 DB 시험을 전부 `#[ignore]`라 돌리지 못한다(그래서 RLS·인증·승인·푸시·
  # 첨부·웹훅 시험이 PR 증거에 없었다). 이 잡은 실제 `pgvector/pgvector:pg18` 서비스
  # 컨테이너에 마이그레이션 + bootstrap_roles.sql 을 얹고, infra/security-pack/selection.txt 가
  # 고른 `_pg` 시험을 `--ignored --test-threads=1` 로 돌린다. 선택은 SEC-02(#4224) claims.yaml
  # 이 착륙하면 거기서 파생한다. 나머지 PG 시험은 야간 잡(security-nightly.yml) 몫이다.
  # 시크릿 없음: `pull_request` + `contents: read`, DB 비밀번호는 일회용 서비스 컨테이너 것.
  # 필수 컨텍스트 이름은 「Security pack」 — 브랜치 보호 등록은 owner 설정 변경이다.
  security_pack:
    name: Security pack
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # 행 방지 안전장치. 콜드 실측은 첫 런에서 PR 본문에 기록한다(목표 15분, 상한 25분).
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: momo
          POSTGRES_PASSWORD: momo
          POSTGRES_DB: momo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U momo -d momo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://momo:momo@localhost:5432/momo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 선택 목록 lint + lint 음성 대조(DB 없이)
        run: |
          scripts/security_pack.sh lint
          bash scripts/tests/test_security_pack.sh

      - name: cargo 캐시(레지스트리 + target)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: server-rust

      - name: DB 준비(마이그레이션 + bootstrap_roles.sql)
        run: |
          psql --version
          scripts/security_pack.sh setup

      - name: 보안 팩 시험(--ignored --test-threads=1)
        run: scripts/security_pack.sh run

      - name: 음성 대조 — FORCE 없는 테넌트 테이블이면 tenant_catalog_pg 가 빨강
        run: scripts/security_pack.sh negative

  # ── ③ Node 레인 — 트리별 3잡 (#4696) ─────────────────────────────────────
  # npm 라이선스 게이트 + 타입체크 3트리 + 단위 테스트 3트리를 트리마다 한 잡으로 나눴다
  # (core·web·mobile). 전에는 한 잡 안에서 직렬이었다(성공 18회 중앙값 524초: 시험 400초 —
  # web 217·mobile 150·core 34 — 와 타입체크 56초, 설치 25초, checkout 27초). 설치는
  # 트리마다 3~15초뿐이라 잡을 나눠도 늘어나는 비용은 잡마다의 root `npm ci` 3초다.
  # web·mobile 이 `@momo/core` 를 경로로 쓰고(core 의 서드파티 의존은 root node_modules 로
  # 올라온다) 그래서 세 잡 모두 root `npm ci` 를 먼저 한다. 대기는 가장 긴 줄인 web 으로
  # 줄어든다(예상 ≈ 300초). 시험은 각 트리가 이미 쓰는 스크립트를 그대로 호출한다
  # (core·web = vitest, mobile = jest) — CI가 러너를 다시 고르면 개발자가 로컬에서 돌리는
  # 것과 다른 명령이 된다. 셋 모두 `node` 레인 하나(`changes` 출력)로 선택되고, `gate` 가
  # 잡마다 선택/결과를 교차검증한다.
  node_core:
    name: TS core — npm 라이선스 게이트 + 타입체크 + 단위 시험
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    # 행 방지용 상한(실측 약 1분 10초의 ~10배).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # clients/mobile/package.json engines = ">= 22.11.0"이 레포의 유일한
          # 선언 제약이고, 24는 개발 머신에서 실제로 npm ci가 도는 버전이다.
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm 의존 라이선스 게이트(워크스페이스 루트 + web + mobile)
        # 설치 전에 돈다 — 이 스크립트는 세 트리의 package-lock.json만 읽으므로 npm ci가
        # 필요 없다. 이 게이트는 세 트리 전부를 한 번 보는 검사라서 가장 짧은 core 잡에 둔다.
        run: node scripts/check_npm_licenses.mjs

      - name: npm ci (워크스페이스 루트 = packages/momo-core)
        run: npm ci

      - name: typecheck — @momo/core
        run: npm run typecheck --workspace @momo/core

      # 타입체크가 초록이어도 동작은 틀릴 수 있다. 단위 테스트는 타입이 못 보는
      # 계약(seq 순서·재연결 복원·카피·권한 표면)을 본다.
      - name: test — @momo/core (vitest)
        run: npm run test --workspace @momo/core

  node_web:
    name: TS web — 타입체크 + 단위 시험
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    # 행 방지용 상한(실측 약 5분의 3배).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            clients/web/package-lock.json

      - name: npm ci (워크스페이스 루트 = packages/momo-core)
        run: npm ci

      - name: npm ci (clients/web)
        # playwright devDependency의 postinstall이 브라우저 3종을 내려받는데,
        # 이 레인은 e2e를 돌리지 않으므로 전부 버려지는 다운로드다
        # (server-rust/Dockerfile의 web 스테이지와 같은 이유·같은 변수).
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --prefix clients/web

      - name: typecheck — clients/web
        run: npm --prefix clients/web run typecheck

      - name: test — clients/web (vitest)
        # TZ 정본은 clients/web/vite.config.ts `test.env` (#1267).
        # 러너 env에 다시 박으면 UTC 호스트의 로컬 빨강을 가린다.
        run: npm --prefix clients/web run test

  node_mobile:
    name: TS mobile — 타입체크 + 단위 시험
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    # 행 방지용 상한(실측 약 3분 30초의 ~4배).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            clients/mobile/package-lock.json

      - name: npm ci (워크스페이스 루트 = packages/momo-core)
        run: npm ci

      - name: npm ci (clients/mobile)
        run: npm ci --prefix clients/mobile

      - name: typecheck — clients/mobile
        run: npm --prefix clients/mobile run typecheck

      - name: test — clients/mobile (jest)
        run: npm --prefix clients/mobile run test

  # Branch protection requires this one stable context. Optional path lanes may
  # be skipped, but a failure/cancellation in any selected lane keeps it red.
  # alignment, gitleaks and advisories always run; a skip there is red.
  # The context name `PR CI gate` is the contract (branch protection lists exactly
  # this and `Policy integrity gate`); job keys behind it may be split or renamed
  # as long as every one of them is in `needs` and cross-checked below (#4696).
  gate:
    name: PR CI gate
    needs:
      - changes
      - alignment
      - gitleaks
      - advisories
      - policy
      - rust
      - security_pack
      - node_core
      - node_web
      - node_mobile
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      ALIGNMENT_RESULT: ${{ needs.alignment.result }}
      GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
      ADVISORIES_RESULT: ${{ needs.advisories.result }}
      POLICY_RESULT: ${{ needs.policy.result }}
      RUST_RESULT: ${{ needs.rust.result }}
      SECURITY_PACK_RESULT: ${{ needs.security_pack.result }}
      NODE_CORE_RESULT: ${{ needs.node_core.result }}
      NODE_WEB_RESULT: ${{ needs.node_web.result }}
      NODE_MOBILE_RESULT: ${{ needs.node_mobile.result }}
      POLICY_SELECTED: ${{ needs.changes.outputs.policy }}
      RUST_SELECTED: ${{ needs.changes.outputs.rust }}
      NODE_SELECTED: ${{ needs.changes.outputs.node }}
    steps:
      - name: required and selected lanes are green
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          test "$ALIGNMENT_RESULT" = success
          test "$GITLEAKS_RESULT" = success
          test "$ADVISORIES_RESULT" = success
          require_optional_lane() {
            selected="$1"
            result="$2"
            label="$3"
            case "$selected:$result" in
              true:success|false:skipped) ;;
              *) echo "$label lane selection/result mismatch: selected=$selected result=$result" >&2; exit 1 ;;
            esac
          }
          require_optional_lane "$POLICY_SELECTED" "$POLICY_RESULT" policy
          require_optional_lane "$RUST_SELECTED" "$RUST_RESULT" rust
          require_optional_lane "$RUST_SELECTED" "$SECURITY_PACK_RESULT" security_pack
          require_optional_lane "$NODE_SELECTED" "$NODE_CORE_RESULT" node_core
          require_optional_lane "$NODE_SELECTED" "$NODE_WEB_RESULT" node_web
          require_optional_lane "$NODE_SELECTED" "$NODE_MOBILE_RESULT" node_mobile
