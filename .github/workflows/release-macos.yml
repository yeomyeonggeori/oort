# momo — macOS Developer ID 공증(notarize) 직접배포.
# ⚠️ 검수 게이트(docs/cicd/03-store-readiness-gate.md) PASS 후에만 실행.
# 2026-06-26: GitHub Actions는 조직 과금/결제 이슈가 해소될 때까지 수동 전용이다.
# v* 태그 푸시는 release를 자동 실행하지 않는다. M7 PASS + owner approval 뒤 수동 dispatch만 허용한다.
# 빌드 → match(developer_id) → gym(developer-id) → notarytool submit --wait
#   → stapler staple → create-dmg → GitHub Release 업로드.
# notarytool은 직접 호출(fastlane notarize+API Key 버그 #22055 회피, docs/cicd/00 §4).
name: release-macos

on:
  workflow_dispatch:

concurrency:
  group: release-macos
  cancel-in-progress: false

permissions:
  contents: write            # GitHub Release 업로드용

jobs:
  notarize:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ASC_KEY_ID:        ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:     ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      MATCH_GIT_URL:     ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_TOKEN:   ${{ secrets.MATCH_GIT_TOKEN }}
      MATCH_PASSWORD:    ${{ secrets.MATCH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Ruby + bundler 캐시
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: match(developer_id) + gym(developer-id) 빌드
        run: bundle exec fastlane mac notarized_release
        # notarized_release 레인이 fastlane notarize까지 시도. 실패 시 아래 직접 경로로 폴백.

      # ── 폴백/명시 경로: 직접 notarytool (위 레인의 notarize를 빼고 이 step만 쓸 수도) ──
      - name: (대안) 직접 notarytool 공증
        if: ${{ vars.ENABLE_DIRECT_NOTARYTOOL == 'true' }}
        run: |
          set -euo pipefail
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --sequesterRsrc --keepParent build/MomoMac.app build/MomoMac.zip
          xcrun notarytool submit build/MomoMac.zip \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple build/MomoMac.app
          xcrun stapler validate build/MomoMac.app
          spctl --assess --type execute --verbose build/MomoMac.app
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: create-dmg 패키징
        run: |
          set -euo pipefail
          brew install create-dmg || true
          create-dmg \
            --volname "oort" \
            --window-size 540 380 \
            --app-drop-link 400 180 \
            "build/oort-${{ github.ref_name }}.dmg" "build/MomoMac.app" || \
          hdiutil create -volname "oort" -srcfolder build/MomoMac.app -ov -format UDZO \
            "build/oort-${{ github.ref_name }}.dmg"
          # dmg 자체도 서명+공증 권장(엄격 배포 시):
          # codesign --sign "Developer ID Application: ..." "build/oort-*.dmg"

      - name: GitHub Release 업로드
        uses: softprops/action-gh-release@v3
        with:
          files: build/oort-*.dmg
          fail_on_unmatched_files: true
