# oort Rust multi-command image publication for source-checkout-free hosts.
# Manual-only: the `release` GitHub Environment is the owner-approval boundary,
# and the selected workflow ref must be main. Repository Environment protection
# still needs an attended owner setup before the first dispatch.
#
# The artifact matches the live stack: `server-rust/Dockerfile`, the current
# `clients/web` bundle, and native linux/amd64. A future arm64 lane must use a
# native runner and merge digests; QEMU is intentionally absent here.
name: publish-images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-images-${{ github.sha }}
  cancel-in-progress: false

env:
  # 2026-08-10: repo renamed momo -> oort. GHCR package names do not follow a
  # repo rename, so this dispatch creates the `oort` package on first run;
  # pre-rename images remain reachable at ghcr.io/yeomyeonggeori/momo:<tag>.
  IMAGE: ghcr.io/yeomyeonggeori/oort
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  publish:
    name: publish oort Rust image (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    outputs:
      image: ${{ env.IMAGE }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Require a main-branch dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "::error::publish-images must be dispatched from refs/heads/main (got $DISPATCH_REF)"
            exit 1
          fi

      # 첫 실행 전 최신 메이저로 시작한다 — v7 breaking(fork PR 체크아웃 차단)은
      # 이 레포 트리거에 해당 없음(W-DEP #667 판정).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `sha-<gitsha>` is a convenient commit locator, not an immutable
      # registry identity: a writer can move a tag. Only the returned digest is
      # immutable and every downstream trust step binds to that digest.
      - name: Build and push commit-addressed multi-command image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: server-rust/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            MOMO_BUILD_SHA=${{ github.sha }}
          # GHCR 패키지를 레포에 **연결**하는 것은 이 라벨이다. 없으면 공개
          # 레포가 된 뒤에도 패키지 페이지가 소스·README·라이선스로 이어지지
          # 않고, 익명 방문자에게는 출처 없는 바이너리로 보인다. 첫 공개 발행
          # 이므로 여기서 붙인다(Dockerfile은 무접촉 — 라벨은 워크플로가
          # 덧씌운다). revision은 이미지가 자기 커밋을 말할 수 있게 한다.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=oort-rust-amd64
          cache-to: type=gha,mode=max,scope=oort-rust-amd64
          provenance: mode=max
          sbom: true

      - name: Attest the pushed image digest
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # The attestation API + OCI referrer are sufficient for
          # `gh attestation verify`. Avoid artifact-metadata:write by not
          # creating the optional organization storage record.
          create-storage-record: false

      - name: Report digest-pinned image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          {
            echo "### Published image"
            echo
            echo "\`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
