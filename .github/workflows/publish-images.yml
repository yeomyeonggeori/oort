# oort Rust multi-command image publication for source-checkout-free hosts.
# Manual-only: owner approval and the release gates remain required before a
# dispatch. This workflow prepares a package; it does not authorize a release.
#
# The artifact matches the live stack: `server-rust/Dockerfile`, the current
# `clients/web` bundle, and native linux/amd64. A future arm64 lane must use a
# native runner and merge digests; QEMU is intentionally absent here.
name: publish-images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-images-${{ github.sha }}
  cancel-in-progress: false

env:
  # 2026-08-10: repo renamed momo -> oort. GHCR package names do not follow a
  # repo rename, so this dispatch creates the `oort` package on first run;
  # pre-rename images remain reachable at ghcr.io/yeomyeonggeori/momo:<tag>.
  IMAGE: ghcr.io/yeomyeonggeori/oort
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  publish:
    name: publish oort Rust image (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      image: ${{ env.IMAGE }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # 첫 실행 전 최신 메이저로 시작한다 — v7 breaking(fork PR 체크아웃 차단)은
      # 이 레포 트리거에 해당 없음(W-DEP #667 판정).
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable multi-command image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-rust/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            MOMO_BUILD_SHA=${{ github.sha }}
          # GHCR 패키지를 레포에 **연결**하는 것은 이 라벨이다. 없으면 공개
          # 레포가 된 뒤에도 패키지 페이지가 소스·README·라이선스로 이어지지
          # 않고, 익명 방문자에게는 출처 없는 바이너리로 보인다. 첫 공개 발행
          # 이므로 여기서 붙인다(Dockerfile은 무접촉 — 라벨은 워크플로가
          # 덧씌운다). revision은 이미지가 자기 커밋을 말할 수 있게 한다.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=oort-rust-amd64
          cache-to: type=gha,mode=max,scope=oort-rust-amd64
          provenance: mode=max
          sbom: true

      - name: Report immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          {
            echo "### Published image"
            echo
            echo "\`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
