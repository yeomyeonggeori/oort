# momo runtime image publication for the source-checkout-free alpha host.
# GitHub Actions is intentionally manual-only: owner approval is required before
# dispatch, and this workflow must never gain a push/pull_request/schedule trigger.
name: publish-images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  publish:
    name: publish ${{ matrix.component }} (linux/arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            image: momo-server
            dockerfile: infra/prod/docker/swift-service.Dockerfile
            build_args: |
              PACKAGE_PATH=server
              PRODUCT=MomoServer
          - component: relay
            image: momo-outbox-relay
            dockerfile: infra/prod/docker/swift-service.Dockerfile
            build_args: |
              PACKAGE_PATH=relay/OutboxRelay
              PRODUCT=OutboxRelay
          - component: worker
            image: momo-agent-worker
            dockerfile: infra/prod/docker/swift-service.Dockerfile
            build_args: |
              PACKAGE_PATH=workers/AgentWorker
              PRODUCT=AgentWorker
          - component: linkshort
            image: momo-linkshort
            dockerfile: infra/prod/docker/swift-service.Dockerfile
            build_args: |
              PACKAGE_PATH=services/LinkShort
              PRODUCT=LinkShort
          - component: migrate
            image: momo-migrate
            dockerfile: infra/prod/docker/internal-smoke-migrate.Dockerfile
            build_args: ""
          - component: web
            image: momo-web
            dockerfile: infra/prod/Dockerfile.web
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Enable linux/arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/dawn-kim-official/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.component }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-arm64
