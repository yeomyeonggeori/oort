# momo multi-command image publication for the source-checkout-free alpha host.
# Manual-only: owner approval is required before dispatch.
name: publish-images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-images-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dawn-kim-official/momo
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  publish:
    name: publish momo (linux/arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      image: ${{ env.IMAGE }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable linux/arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable multi-command image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/prod/docker/momo.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=momo-arm64
          cache-to: type=gha,mode=max,scope=momo-arm64
          provenance: mode=max
          sbom: true

      - name: Report immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          {
            echo "### Published image"
            echo
            echo "\`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
