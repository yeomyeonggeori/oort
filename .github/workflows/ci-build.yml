# momo — CI build/test (서명·배포 없음).
# 2026-06-26: GitHub Actions는 조직 과금/결제 이슈가 해소될 때까지 수동 전용이다.
# 기본 merge gate는 docs/LOCAL_PR_GATE.md의 local evidence이며, 이 workflow는 명시적 dispatch 때만 실행한다.
name: ci-build

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-packages:
    name: swift build + test (5 packages)
    runs-on: macos-15          # Apple Silicon(M1), 3 CPU / 7GB (검증됨)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (toolchain 고정)
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Swift / Xcode 버전 확인
        run: |
          swift --version
          xcodebuild -version

      - name: build + test (Package.swift 있는 패키지만)
        run: |
          set -euo pipefail
          for pkg in clients/Core server relay/OutboxRelay workers/AgentWorker clients/macOS; do
            if [ -f "$pkg/Package.swift" ]; then
              echo "==> swift build ($pkg)"
              ( cd "$pkg" && swift build )
              echo "==> swift test ($pkg)"
              ( cd "$pkg" && swift test )
            fi
          done

