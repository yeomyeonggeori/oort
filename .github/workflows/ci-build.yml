# momo — CI build/test (서명·배포 없음). 모든 푸시·PR에서 빠른 피드백.
# Swift 패키지 빌드/테스트는 항상 동작. Xcode app 빌드는 프로젝트 추가 후 활성.
name: ci-build

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]        # 릴리스 태그는 release-* 워크플로우가 담당
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-packages:
    name: swift build + test (5 packages)
    runs-on: macos-15          # Apple Silicon(M1), 3 CPU / 7GB (검증됨)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (toolchain 고정)
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Swift / Xcode 버전 확인
        run: |
          swift --version
          xcodebuild -version

      - name: build + test (Package.swift 있는 패키지만)
        run: |
          set -euo pipefail
          for pkg in clients/Core server relay/OutboxRelay workers/AgentWorker clients/macOS; do
            if [ -f "$pkg/Package.swift" ]; then
              echo "==> swift build ($pkg)"
              ( cd "$pkg" && swift build )
              echo "==> swift test ($pkg)"
              ( cd "$pkg" && swift test )
            fi
          done

