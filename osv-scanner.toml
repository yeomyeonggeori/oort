# =============================================================================
# oort OSV-Scanner exception ledger (#4243, SEC-05).
#
# `scripts/check_advisories.py` runs `osv-scanner scan source --config osv-scanner.toml`
# over the five lockfiles that ship or build oort:
#   server-rust/Cargo.lock  clients/desktop/src-tauri/Cargo.lock  package-lock.json
#   clients/web/package-lock.json  clients/mobile/package-lock.json
# and the PR CI lane `advisories` makes it a required check.
#
# Division of labour with `cargo deny` (deny.toml): OSV reads Cargo.lock without a
# dependency graph (no features, no target filter), so a crates.io finding that
# carries a RUSTSEC id is judged by `cargo deny check advisories` instead, where
# the graph is real. OSV is what catches the GHSA-only Rust advisories RustSec
# does not list (jsonwebtoken below). npm findings are judged here.
#
# RULES (enforced by the gate, not by convention):
#   - Only `[[IgnoredVulns]]` by advisory id. `[[PackageOverrides]]` with `ignore = true`
#     is rejected: a package-wide ignore would hide future advisories too.
#   - Every entry needs `reason` and `ignoreUntil`. `ignoreUntil` is the FIRST RED DAY:
#     on that day OSV stops ignoring it and the gate also fails on the expired entry.
#   - `ignoreUntil` may not be more than 180 days out. Renewing is a reviewed policy
#     change: this file is a policy path (scripts/verify_policy_integrity.sh).
# =============================================================================

# ---- server-rust (Rust, GHSA-only advisory) ---------------------------------

[[IgnoredVulns]]
id = "GHSA-h395-gr6q-cpjc"
ignoreUntil = 2027-01-22
reason = """jsonwebtoken 9.3.1: claim type confusion can skip nbf/exp checks; fixed only in 10.x (major, CVE-2026-25537). \
Low reach: every decode (momo-auth jwt.rs:74, realtime.rs:161/227, ephemeral_grant.rs:259) verifies an HS256 signature made with the \
server's own secret first, so a caller cannot craft the claims. Follow-up: jsonwebtoken 10 migration."""

# ---- server-rust + clients/desktop/src-tauri (Rust, GHSA-only advisory) -------

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2027-01-25
reason = """block-buffer < 0.12.1 (GHSA range `introduced: 0`): a caught panic can corrupt the inline cursor of EagerBuffer/ReadBuffer (OOB read/write). \
Not exposed here: the locked 0.10.4 keeps its cursor in a separate `pos: u8` field and has no ReadBuffer; the inline-cursor layout arrived in 0.11.0 \
(block-buffer CHANGELOG), so the match is a version-range over-approximation. Also no reach: oort never names block_buffer/EagerBuffer/ReadBuffer, \
only digest 0.10.7 uses it (sha2/sha1/md-5/hmac/curve25519-dalek in server-rust; sha2/hmac/ecdsa/elliptic-curve/signature in src-tauri), and no \
production code catches a panic or keeps a hasher alive. Not upgradable yet: 0.12.1 needs digest 0.11, but sqlx-core 0.9.0 (always-on migrate feature), \
wry 0.57.1 and tauri-codegen 2.7.4 still pin sha2 ^0.10. Follow-up: ask RustCrypto/utils to narrow the GHSA `introduced` to 0.11.0 (then drop this entry); \
at renewal re-check those upstreams and the RustSec alias; keep server-rust's block-buffer 0.12.x >= 0.12.1. Upgrade issue: #4644."""

