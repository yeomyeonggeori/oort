[package]
name = "momo-embed"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

# #3173 (MEM-M3, ADR-0196 D8 증보): the local sentence embedder behind team-memory
# vector search — `intfloat/multilingual-e5-small` (MIT), int8 ONNX, 384 dimensions.
#
# Only `momo-agent-worker` depends on this crate. The API process (`momo-server`) must
# never list it: the ONNX Runtime library and the 118 MB model live in the worker's
# address space, and browser search stays keyword-only (ADR-0147: the API process makes no
# outbound HTTP and loads no model).
#
# `default-features = false` drops fastembed's `hf-hub` downloader (and with it the MPL-2.0
# `option-ext` crate) and its image models. The model files are NOT fetched at run time: the image
# build downloads them at a pinned revision and verifies sha256 (server-rust/Dockerfile, stage
# `model-payload`), and this crate only loads a directory.
#
# ONNX Runtime is loaded at RUN time from `ORT_DYLIB_PATH` (`ort-load-dynamic`), not linked in. The
# pyke.io prebuilt static library (`ort-download-binaries*`) is built with a newer GCC than Debian
# bookworm's, so linking it in the bookworm build image fails on libstdc++ symbols
# (`__cxa_call_terminate`, `basic_string::_M_replace_cold`), and it adds a build-time download from
# cdn.pyke.io. Microsoft's own release library (MIT, `onnxruntime-linux-<arch>-<ver>.tgz`) needs only
# GLIBCXX <= 3.4.21 / GLIBC <= 2.27, is pinned by sha256 in the Dockerfile stage `ort-payload`, and
# needs nothing at cargo build time — so `cargo build/test/clippy` stay offline-capable and CI needs
# no extra download. Anything that actually creates a session (the image's `--embed-check`, the
# ignored real-model tests) needs `ORT_DYLIB_PATH` pointing at libonnxruntime.
[dependencies]
fastembed = { version = "=7.1.0", default-features = false, features = ["ort-load-dynamic"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
