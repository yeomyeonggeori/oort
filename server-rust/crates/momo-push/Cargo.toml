[package]
name = "momo-push"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# shared infrastructure — consumed by public API only, never re-implemented.
momo-db = { path = "../momo-db" }         # with_tenant_tx = the sole RLS GUC seam
# `active_workspace_role` — so "active member of this workspace" keeps one
# definition across every route rather than gaining a push-flavoured copy.
momo-messaging = { path = "../momo-messaging" }
# #2677 — `lock_session_for_registration`: a registration binds to the calling
# session's lineage under a share lock on that `token` row. `token` SQL stays in
# momo-auth (it owns that table); this crate only calls it. momo-auth depends on
# neither this crate nor momo-messaging, so the edge adds no cycle.
momo-auth = { path = "../momo-auth" }
# ADR-0204 D7 (#3928): who may decide an approval is the decision route's rule,
# not a push-flavoured copy of it. `momo-agent` owns the pure gate
# (`decider_gate`, `reference_execution_host`) and `agent_owner_in_tx`; `momo-t3`
# owns `remote_host_owner_in_tx`. The push judgment CALLS the functions the
# route calls. Neither depends on this crate (momo-agent -> momo-db; momo-t3 ->
# momo-db, momo-provider, momo-wire), so the edges add no cycle.
momo-agent = { path = "../momo-agent" }
momo-t3 = { path = "../momo-t3" }
# ADR-0186 v8 X8-3: who may decide an `expression.create` card is the ONE predicate
# `momo_expressions::adder_allows_in_tx` (the decision route calls it too). momo-expressions
# depends on momo-db/-outbox/-wire only, so the edge adds no cycle.
momo-expressions = { path = "../momo-expressions" }

async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
