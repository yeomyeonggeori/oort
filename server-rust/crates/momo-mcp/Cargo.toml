[package]
name = "momo-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

# ADR-0162's protocol core is deliberately transport- and persistence-free.
# Axum, authentication, rate limiting, audit, and every product data port live
# in the server adapter; this crate only validates and dispatches bounded wire
# values.
[dependencies]
serde.workspace = true
serde_json.workspace = true
# The opaque `leaseHandle` (HAP-E5) is a sealed protocol artifact, not a data
# access: these are AEAD/encoding crates only. No SQL, HTTP or DB dependency
# enters this crate — that boundary is what ADR-0162 D3 asks of it.
uuid.workspace = true
thiserror.workspace = true
base64.workspace = true
sha2.workspace = true
aes-gcm = "0.10"
getrandom = "0.2"
