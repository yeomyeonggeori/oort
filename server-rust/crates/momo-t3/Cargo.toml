[package]
name = "momo-t3"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# shared infrastructure — consumed through its public API, never re-implemented.
momo-db = { path = "../momo-db" }             # the sole RLS GUC seam
momo-provider = { path = "../momo-provider" } # the sole provider-specific seam
momo-wire = { path = "../momo-wire" }         # B2.2: the bootstrap-token digest
                                              # format is a server<->workd
                                              # contract, so it is minted with
                                              # the shared sha256 helper, not a
                                              # second local implementation.

async-trait.workspace = true
futures.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
# B2.4 (terminal attach + reattach replay):
#   base64     — the capability bearer is `base64URL(randomBytes(32))`, the exact
#                spelling `WebhookCrypto.randomReference()` produces; a second
#                encoder would be a second grammar.
#   serde_json — a replayed thread row carries `message.props` (jsonb) through
#                unchanged; the domain must not re-shape a client contract.
base64.workspace = true
serde_json.workspace = true

[dev-dependencies]
# DB-backed conformance harness (tests/conformance_pg.rs, all #[ignore]) — the
# orchestrator's docker gate. Not part of the DB-free `cargo test --workspace`.
tokio = { workspace = true }
futures = { workspace = true }
