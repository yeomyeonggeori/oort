# MEM-M0 (#3159) 스파이크 — 제품 코드 아님. server-rust 워크스페이스 밖의 독립 크레이트(자체 [workspace]
# + 자체 Cargo.lock)라 워크스페이스 빌드·Cargo.lock·GHCR 고지 번들에 영향이 없다.
# 채택되면 그때 크레이트로 승격하고 lindera(MIT)·mecab-ko-dic(Apache-2.0)를 NOTICE에 반영한다.
[package]
name = "kr-keyword-search-bench"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
lindera = { version = "=6.2.0", features = ["embed-ko-dic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
