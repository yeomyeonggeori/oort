[package]
name = "momo-push-relay"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

# The HTTP surface is a library so conformance tests can drive the router
# without spawning a process; `src/main.rs` is the env→serve shell.
[lib]
name = "momo_push_relay"
path = "src/lib.rs"

[[bin]]
name = "momo-push-relay"
path = "src/main.rs"

[dependencies]
# Ed25519 verify of the notifier's raw-body signature. Reused rather than
# re-implemented so there is one signing primitive in the workspace.
momo-wire = { path = "../../crates/momo-wire" }

axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
# APNs provider JWT (ES256 over a .p8). Same crate the rest of the workspace
# already uses; no new license surface.
jsonwebtoken.workspace = true
# HTTP/2 to api.push.apple.com. The workspace reqwest is rustls-only; `http2`
# is the extra feature APNs requires (ALPN). Tests talk to a loopback mock
# and never reach Apple.
reqwest = { workspace = true, features = ["http2"] }

[dev-dependencies]
ed25519-dalek.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
