[package]
name = "momo-agent-worker"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

# The turn loop is a library so conformance tests can run exactly one iteration
# against an injected provider; `src/main.rs` is the env→run shell (same split
# as momo-relay / momo-notifier).
[lib]
name = "momo_agent_worker"
path = "src/lib.rs"

[[bin]]
name = "momo-agent-worker"
path = "src/main.rs"

[dependencies]
# Every statement this binary causes belongs to a domain crate:
#   momo-outbox    claim + settle the agent_job row (invariant #3)
#   momo-messaging the agent's reply — the SAME send path a human uses
#   momo-agent     agent_run transitions + the usage_ledger row
#   momo-settings  provider_link read/decrypt + the cascade classifier
#   momo-db        the RLS GUC seam (invariant #6)
#   momo-t3        the work-session lifecycle the one executable tool drives
# This crate owns no SQL of its own; see the module docs in `src/lib.rs`.
momo-agent = { path = "../../crates/momo-agent" }
momo-workspace-actions = { path = "../../crates/momo-workspace-actions" }
momo-db = { path = "../../crates/momo-db" }
momo-drive = { path = "../../crates/momo-drive" }
# #4820 C2b 2부: the hosted expression door turns a picture into candidates through the same decoder
# and assembler every picture path shares (`momo_workspace_actions::hosted_expression`). No new crate.
momo-expressions = { path = "../../crates/momo-expressions" }
momo-messaging = { path = "../../crates/momo-messaging" }
momo-outbox = { path = "../../crates/momo-outbox" }
momo-settings = { path = "../../crates/momo-settings" }
# #2976: the egress guard's reqwest plumbing, shared with momo-provider-probe.
momo-egress = { path = "../../crates/momo-egress" }
# #3173: the local embedder (ONNX) for team-memory vector search. Worker-only by design.
momo-embed = { path = "../../crates/momo-embed" }
# goal SRV-T1: the one tool this worker executes is `work.session.end`, and its
# executor calls the SAME domain functions `routes::work_sessions::end` calls —
# `end_work_session_in_tx` + `terminate_in_tx` under the ADR-0140 lock ladder.
# The dependency is what keeps the tool a second *caller* rather than a second
# implementation; without it the worker would need a settlement statement of its
# own, which migration 053's guard refuses at runtime anyway.
momo-t3 = { path = "../../crates/momo-t3" }

# The provider call is outbound HTTP by nature (the Swift AgentWorker does the
# same). It targets the LLM gateway, plus — since #4934 — exactly one call to
# momo-server: `GET /v1/self-media/{ws}/{token}` on the api's private address
# (OORT_API_INTERNAL_ORIGIN), with a single-use token this worker minted itself,
# to read the picture a person asked to have as their profile image when the
# archive is a volume only the api mounts (ADR-0151 증보 3). It never publishes
# to Centrifugo — the reply reaches clients through the message write path →
# outbox → relay, like every other message.
reqwest.workspace = true

# #4970 (ADR-0201 증보 v3 B6-1, ADR-0151 증보 4): the helper reads an attachment. `lopdf` (MIT) pulls a
# PDF's letters out — and is called **only** inside the supervised child process this binary re-executes
# itself as (`attachment_text`), never in the worker's own address space. `image` (already in the
# graph) re-encodes a picture before the model sees it, `base64` carries it on the wire, and
# `encoding_rs` reads the Korean legacy encoding a text file may be in. No default features on lopdf:
# no rayon, no date crates, no font crate. At least 0.42: earlier versions recurse without bound into
# nested arrays and a ~21 KB file aborts the process (RUSTSEC-2026-0187).
lopdf = { version = "0.46", default-features = false }
image.workspace = true
base64.workspace = true
encoding_rs = "0.8"
# #4970 수리 (독립 보안 검수 High): the PDF child puts a ceiling on its own address space as its first
# act. `rlimit` is the safe wrapper `momo-expressions` already uses for its decoder child, so this is a
# new edge in the graph and no new crate (and the workspace's `unsafe_code = "forbid"` stands).
rlimit = "0.10"

async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "time", "sync", "net"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

# #5072 (ADR-0151 증보 6 B): once its limits are in place the PDF child refuses itself a file by name, a socket,
# another program and another process (`attachment_lockdown`), and marks itself not dumpable. Linux only — the
# image is Linux, and another unix has neither the call nor a need for it.
#   rustix       the safe `prctl` wrapper (`PR_SET_DUMPABLE`). Already in the lock file (tempfile, oort-cli): no new
#                crate, and the workspace's `unsafe_code = "forbid"` stands (Apache-2.0 WITH LLVM-exception OR
#                Apache-2.0 OR MIT).
#   seccompiler  builds and installs the system-call filter through a safe API (installing one takes a raw
#                `seccomp(2)` call, which the workspace forbids us to write). The one new crate: Firecracker's, the
#                rust-vmm project's, Apache-2.0 OR BSD-3-Clause, no dependency beyond `libc`.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process"] }
seccompiler = "0.5"

# `libc`: the system-call numbers the filter names, `EPERM`, and — on every unix — `SIGSYS`, the signal a host's own
# profile ends the PDF child with if it answers `seccomp(2)` by killing (#5072 review R1-4). Already in the lock file.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# #4820 C2b 2부 (tests/hosted_door_pg.rs): the suite draws its own pictures and writes them the way
# Hermes' API server does (`data:image/png;base64,…`). Both crates are normal dependencies now (#4970).
#
# #4970 (tests/team_ai_files_conformance_pg.rs): an in-memory archive for the worker's own read path
# is a `DriveArchive` whose content is a one-chunk stream. Both crates are in the graph already.
futures.workspace = true
bytes.workspace = true

# Conformance harness (tests/agent_worker_conformance_pg.rs, all #[ignore]): the
# real migrations + bootstrap roles, with the deterministic in-process provider
# so a turn and a provider outage are both staged without a network. `sqlx` is a
# dev-dep only — the shipped crate reaches the driver through `momo_db::sqlx`
# and owns no query of its own.
sqlx.workspace = true

# The B5.4 OAuth suite (tests/oauth_provider_conformance_pg.rs) and the B5.4b
# Responses suite (tests/responses_adapter_conformance_pg.rs) stand up a real
# loopback HTTP server as the token endpoint AND the provider, so the shipped
# `HttpTokenRefresher` / `OpenAiCompatProvider` / `OpenAiResponsesProvider` wires
# are exercised rather than stubbed. `net` + `io-util` are the only additions and
# no new crate enters the dependency graph, so the Dockerfile crate list is
# unchanged.
tokio = { workspace = true, features = ["net", "io-util"] }

# #4970 수리 (tests/attachment_text_child.rs): the memory guard is measured against a real child reading a
# stream that inflates far past its own size; the test writes that stream with the very crate `lopdf`
# reads it with. Already in the graph (lopdf's), so no new crate.
flate2 = "1"

[lints]
workspace = true
