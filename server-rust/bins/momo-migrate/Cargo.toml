[package]
name = "momo-migrate"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

# A separate binary rather than a `momo-server migrate` subcommand (B1.7):
#   * the migrate role must boot with DATABASE_URL alone — momo-server's
#     `Config::from_env` fails closed without JWT_HMAC/realtime URL, which the
#     prod `migrate`/`runtime-roles` services never set;
#   * migrating is synchronous psql shell-out: no tokio runtime, no axum router;
#   * the shipped Swift image already separates its migrate entry
#     (`infra/prod/docker/internal-smoke-migrate.sh`), so `command: ["migrate"]`
#     maps 1:1 onto this binary and the compose contract is unchanged.
[[bin]]
name = "momo-migrate"
path = "src/main.rs"

[dependencies]
# The runner itself is momo-db's (`run_migrations`, psql-based, B0/B1.6). This
# binary only resolves the environment contract around it — it owns no SQL and
# re-implements no migration logic.
momo-db = { path = "../../crates/momo-db" }
chrono.workspace = true
hex.workspace = true
hmac.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# ADR-0166 claim-token mint: same 32-byte OS CSPRNG as momo-auth pairing.
# The migrate binary prints the raw token once; Postgres stores only the hash.
getrandom = "0.2"
base64.workspace = true

# unsafe-allowlist (SEC-08, #4246): one call, libc::geteuid() (pitr.rs, the PITR runbook's must-
# not-be-root check). Same reason as momo-box-runner: no safe std API, and a new dependency for
# one line is out of scope (candidate follow-up: remove this entry then).
# Adding a crate here needs a reason row in server-rust/unsafe-allowlist.tsv; scripts/check_unsafe_policy.py
# keeps this table and the workspace forbid in sync.
[lints.rust]
unsafe_code = "allow"
