[package]
name = "momo-box-runner"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

# ADR-0197 M2 (#3505) — the personal-cloud box runner (D2).
#
# A daemon on the runner host. It dials the server (outbound HTTPS only, no listener),
# polls signed-in lifecycle controls and runs them through the Docker CLI with a FIXED
# template. The whole of what it can do is five verbs (`create|start|stop|delete|status`,
# `src/verbs.rs`); there is no exec/cp/commit/export/snapshot and no code path that reads
# a box volume's content. What a box runs (image, command, mounts, network, env) lives in
# the runner's own configuration file, never in a server control (`src/wire.rs` is a closed
# schema).
#
# It speaks to Docker by argv vector through `tokio::process` (no shell string, no docker
# API client crate, no new dependency): `src/docker.rs` holds the closed list of docker
# subcommands. `tests/` read this crate's source to keep all of that true.
[lib]
name = "momo_box_runner"
path = "src/lib.rs"

[[bin]]
name = "momo-box-runner"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
libc.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "time", "signal", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
# A mock oort server for the poll→execute→complete loop test.
axum.workspace = true
