# momo server — Rust/Axum rewrite (ADR-0145 B안). B0 = workspace skeleton + 5
# shared infrastructure crates; B1 = momo-messaging (write-path spine);
# B1.5 = the first bootable binaries (momo-server, momo-relay).
[workspace]
resolver = "2"
members = ["crates/*", "bins/*"]

[workspace.package]
edition = "2021"
version = "0.0.0"
license = "Apache-2.0"
# MSRV — 선언이 아니라 실측치다(#1442). 이 워크스페이스의 해결된 의존 그래프가
# 실제로 요구하는 최솟값이며, 게이트가 아니라 `cargo`가 강제한다: 더 낮은
# 툴체인은 컴파일 이전 resolve 단계에서 거절된다.
#   실측(2026-08-17, track/engine@54f5d2dc, Cargo.lock 고정):
#     `cargo +1.87.0 check --workspace --locked` → 거절
#       home@0.5.12 / time@0.3.54 / time-core@0.1.9 / time-macros@0.2.32 이 rustc 1.88 요구
#     `cargo +1.88.0 check --workspace --all-targets --locked` → green(경고 0)
#   그래프에 edition2024 서드파티 크레이트가 15개 있으나(rustc ≥1.85 요구) 그것이
#   상한이 아니다 — 실제 바닥은 time 계열의 1.88.0이다. 이 워크스페이스 자체의
#   edition은 위 "2021"이고 마이그레이션 계획은 없다(#1442 Out of scope).
# 올릴 때: 값만 고치지 말고 위 두 명령을 다시 재서 근거 줄을 같이 갱신할 것.
rust-version = "1.88.0"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures = "0.3"
async-trait = "0.1"

# DB — sqlx runtime query API only (no compile-time query! macro: B0 must build
# without a live DB, so the "macros" feature is deliberately absent).
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "chrono",
  "json",
] }

# shared value types
# `v5` (goal SRV-T1): a provider's `call_id` is an arbitrary string but
# `message.client_msg_id` is a uuid column, so the tool-result key is a
# deterministic name-based uuid over (run_id, call_id) — that determinism IS the
# exactly-once guarantee for tool execution.
uuid = { version = "1", features = ["v4", "v5", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# crypto / wire (workd Ed25519 signature parity)
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
# ADR-0115 webhook secret derivation + the outbound delivery signature (#1222).
# Both webhook families are HMAC-SHA256 over a domain-separated string, which is
# exactly what lets Postgres store a random *reference* instead of a secret.
hmac = "0.12"

# auth
jsonwebtoken = "9"

# HTTP (B1.5 binaries)
#   axum   — momo-server's router/middleware (D1 §1 stack decision).
#   reqwest — momo-relay's Centrifugo `/api/publish` client. Invariant #2 keeps
#             this dependency out of momo-server: only the relay publishes.
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
# ADR-0151: the attachment content proxy *streams* Drive bytes through rather
# than buffering them, so the 100 MB ceiling is a transfer bound and not a
# per-download memory one. `bytes` is the currency reqwest and axum already
# exchange, so pinning it here lets the stream cross momo-drive → momo-server
# with no copy and no third buffer type in between.
bytes = "1"

# errors / logging
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
