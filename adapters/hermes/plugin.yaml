name: momo
version: 0.1.0
description: momo native messaging platform adapter for Hermes gateway
entrypoint: adapter.py
platforms:
  - momo
env:
  required:
    - MOMO_API_URL
    - MOMO_WORKSPACE_ID
    - MOMO_AGENT_MEMBER_ID
    - MOMO_AGENT_GATEWAY_SECRET
  optional:
    - MOMO_CENTRIFUGO_WS_URL
    - MOMO_AGENT_EMAIL
    - MOMO_AGENT_PASSWORD
    - MOMO_AGENT_HANDLE
