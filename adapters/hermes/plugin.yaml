name: momo
label: Momo
kind: platform
version: 0.2.0
description: Native momo messaging platform adapter using a scoped per-agent bearer.
author: Dawn Kim / momo
entrypoint: adapter.py
requires_env:
  - name: MOMO_API_URL
    label: momo API URL
    description: Local momo API base URL, for example http://127.0.0.1:28180.
  - name: MOMO_WORKSPACE_ID
    label: Workspace ID
    description: momo workspace UUID the Hermes agent belongs to.
  - name: MOMO_AGENT_MEMBER_ID
    label: Agent member ID
    description: momo member UUID where member.kind='agent'.
  - name: MOMO_AGENT_TOKEN
    label: Agent bearer token
    description: One-time-issued, scoped momo credential for this agent. Never a provider OAuth/API token.
optional_env:
  - name: MOMO_CENTRIFUGO_WS_URL
    label: Centrifugo WebSocket URL
    description: Realtime endpoint, for example ws://127.0.0.1:28100/connection/websocket.
  - name: MOMO_AGENT_HANDLE
    label: Agent handle
    description: Mention handle, usually hermes.
  - name: MOMO_WORK_HOST_ID
    label: Work host ID
    description: Optional host registry UUID. Gateway work tools remain unavailable when unset.
  - name: MOMO_HOME_CHANNEL
    label: Home channel ID
    description: Channel UUID configured at gateway startup for scheduled and cross-platform delivery.
  - name: MOMO_HOME_CHANNEL_NAME
    label: Home channel name
    description: Display name for the preconfigured momo home channel.
  - name: MOMO_AGENT_ALLOW_INSECURE_HTTP
    label: Allow private-network plaintext
    description: Set to 1 only when http/ws is required on a trusted non-loopback private network. Defaults to fail-closed.
  - name: MOMO_PROVIDER_BEARER_ENV_PREFIX
    label: Provider bearer env prefix
    description: Env prefix this adapter reads provider bearers from (default HERMES_PROVIDER_BEARER; per link HERMES_PROVIDER_BEARER__<PROVIDER_REF>). momo never sends provider credentials (ADR-0004).
  - name: MOMO_QUOTA_PROBE_ENABLED
    label: Quota probe enabled
    description: Set to 0 to disable the periodic provider remaining-quota probe. Defaults to enabled.
  - name: MOMO_QUOTA_PROBE_INTERVAL_S
    label: Quota probe interval (seconds)
    description: Probe period in seconds, minimum 30, default 900.
